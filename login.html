<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>로그인 - 다담가구</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-system.css" />
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="js/auth-redirect.js?v=2026112320"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 색 · 모서리는 앱과 같다 — css/dadam-v5.css 의 값 (각진 모서리 · 그림자 없음 · 가는 선).
         변수 이름은 이 화면이 쓰던 그대로 둔다 (금색 자리는 v5 의 tan). */
      :root {
        --white: #ffffff;
        --cream: #f6f3ee;
        --warm: rgba(45, 42, 38, 0.16);
        --gray: rgba(45, 42, 38, 0.62);
        --charcoal: #2d2a26;
        --black: #2d2a26;
        --gold: #8a7457;
        --gold-light: #8a7457;
      }

      body {
        font-family:
          'Noto Sans KR',
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--cream);
        color: var(--charcoal);
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: inherit;
        font-weight: 400;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      /* Layout */
      .login-container {
        display: flex;
        width: 100%;
        min-height: 100vh;
      }

      /* Left Brand Section */
      .brand-section {
        display: none;
        width: 50%;
        position: relative;
        overflow: hidden;
        background: var(--charcoal);
      }

      .brand-bg {
        display: none;
      }

      .brand-bg::before {
        content: '';
        position: absolute;
        top: 25%;
        left: 25%;
        width: 400px;
        height: 400px;
        background: var(--gold);
        border-radius: 50%;
        filter: blur(120px);
      }

      .brand-bg::after {
        content: '';
        position: absolute;
        bottom: 25%;
        right: 25%;
        width: 300px;
        height: 300px;
        background: var(--gold);
        border-radius: 50%;
        filter: blur(100px);
      }

      .brand-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px;
        color: #fff;
        height: 100%;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
      }

      .brand-logo svg {
        width: 40px;
        height: 40px;
      }

      .brand-logo span {
        font-family: inherit;
        font-weight: 300;
        letter-spacing: 0.08em;
        font-size: 28px;
      }

      .brand-content h1 {
        font-size: 42px;
        line-height: 1.3;
        margin-bottom: 24px;
      }

      .brand-content h1 span {
        color: var(--gold);
      }

      .brand-content > p {
        color: rgba(255, 255, 255, 0.6);
        font-size: 18px;
        margin-bottom: 48px;
        max-width: 400px;
      }

      .brand-features {
        display: flex;
        gap: 16px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 14px;
      }

      .brand-features span {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-features svg {
        width: 16px;
        height: 16px;
        color: var(--gold);
      }

      /* Right Form Section */
      .form-section {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .form-container {
        width: 100%;
        max-width: 420px;
      }

      /* Mobile Logo */
      .mobile-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 32px;
      }

      .mobile-logo svg {
        width: 32px;
        height: 32px;
      }

      .mobile-logo span {
        font-family: inherit;
        font-weight: 300;
        letter-spacing: 0.08em;
        font-size: 24px;
      }

      /* Form Header */
      .form-header {
        margin-bottom: 32px;
      }

      .form-header h2 {
        font-size: 32px;
        margin-bottom: 8px;
      }

      .form-header p {
        color: var(--gray);
      }

      .form-header a {
        color: var(--gold);
      }

      .form-header a:hover {
        text-decoration: underline;
      }

      /* Error Message */
      .error-message {
        display: none;
        padding: 16px;
        background: #f8ece9;
        border: 1px solid rgba(147, 48, 31, 0.3);
        color: #93301f;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .error-message.show {
        display: block;
      }

      /* Success Message */
      .success-message {
        display: none;
        padding: 16px;
        background: #eaf2ed;
        border: 1px solid rgba(47, 107, 79, 0.3);
        color: #2f6b4f;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .success-message.show {
        display: block;
      }

      /* 이메일로 가입했던 분께 — 같은 이메일의 구글 · 카카오로 이어진다 */
      .link-note {
        margin-top: 20px;
        padding: 14px 16px;
        border: 1px solid var(--warm);
        font-size: 14px;
        line-height: 1.6;
        color: var(--gray);
      }

      /* Social Buttons */
      .social-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-social {
        width: 100%;
        padding: 16px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: all 0.3s;
      }

      .btn-social:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-social svg {
        width: 20px;
        height: 20px;
      }

      .btn-google {
        background: #fff;
        border: 1px solid var(--warm);
        color: var(--charcoal);
      }

      .btn-google:hover {
        background: var(--cream);
      }

      /* 카카오 — signup.html 의 .btn-kakao 와 같은 색 */
      .btn-kakao {
        background: #fee500;
        border: none;
        color: #191919;
      }

      .btn-kakao:hover {
        background: #fdd800;
      }

      /* 인앱 브라우저 안내 (hidden 으로 감춘다 — 안의 요소에도 display 를 주지 않는다) */
      .inapp-notice {
        margin-bottom: 16px;
        padding: 14px 16px;
        background: #fbefd4;
        border: 1px solid #c9952b;
        font-size: 14px;
        line-height: 1.6;
        color: var(--charcoal);
      }

      .btn-inapp {
        margin-top: 10px;
        width: 100%;
        padding: 12px;
        background: var(--charcoal);
        color: #fff;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-inapp:hover {
        background: var(--gold);
      }

      .inapp-manual {
        margin-top: 8px;
        font-weight: 500;
      }

      .inapp-copy-hint {
        margin-top: 8px;
        font-size: 13px;
        color: var(--gray);
      }

      .inapp-url {
        margin-top: 8px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--warm);
        background: #fff;
        font-family: inherit;
        font-size: 16px;
        color: var(--charcoal);
      }

      .btn-naver {
        background: #03c75a;
        border: none;
        color: #fff;
      }

      .btn-naver:hover {
        background: #02b351;
      }

      .btn-apple {
        background: #000;
        border: none;
        color: #fff;
      }

      .btn-apple:hover {
        background: #333;
      }

      /* Footer */
      .form-footer {
        margin-top: 32px;
        text-align: center;
        font-size: 14px;
        color: var(--gray);
      }

      .form-footer a {
        color: var(--gold);
      }

      .form-footer a:hover {
        text-decoration: underline;
      }

      /* Responsive */
      @media (min-width: 1024px) {
        .brand-section {
          display: flex;
        }

        .form-section {
          width: 50%;
        }

        .mobile-logo {
          display: none;
        }
      }

      @media (max-width: 480px) {
        .form-section {
          padding: 24px 16px;
        }

        .form-header h2 {
          font-size: 28px;
        }

        .btn-social {
          padding: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <!-- Left: Brand Section -->
      <div class="brand-section">
        <div class="brand-bg"></div>
        <div class="brand-content">
          <a href="index.html" class="brand-logo">
            <svg viewBox="0 0 40 40" fill="currentColor">
              <path d="M20 4L4 12v16l16 8 16-8V12L20 4zm0 4l12 6-12 6-12-6 12-6zm-12 10l12 6 12-6v8l-12 6-12-6v-8z" />
            </svg>
            <span>다담</span>
          </a>
          <h1>AI가 설계하는<br /><span>프리미엄</span> 맞춤 가구</h1>
          <p>30년 장인정신과 AI 기술의 만남.<br />완벽한 공간을 위한 최선의 선택.</p>
          <div class="brand-features">
            <span
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" /></svg
              >AI 설계 시스템</span
            >
            <span>•</span>
            <span>30년 경력 장인</span>
            <span>•</span>
            <span>평생 A/S</span>
          </div>
        </div>
      </div>

      <!-- Right: Form Section -->
      <div class="form-section">
        <div class="form-container">
          <!-- Mobile Logo -->
          <a href="index.html" class="mobile-logo">
            <svg viewBox="0 0 40 40" fill="currentColor">
              <path d="M20 4L4 12v16l16 8 16-8V12L20 4zm0 4l12 6-12 6-12-6 12-6zm-12 10l12 6 12-6v8l-12 6-12-6v-8z" />
            </svg>
            <span>다담</span>
          </a>

          <!-- Form Header -->
          <div class="form-header">
            <h2 data-i18n="login.btn">로그인</h2>
            <p>
              <span data-i18n="login.no_account">계정이 없으신가요?</span>
              <a href="signup.html" id="signupLink" data-i18n="login.signup_link">회원가입</a>
            </p>
          </div>

          <!-- 오류 · 알림 — 로그인은 카카오 · 구글 두 가지뿐이다 (2026-11-23 대표님: 이메일 · 비밀번호 로그인 없앰) -->
          <div class="error-message" id="errorMsg"></div>
          <div class="success-message" id="successMsg"></div>

          <!-- 인앱 브라우저 안내 — js/auth-redirect.js 의 inAppBrowser 가 알아본 앱
               (카카오톡·네이버·인스타그램·페이스북·라인·다음·밴드) 안에서만 보인다 -->
          <div class="inapp-notice" id="inappNotice" hidden>
            <p id="inappText"></p>
            <!-- 외부 브라우저로 여는 주소가 있을 때 (카카오톡·라인·안드로이드의 그 밖 앱) -->
            <button type="button" class="btn-inapp" id="openExternalBtn" hidden>외부 브라우저로 열기</button>
            <!-- 없을 때 (iOS 의 그 밖 앱) — 메뉴 안내 + 주소 복사, 복사가 안 되면 주소 글자를 골라 둔다 -->
            <div id="inappManual" hidden>
              <p class="inapp-manual">오른쪽 위 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요.</p>
              <button type="button" class="btn-inapp" id="copyUrlBtn">주소 복사</button>
              <p class="inapp-copy-hint" id="copyHint" hidden></p>
              <input type="text" class="inapp-url" id="inappUrl" readonly hidden aria-label="이 페이지 주소" />
            </div>
          </div>

          <!-- Social Login — 카카오 먼저 (작업자 링크는 카카오톡으로 받는다) -->
          <div class="social-buttons">
            <button type="button" class="btn-social btn-kakao" onclick="signInWithKakao()">
              <svg viewBox="0 0 24 24" fill="#191919">
                <path
                  d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.93 5.35 4.84 6.75-.22.81-.8 2.93-.92 3.38-.14.54.2.53.42.39.17-.11 2.72-1.84 3.83-2.59.59.09 1.2.13 1.83.13 5.52 0 10-3.58 10-8s-4.48-8-10-8z"
                />
              </svg>
              카카오로 계속하기
            </button>
            <button type="button" class="btn-social btn-google" onclick="signInWithGoogle()">
              <svg viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              Google로 계속하기
            </button>
          </div>

          <!-- 이메일 · 비밀번호로 가입했던 계정 — Supabase 가 같은 이메일의 구글 · 카카오 계정을 그 계정에 이어 준다 -->
          <p class="link-note" id="linkNote">
            이메일로 가입하셨던 분은 같은 이메일의 구글 · 카카오 계정으로 들어오시면 그 계정으로 이어집니다.
          </p>

          <!-- Footer -->
          <p class="form-footer">
            로그인하면 <a href="terms.html">이용약관</a> 및 <a href="privacy.html">개인정보처리방침</a>에 동의하게
            됩니다.
          </p>
        </div>
      </div>
    </div>

    <script>
      // Supabase 설정 - config.js에서 가져옴
      let supabaseClient = null;

      // Supabase 클라이언트 초기화
      try {
        if (typeof window.supabase !== 'undefined' && window.DADAM_CONFIG?.supabase) {
          const { url, anonKey } = window.DADAM_CONFIG.supabase;
          supabaseClient = window.supabase.createClient(url, anonKey);
          console.log('Supabase 초기화 성공');
        } else {
          console.error('Supabase 설정이 로드되지 않았습니다. js/config.js를 확인하세요.');
        }
      } catch (e) {
        console.error('Supabase 초기화 오류:', e);
      }

      // 로그인 뒤 돌아갈 곳 — ?redirect= 는 누구나 링크로 만들 수 있으므로 같은 사이트 *.html 만 받는다
      // (js/auth-redirect.js). 페이지를 열 때 한 번만 읽어 둔다.
      // 검사기가 안 실렸으면 믿지 않고 index.html 로 간다.
      const AuthRedirect = window.DadamAuthRedirect || null;
      const REDIRECT_TARGET = AuthRedirect ? AuthRedirect.fromSearch(window.location.search) : 'index.html';

      // OAuth 뒤 돌아올 주소 — 돌아갈 곳이 있으면 login.html?redirect=… 로 돌아와 아래 checkSession 이 보낸다
      function oauthRedirectTo() {
        return AuthRedirect
          ? AuthRedirect.oauthRedirectTo(window.location.origin, REDIRECT_TARGET)
          : window.location.origin + '/index.html';
      }

      // 회원가입으로 넘어가도 돌아갈 곳을 들고 간다
      if (AuthRedirect) {
        document.getElementById('signupLink').href = AuthRedirect.withRedirect('signup.html', REDIRECT_TARGET);
      }

      // 인앱 브라우저(카카오톡·네이버·인스타그램 등): 구글이 웹뷰 로그인을 막는다(disallowed_useragent).
      // 카카오 로그인은 그대로 된다. 앱 이름은 auth-redirect.js 의 고정 목록에서만 — UA 글자는 화면에 넣지 않는다.
      function setupInAppNotice() {
        const app = AuthRedirect ? AuthRedirect.inAppBrowser(navigator.userAgent) : null;
        if (!app) return;
        document.getElementById('inappText').textContent =
          app.label + ' 앱 안에서는 구글 로그인이 막힙니다. 카카오로 로그인하거나 외부 브라우저로 열어 주세요.';
        document.getElementById('inappNotice').hidden = false;
        if (AuthRedirect.externalOpenUrl(window.location.href, navigator.userAgent)) {
          const btn = document.getElementById('openExternalBtn');
          btn.hidden = false;
          btn.addEventListener('click', () => {
            window.location.href = AuthRedirect.externalOpenUrl(window.location.href, navigator.userAgent);
          });
        } else {
          // iOS 의 그 밖 앱 — 여는 주소가 없다. 메뉴 안내 + 주소 복사
          document.getElementById('inappManual').hidden = false;
          document.getElementById('copyUrlBtn').addEventListener('click', copyPageUrl);
        }
      }

      // 지금 주소 복사 — 앱이 클립보드를 막으면 주소를 보여 주고 글자를 골라 둔다 (길게 눌러 복사)
      async function copyPageUrl() {
        const href = window.location.href;
        const hint = document.getElementById('copyHint');
        try {
          await navigator.clipboard.writeText(href);
          hint.textContent = '주소를 복사했습니다. 다른 브라우저 주소창에 붙여 넣어 주세요.';
        } catch (e) {
          const input = document.getElementById('inappUrl');
          input.value = href;
          input.hidden = false;
          input.focus();
          input.select();
          input.setSelectionRange(0, href.length);
          hint.textContent = '자동 복사가 되지 않습니다. 아래 주소를 길게 눌러 복사해 주세요.';
        }
        hint.hidden = false;
      }

      setupInAppNotice();

      // DOM 요소
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.add('show');
        successMsg.classList.remove('show');
      }

      function hideMessages() {
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');
      }

      // Google 로그인
      async function signInWithGoogle() {
        if (!supabaseClient) {
          showError('Supabase가 설정되지 않았습니다.');
          return;
        }

        hideMessages();

        try {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: oauthRedirectTo(),
              // 이 브라우저에 로그인된 Google 계정으로 바로 넘어가지 않고 늘 계정을 고르게 한다 (다른 계정으로 들어가기)
              queryParams: { prompt: 'select_account' },
            },
          });

          if (error) {
            showError('Google 로그인 중 오류가 발생했습니다.');
          }
        } catch (err) {
          showError('Google 로그인 중 오류가 발생했습니다.');
        }
      }

      // 카카오 로그인 — signup.html 과 같은 공급자('kakao')
      async function signInWithKakao() {
        if (!supabaseClient) {
          showError('Supabase가 설정되지 않았습니다.');
          return;
        }

        hideMessages();

        try {
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'kakao',
            options: {
              redirectTo: oauthRedirectTo(),
            },
          });

          if (error) {
            showError('카카오 로그인 중 오류가 발생했습니다.');
          }
        } catch (err) {
          showError('카카오 로그인 중 오류가 발생했습니다.');
        }
      }

      // OAuth 가 실패하면 Supabase 가 돌아온 주소에 error_description 을 붙인다 (예: 카카오가 이메일을 주지 않음).
      // 그 글은 링크로 아무렇게나 꾸밀 수 있으므로 화면에는 고정 문구만, 원문은 콘솔에만 남긴다.
      // (옛 인증 메일 링크가 만료돼 돌아와도 같은 문구 — 이메일 로그인은 없다)
      (function showOAuthError() {
        const params = new URLSearchParams(window.location.hash.slice(1) + '&' + window.location.search.slice(1));
        const desc = params.get('error_description');
        if (!desc) return;
        console.warn('[login] OAuth:', params.get('error_code'), desc);
        showError('소셜 로그인에 실패했습니다. 다시 시도해 주세요.');
      })();

      // 페이지 로드 시 세션 확인
      function getRedirectUrl() {
        return REDIRECT_TARGET;
      }

      async function checkSession() {
        if (!supabaseClient) return;

        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (session) {
          window.location.href = getRedirectUrl();
        }
      }

      checkSession();
    </script>
    <script type="module" src="js/i18n.js"></script>
  </body>
</html>
