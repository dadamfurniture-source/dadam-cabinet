<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다담AI — Step 2 구조 (mockup)</title>
<style>
  :root{
    --brand-deep:#6a4b2a;
    --brand-mid:#b8956c;
    --brand-soft:#f3ead9;
    --bg:#fbfaf6;
    --bg-canvas:#f4efe7;
    --line:#e5e0d4;
    --text:#3d342a;
    --text-dim:#7a7062;
    --text-faint:#a89c84;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ── TopBar h:40 ─────────────────────────────────── */
  .topbar{height:40px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .step-pill{display:flex;align-items:center;gap:0;padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600}
  .step-pill button{border:none;background:transparent;padding:3px 10px;border-radius:999px;cursor:pointer;color:var(--text-dim);font-size:11px;font-weight:600;display:flex;gap:4px;align-items:center}
  .step-pill button.active{background:var(--brand-deep);color:#fff;box-shadow:0 2px 5px rgba(106,75,42,.25)}
  .step-pill .sep{width:14px;height:2px;background:var(--line);display:inline-block}
  .topbar .spacer{flex:1}
  .module-name{font-size:12px;color:var(--text);font-weight:600;background:var(--brand-soft);padding:4px 10px;border-radius:5px;border:1px solid var(--brand-mid)}
  /* W9-64: View toggle (3D / 2D) */
  .view-toggle{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px}
  .view-toggle button{padding:3px 10px;border:none;background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;border-radius:4px}
  .view-toggle button.active{background:var(--brand-deep);color:#fff}
  .panel-toggle{display:flex;gap:3px}
  .panel-toggle button{width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text)}
  .panel-toggle button.on{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}

  /* ── Mid (3-column) ─────────────────────────────── */
  .mid{flex:1;display:flex;min-height:0;overflow:hidden}
  .module-list{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
  .module-list.collapsed{width:32px}
  .module-list.collapsed .ml-body,.module-list.collapsed .ml-header-title{display:none}
  .ml-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-header-title{font-size:11px;color:var(--text);font-weight:600}
  /* W9-65: view mode toggle */
  .ml-mode-toggle{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-mode-toggle button{flex:1;padding:4px 0;border:1px solid var(--line);background:#fff;color:var(--text-dim);font-size:10px;font-weight:600;cursor:pointer;border-radius:3px}
  .ml-mode-toggle button.active{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .set-item{padding:8px 8px;margin:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:11px}
  .set-item:hover{background:var(--bg)}
  .set-item.active{background:var(--brand-soft);border-color:var(--brand-deep);font-weight:600}
  .set-item .set-meta{font-size:9px;color:var(--text-faint);margin-top:2px}
  .ml-body{flex:1;overflow-y:auto;padding:6px 4px}
  .module-item{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--text);transition:background .12s ease;border-left:3px solid transparent}
  .module-item:hover{background:var(--bg)}
  .module-item.active{background:var(--brand-soft);border-left-color:var(--brand-deep);font-weight:600}
  .module-item .mi-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--text-dim)}
  .module-item.active .mi-mark{background:var(--brand-deep);border-color:var(--brand-deep)}
  .module-item .mi-text{flex:1;line-height:1.3}
  .module-item .mi-dim{display:block;font-size:9px;color:var(--text-faint);margin-top:1px;font-family:monospace}

  /* ── Canvas (정면도) ────────────────────────────── */
  .canvas-wrap{flex:1;min-width:0;position:relative;background:var(--bg-canvas);overflow:hidden;background-image:linear-gradient(rgba(184,149,108,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(184,149,108,.08) 1px,transparent 1px);background-size:50px 50px}
  .canvas-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
  .canvas-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;text-align:center;line-height:1.6}
  /* 정면도 영역 */
  .area-rect{cursor:pointer;transition:opacity .12s ease}
  .area-rect:hover{opacity:0.85}
  /* W9-110: viewport sticky ruler bar (HTML, pan/zoom 따라가지 않음) */
  /* W9-120: 우측 corner 영역 118px 확장 (4 섹션 컬럼 30+22*4) */
  .ruler-top{position:absolute;top:0;left:30px;right:118px;height:30px;background:#fff;border-bottom:1px solid var(--line);z-index:10;cursor:crosshair;overflow:hidden;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none}
  .ruler-right{position:absolute;top:118px;right:0;bottom:30px;width:30px;background:#fff;border-left:1px solid var(--line);z-index:10;cursor:crosshair;overflow:hidden;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none}
  .ruler-corner{position:absolute;top:0;right:0;width:118px;height:118px;background:#fbfaf6;border-bottom:1px solid var(--line);border-left:1px solid var(--line);z-index:11}
  .ruler-tick{position:absolute;background:#3d342a;pointer-events:none}
  .ruler-top .ruler-tick{top:0;width:1px;height:8px}
  .ruler-top .ruler-tick.major{height:14px;background:#1a1a1a}
  .ruler-right .ruler-tick{left:0;height:1px;width:8px}
  .ruler-right .ruler-tick.major{width:14px;background:#1a1a1a}
  .ruler-label{position:absolute;font-family:monospace;font-size:9px;color:var(--text);pointer-events:none;white-space:nowrap}
  .ruler-top .ruler-label{top:14px;transform:translateX(-50%)}
  .ruler-right .ruler-label{left:14px;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
  .ruler-cursor{position:absolute;background:#b8956c;z-index:13;pointer-events:none;opacity:0.7}
  .ruler-top .ruler-cursor{top:0;width:2px;height:30px}
  .ruler-right .ruler-cursor{left:0;height:2px;width:30px}
  /* W9-118: ruler bar 외경 치수 버튼 (세트 모드 전용) */
  .ruler-btn{position:absolute;background:rgba(184,149,108,0.18);border:1px solid #b8956c;border-radius:3px;cursor:pointer;font-family:monospace;font-size:10px;color:#3d342a;display:flex;align-items:center;justify-content:center;user-select:none;transition:background .1s ease;z-index:12;box-sizing:border-box}
  .ruler-top .ruler-btn{top:2px;height:24px;min-width:24px}
  .ruler-right .ruler-btn{left:2px;width:24px;min-height:24px;writing-mode:vertical-rl;text-orientation:mixed}
  .ruler-btn:hover{background:rgba(184,149,108,0.42)}
  .ruler-btn.fixed{background:rgba(63,185,80,0.22);border-color:#3fb950;color:#1a4d24;font-weight:700}
  .ruler-btn.fixed:hover{background:rgba(63,185,80,0.38)}
  .ruler-btn-editor{position:absolute;z-index:100;background:#fff;border:1px solid #999;border-radius:6px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,0.15);font-size:12px;display:flex;flex-direction:column;gap:6px;min-width:160px;font-family:-apple-system,'Segoe UI',sans-serif}
  .ruler-btn-editor label{display:flex;align-items:center;gap:6px;color:#3d342a}
  .ruler-btn-editor input[type=number]{width:80px;padding:3px 6px;border:1px solid #ccc;border-radius:3px;font-family:monospace;font-size:12px}
  /* 영역 도구 — 영역을 고르면 우측 상단에 뜬다 */
  .area-tools{position:fixed;top:52px;right:316px;z-index:130;background:#fff;border:1px solid var(--brand-deep);
    border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;min-width:186px;
    font-family:-apple-system,'Segoe UI',sans-serif}
  .area-tools .at-title{font-size:12px;font-weight:700;color:var(--brand-deep)}
  .area-tools .at-room{font-size:11px;color:var(--text-dim);font-family:monospace;margin:2px 0 8px}
  .area-tools{min-width:214px}
  .area-tools .at-sec{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .area-tools .at-sec label{font-size:11px;color:var(--text-dim);font-weight:600;flex-shrink:0}
  .area-tools .at-sec select{flex:1;min-width:0;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font-size:11px}
  .area-tools .at-btns{display:flex;gap:6px}
  .area-tools button{flex:1;border:0;border-radius:4px;padding:6px 8px;cursor:pointer;font-weight:600;font-size:11px;
    white-space:nowrap}   /* 좁으면 "＋ 모듈 추 / 가" 로 접혔다 */
  .area-tools .at-add{background:var(--brand-deep);color:#fff}
  .area-tools .at-add:hover{background:#523a20}
  .area-tools .at-del{background:#eee;color:#666}
  .area-tools .at-del:hover{background:#ddd}
  .area-tools .at-note{font-size:10px;color:var(--text-dim);line-height:1.5;background:var(--bg);
    border:1px solid var(--line);border-radius:4px;padding:6px 8px}
  .area-tools .at-fin{margin-top:8px;margin-bottom:0;padding-top:8px;border-top:1px solid var(--line)}
  .area-tools .at-fin select{flex:1;min-width:0}
  .area-tools .at-finadd{flex:0 0 auto;background:#eee;color:#666;border:0;border-radius:4px;
    padding:4px 8px;cursor:pointer;font-weight:600;font-size:11px;white-space:nowrap}
  .area-tools .at-finadd:hover{background:#ddd}
  .area-tools .at-auto{width:100%;margin-top:6px;background:var(--brand-mid);color:#fff;
    border:0;border-radius:4px;padding:6px 8px;cursor:pointer;font-weight:600;font-size:11px;white-space:nowrap}
  .area-tools .at-auto:hover{background:#9d7c54}


  .ruler-btn-editor .row-actions{display:flex;gap:6px;margin-top:4px}
  .ruler-btn-editor button.apply{background:#b8956c;color:#fff;border:0;padding:5px 14px;border-radius:4px;cursor:pointer;font-weight:600;flex:1}
  .ruler-btn-editor button.apply:hover{background:#9d7c54}
  .ruler-btn-editor button.cancel{background:#eee;border:0;padding:5px 14px;border-radius:4px;cursor:pointer;color:#666;flex:1}
  .ruler-btn-editor button.cancel:hover{background:#ddd}
  /* W9-120: 섹션별 ruler 스트라이프 (상/하/키/붙) */
  .ruler-section-bar{position:absolute;left:30px;right:114px;height:22px;background:rgba(184,149,108,0.06);border-bottom:1px solid rgba(184,149,108,0.25);z-index:11;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none;overflow:hidden;box-sizing:border-box}
  .ruler-section-col{position:absolute;top:118px;bottom:30px;width:22px;background:rgba(184,149,108,0.06);border-left:1px solid rgba(184,149,108,0.25);z-index:11;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none;overflow:hidden;box-sizing:border-box}
  /* 상단 4 스트라이프 — top 30/52/74/96 */
  #rulerTopUpper{top:30px}
  #rulerTopLower{top:52px}
  #rulerTopTall{top:74px}
  #rulerTopWardrobe{top:96px}
  /* 우측 4 컬럼 — right 30/52/74/96 (corner 와 충돌 회피) */
  #rulerRightUpper{right:30px}
  #rulerRightLower{right:52px}
  #rulerRightTall{right:74px}
  #rulerRightWardrobe{right:96px}
  /* 섹션 태그 (좌측 작은 라벨) */
  .rsb-tag{position:absolute;left:2px;top:2px;font-size:10px;font-weight:700;color:#6a4b2a;background:rgba(255,255,255,0.7);padding:0 4px;border-radius:2px;z-index:13;pointer-events:none}
  .ruler-section-col .rsb-tag{top:2px;left:2px;writing-mode:horizontal-tb}
  /* 끄기 아이콘 (우측 끝) */
  .rsb-eye{position:absolute;right:2px;top:2px;width:16px;height:16px;border:none;background:rgba(255,255,255,0.7);color:#6a4b2a;border-radius:2px;font-size:10px;cursor:pointer;line-height:16px;padding:0;z-index:13}
  .rsb-eye:hover{background:#b8956c;color:#fff}
  /* 다시 켜기 floating panel */
  .section-restore-panel{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,0.9);border:1px solid var(--brand-mid);border-radius:4px;padding:4px;display:flex;gap:4px;z-index:20;font-size:11px;font-family:-apple-system,'Segoe UI',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
  .section-restore-panel button{border:1px solid var(--brand-mid);background:#fff;color:var(--text);padding:3px 8px;border-radius:3px;cursor:pointer;font-size:11px}
  .section-restore-panel button:hover{background:var(--brand-deep);color:#fff}
  /* 섹션 스트라이프 내 버튼 — 기존 ruler-btn 스타일 상속, 높이 조정 */
  .ruler-section-bar .ruler-btn{top:1px;height:20px;min-width:24px}
  .ruler-section-col .ruler-btn{left:1px;width:20px;min-height:24px;writing-mode:vertical-rl;text-orientation:mixed}
  /* ruler-top/right 자체는 corner 영역 확장 (114px → corner) */
  .area-label{font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700;fill:#fff;pointer-events:none}
  .area-label-small{font-size:10px;fill:#fff;opacity:0.85;pointer-events:none}
  .module-dim-label{fill:var(--text-dim);font-size:11px;font-weight:600;font-family:monospace;pointer-events:none}
  .shelf-line{stroke:#5a4d2f;stroke-width:2;stroke-dasharray:10 4;opacity:0.6}
  .open-direction{fill:#fff;font-size:14px;pointer-events:none;font-weight:700}
  /* 줌 안내 */
  .canvas-help{position:absolute;bottom:8px;left:8px;color:var(--text-faint);font-size:10px;padding:4px 8px;background:rgba(255,255,255,0.75);border-radius:4px;border:1px solid var(--line)}

  /* ── 우측 패널 ────────────────────────────── */
  .right-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width .18s ease}
  .right-panel.collapsed{width:32px}
  .right-panel.collapsed .section,.right-panel.collapsed .panel-header-title{display:none}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);font-size:11px;color:var(--text);font-weight:600}
  .panel-header button{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px}
  /* W12-33: 섹션이 일곱이라 다 펴면 화면보다 길다. 스크롤은 원래 됐지만
     **마지막 줄이 패널 바닥에 딱 붙어** 잘려 보였다 — 끝에 여백을 준다.
     스크롤바 자리를 늘 잡아 두어(gutter) 내용이 좌우로 흔들리지 않게 한다. */
  .sections{overflow-y:auto;flex:1;min-height:0;padding-bottom:28px;scrollbar-gutter:stable}
  .sections::-webkit-scrollbar{width:9px}
  .sections::-webkit-scrollbar-thumb{background:#d6c6b0;border-radius:5px;border:2px solid #fff}
  .sections::-webkit-scrollbar-thumb:hover{background:var(--brand-mid)}
  .section{border-bottom:1px solid var(--line)}
  .section-header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--text);
    position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
  .section-header:hover{background:var(--bg)}
  .section-header .chev{font-size:10px;color:var(--text-faint);transition:transform .15s ease}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .section.collapsed .section-body{display:none}
  .section-body{padding:8px 10px 12px;background:#fff;font-size:11px;color:var(--text)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0}
  .chk-row{display:flex;align-items:center;gap:6px;margin:8px 0 0;font-size:10px;color:var(--text-dim);cursor:pointer}
  .chk-row input{margin:0}
  .row label{color:var(--text-dim);font-size:11px}
  .row input[type="number"],.row select{padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:11px;background:#fff;color:var(--text);font-family:inherit}
  .row input[type="number"]{width:72px;text-align:right;font-family:monospace}
  .row select{font-family:inherit}
  .area-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
  .area-row:last-child{border-bottom:none}
  .area-row .a-lab{font-size:10px;color:var(--text);font-weight:600;font-family:monospace}
  .area-row select{padding:2px 4px;font-size:10px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .shelf-row{display:flex;align-items:center;gap:4px;margin:4px 0}
  .shelf-row input{flex:1;padding:3px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;text-align:right;font-family:monospace}
  .shelf-row button.del{padding:3px 6px;border:1px solid #c0392b;background:#fef0ed;color:#c0392b;border-radius:3px;font-size:10px;cursor:pointer;font-weight:600}
  .shelf-row button.del:hover{background:#fde0d8}
  .add-btn{display:block;width:100%;padding:5px;margin-top:6px;border:1px dashed var(--brand-mid);background:transparent;color:var(--brand-deep);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer}
  .add-btn:hover{background:var(--brand-soft)}
  .empty-msg{padding:20px 8px;color:var(--text-faint);font-size:11px;text-align:center;line-height:1.5}

  /* ── BottomBar h:32 ──────────────────────────── */
  .bottombar{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(0,0,0,.04);font-size:11px;color:var(--text-dim)}
  .bottombar .actions{display:flex;gap:6px}
  .bottombar button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer}
  .bottombar button:hover{background:var(--brand-soft)}
  .bottombar button.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .bottombar button.primary:hover{background:#553b22}
  .bottombar button.next{background:#1976d2;color:#fff;border-color:#0d47a1}
  .bottombar button.next:hover{background:#0d47a1}

  /* 토스트 */
  .toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(122,72,16,0.92);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;z-index:100;pointer-events:none;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-4px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>
<body>

<!-- TopBar -->
<div class="topbar">
  <div class="step-pill">
    <button onclick="sessionStorage.setItem('fromStructure','1'); location.href='mockup-shell'">📐 1.배치</button><span class="sep"></span>
    <button class="active">📦 2.구조</button><span class="sep"></span>
    <button>🎨 3.디테일</button>
  </div>
  <div class="module-name" id="curModuleName">모듈을 선택하세요</div>
  <div class="spacer"></div>
  <!-- W9-64: View toggle (3D / 정면도) -->
  <div class="view-toggle">
    <button id="view3dBtn" class="active" data-view="3d" title="3D 뷰">🧊 3D</button>
    <button id="view2dBtn" data-view="2d" title="정면도 (2D)">📐 정면도</button>
  </div>
  <!-- W9-86: 도어 표시 on/off -->
  <div class="view-toggle">
    <button id="doorToggleBtn" class="active" title="도어 표시 on/off">🚪 도어</button>
  </div>

<!-- 플래너 공통 모듈 — 배치 단계(mockup-shell)와 같은 정본.
     클래식 스크립트라 아래 인라인보다 먼저 실행되어야 하며,
     여기서 선언한 이름을 인라인이 재선언하면 SyntaxError 로 화면이 죽는다. -->
<script src="js/planner/planner-scope.js?v=37.5"></script>
<script src="js/planner/planner-view.js?v=37.5"></script>
<script src="js/planner/planner-sections.js?v=37.5"></script>
<!-- P2: 계산 엔진 — 구조 단계 전용 (배치 단계는 쓰지 않는다) -->
<script src="js/planner/planner-engine.js?v=37.5"></script>

<script>
  // ─────────────────────────────────────────────────────────────
  // SECTION_CONFIG — 정본은 js/planner/planner-sections.js.
  // 구조 단계만의 차이 두 가지를 여기서 명시적으로 얹는다:
  //   · wardrobe — 배치 단계엔 없는 섹션 (js/planner/planner-engine.js 의
  //     getMoldingH 주석 참고. 배치 단계 확장은 P11)
  //   · 마감재 3종 — 3D 에서 몸통에 묻히지 않도록 더 어두운 색
  // ─────────────────────────────────────────────────────────────
  const SECTION_CONFIG = buildSectionConfig(STRUCTURE_ONLY_SECTIONS, SECTION_PALETTE_3D);
  // 영역 type 별 색상 보정
  function colorForArea(sectionFill, type) {
    if (type === 'door')   return sectionFill;
    if (type === 'drawer') return darken(sectionFill, 0.15);
    if (type === 'open')   return '#fffaf2';
    return sectionFill;
  }
  function darken(hex, factor) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const f = 1 - factor;
    return '#' + [r*f,g*f,b*f].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }

  // ─────────────────────────────────────────────────────────────
  // P2: MASTER_RULES 는 js/planner/planner-engine.js 가 정본.
  //   계산 엔진(getMoldingH·calcDoorCount·distributeModules·calcDefaultShelves·
  //   collectXRanges·splitModuleByAppliance·autoCalcModule)도 같이 그쪽에 있다.
  // ─────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────
  // 데이터 모델
  // ─────────────────────────────────────────────────────────────
  // CD-3: 저장 스코프(PLANNER_SCOPE · scopedKey)는 js/planner/planner-scope.js 가 정본.
  // 배치 단계와 **같은 키**를 봐야 넘어온 배치를 읽을 수 있다.
  const LAYOUT_KEY    = PLANNER_LAYOUT_KEY;
  const STRUCTURE_KEY = PLANNER_STRUCTURE_KEY;
  const ORIGIN_KEY    = PLANNER_ORIGIN_KEY;

  /** @type {Array<{id, section, W, H, D}>} */
  // 배치에서 온 사각형은 **영역(area)** 이다. 모듈을 담는 그릇이지 모듈이 아니다.
  //   예전엔 사각형 하나가 곧 모듈 하나였다. 그래서 구조 단계는 배치를 열자마자
  //   모듈이 가득 찬 상태로 시작했고, 모듈을 더하거나 빼는 수단이 없었다.
  //   이제 영역은 **읽기 전용 배경**이고, 편집 대상은 그 안에 넣은 모듈뿐이다.
  let areas = [];
  // 구조 단계가 소유하는 모듈 목록. 배치 JSON 에는 넣지 않는다 —
  // 그 형식은 브리지 계약(골든 3종)의 입력이라 건드리면 계약이 깨진다.
  const MODULES_KEY = scopedKey('dadam_struct_modules_v1');
  let activeAreaId = null;
  // W12-31: 우측 패널이 **모듈**을 보여줄지 **영역**을 보여줄지.
  //   activeId·activeAreaId 로는 못 가른다 — 영역을 골라도 activeId 는 그대로 남고,
  //   모듈을 골라도 activeAreaId 는 안 지운다(둘 다 그래야 하는 이유가 있다).
  //   패널은 **마지막으로 고른 것**을 보여준다.
  let panelTarget = 'module';

  let modules = [];
  /** @type {Record<string, {verticalCount, horizontalSplits, areaTypes, shelves, handleType, handlePosition}>} */
  let structures = {};
  let activeId = null;

  // 모듈 ID 생성
  function moduleIdFor(section, idx) { return `${section}-${idx}`; }

  // 기본 구조 (모듈 첫 진입 시)
  function defaultStructure() {
    return {
      verticalCount: 1,        // 좌우 분할 N
      horizontalLayout: 'doorOnly',  // 'doorOnly' | 'doorTopDrawerBottom'
      drawerHeight: 200,       // 하부 서랍 H (mm)
      areaTypes: ['door'],     // 길이 = verticalCount (상부 영역)
      areaDirections: ['left'],  // 도어 열림 방향 (길이 = verticalCount)
      // W9-95: 영역별 폭 (불균등 분할 — 가전 X 정밀 분할 시 사용)
      // 빈 배열 또는 길이 ≠ verticalCount 면 균등 분할 (colW = W/N) fallback
      areaWidths: [],
      // W9-101: 영역별 양문 (2D) 여부 — true 면 cell 안에 도어 2장 + 가운데 처짐방지목
      areaIs2D: [],
      bottomType: 'drawer',    // doorTopDrawerBottom 시 하부 type
      bottomDirection: 'left', // 하부 도어일 때 방향
      shelves: [],             // 바닥부터 mm
      handleType: 'auto',      // W12-6: 미지정 — defaultHandleType 이 단별로 정한다
      handlePosition: 'top',
    };
  }

  // 모듈 로드 — localStorage 또는 sample
  /** 배치 사각형을 영역으로 읽는다. 마감재는 영역이 아니다. */
  function loadAreas() {
    areas = [];
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      const layout = raw ? JSON.parse(raw) : null;
      if (layout && Array.isArray(layout.modules)) {
        // 마감재(EP·몰딩·휠라)도 영역으로 싣는다. 예전엔 걸러 내서, 배치에서
        // 놓아도 구조 단계에서 아예 보이지 않고 클릭도 되지 않았다.
        // 다만 모듈을 담는 그릇은 아니므로 isFinishing 으로 구분해 둔다.
        // W12-16: 배치 원본에서 온 자리(_srcIndex)를 들고 있어야 영역 치수를
        // 고쳤을 때 되쓸 수 있다. id 의 i 는 **거른 뒤** 번호라 원본 index 와 다르다 —
        // id 규칙을 바꾸면 저장된 activeAreaId·module.areaId 가 끊기므로 그대로 둔다.
        areas = layout.modules
          .map((a, srcIndex) => ({ a, srcIndex }))
          .filter(({ a }) => SECTION_CONFIG[a.section])
          .map(({ a, srcIndex }, i) => ({
            id: 'area-' + a.section + '-' + i,
            _srcIndex: srcIndex,
            section: a.section,
            isFinishing: isFinishingSection(a.section),
            W: a.w, H: a.moduleH, D: a.h,
            x: a.x || 0, y: a.y || 0, rotation: a.rotation || 0,
            // 영역이 직접 가진 높이 부위 — 없으면 마스터 기본값을 쓴다 (stackForArea)
            pedestalH: a.pedestalH, moldingH: a.moldingH,
            topT: a.topT, baseKind: a.baseKind,   // W12-38
          }));
      }
    } catch (e) { console.warn('[STRUCT] 영역 로드 실패', e); }
    // 배치가 아직 없으면 예전 sample 과 같은 구성을 영역으로 보여준다.
    // (예전엔 이 sample 이 곧 모듈이었다 — 이제는 그릇이다)
    if (!areas.length) {
      areas = [
        { id: 'area-lower-0',  section: 'lower',  W: 2400, H: 860,  D: 650, x: 0,    y: 0,    rotation: 0  },
        { id: 'area-upper-0',  section: 'upper',  W: 2400, H: 800,  D: 320, x: 0,    y: 1000, rotation: 0  },
        { id: 'area-tall-0',   section: 'tall',   W: 600,  H: 2300, D: 650, x: 2500, y: 0,    rotation: 0  },
        { id: 'area-fridge-0', section: 'fridge', W: 720,  H: 2300, D: 700, x: 3200, y: 0,    rotation: 90 },
      ];
    }
  }

  /** 지금 열려 있는 배치의 저장 시각. 구조 단계 모듈이 어느 배치에 속하는지 가른다. */
  function currentLayoutStamp() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      return raw ? (JSON.parse(raw).savedAt || '') : '';
    } catch (e) { return ''; }
  }

  /**
   * 구조 단계가 소유한 모듈을 읽는다.
   *
   * 모듈은 **그 배치에 속한다.** 배치를 새로 만들면(savedAt 이 바뀌면) 예전 배치에
   * 넣어 둔 모듈은 더 이상 맞지 않으므로 빈 상태로 시작한다 — 그래야 새 배치가
   * "영역만 보이는 첫 화면" 으로 열린다. 같은 배치를 다시 열면 짜 둔 모듈이 남는다.
   */
  function loadStructModules() {
    try {
      const raw = localStorage.getItem(MODULES_KEY);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      // 예전 형식(배열)은 스탬프가 없다 — 현재 배치의 것으로 본다.
      if (Array.isArray(saved)) { modules = saved; return true; }
      if (saved.layoutSavedAt === currentLayoutStamp()) { modules = saved.modules || []; return true; }
      modules = [];        // 다른 배치의 모듈이다 — 새 배치로 연다
      return true;
    } catch (e) { console.warn('[STRUCT] 모듈 로드 실패', e); }
    return false;
  }
  function saveStructModules() {
    localStorage.setItem(MODULES_KEY, JSON.stringify({
      layoutSavedAt: currentLayoutStamp(),
      modules,
    }));
  }

  function loadModules() {
    loadAreas();
    // 이미 이 방식으로 저장한 적이 있으면 그것을 쓴다.
    if (loadStructModules()) { seatAllModuleDepths(); return; }
    // 예전 방식으로 만든 설계는 그대로 열어 준다 — 구조를 짜 둔 설계가
    // 열자마자 빈 화면이 되는 것이 사용자에겐 데이터를 잃은 것과 같다.
    // 판단 근거는 "구조가 이미 있는가" 다. 구조가 없으면 새 설계로 본다.
    //
    // 메모리의 structures 를 보지 않고 저장소를 직접 읽는다 —
    // 초기화에서 loadModules() 가 loadStructures() 보다 먼저 돌기 때문에
    // 메모리를 믿으면 항상 "새 설계" 로 판정된다.
    let legacy = false;
    try {
      const rawS = localStorage.getItem(STRUCTURE_KEY);
      legacy = !!rawS && Object.keys(JSON.parse(rawS) || {}).length > 0;
    } catch (e) { legacy = false; }
    if (!legacy) { modules = []; return; }
    loadModulesLegacy();
    seatAllModuleDepths();
    // 레거시로 읽은 즉시 현재 배치 도장을 찍어 둔다.
    // 안 찍으면 이 설계는 **영원히** 레거시로 열려, 배치를 새로 만들어도
    // 영역 화면을 보지 못한다 (구조가 한 번이라도 있으면 계속 걸리기 때문).
    saveStructModules();
  }

  function loadModulesLegacy() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (raw) {
        const layout = JSON.parse(raw);
        if (layout.modules && layout.modules.length) {
          const FINISHING_SECTIONS = ['ep', 'molding', 'filler'];
          // 1) 일반 모듈만 추출
          modules = layout.modules
            // CD-3: 원본 배열에서의 위치를 남겨둔다 — 구조 단계 편집을 되쓸 때
            // 어느 항목을 갱신할지 알아야 하고, 마감재는 건드리면 안 된다.
            .map((m, srcIndex) => ({ m, srcIndex }))
            .filter(({ m }) => SECTION_CONFIG[m.section] && !FINISHING_SECTIONS.includes(m.section))
            .map(({ m, srcIndex }, i) => ({
              id: moduleIdFor(m.section, i),
              _srcIndex: srcIndex,
              section: m.section,
              W: m.w,
              H: m.moduleH,
              D: m.h,
              x: m.x || 0,
              y: m.y || 0,
              rotation: m.rotation || 0,
              // W9-77: 자식 마감재 (attachToSelected 로 추가된 것) 평행 추출
              finishings: (m.finishings || []).map(f => ({
                section: f.section,
                W: f.w,
                H: f.moduleH || m.moduleH,
                D: f.h,
                x: f.x,
                y: f.y,
              })),
            }));
          // 2) W9-84: 사이드바 직접 추가된 standalone 마감재 (top-level modules 의 ep/molding/filler)
          //    → 가장 가까운 모듈의 finishings 에 push (구조 단계에 표시되도록)
          const standalone = layout.modules.filter(m => FINISHING_SECTIONS.includes(m.section));
          console.log('[STRUCT] loadModules', { totalModules: layout.modules.length, regular: modules.length, standaloneFinishings: standalone.length, sections: layout.modules.map(m => m.section) });
          standalone.forEach((fm) => {
            const fxC = (fm.x || 0) + (fm.w || 0) / 2;
            const fyC = (fm.y || 0) + (fm.h || 0) / 2;
            let closest = null, closestDist = Infinity;
            modules.forEach((m) => {
              const mxC = m.x + m.W / 2;
              const myC = m.y + m.D / 2;
              const d = Math.hypot(fxC - mxC, fyC - myC);
              if (d < closestDist) { closestDist = d; closest = m; }
            });
            if (closest) {
              closest.finishings.push({
                section: fm.section,
                W: fm.w,
                H: fm.moduleH || closest.H,
                D: fm.h,
                x: fm.x || 0,
                y: fm.y || 0,
              });
            }
          });
          return;
        }
      }
    } catch (e) { console.warn('layout load 실패', e); }
    // sample — ㄱ자 구조 (3개 회전 0 + 1개 회전 90)
    modules = [
      { id: 'lower-0', section: 'lower', W: 2400, H: 860,  D: 650, x: 0,    y: 0,    rotation: 0  },
      { id: 'upper-0', section: 'upper', W: 2400, H: 800,  D: 320, x: 0,    y: 1000, rotation: 0  },
      { id: 'tall-0',  section: 'tall',  W: 600,  H: 2300, D: 650, x: 2500, y: 0,    rotation: 0  },
      { id: 'fridge-0', section: 'fridge', W: 720, H: 1850, D: 700, x: 3200, y: 0,    rotation: 90 },
    ];
  }

  function loadStructures() {
    try {
      const raw = localStorage.getItem(STRUCTURE_KEY);
      structures = raw ? JSON.parse(raw) : {};
    } catch (e) { structures = {}; }
  }
  function saveStructures() {
    localStorage.setItem(STRUCTURE_KEY, JSON.stringify(structures));
  }

  /**
   * CD-3: 구조 단계에서 바꾼 모듈 치수를 배치 레이아웃에 되쓴다.
   *
   * 예전엔 이 파일의 localStorage 쓰기가 saveStructures() 한 곳뿐이라,
   * 눈금자로 고친 W/H 와 자동계산이 재배치한 x 가 **메모리에만** 있었다.
   * 새로고침하거나 "배치 로드"를 누르면 원래 값으로 되돌아갔고,
   * 특히 H 는 배치 단계에 입력이 없어 되돌아가면 복구할 방법이 없었다.
   *
   * 통째로 다시 만들지 않고 원본 항목을 갱신한다 — 마감재(ep/molding/filler)와
   * person·origin 같은 다른 필드를 건드리지 않기 위해서다.
   * 구조 단계에서 삭제된 모듈(W<100 으로 splice 된 것)은 여기서도 빠진다.
   */
  function saveLayoutFromModules() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (!raw) return false;
      const layout = JSON.parse(raw);
      if (!layout || !Array.isArray(layout.modules)) return false;

      const FINISHING_SECTIONS = ['ep', 'molding', 'filler'];
      const byIdx = new Map();
      modules.forEach((mod) => {
        if (Number.isInteger(mod._srcIndex)) byIdx.set(mod._srcIndex, mod);
      });
      // 샘플 데이터로 띄운 경우엔 되쓸 원본이 없다
      if (byIdx.size === 0) return false;

      const next = [];
      layout.modules.forEach((entry, i) => {
        const isRegular = SECTION_CONFIG[entry.section] && !FINISHING_SECTIONS.includes(entry.section);
        if (!isRegular) { next.push(entry); return; }   // 마감재·기타는 원본 보존
        const mod = byIdx.get(i);
        if (!mod) return;                                // 구조 단계에서 삭제됨
        next.push({ ...entry, w: mod.W, moduleH: mod.H, h: mod.D, x: mod.x, y: mod.y });
      });

      layout.modules = next;
      layout.savedAt = new Date().toISOString();
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
      return true;
    } catch (e) {
      console.warn('[CD-3] 배치 되쓰기 실패:', e);
      return false;
    }
  }


  /**
   * W12-16: 영역에서 고친 값을 배치 원본(LAYOUT_KEY)에 되쓴다.
   *
   * 영역은 배치 단계가 정본이라, 구조 단계에서 치수를 고쳐도 되쓰지 않으면
   * 새로고침에 사라진다. `_srcIndex` 로 원본 자리를 찾는다 — 영역 id 의 번호는
   * 거른 뒤 번호라 원본 index 와 다르다.
   */
  function saveLayoutFromAreas() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (!raw) return false;
      const layout = JSON.parse(raw);
      if (!layout || !Array.isArray(layout.modules)) return false;
      let touched = 0;
      areas.forEach((a) => {
        if (!Number.isInteger(a._srcIndex)) return;
        const entry = layout.modules[a._srcIndex];
        if (!entry) return;
        entry.w = a.W; entry.moduleH = a.H; entry.h = a.D;
        if (a.pedestalH == null) delete entry.pedestalH; else entry.pedestalH = a.pedestalH;
        if (a.moldingH == null) delete entry.moldingH; else entry.moldingH = a.moldingH;
        // W12-38: 상판 두께와 받침 종류도 배치에 되쓴다.
        if (a.topT == null) delete entry.topT; else entry.topT = a.topT;
        if (!a.baseKind) delete entry.baseKind; else entry.baseKind = a.baseKind;
        touched++;
      });
      if (!touched) return false;
      layout.savedAt = new Date().toISOString();
      localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
      return true;
    } catch (e) {
      console.warn('[W12-16] 영역 되쓰기 실패:', e);
      return false;
    }
  }

  /**
   * CD-6: 자동계산 직후 상태 스냅샷 (학습용 기준선).
   *
   * 목표는 "자동 모듈 분배 품질" 학습이다. 자동계산이 낸 값과 사용자가
   * 최종적으로 고친 값의 **차이**가 학습 신호인데, 지금까지는 최종값만 남아
   * 그 신호가 존재하지 않았다.
   *
   * 타임스탬프는 넣지 않는다 — 이 값이 설계 스냅샷 payload 를 타고 서버로 가는데,
   * 매번 달라지는 값이 섞이면 content_hash 가 흔들려 같은 설계인데도 rev 가
   * 계속 늘어난다. (서버는 '_' 로 시작하는 이 키를 해시에서 제외한다)
   */
  function snapshotAutoCalc(m, s) {
    const arr = (a) => (Array.isArray(a) ? a.slice() : []);
    return {
      W: Number(m.W) || 0,
      H: Number(m.H) || 0,
      verticalCount: Number(s.verticalCount) || 0,
      areaWidths: arr(s.areaWidths),
      areaTypes: arr(s.areaTypes),
      areaIs2D: arr(s.areaIs2D),
      shelves: arr(s.shelves),
      drawerHeight: Number(s.drawerHeight) || 0,
      drawerCount: Number(s.drawerCount) || 1,
      horizontalLayout: s.horizontalLayout || '',
      bottomType: s.bottomType || '',
    };
  }

  /** 구조 + 배치를 함께 저장 — 편집 결과가 새로고침을 견디게 한다 */
  /**
   * 지금 상태를 전부 저장한다. 편집 경로는 모두 이 함수 하나만 부르면 된다.
   *
   * W12-28: `saveStructModules()` 가 빠져 있었다. `modules` 배열(m.W/H/D/x/isFixed)의
   *   정본 저장소는 MODULES_KEY 이고 거기 쓰는 함수는 그것 하나뿐이다.
   *   `saveLayoutFromModules()` 는 `_srcIndex` 가 없으면 곧바로 빠지는데
   *   `addModuleToArea` 가 만든 모듈에는 그게 없다 — 그래서 영역에 넣은 모듈의
   *   치수 편집이 **어느 경로로도 새로고침을 못 견뎠다** (실측: 폭 777 → 600).
   *
   * 순서가 중요하다. `saveLayoutFromModules()` 가 `layout.savedAt` 을 갱신하고,
   *   `loadStructModules()` 는 그 값(`currentLayoutStamp`)으로 모듈 소속을 판정한다.
   *   배치를 되쓴 **뒤에** 모듈을 찍어야 새 도장이 박힌다. 뒤집으면 예전 방식으로
   *   열린 설계가 편집 한 번 뒤 새로고침에 **모듈 0개**가 된다 (실측으로 그랬다).
   */
  /**
   * 모듈을 배치 공간 **앞선**에 맞춘다. 남는 깊이는 **뒤에** 둔다.
   *
   * 배치 공간 깊이는 몸통 + 도어다 (W12-25). 앞선은 상판·걸레받이가 따라가는
   * 기준선이라 조립체 앞면이 거기 붙어야 하고, 뒤에 남는 자리는 배관이 지난다.
   *
   *   도어 앞면 = m.y + m.D + DOOR_T = area.y + area.D
   *
   * 예전엔 `m.y = area.y` 라 모듈이 **뒤에 붙고 앞이 비었다** — 영역 D700 에
   * 하부장 D550 이면 앞에 132mm 가 떠 있었다.
   *
   * 마감재는 배치 공간 깊이 그대로라(W12-18) 앞뒤로 꽉 찬다.
   *
   * **회전과 무관하다.** W12-36 이 좌표 규약을 배치 단계에 맞춘 뒤로,
   * `m.y`·`m.D` 는 회전 전 좌표라 어느 회전에서나 깊이 축이고 영역의
   * `a.y`·`a.D` 도 같은 축이다. 모듈은 영역 중심을 축으로 함께 돈다
   * (`modulePlaneBox`). 그래서 회전 다리의 모듈도 같은 식으로 앉힌다.
   */
  function seatModuleDepth(m) {
    if (!m) return false;
    // areaId 가 있으면 그것을, 없으면 areaOfModule 의 추정을 쓴다 — 옛 설계의
    // 모듈도 앞선에 와야 한다.
    const area = areaOfModule(m);
    if (!area) return false;
    const y = m.isFinishing
      ? (area.y || 0)
      : (area.y || 0) + Math.max(0, (area.D || 0) - DOOR_T - (m.D || 0));
    if (m.y === y) return false;
    m.y = y;
    return true;
  }

  /** 모듈 전체를 다시 앉힌다. 값이 이미 맞으면 아무것도 안 한다(멱등). */
  function seatAllModuleDepths() {
    let n = 0;
    modules.forEach((m) => { if (seatModuleDepth(m)) n++; });
    return n;
  }

  function persistPlannerState() {
    // 저장 전에 깊이를 다시 앉힌다 — 모듈 D·영역 D 를 고치는 길이 여럿이라
    // 부르는 쪽마다 챙기면 한 곳은 빠진다.
    seatAllModuleDepths();
    saveStructures();
    saveLayoutFromModules();
    saveStructModules();
  }
  function getStructure(id) {
    if (!structures[id]) { structures[id] = defaultStructure(); return structures[id]; }
    // 저장된 구조에 빠진 항목을 채운다.
    //   areaTypes 하나만 없어도 renderModuleFront 가 s.areaTypes[i] 에서 터지고,
    //   그 예외가 렌더 전체를 멈춰 **흰 화면**이 된다. 실제로 그렇게 죽었다.
    //   예전 형식·부분 저장·손으로 고친 값이 모두 여기로 들어온다.
    const d = defaultStructure();
    const s = structures[id];
    for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
    return s;
  }

  // ─────────────────────────────────────────────────────────────
  // 좌측 모듈 리스트 렌더
  // ─────────────────────────────────────────────────────────────
  function renderModuleList() {
    const body = document.getElementById('mlBody');
    if (!modules.length) {
      body.innerHTML = areas.length
        ? '<div class="empty-msg">아직 모듈이 없습니다<br><span style="font-size:10px">도면의 영역을 클릭해 모듈을 추가하세요</span></div>'
        : '<div class="empty-msg">배치된 영역 없음<br><span style="font-size:10px">mockup-shell.html 에서 배치 후 돌아오세요</span></div>';
      return;
    }
    body.innerHTML = modules.map(m => `
      <div class="module-item ${m.id === activeId ? 'active' : ''}" data-id="${m.id}">
        <span class="mi-mark"></span>
        <div class="mi-text">
          ${SECTION_CONFIG[m.section].label}${m.part ? ` · ${m.part}` : ''} ${m.id.split('-')[1] ? `#${parseInt(m.id.split('-')[1])+1}` : ''}
          <span class="mi-dim">W${m.W} × H${m.H} × D${m.D}</span>
        </div>
      </div>
    `).join('');
    body.querySelectorAll('.module-item').forEach(el => {
      // W12-15: 목록 클릭 = 도면에서 모듈을 클릭한 것과 **똑같이** 동작한다.
      //   예전엔 `activeAreaId = null` 로 영역 보기를 벗어나 그 모듈 하나만 크게
      //   띄웠다. 같은 모듈을 도면에서 누를 때와 결과가 달라 혼란스러웠다 —
      //   색이 변하고 옵션 팔레트가 뜨는 쪽으로 맞춘다.
      el.onclick = () => {
        const m = modules.find((x) => x.id === el.dataset.id);
        const area = areaOfModule(m);
        if (area && area.id !== activeAreaId) { activeAreaId = area.id; renderAreaTools(); }
        setActiveModule(el.dataset.id);
      };
    });
  }

  /**
   * W12-15: 모듈이 속한 영역을 찾는다.
   *
   * 예전 방식으로 만든 설계의 모듈에는 `areaId` 가 없다 (loadModulesLegacy 가
   * 도면에서 바로 만든다). 그래서 id 로 못 찾으면 **자리로** 찾는다 —
   * 같은 섹션·같은 회전이면서 X 구간이 겹치는 영역이다.
   */
  function areaOfModule(m) {
    if (!m) return null;
    if (m.areaId) {
      const byId = areaById(m.areaId);
      if (byId) return byId;
    }
    const mx0 = m.x || 0, mx1 = mx0 + (m.W || 0);
    const rot = ((m.rotation || 0) % 360 + 360) % 360;
    return areas.find((a) => {
      if (a.isFinishing) return false;
      if (((a.rotation || 0) % 360 + 360) % 360 !== rot) return false;
      const ax0 = a.x || 0, ax1 = ax0 + (a.W || 0);
      return mx0 < ax1 && mx1 > ax0;      // X 구간이 겹친다
    }) || null;
  }

  function setActiveModule(id) {
    activeId = id;
    panelTarget = 'module';
    renderModuleList();
    renderFrontView();
    renderRightPanel();
    document.getElementById('curModuleName').textContent = (() => {
      const m = modules.find(x => x.id === id);
      if (!m) return '모듈을 선택하세요';
      const cfg = SECTION_CONFIG[m.section];
      const idx = parseInt(id.split('-')[1] || 0) + 1;
      return `${cfg.label} #${idx}`;
    })();
    syncCanvasEmpty();
    // 영역 보기 중이면 화면을 모듈로 당기지 않는다 — 계획 전체가 보이는 편이 낫다.
    if (!activeAreaId) fitToActiveModule();
  }

  // ─────────────────────────────────────────────────────────────
  // 중앙 정면도 (SVG)
  // ─────────────────────────────────────────────────────────────
  // view 상태와 좌표변환은 js/planner/planner-view.js 가 정본.
  // applyView 는 이 페이지의 DOM(#contentG · 뷰포트 눈금자)에 묶여 있어 여기 남는다.
  function applyView() {
    const content = document.getElementById('contentG');
    content.setAttribute('transform', viewTransform(view));
    const wrap = document.getElementById('canvasWrap');
    const bg = gridBackground(view);
    wrap.style.backgroundSize = bg.size;
    wrap.style.backgroundPosition = bg.position;
    document.getElementById('zoomInd').textContent = Math.round(view.zoom * 100) + '%';
    // W9-110: viewport ruler 갱신
    updateViewportRulers();
  }

  // W9-110: viewport ruler — pan/zoom 변경 시 tick + 라벨 재생성
  //   화면 px = (SVG mm * zoom) + panX
  //   화면 px → SVG mm = (px - panX) / zoom
  function updateViewportRulers() {
    const rulerTop = document.getElementById('rulerTop');
    const rulerRight = document.getElementById('rulerRight');
    if (!rulerTop || !rulerRight || rulerTop.style.display === 'none') return;
    const cw = rulerTop.clientWidth, ch = rulerRight.clientHeight;
    const z = view.zoom || 1;
    // tick 간격 — zoom 에 따라 50 / 100 / 500 / 1000 mm
    let tickMM = 100;
    const pxPerMM = z;
    if (pxPerMM < 0.05) tickMM = 1000;
    else if (pxPerMM < 0.15) tickMM = 500;
    else if (pxPerMM < 0.4) tickMM = 200;
    else if (pxPerMM < 1.0) tickMM = 100;
    else tickMM = 50;
    // W9-119/120: ruler-top(left:30), ruler-right(top:118) — 4 섹션 컬럼 reserve 후 변경
    const RULER_TOP_X_OFFSET = 30;
    const RULER_RIGHT_Y_OFFSET = 118;
    // 가로 ruler
    rulerTop.innerHTML = '';
    const mmStart = Math.floor((-view.panX + RULER_TOP_X_OFFSET) / z / tickMM) * tickMM;
    const mmEnd   = Math.ceil((cw + RULER_TOP_X_OFFSET - view.panX) / z / tickMM) * tickMM;
    for (let mm = mmStart; mm <= mmEnd; mm += tickMM) {
      const px = mm * z + view.panX - RULER_TOP_X_OFFSET;
      if (px < 0 || px > cw) continue;
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (mm % (tickMM * 5) === 0 ? ' major' : '');
      tick.style.left = px + 'px';
      rulerTop.appendChild(tick);
      if (mm % (tickMM * 5) === 0) {
        const lab = document.createElement('div');
        lab.className = 'ruler-label';
        lab.style.left = px + 'px';
        lab.textContent = mm;
        rulerTop.appendChild(lab);
      }
    }
    // 세로 ruler
    rulerRight.innerHTML = '';
    const yStart = Math.floor((-view.panY + RULER_RIGHT_Y_OFFSET) / z / tickMM) * tickMM;
    const yEnd   = Math.ceil((ch + RULER_RIGHT_Y_OFFSET - view.panY) / z / tickMM) * tickMM;
    for (let mm = yStart; mm <= yEnd; mm += tickMM) {
      const py = mm * z + view.panY - RULER_RIGHT_Y_OFFSET;
      if (py < 0 || py > ch) continue;
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (mm % (tickMM * 5) === 0 ? ' major' : '');
      tick.style.top = py + 'px';
      rulerRight.appendChild(tick);
      if (mm % (tickMM * 5) === 0) {
        const lab = document.createElement('div');
        lab.className = 'ruler-label';
        lab.style.top = py + 'px';
        lab.textContent = mm;
        rulerRight.appendChild(lab);
      }
    }
    // W9-118: ruler 버튼 (세트 모드) 재배치
    if (typeof renderRulerButtons === 'function') renderRulerButtons();
  }

  // W9-110: ruler 클릭 — 클릭 px 의 SVG mm 좌표 toast
  function attachRulerHandlers() {
    const rulerTop = document.getElementById('rulerTop');
    const rulerRight = document.getElementById('rulerRight');
    if (!rulerTop || !rulerRight) return;
    rulerTop.onclick = (e) => {
      // W9-118: 버튼 클릭은 무시 (버튼 자체 핸들러에서 처리)
      if (e.target.classList && e.target.classList.contains('ruler-btn')) return;
      const rect = rulerTop.getBoundingClientRect();
      const px = e.clientX - rect.left;
      // W9-119: ruler-top left:30 offset 보정 — clickPx 는 ruler 내 좌표 + 30 = canvas-wrap 좌표
      const mm = Math.round((px + 30 - view.panX) / (view.zoom || 1));
      if (typeof showToast === 'function') showToast('📐 X = ' + mm + ' mm');
    };
    rulerRight.onclick = (e) => {
      if (e.target.classList && e.target.classList.contains('ruler-btn')) return;
      const rect = rulerRight.getBoundingClientRect();
      const py = e.clientY - rect.top;
      // W9-120: ruler-right top:118 offset 보정 (4 섹션 컬럼 reserve)
      const mm = Math.round((py + 118 - view.panY) / (view.zoom || 1));
      // 정면도 Y 는 위→아래 (천장=0, 바닥=ceilingHeight) → 사람 시점 H 변환
      const h = ceilingHeight - mm;
      if (typeof showToast === 'function') showToast('📐 H = ' + h + ' mm (Y=' + mm + ')');
    };
  }

  // ─────────────────────────────────────────────────────────────────
  // W9-118: 정면도 ruler 외경 치수 버튼 (세트 모드 전용)
  //   - 상단 ruler: 같은 X 범위(start/end) + 동일 W 모듈을 1 버튼으로 병합
  //   - 우측 ruler: 동일 H 값 모듈을 1 그룹으로 묶고 각 모듈 Y 위치에 버튼 표시
  //   - 클릭 → 치수 입력 + 고정 체크 → 적용 → 매칭 모듈 일괄 갱신
  //   - W 변경 시 인접 비고정 모듈이 흡수/제거 (세트 너비 절대 보존)
  // ─────────────────────────────────────────────────────────────────

  // 세트 내 모듈을 footprint 기준으로 W/H 그룹화
  //   W9-119: 자동계산 cell (s.areaWidths) 을 W entity 로 인식
  //     - 자동계산 전: cells = [m.W] (모듈 전체 = 1 cell)
  //     - 자동계산 후: cells = s.areaWidths (예: [600,600,600])
  //     - 각 cell 을 ruler 의 entity 로 push (모듈 외경이 아닌 cell 단위)
  //   W entity 매칭: 정확히 같은 X 범위(start/end) + 동일 W 인 cell 들 1 버튼으로 병합
  //   H 그룹: 모듈 단위 (cells 가 H 공유)
  function buildRulerGroups(setModules) {
    const ox = getFrontViewOriginX();
    const wGroups = new Map();   // key: `${xStart}-${xEnd}-${W}`
    const hGroups = new Map();   // key: `H${H}`
    for (const m of setModules) {
      // 가전(sink/hood/dishwasher/fridge)은 외경 조작 대상 제외
      if (['sink','hood','dishwasher','fridge'].includes(m.section)) continue;
      const baseY  = baseYOf(m);
      const yTop   = ceilingHeight - (baseY + m.H);   // 정면도 Y (위→아래)
      // W9-119: cell entity — 자동계산 결과(s.areaWidths) 가 있으면 cell 단위로 분해
      const s = (typeof getStructure === 'function') ? getStructure(m.id) : null;
      const cells = (s && Array.isArray(s.areaWidths) && s.areaWidths.length > 0)
        ? s.areaWidths
        : [m.W];   // fallback: 모듈 외경 1 cell
      const isMultiCell = cells.length > 1;
      let cellOffset = 0;
      cells.forEach((cellW, cellIdx) => {
        const cellXStartMM = (m.x || 0) + cellOffset;
        const xStart = Math.round(cellXStartMM - ox);
        const xEnd   = xStart + Math.round(cellW);
        const wKey = `${xStart}-${xEnd}-${Math.round(cellW)}`;
        if (!wGroups.has(wKey)) wGroups.set(wKey, {
          xStart, xEnd, W: cellW, entities: [], anyFixed: false
        });
        const wg = wGroups.get(wKey);
        wg.entities.push({ moduleId: m.id, cellIdx, m, isCell: isMultiCell });
        if (m.isFixed) wg.anyFixed = true;
        cellOffset += cellW;
      });
      // H 그룹: 모듈 단위 (cells 공유 H)
      const hKey = `H${Math.round(m.H)}`;
      if (!hGroups.has(hKey)) hGroups.set(hKey, { H: m.H, modules: [], positions: [], anyFixed: false });
      const hg = hGroups.get(hKey);
      hg.modules.push(m);
      hg.positions.push({ yTop, H: m.H });
      if (m.isFixed) hg.anyFixed = true;
    }
    return { wGroups: [...wGroups.values()], hGroups: [...hGroups.values()] };
  }

  // ─────────────────────────────────────────────────────────────────
  // W9-120: 섹션 정의 (상/하/키/붙) + 토글 상태
  //   - 자동 감지: 활성 세트의 모듈 중 해당 섹션 모듈 1개 이상 있으면 자동 ON
  //   - 수동 토글: 눈 아이콘 클릭으로 OFF → restore 패널로 다시 ON
  //   - 섹션 격리: 매칭 키에 section 포함 → 다른 섹션 간 cross-matching 차단
  // ─────────────────────────────────────────────────────────────────
  const RULER_SECTIONS = [
    { id: 'upper',    label: '상부장', match: m => m.section === 'upper' },
    { id: 'lower',    label: '하부장', match: m => m.section === 'lower' },
    { id: 'tall',     label: '키큰장', match: m => m.section === 'tall' },
    { id: 'wardrobe', label: '붙박이장', match: m => m.section === 'wardrobe' },
  ];
  const sectionRulerUserOff = new Set();   // 사용자가 명시적 끈 섹션

  // 활성 세트 모듈로부터 섹션 존재 여부 자동 감지
  function detectSectionPresence(setModules) {
    const present = {};
    for (const s of RULER_SECTIONS) {
      present[s.id] = setModules.some(s.match);
    }
    return present;
  }

  // ruler 버튼 DOM 렌더 (updateViewportRulers 직후 호출)
  //   W9-120: 4 섹션 각각의 ruler-section-bar / ruler-section-col 에 분산 렌더
  function renderRulerButtons() {
    const rulerTop = document.getElementById('rulerTop');
    const rulerRight = document.getElementById('rulerRight');
    if (!rulerTop || !rulerRight) return;
    // 기존 ruler-top/right (ticks 영역) + 4 섹션 버튼 모두 제거
    rulerTop.querySelectorAll('.ruler-btn').forEach(n => n.remove());
    rulerRight.querySelectorAll('.ruler-btn').forEach(n => n.remove());
    for (const s of RULER_SECTIONS) {
      const wBar = document.getElementById('rulerTop'   + cap(s.id));
      const hCol = document.getElementById('rulerRight' + cap(s.id));
      if (wBar) wBar.querySelectorAll('.ruler-btn').forEach(n => n.remove());
      if (hCol) hCol.querySelectorAll('.ruler-btn').forEach(n => n.remove());
    }
    // W12-15: 배치 모드 + 활성 영역 + ruler 표시 중 일 때만 (예전엔 세트 모드였다)
    if (viewMode !== 'area' || !activeAreaId) { updateSectionRulerVisibility({}); return; }
    if (rulerTop.style.display === 'none') { updateSectionRulerVisibility({}); return; }
    const areaMods = modules.filter((m) => m.areaId === activeAreaId);
    if (!areaMods.length) { updateSectionRulerVisibility({}); return; }

    const present = detectSectionPresence(areaMods);
    updateSectionRulerVisibility(present);

    const z = view.zoom || 1;
    // W9-119: ruler-top left:30, ruler-right top:118 (W9-120 변경 — 4 컬럼 reserve)
    const RULER_TOP_X_OFFSET = 30;
    const RULER_RIGHT_Y_OFFSET = 118;

    for (const sec of RULER_SECTIONS) {
      if (!present[sec.id] || sectionRulerUserOff.has(sec.id)) continue;
      const wBar = document.getElementById('rulerTop'   + cap(sec.id));
      const hCol = document.getElementById('rulerRight' + cap(sec.id));
      if (!wBar || !hCol) continue;
      const sectionMods = set.modules.filter(sec.match);
      const { wGroups, hGroups } = buildRulerGroups(sectionMods);
      // W 버튼
      const topW = wBar.clientWidth;
      for (const g of wGroups) {
        const leftPx  = g.xStart * z + view.panX - RULER_TOP_X_OFFSET;
        const widthPx = (g.xEnd - g.xStart) * z;
        if (leftPx + widthPx < 0 || leftPx > topW) continue;
        const btn = document.createElement('div');
        btn.className = 'ruler-btn' + (g.anyFixed ? ' fixed' : '');
        btn.style.left  = leftPx + 'px';
        btn.style.width = widthPx + 'px';
        btn.textContent = Math.round(g.W);
        const isCell = g.entities.some(e => e.isCell);
        const entityType = isCell ? '셀' : '모듈';
        btn.title = `[${sec.label}] W=${Math.round(g.W)}mm · ${g.entities.length}개 ${entityType}${g.anyFixed ? ' (고정)' : ''}`;
        btn.onclick = (e) => { e.stopPropagation(); openDimEditor('W', g, e.currentTarget); };
        wBar.appendChild(btn);
      }
      // H 버튼
      const rightH = hCol.clientHeight;
      for (const g of hGroups) {
        const seenY = new Set();
        for (const pos of g.positions) {
          const yKey = `${Math.round(pos.yTop)}-${Math.round(pos.H)}`;
          if (seenY.has(yKey)) continue;
          seenY.add(yKey);
          const topPx    = pos.yTop * z + view.panY - RULER_RIGHT_Y_OFFSET;
          const heightPx = pos.H * z;
          if (topPx + heightPx < 0 || topPx > rightH) continue;
          const btn = document.createElement('div');
          btn.className = 'ruler-btn' + (g.anyFixed ? ' fixed' : '');
          btn.style.top    = topPx + 'px';
          btn.style.height = heightPx + 'px';
          btn.textContent  = Math.round(g.H);
          btn.title = `[${sec.label}] H=${Math.round(g.H)}mm · ${g.modules.length}개 모듈${g.anyFixed ? ' (고정)' : ''}`;
          btn.onclick = (e) => { e.stopPropagation(); openDimEditor('H', g, e.currentTarget); };
          hCol.appendChild(btn);
        }
      }
    }
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // 섹션 ruler 표시 상태 갱신 (present + userOff 조합)
  function updateSectionRulerVisibility(present) {
    const restore = document.getElementById('sectionRestorePanel');
    if (restore) restore.innerHTML = '';
    let hasOff = false;
    for (const s of RULER_SECTIONS) {
      const wBar = document.getElementById('rulerTop'   + cap(s.id));
      const hCol = document.getElementById('rulerRight' + cap(s.id));
      const visible = !!present[s.id] && !sectionRulerUserOff.has(s.id);
      if (wBar) wBar.style.display = visible ? 'block' : 'none';
      if (hCol) hCol.style.display = visible ? 'block' : 'none';
      // 사용자가 꺼둔 + 모듈 존재 → restore 패널에 다시 켜기 버튼
      if (present[s.id] && sectionRulerUserOff.has(s.id) && restore) {
        const btn = document.createElement('button');
        btn.textContent = '+ ' + s.label;
        btn.onclick = () => { sectionRulerUserOff.delete(s.id); renderRulerButtons(); };
        restore.appendChild(btn);
        hasOff = true;
      }
    }
    if (restore) restore.style.display = hasOff ? 'flex' : 'none';
  }

  // 끄기 아이콘 핸들러 (HTML 의 rsb-eye 버튼)
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t && t.classList && t.classList.contains('rsb-eye')) {
      e.stopPropagation();
      const target = t.dataset.target;
      if (target) {
        sectionRulerUserOff.add(target);
        renderRulerButtons();
      }
    }
  });

  // 치수 입력 에디터 popup
  function openDimEditor(dim, group, anchorEl) {
    // 기존 에디터 제거
    document.querySelectorAll('.ruler-btn-editor').forEach(n => n.remove());
    const cur = dim === 'W' ? group.W : group.H;
    const editor = document.createElement('div');
    editor.className = 'ruler-btn-editor';
    // W9-119: W 그룹은 entities (cell/module), H 그룹은 modules 사용
    const matchedCount = dim === 'W' ? group.entities.length : group.modules.length;
    const entityLabel = (dim === 'W' && group.entities.some(e => e.isCell)) ? '셀' : '모듈';
    editor.innerHTML = `
      <div style="font-weight:600;color:#3d342a">${dim} 치수 변경 (${matchedCount}개 ${entityLabel})</div>
      <label>${dim} (mm) <input type="number" value="${Math.round(cur)}" min="100" max="6000" step="1" /></label>
      <label><input type="checkbox" ${group.anyFixed ? 'checked' : ''}/> 모듈 고정 (자동계산 시 보존)</label>
      <div class="row-actions">
        <button class="apply">적용</button>
        <button class="cancel">취소</button>
      </div>
    `;
    document.body.appendChild(editor);
    // anchor 근처 배치 (viewport 경계 고려)
    const rect = anchorEl.getBoundingClientRect();
    const editorRect = editor.getBoundingClientRect();
    let left = rect.left;
    let top  = rect.bottom + 4;
    if (left + editorRect.width > window.innerWidth - 8) left = window.innerWidth - editorRect.width - 8;
    if (top + editorRect.height > window.innerHeight - 8) top = rect.top - editorRect.height - 4;
    editor.style.left = Math.max(8, left) + 'px';
    editor.style.top  = Math.max(8, top)  + 'px';
    // focus + select
    const numInput = editor.querySelector('input[type=number]');
    numInput.focus(); numInput.select();
    // AbortController — editor 가 닫힐 때 모든 외부 리스너 즉시 제거
    const ctrl = new AbortController();
    const closeEditor = () => {
      ctrl.abort();
      editor.remove();
    };
    // 적용
    const doApply = () => {
      const newVal = +numInput.value;
      const fixed  = editor.querySelector('input[type=checkbox]').checked;
      if (!isFinite(newVal) || newVal < 100) { showToast('⚠ 치수는 100mm 이상이어야 합니다'); return; }
      applyDimChange(dim, group, newVal, fixed);
      closeEditor();
    };
    editor.querySelector('.apply').onclick = doApply;
    editor.querySelector('.cancel').onclick = closeEditor;
    numInput.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doApply(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
    };
    // 외부 클릭 시 닫기 — AbortController 로 unmount 시 자동 해제
    setTimeout(() => {
      if (ctrl.signal.aborted) return;
      document.addEventListener('mousedown', (ev) => {
        if (editor.contains(ev.target) || anchorEl.contains(ev.target)) return;
        closeEditor();
      }, { signal: ctrl.signal });
    }, 0);
  }

  // 치수 변경 적용 + 인접 흡수/제거
  //   W: group.entities (cell 또는 module)
  //   H: group.modules (모듈 단위)
  function applyDimChange(dim, group, newVal, fixed) {
    const oldVal = dim === 'W' ? group.W : group.H;
    const delta  = newVal - oldVal;
    let count = 0;
    let label = '모듈';
    if (dim === 'W') {
      // W9-119: entities 기반 — cell 인지 module 인지 분기
      const cellEntities   = group.entities.filter(e => e.isCell);
      const moduleEntities = group.entities.filter(e => !e.isCell);
      // (A) cell 변경 — 모듈 내부 인접 cell 흡수
      if (cellEntities.length) {
        label = '셀';
        const processedCellKeys = new Set();
        for (const e of cellEntities) {
          const key = `${e.moduleId}@${e.cellIdx}`;
          if (processedCellKeys.has(key)) continue;
          processedCellKeys.add(key);
          const s = getStructure(e.moduleId);
          if (!Array.isArray(s.areaWidths)) continue;
          s.areaWidths[e.cellIdx] = newVal;
          absorbAdjacentCell(s, e.cellIdx, delta);
          if (fixed) e.m.isFixed = true;
          count++;
        }
      }
      // (B) 모듈 W 변경 (기존 동작)
      if (moduleEntities.length) {
        for (const e of moduleEntities) { e.m.W = newVal; e.m.isFixed = fixed; }
        if (Math.abs(delta) > 0.5) {
          const affected = new Set();
          const processedRows = new Set();
          let gapWarning = false;
          for (const e of moduleEntities) {
            const result = absorbAdjacentW(e.m, delta, affected, processedRows);
            if (result === 'gap') gapWarning = true;
          }
          for (const id of affected) {
            const idx = modules.findIndex(x => x.id === id);
            if (idx >= 0 && modules[idx].W < 100) modules.splice(idx, 1);
          }
          if (gapWarning && typeof showToast === 'function') {
            showToast('⚠ 고정 인접 모듈로 인해 일부 row 에 gap 발생 — 자동계산 권장');
          }
        }
        count += moduleEntities.length;
      }
    } else {
      // H: 모듈 단위
      for (const m of group.modules) { m.H = newVal; m.isFixed = fixed; }
      count = group.modules.length;
    }
    // CD-3: 즉시 저장. 예전엔 여기서 바꾼 W/H 가 메모리에만 남아
    // 새로고침하면 사라졌다 (특히 H 는 배치 단계에 입력이 없어 복구 불가).
    persistPlannerState();

    // 재렌더
    if (typeof renderFrontView === 'function') renderFrontView();
    if (typeof renderRightPanel === 'function') renderRightPanel();
    updateViewportRulers();
    if (typeof showToast === 'function') {
      showToast(`✓ ${dim}=${Math.round(newVal)}mm 적용 (${count}개 ${label}${fixed ? ', 고정' : ''})`);
    }
  }

  // W9-119: 모듈 내부 인접 cell 흡수 (모듈 W 보존)
  //   delta > 0: cellIdx+1 부터 차례로 W 차감, 잔여 전파, cell 폭 100 미만 시 마킹 (제거는 자동계산이 정리)
  //   delta < 0: cellIdx+1 cell 이 좌측으로 확장 (W 증가) — 모듈 W 절대 보존
  function absorbAdjacentCell(s, cellIdx, delta) {
    if (!Array.isArray(s.areaWidths)) return;
    const N = s.areaWidths.length;
    if (delta > 0) {
      let remaining = delta;
      for (let i = cellIdx + 1; i < N && remaining > 0; i++) {
        const eat = Math.min(s.areaWidths[i], remaining);
        s.areaWidths[i] -= eat;
        remaining -= eat;
      }
      // 잔여는 좌측 cell 로 (delta>0 → 앞 cell 이 흡수)
      for (let i = cellIdx - 1; i >= 0 && remaining > 0; i--) {
        const eat = Math.min(s.areaWidths[i], remaining);
        s.areaWidths[i] -= eat;
        remaining -= eat;
      }
    } else {
      const grow = -delta;
      if (cellIdx + 1 < N) {
        s.areaWidths[cellIdx + 1] += grow;
      } else if (cellIdx - 1 >= 0) {
        s.areaWidths[cellIdx - 1] += grow;
      }
    }
  }

  // 변경된 모듈의 X 우측 인접 모듈을 delta 만큼 흡수/제거 (세트 너비 보존)
  //   delta > 0 (커짐): 우측 비고정 모듈 W 차감, 0 미만이면 제거하고 잔여 delta 다음 비고정 모듈에 전파
  //                     (고정 모듈은 skip — 그 너머 비고정으로 jump 시 모듈 겹침 방지 위해 차감만 함)
  //   delta < 0 (작아짐): 변경 모듈 OLD 우측 끝에 정확히 붙어있는 IMMEDIATE 이웃만 좌측 확장
  //                     (fixed 사이를 jump 하면 모듈 겹침 → 그 경우 gap 발생, 호출자에게 알림)
  //   processedRows: 동일 row(section@y) 1회만 처리 (그룹 다중 target 의 row 중복 호출 방지)
  //   반환: 'ok' | 'gap'
  function absorbAdjacentW(changed, delta, affected, processedRows) {
    const rowKey = `${changed.section}@${Math.round(changed.y || 0)}`;
    if (processedRows.has(rowKey)) return 'ok';
    processedRows.add(rowKey);
    const sameRow = modules.filter(m =>
      m.id !== changed.id &&
      m.section === changed.section &&
      Math.abs((m.y || 0) - (changed.y || 0)) < 1
    ).sort((a, b) => (a.x || 0) - (b.x || 0));
    const changedRight = (changed.x || 0) + changed.W - delta;   // 변경 전 우측 끝
    const rightSide = sameRow.filter(m => (m.x || 0) >= changedRight - 0.5);
    if (delta > 0) {
      // 확대 — 우측 비고정 모듈이 순차 흡수, 고정은 skip (그 너머 jump 금지)
      let remaining = delta;
      let firstNeighborSkipped = false;
      for (const neighbor of rightSide) {
        if (remaining <= 0) break;
        if (neighbor.isFixed) {
          firstNeighborSkipped = true;
          continue;
        }
        const eat = Math.min(neighbor.W, remaining);
        neighbor.W -= eat;
        neighbor.x = (neighbor.x || 0) + eat;
        remaining -= eat;
        if (neighbor.W < 100) affected.add(neighbor.id);
      }
      // 고정 모듈 너머로 잔여 흡수 못한 경우 gap (changed 가 fixed 안으로 침범하는 모양)
      // → 실제로는 changed.W 만 갱신되었으므로 X 충돌 없음, 단 fixed 위로 표시될 수 있음
      return (remaining > 0 || firstNeighborSkipped) ? 'gap' : 'ok';
    } else {
      // 축소 — IMMEDIATE 인접 모듈 (정확히 OLD 우측 끝에 붙음) 만 확장
      const grow = -delta;
      const immediate = rightSide.find(m => Math.abs((m.x || 0) - changedRight) < 1);
      if (!immediate || immediate.isFixed) return 'gap';
      // immediate.x 가 좌측으로 grow 만큼 이동, W 가 grow 만큼 증가
      // → 좌측 끝이 changed 의 새 우측 끝(changed.x + newW)에 정확히 붙음
      immediate.x = (immediate.x || 0) - grow;
      immediate.W += grow;
      return 'ok';
    }
  }

  // ── 평면 좌표와 회전 ──────────────────────────────────────────
  //
  // W12-36: 배치 단계는 사각형을 **자기 중심으로** 돌린다
  // (mockup-shell.html `getRotatedCorners`: 축이 `x + w/2, y + h/2`).
  // 그래서 회전 90/270 이면 시각 좌상단이 `(x, y)` 가 아니다.
  //
  // 구조 단계는 다섯 곳에서 `(x, y)` 를 그대로 좌상단으로 쓰고 폭·깊이만 맞바꿔
  // 왔다. 실측 — 배치가 X[875,1525] 에 그린 영역을 구조는 X[0,650] 에 그렸다.
  // 어긋난 양이 정확히 (W−D)/2 = 875 다. ㄱ자를 겹쳐 트리밍하면 두 다리가
  // 서로 다른 자리로 흩어지는 것이 이 때문이다.
  //
  // **모듈의 회전축은 자기 중심이 아니라 속한 영역의 중심이다.** 영역이 통째로
  // 도는 것이라, 모듈을 제 중심으로 돌리면 영역 밖으로 흩어진다
  // (§10 "90° 회전 영역 — 모듈이 영역 밖으로 나간다" 가 이것이다).

  /** 점 (px,py) 를 (cx,cy) 둘레로 rot 도 돌린다. 90 배수는 정확값을 쓴다. */
  function rotPoint(px, py, cx, cy, rot) {
    const a = ((rot % 360) + 360) % 360;
    let cos, sin;
    if (a === 0) { cos = 1; sin = 0; }
    else if (a === 90) { cos = 0; sin = 1; }
    else if (a === 180) { cos = -1; sin = 0; }
    else if (a === 270) { cos = 0; sin = -1; }
    else { const r = a * Math.PI / 180; cos = Math.cos(r); sin = Math.sin(r); }
    return { x: cx + (px - cx) * cos - (py - cy) * sin,
             y: cy + (px - cx) * sin + (py - cy) * cos };
  }

  /**
   * 평면도에서 이 사각형이 실제로 차지하는 자리.
   * `pivot` 을 주면 그 점을 축으로 돈다 — 안 주면 제 중심으로 돈다(영역).
   * 폭·깊이 맞바꾸기는 90/270 에서만 한다 (예전 규약 그대로).
   */
  function planeBoxOf(o, pivot) {
    const rot = ((o.rotation || 0) % 360 + 360) % 360;
    const W = Number(o.W) || 0, D = Number(o.D) || 0;
    const swap = rot === 90 || rot === 270;
    let cx = (o.x || 0) + W / 2, cy = (o.y || 0) + D / 2;
    if (rot && pivot) { const p = rotPoint(cx, cy, pivot.x, pivot.y, rot); cx = p.x; cy = p.y; }
    const w = swap ? D : W, d = swap ? W : D;
    return { x: cx - w / 2, y: cy - d / 2, w, d, cx, cy, rot };
  }

  /** 모듈의 회전축 — 속한 영역의 중심. 영역을 못 찾으면 제 중심으로 돈다. */
  function areaPivotOf(m) {
    const a = areaOfModule(m);
    if (!a) return null;
    return { x: (a.x || 0) + (a.W || 0) / 2, y: (a.y || 0) + (a.D || 0) / 2 };
  }

  /** 모듈이 평면도에서 차지하는 자리 (영역 회전 반영) */
  function modulePlaneBox(m) { return planeBoxOf(m, areaPivotOf(m)); }

  function fitToActiveModule() {
    const m = modules.find(x => x.id === activeId);
    const wrap = document.getElementById('canvasWrap');
    if (!m || !wrap) return;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const pad = 80;
    const targetW = m.W, targetH = m.H;
    const zx = (cw - pad*2) / targetW;
    const zy = (ch - pad*2) / targetH;
    view.zoom = Math.max(0.05, Math.min(zx, zy, 4));
    view.panX = (cw - targetW * view.zoom) / 2;
    view.panY = (ch - targetH * view.zoom) / 2;
    applyView();
  }

  // W9-103: viewMode 별 정면도 자동 fit
  function fitFrontView() {
    const wrap = document.getElementById('canvasWrap');
    if (!wrap) return;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    // W9-120: 4 섹션 ruler reserve (top 118, right 118) — content 가 ruler 밑에 가리지 않도록 패딩 확보
    const padX = 130;       // 좌측 기본 + 우측 ruler 118 + 여유
    const padTop = 130;     // 상단 ruler 118 + 여유
    const padBot = 100;
    if (viewMode === 'single') {
      fitToActiveModule();
      return;
    }
    // W12-15: 배치 / 전체 — 대상 모듈의 X bbox + ceilingHeight 기반
    let mods = modules;
    if (viewMode === 'area' && activeAreaId) {
      const areaMods = modules.filter((m) => m.areaId === activeAreaId);
      if (areaMods.length) mods = areaMods;
    }
    if (!mods.length) return;
    const ox = getFrontViewOriginX();
    const oy = (personPos && typeof personPos.cy === 'number') ? personPos.cy : originPos2D.y;
    // W12-15: 배치 모드 = forceForward (영역 안 모듈을 모두 정면 도어 면으로)
    const forceForward = (viewMode === 'area');
    let minX = Infinity, maxX = -Infinity;
    mods.forEach(m => {
      const B = modulePlaneBox(m);                      // W12-36
      const planeW = B.w, planeD = B.d;
      const px = B.x, py = B.y;
      let vx, vw;
      if (forceForward)              { vx = px - ox; vw = m.W; }
      else if (viewRotation === 0)   { vx = px - ox; vw = planeW; }
      else if (viewRotation === 90)  { vx = py - oy; vw = planeD; }
      else if (viewRotation === 180) { vx = -(px + planeW - ox); vw = planeW; }
      else                            { vx = -(py + planeD - oy); vw = planeD; }
      minX = Math.min(minX, vx);
      maxX = Math.max(maxX, vx + vw);
    });
    if (!isFinite(minX) || !isFinite(maxX)) return;
    const targetW = (maxX - minX) + 300;
    const targetH = ceilingHeight + 250;
    const zx = (cw - padX * 2) / targetW;
    const zy = (ch - padTop - padBot) / targetH;
    view.zoom = Math.max(0.02, Math.min(zx, zy, 4));
    view.panX = (cw - targetW * view.zoom) / 2 - (minX - 150) * view.zoom;
    view.panY = padTop + (ch - padTop - padBot - targetH * view.zoom) / 2;
    applyView();
  }

  // W9-102: 정면도 — viewMode 별 분기 (single / set / all). 배치 단계 X 좌표 + baseY 반영
  /**
   * 영역 하나의 정면도 사각형. **모듈과 똑같은 좌표 규약**을 쓴다.
   *   X — 사람(원점) 기준, 시점 회전(viewRotation) 적용
   *   Y — 천장에서 내려온 거리. 상부장·후드는 천장 매달림이라 baseY 가 다르다
   * 여기서 규약을 새로 만들면 영역과 모듈이 서로 다른 자리에 그려진다
   * (실제로 그랬다 — 영역을 임의로 좌→우 나열해 ㄱ자 배치가 일렬로 보였다).
   */
  function areaFrontRect(a) {
    const ox = getFrontViewOriginX();
    const oy = (personPos && typeof personPos.cy === 'number') ? personPos.cy : originPos2D.y;
    const B = planeBoxOf(a);                            // W12-36
    const planeW = B.w, planeD = B.d;
    const px = B.x, py = B.y;
    let x, w;
    if (viewRotation === 90)       { x = py - oy;                 w = planeD; }
    else if (viewRotation === 180) { x = -(px + planeW - ox);     w = planeW; }
    else if (viewRotation === 270) { x = -(py + planeD - oy);     w = planeD; }
    else                           { x = px - ox;                 w = planeW; }
    const baseY = getBaseY(a.section, a.H);
    return { x, w, y: ceilingHeight - (baseY + a.H), h: a.H };
  }

  /** 영역 사각형 — 배경이자 클릭 대상. 편집 대상이 아니라 점선으로 그린다. */
  function renderAreas(content) {
    const ns = 'http://www.w3.org/2000/svg';
    areas.forEach((a) => {
      const cfg = SECTION_CONFIG[a.section] || {};
      const R = areaFrontRect(a);
      const on = a.id === activeAreaId;
      const g = document.createElementNS(ns, 'g');
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', R.x); r.setAttribute('y', R.y);
      r.setAttribute('width', R.w); r.setAttribute('height', R.h);
      r.setAttribute('fill', cfg.fill || '#ccc');
      r.setAttribute('fill-opacity', on ? '0.18' : '0.06');
      r.setAttribute('stroke', cfg.stroke || '#999');
      r.setAttribute('stroke-width', on ? 6 : 3);
      r.setAttribute('stroke-dasharray', '18 10');
      r.setAttribute('data-area-id', a.id);
      r.style.cursor = 'pointer';
      r.addEventListener('click', (e) => { e.stopPropagation(); setActiveArea(a.id); });
      g.appendChild(r);

      const used = usedWidthOf(a.id);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', R.x + 14);
      lab.setAttribute('y', R.y + 48);
      lab.setAttribute('font-size', 40);
      lab.setAttribute('fill', cfg.stroke || '#666');
      lab.textContent = `${cfg.label || a.section} ${Math.round(a.W)}×${Math.round(a.H)}`
        + (used ? `  ·  ${Math.round(used)} 사용` : '  ·  비어 있음');
      lab.style.pointerEvents = 'none';
      g.appendChild(lab);
      content.appendChild(g);
    });
  }

  /** 영역 보기에서 모듈을 **배치 좌표 그대로** 그린다. 영역과 같은 규약을 쓴다. */
  function renderModulesInPlace(content) {
    modules.forEach((m) => {
      const R = areaFrontRect(m);
      renderModuleFront(content, m, getStructure(m.id), R.x, R.y);
    });
  }

  /** 영역 전체를 화면에 맞춘다 — 모듈이 없을 때의 fit 대상 */
  function fitToAreas() {
    const wrap = document.getElementById('canvasWrap');
    if (!wrap || !areas.length) return;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    areas.forEach((a) => {
      const R = areaFrontRect(a);
      minX = Math.min(minX, R.x); maxX = Math.max(maxX, R.x + R.w);
      minY = Math.min(minY, R.y); maxY = Math.max(maxY, R.y + R.h);
    });
    if (!isFinite(minX)) return;
    const padX = 130, padTop = 130, padBot = 100;
    const cw = wrap.clientWidth - padX * 2;
    const ch = wrap.clientHeight - padTop - padBot;
    const z = clampZoom(Math.min(cw / Math.max(1, maxX - minX), ch / Math.max(1, maxY - minY)));
    view.zoom = z;
    view.panX = padX + (cw - (maxX - minX) * z) / 2 - minX * z;
    view.panY = padTop + (ch - (maxY - minY) * z) / 2 - minY * z;
    applyView();
  }

  function renderFrontView() {
    const content = document.getElementById('contentG');
    content.innerHTML = '';
    // 보기는 둘이다.
    //   ① 영역 보기 — 배치 좌표 그대로. 영역과 그 안의 모듈을 계획대로 보여준다.
    //   ② 모듈 상세 — 모듈 하나를 원점에 확대. fitToActiveModule 이 그 전제를 쓴다.
    // 둘을 섞으면 좌표계가 어긋난다. 영역을 원점 기준으로 그렸더니 ㄱ자 배치가
    // 일렬로 보였던 것이 그 예다.
    if (isAreaView()) {
      renderAreas(content);
      renderModulesInPlace(content);
      return;
    }
    if (viewMode === 'area' && activeAreaId) {
      // W12-15: 영역 안 모듈을 모두 정면 도어 면으로 (회전 무관).
      // 위 isAreaView 분기가 대부분 먼저 잡지만, 영역만 고르고 모듈이 없을 때를 위해 남긴다.
      renderFrontSet(content, modules.filter((m) => m.areaId === activeAreaId), { forceForward: true });
      return;
    }
    if (viewMode === 'all') {
      // 전체 모드 — viewRotation 토글 시점 적용 (W9-108)
      renderFrontSet(content, modules, { forceForward: false });
      return;
    }
    // single mode (기존)
    if (!activeId) return;
    const m = modules.find(x => x.id === activeId);
    if (!m) return;
    const s = getStructure(activeId);
    renderModuleFront(content, m, s, 0, 0);
  }

  // W9-102/104/105/106/107/108/111: 세트/전체 정면도
  //   W9-108: viewRotation (0/90/180/270) — 시점 회전
  //   W9-111: forceForward — 세트 모드 시 모든 모듈 강제 정면 도어 (회전 무관)
  function renderFrontSet(content, mods, opts) {
    opts = opts || {};
    const forceForward = !!opts.forceForward;
    if (!mods || !mods.length) return;
    const ns = 'http://www.w3.org/2000/svg';
    const ox = getFrontViewOriginX();
    const oy = (personPos && typeof personPos.cy === 'number') ? personPos.cy : originPos2D.y;
    // W9-108: 시점 회전에 따라 모듈 X (정면도) 좌표 변환
    //   viewRotation = 0 (정면, Y- 방향 봄): X = m.x - ox
    //   viewRotation = 90 (우측, X+ 방향 봄): X = m.y - oy
    //   viewRotation = 180 (뒷면, Y+ 방향 봄): X = -(m.x + m.W - ox) — 거울
    //   viewRotation = 270 (좌측, X- 방향 봄): X = -(m.y + m.D - oy) — 거울
    function viewX(m) {
      // W12-36: 평면도 footprint — 회전축은 **영역 중심**이다 (modulePlaneBox).
      const B = modulePlaneBox(m);
      const planeW = B.w, planeD = B.d;
      const px = B.x, py = B.y;
      // W9-111: forceForward — 모든 모듈 정면 도어 (회전 무관)
      //   X 좌표는 평면도 X 그대로 (사람 기준), footprint W = m.W (도어 면)
      if (forceForward) return { x: px - ox, w: m.W };
      if (viewRotation === 0)   return { x: px - ox, w: planeW };
      if (viewRotation === 90)  return { x: py - oy, w: planeD };
      if (viewRotation === 180) return { x: -(px + planeW - ox), w: planeW };
      if (viewRotation === 270) return { x: -(py + planeD - oy), w: planeD };
      return { x: px - ox, w: planeW };
    }
    // X 좌표 순서로 정렬 (시점 회전 적용 후 X 기준)
    const sorted = mods.slice().sort((a, b) => viewX(a).x - viewX(b).x);
    let allMinX = Infinity, allMaxX = -Infinity;
    sorted.forEach(m => {
      const s = getStructure(m.id);
      const baseY = baseYOf(m);
      const offsetY = ceilingHeight - (baseY + m.H);
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      // W9-108: 시점 회전 적용 — effective rotation = (m.rotation - viewRotation) mod 360
      //   0   → 도어 면 정면 (W × H)
      //   90  → 우측면 (D × H, 도어 안 보임)
      //   180 → 뒷면 (W × H, 거울 — 단순화: 도어 안 보임)
      //   270 → 좌측면 (D × H)
      // W9-111: forceForward 면 effRot 0 강제 (모든 모듈 정면 도어)
      const effRot = forceForward ? 0 : (((rot - viewRotation) % 360 + 360) % 360);
      const showDoor = (effRot === 0);
      // 정면도 footprint (시점 회전 적용)
      const vx = viewX(m);
      const footprintW = vx.w;
      const footprintX = vx.x;
      // (effRot 0 → 도어 W, 90/270 → 측면 D, 180 → 뒷면 W — 분기 안에서 처리)
      const cfg = SECTION_CONFIG[m.section] || { fill: '#999', stroke: '#333', label: m.section };
      // W9-108: effective rotation 별 mesh 표시
      if (showDoor) {
        // 정면 도어 면 (effRot=0)
        renderModuleFront(content, m, s, footprintX, offsetY);
      } else if (effRot === 180) {
        // 뒷면 — 단순 rect (도어 색 약간 어둡게) + '뒷' 라벨
        const back = document.createElementNS(ns, 'rect');
        back.setAttribute('x', footprintX); back.setAttribute('y', offsetY);
        back.setAttribute('width', footprintW); back.setAttribute('height', m.H);
        back.setAttribute('fill', cfg.fill); back.setAttribute('opacity', 0.5);
        back.setAttribute('stroke', cfg.stroke); back.setAttribute('stroke-width', 3);
        content.appendChild(back);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW / 2);
        lab.setAttribute('y', offsetY + m.H / 2);
        lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', Math.min(footprintW * 0.12, m.H * 0.12, 60));
        lab.setAttribute('fill', cfg.stroke); lab.setAttribute('font-weight', 'bold');
        lab.textContent = '뒷면';
        content.appendChild(lab);
      } else {
        // 측면 (effRot=90/270) — 측판 색 단순 rect + '측' 라벨 + footprint 라벨
        const side = document.createElementNS(ns, 'rect');
        side.setAttribute('x', footprintX); side.setAttribute('y', offsetY);
        side.setAttribute('width', footprintW); side.setAttribute('height', m.H);
        side.setAttribute('fill', cfg.fill); side.setAttribute('opacity', 0.7);
        side.setAttribute('stroke', cfg.stroke); side.setAttribute('stroke-width', 3);
        content.appendChild(side);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW / 2);
        lab.setAttribute('y', offsetY + m.H / 2);
        lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', Math.min(footprintW * 0.18, m.H * 0.12, 50));
        lab.setAttribute('fill', '#fff'); lab.setAttribute('font-weight', 'bold');
        lab.textContent = (effRot === 90) ? '우측면' : '좌측면';
        content.appendChild(lab);
        // footprint W (=D) 라벨 (아래)
        const dimLab = document.createElementNS(ns, 'text');
        dimLab.setAttribute('x', footprintX + footprintW / 2);
        dimLab.setAttribute('y', offsetY + m.H + 50);
        dimLab.setAttribute('text-anchor', 'middle');
        dimLab.setAttribute('font-size', 24);
        dimLab.setAttribute('fill', '#5a4d2f');
        dimLab.setAttribute('font-family', 'monospace');
        dimLab.textContent = 'D=' + Math.round(footprintW);
        content.appendChild(dimLab);
      }
      allMinX = Math.min(allMinX, footprintX);
      allMaxX = Math.max(allMaxX, footprintX + footprintW);
      // W9-108: 회전각 배지 — 모듈 실제 회전 + (effective !== 0 면 effRot 도)
      if (rot !== 0 || !showDoor) {
        const badge = document.createElementNS(ns, 'rect');
        badge.setAttribute('x', footprintX + footprintW - 220);
        badge.setAttribute('y', offsetY - 60);
        badge.setAttribute('width', 200);
        badge.setAttribute('height', 50);
        badge.setAttribute('fill', '#b8956c');
        badge.setAttribute('rx', 8);
        badge.setAttribute('opacity', 0.85);
        content.appendChild(badge);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW - 120);
        lab.setAttribute('y', offsetY - 30);
        lab.setAttribute('text-anchor', 'middle');
        lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', 22);
        lab.setAttribute('font-weight', 'bold');
        lab.setAttribute('fill', '#fff');
        lab.textContent = '회전 ' + rot + '° (eff ' + effRot + '°)';
        content.appendChild(lab);
      }
    });
    // ──────────────────────────────────────────────
    // 천장/바닥 가이드 라인 (전체 X 범위)
    // ──────────────────────────────────────────────
    if (!isFinite(allMinX)) { allMinX = 0; allMaxX = 0; }
    const drawGuide = (yMM, label, color) => {
      const ln = document.createElementNS(ns, 'line');
      ln.setAttribute('x1', allMinX - 100); ln.setAttribute('y1', yMM);
      ln.setAttribute('x2', allMaxX + 100); ln.setAttribute('y2', yMM);
      ln.setAttribute('stroke', color); ln.setAttribute('stroke-width', 2);
      ln.setAttribute('stroke-dasharray', '12 6');
      ln.setAttribute('opacity', 0.5);
      content.appendChild(ln);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', allMinX - 110); lab.setAttribute('y', yMM);
      lab.setAttribute('text-anchor', 'end'); lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', 36); lab.setAttribute('fill', color); lab.setAttribute('font-family', 'monospace');
      lab.textContent = label;
      content.appendChild(lab);
    };
    drawGuide(0, '천장 H=' + ceilingHeight, '#6a4b2a');
    drawGuide(ceilingHeight, '바닥 0', '#6a4b2a');
    // W9-110: SVG 안 ruler 제거 — viewport sticky ruler 로 대체
    // W9-105: 사람 위치 마커 — 정면도 X=0 (사람 원의 cx 가 X=0 으로 매핑되므로)
    if (personPos) {
      // 사람 마커 — 정면도 바닥 라인 (Y=ceilingHeight) 에 작은 원
      const personMarker = document.createElementNS(ns, 'circle');
      personMarker.setAttribute('cx', 0);
      personMarker.setAttribute('cy', ceilingHeight + 50);
      personMarker.setAttribute('r', 30);
      personMarker.setAttribute('fill', '#b8956c');
      personMarker.setAttribute('stroke', '#3d342a');
      personMarker.setAttribute('stroke-width', 2);
      personMarker.setAttribute('opacity', 0.85);
      content.appendChild(personMarker);
      // 사람 라벨
      const personLab = document.createElementNS(ns, 'text');
      personLab.setAttribute('x', 0);
      personLab.setAttribute('y', ceilingHeight + 130);
      personLab.setAttribute('text-anchor', 'middle');
      personLab.setAttribute('font-size', 36);
      personLab.setAttribute('fill', '#3d342a');
      personLab.setAttribute('font-weight', 'bold');
      personLab.textContent = '🧍 사람 (X=0)';
      content.appendChild(personLab);
      // X=0 vertical 가이드 (사람 위치 기준선)
      const vGuide = document.createElementNS(ns, 'line');
