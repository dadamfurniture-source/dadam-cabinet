<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다담AI — Step 2 구조 (mockup)</title>
<style>
  :root{
    --brand-deep:#6a4b2a;
    --brand-mid:#b8956c;
    --brand-soft:#f3ead9;
    --bg:#fbfaf6;
    --bg-canvas:#f4efe7;
    --line:#e5e0d4;
    --text:#3d342a;
    --text-dim:#7a7062;
    --text-faint:#a89c84;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ── TopBar h:40 ─────────────────────────────────── */
  .topbar{height:40px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .step-pill{display:flex;align-items:center;gap:0;padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600}
  .step-pill button{border:none;background:transparent;padding:3px 10px;border-radius:999px;cursor:pointer;color:var(--text-dim);font-size:11px;font-weight:600;display:flex;gap:4px;align-items:center}
  .step-pill button.active{background:var(--brand-deep);color:#fff;box-shadow:0 2px 5px rgba(106,75,42,.25)}
  .step-pill .sep{width:14px;height:2px;background:var(--line);display:inline-block}
  .topbar .spacer{flex:1}
  .module-name{font-size:12px;color:var(--text);font-weight:600;background:var(--brand-soft);padding:4px 10px;border-radius:5px;border:1px solid var(--brand-mid)}
  /* W9-64: View toggle (3D / 2D) */
  .view-toggle{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px}
  .view-toggle button{padding:3px 10px;border:none;background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;border-radius:4px}
  .view-toggle button.active{background:var(--brand-deep);color:#fff}
  .panel-toggle{display:flex;gap:3px}
  .panel-toggle button{width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text)}
  .panel-toggle button.on{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}

  /* ── Mid (3-column) ─────────────────────────────── */
  .mid{flex:1;display:flex;min-height:0;overflow:hidden}
  .module-list{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
  .module-list.collapsed{width:32px}
  .module-list.collapsed .ml-body,.module-list.collapsed .ml-header-title{display:none}
  .ml-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-header-title{font-size:11px;color:var(--text);font-weight:600}
  /* W9-65: view mode toggle */
  .ml-mode-toggle{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-mode-toggle button{flex:1;padding:4px 0;border:1px solid var(--line);background:#fff;color:var(--text-dim);font-size:10px;font-weight:600;cursor:pointer;border-radius:3px}
  .ml-mode-toggle button.active{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .set-item{padding:8px 8px;margin:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:11px}
  .set-item:hover{background:var(--bg)}
  .set-item.active{background:var(--brand-soft);border-color:var(--brand-deep);font-weight:600}
  .set-item .set-meta{font-size:9px;color:var(--text-faint);margin-top:2px}
  .ml-body{flex:1;overflow-y:auto;padding:6px 4px}
  .module-item{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--text);transition:background .12s ease;border-left:3px solid transparent}
  .module-item:hover{background:var(--bg)}
  .module-item.active{background:var(--brand-soft);border-left-color:var(--brand-deep);font-weight:600}
  .module-item .mi-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--text-dim)}
  .module-item.active .mi-mark{background:var(--brand-deep);border-color:var(--brand-deep)}
  .module-item .mi-text{flex:1;line-height:1.3}
  .module-item .mi-dim{display:block;font-size:9px;color:var(--text-faint);margin-top:1px;font-family:monospace}

  /* ── Canvas (정면도) ────────────────────────────── */
  .canvas-wrap{flex:1;min-width:0;position:relative;background:var(--bg-canvas);overflow:hidden;background-image:linear-gradient(rgba(184,149,108,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(184,149,108,.08) 1px,transparent 1px);background-size:50px 50px}
  .canvas-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
  .canvas-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;text-align:center;line-height:1.6}
  /* 정면도 영역 */
  .area-rect{cursor:pointer;transition:opacity .12s ease}
  .area-rect:hover{opacity:0.85}
  .area-label{font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700;fill:#fff;pointer-events:none}
  .area-label-small{font-size:10px;fill:#fff;opacity:0.85;pointer-events:none}
  .module-dim-label{fill:var(--text-dim);font-size:11px;font-weight:600;font-family:monospace;pointer-events:none}
  .shelf-line{stroke:#5a4d2f;stroke-width:2;stroke-dasharray:10 4;opacity:0.6}
  .open-direction{fill:#fff;font-size:14px;pointer-events:none;font-weight:700}
  /* 줌 안내 */
  .canvas-help{position:absolute;bottom:8px;left:8px;color:var(--text-faint);font-size:10px;padding:4px 8px;background:rgba(255,255,255,0.75);border-radius:4px;border:1px solid var(--line)}

  /* ── 우측 패널 ────────────────────────────── */
  .right-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
  .right-panel.collapsed{width:32px}
  .right-panel.collapsed .section,.right-panel.collapsed .panel-header-title{display:none}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);font-size:11px;color:var(--text);font-weight:600}
  .panel-header button{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px}
  .sections{overflow-y:auto;flex:1}
  .section{border-bottom:1px solid var(--line)}
  .section-header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--text)}
  .section-header:hover{background:var(--bg)}
  .section-header .chev{font-size:10px;color:var(--text-faint);transition:transform .15s ease}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .section.collapsed .section-body{display:none}
  .section-body{padding:8px 10px 12px;background:#fff;font-size:11px;color:var(--text)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0}
  .row label{color:var(--text-dim);font-size:11px}
  .row input[type="number"],.row select{padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:11px;background:#fff;color:var(--text);font-family:inherit}
  .row input[type="number"]{width:72px;text-align:right;font-family:monospace}
  .row select{font-family:inherit}
  .area-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
  .area-row:last-child{border-bottom:none}
  .area-row .a-lab{font-size:10px;color:var(--text);font-weight:600;font-family:monospace}
  .area-row select{padding:2px 4px;font-size:10px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .shelf-row{display:flex;align-items:center;gap:4px;margin:4px 0}
  .shelf-row input{flex:1;padding:3px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;text-align:right;font-family:monospace}
  .shelf-row button.del{padding:3px 6px;border:1px solid #c0392b;background:#fef0ed;color:#c0392b;border-radius:3px;font-size:10px;cursor:pointer;font-weight:600}
  .shelf-row button.del:hover{background:#fde0d8}
  .add-btn{display:block;width:100%;padding:5px;margin-top:6px;border:1px dashed var(--brand-mid);background:transparent;color:var(--brand-deep);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer}
  .add-btn:hover{background:var(--brand-soft)}
  .empty-msg{padding:20px 8px;color:var(--text-faint);font-size:11px;text-align:center;line-height:1.5}

  /* ── BottomBar h:32 ──────────────────────────── */
  .bottombar{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(0,0,0,.04);font-size:11px;color:var(--text-dim)}
  .bottombar .actions{display:flex;gap:6px}
  .bottombar button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer}
  .bottombar button:hover{background:var(--brand-soft)}
  .bottombar button.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .bottombar button.primary:hover{background:#553b22}
  .bottombar button.next{background:#1976d2;color:#fff;border-color:#0d47a1}
  .bottombar button.next:hover{background:#0d47a1}

  /* 토스트 */
  .toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(122,72,16,0.92);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;z-index:100;pointer-events:none;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-4px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>
<body>

<!-- TopBar -->
<div class="topbar">
  <div class="step-pill">
    <button onclick="sessionStorage.setItem('fromStructure','1'); location.href='mockup-shell'">📐 1.배치</button><span class="sep"></span>
    <button class="active">📦 2.구조</button><span class="sep"></span>
    <button>🎨 3.디테일</button>
  </div>
  <div class="module-name" id="curModuleName">모듈을 선택하세요</div>
  <div class="spacer"></div>
  <!-- W9-64: View toggle (3D / 정면도) -->
  <div class="view-toggle">
    <button id="view3dBtn" class="active" data-view="3d" title="3D 뷰">🧊 3D</button>
    <button id="view2dBtn" data-view="2d" title="정면도 (2D)">📐 정면도</button>
  </div>
  <!-- W9-86: 도어 표시 on/off -->
  <div class="view-toggle">
    <button id="doorToggleBtn" class="active" title="도어 표시 on/off">🚪 도어</button>
  </div>
  <div class="panel-toggle">
    <button id="btnLeft" class="on" title="좌측 패널 (L)">⬛</button>
    <button id="btnRight" class="on" title="우측 패널 (R)">▦</button>
  </div>
</div>

<!-- Middle -->
<div class="mid">

  <!-- 좌측 모듈 리스트 -->
  <div class="module-list" id="moduleList">
    <div class="ml-header">
      <span class="ml-header-title">배치된 모듈</span>
      <button style="border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px"
              onclick="document.getElementById('moduleList').classList.toggle('collapsed')">«</button>
    </div>
    <!-- W9-65: view mode toggle — 개별 / 세트 / 전체 -->
    <div class="ml-mode-toggle">
      <button class="active" data-mode="single" title="개별 모듈 1개씩 보기">개별</button>
      <button data-mode="set" title="ㄱ자/ㄷ자 세트 (정면 묶음)">세트</button>
      <button data-mode="all" title="전체 모듈 한 번에">전체</button>
    </div>
    <div class="ml-body" id="mlBody">
      <div class="empty-msg">로딩 중...</div>
    </div>
  </div>

  <!-- 캔버스: 3D + 정면도 toggle -->
  <div class="canvas-wrap" id="canvasWrap">
    <!-- W9-64: 3D canvas (Three.js) -->
    <canvas id="canvas3d" style="position:absolute;inset:0;width:100%;height:100%;display:block;outline:none"></canvas>
    <!-- 기존 2D SVG 정면도 -->
    <svg class="canvas-svg" id="frontSvg" style="display:none">
      <g class="content" id="contentG"></g>
    </svg>
    <div class="canvas-empty" id="canvasEmpty">
      좌측에서 모듈을 선택하세요<br>
      <span style="font-size:11px;color:var(--text-faint);margin-top:6px;display:inline-block">
        휠 = 줌 · 빈공간 드래그 = 팬 · F = Fit · 0 = Reset
      </span>
    </div>
    <div class="canvas-help">단축키: 휠=줌 · 드래그=팬 · F=Fit · 0=Reset · L/R=패널</div>
  </div>

  <!-- 우측 편집 패널 -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-header">
      <span class="panel-header-title">구조 편집</span>
      <button title="패널 접기" onclick="document.getElementById('rightPanel').classList.toggle('collapsed')">»</button>
    </div>
    <!-- W9-72: 세트 자동계산 버튼 (세트 모드에서만 표시) -->
    <div id="autoCalcBar" style="display:none;padding:8px 10px;background:#fffaf2;border-bottom:1px solid var(--brand-mid)">
      <button id="autoCalcBtn" style="width:100%;padding:8px;border:1px solid var(--brand-deep);background:var(--brand-deep);color:#fff;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer">⚡ 세트 일괄 자동계산</button>
      <div style="font-size:9px;color:var(--text-faint);margin-top:4px;line-height:1.4">분배기/후드 위치 고려 · 다담 표준 (목표 도어 450mm) · 매립형 손잡이</div>
    </div>
    <div class="sections">
      <!-- 분할 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 분할
        </div>
        <div class="section-body" id="splitBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 영역 타입 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 영역 타입 + 도어 열림
        </div>
        <div class="section-body" id="areasBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 선반 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 선반 (내부 mm)
        </div>
        <div class="section-body" id="shelvesBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 손잡이 -->
      <div class="section collapsed">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 손잡이
        </div>
        <div class="section-body" id="handleBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BottomBar -->
<div class="bottombar">
  <div class="actions">
    <button id="reloadBtn" title="배치 단계 데이터 다시 로드">📥 배치 로드</button>
    <button class="primary" id="saveBtn" title="구조 저장">💾 구조 저장</button>
    <button class="next" id="nextBtn" title="디테일 단계로">디테일 단계 →</button>
  </div>
  <div>ⓘ 줌 <span id="zoomInd">100%</span> · 휠=줌 · 빈공간 드래그=팬 · F=Fit · 0=Reset</div>
</div>

<!-- W9-64: Three.js CDN importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.THREE = THREE;
window.OrbitControls = OrbitControls;
// 3D 초기화는 페이지 로드 후 init3D() 가 호출
window.dispatchEvent(new CustomEvent('three-ready'));
</script>

<script>
  // ─────────────────────────────────────────────────────────────
  // SECTION_CONFIG — mockup-shell.html 과 동일
  // ─────────────────────────────────────────────────────────────
  const SECTION_CONFIG = {
    lower:        { fill: '#b8956c', stroke: '#6a4b2a', label: '하부장' },
    upper:        { fill: '#7c9c8f', stroke: '#3d5750', label: '상부장' },
    tall:         { fill: '#9c6e7c', stroke: '#5c3848', label: '키큰장' },
    fridge:       { fill: '#a0a8b0', stroke: '#4a525a', label: '냉장고장' },
    sink:         { fill: '#b0b8c0', stroke: '#5a626a', label: '분배기' },
    hood:         { fill: '#6a727a', stroke: '#2a3238', label: '후드' },
    refrigerator: { fill: '#c8ced4', stroke: '#5a626a', label: '냉장고' },
    dishwasher:   { fill: '#9ca4ac', stroke: '#5a626a', label: '식기세척기' },
    // W9-85: 마감재 — finishings forEach 의 SECTION_CONFIG[f.section] 조회 통과용
    ep:           { fill: '#7a6a45', stroke: '#1a0f00', label: 'EP' },
    molding:      { fill: '#5a4d2f', stroke: '#1a0f00', label: '몰딩' },
    filler:       { fill: '#8a7858', stroke: '#1a0f00', label: '휠라' },
  };
  // 영역 type 별 색상 보정
  function colorForArea(sectionFill, type) {
    if (type === 'door')   return sectionFill;
    if (type === 'drawer') return darken(sectionFill, 0.15);
    if (type === 'open')   return '#fffaf2';
    return sectionFill;
  }
  function darken(hex, factor) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const f = 1 - factor;
    return '#' + [r*f,g*f,b*f].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }

  // ─────────────────────────────────────────────────────────────
  // 데이터 모델
  // ─────────────────────────────────────────────────────────────
  const LAYOUT_KEY    = 'dadam_layout_v1';
  const STRUCTURE_KEY = 'dadam_structure_v1';

  /** @type {Array<{id, section, W, H, D}>} */
  let modules = [];
  /** @type {Record<string, {verticalCount, horizontalSplits, areaTypes, shelves, handleType, handlePosition}>} */
  let structures = {};
  let activeId = null;

  // 모듈 ID 생성
  function moduleIdFor(section, idx) { return `${section}-${idx}`; }

  // 기본 구조 (모듈 첫 진입 시)
  function defaultStructure() {
    return {
      verticalCount: 1,        // 좌우 분할 N
      horizontalLayout: 'doorOnly',  // 'doorOnly' | 'doorTopDrawerBottom'
      drawerHeight: 200,       // 하부 서랍 H (mm)
      areaTypes: ['door'],     // 길이 = verticalCount (상부 영역)
      areaDirections: ['left'],  // 도어 열림 방향 (길이 = verticalCount)
      bottomType: 'drawer',    // doorTopDrawerBottom 시 하부 type
      bottomDirection: 'left', // 하부 도어일 때 방향
      shelves: [],             // 바닥부터 mm
      handleType: 'channel',
      handlePosition: 'top',
    };
  }

  // 모듈 로드 — localStorage 또는 sample
  function loadModules() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (raw) {
        const layout = JSON.parse(raw);
        if (layout.modules && layout.modules.length) {
          const FINISHING_SECTIONS = ['ep', 'molding', 'filler'];
          // 1) 일반 모듈만 추출
          modules = layout.modules
            .filter(m => SECTION_CONFIG[m.section] && !FINISHING_SECTIONS.includes(m.section))
            .map((m, i) => ({
              id: moduleIdFor(m.section, i),
              section: m.section,
              W: m.w,
              H: m.moduleH,
              D: m.h,
              x: m.x || 0,
              y: m.y || 0,
              rotation: m.rotation || 0,
              // W9-77: 자식 마감재 (attachToSelected 로 추가된 것) 평행 추출
              finishings: (m.finishings || []).map(f => ({
                section: f.section,
                W: f.w,
                H: f.moduleH || m.moduleH,
                D: f.h,
                x: f.x,
                y: f.y,
              })),
            }));
          // 2) W9-84: 사이드바 직접 추가된 standalone 마감재 (top-level modules 의 ep/molding/filler)
          //    → 가장 가까운 모듈의 finishings 에 push (구조 단계에 표시되도록)
          const standalone = layout.modules.filter(m => FINISHING_SECTIONS.includes(m.section));
          console.log('[STRUCT] loadModules', { totalModules: layout.modules.length, regular: modules.length, standaloneFinishings: standalone.length, sections: layout.modules.map(m => m.section) });
          standalone.forEach((fm) => {
            const fxC = (fm.x || 0) + (fm.w || 0) / 2;
            const fyC = (fm.y || 0) + (fm.h || 0) / 2;
            let closest = null, closestDist = Infinity;
            modules.forEach((m) => {
              const mxC = m.x + m.W / 2;
              const myC = m.y + m.D / 2;
              const d = Math.hypot(fxC - mxC, fyC - myC);
              if (d < closestDist) { closestDist = d; closest = m; }
            });
            if (closest) {
              closest.finishings.push({
                section: fm.section,
                W: fm.w,
                H: fm.moduleH || closest.H,
                D: fm.h,
                x: fm.x || 0,
                y: fm.y || 0,
              });
            }
          });
          return;
        }
      }
    } catch (e) { console.warn('layout load 실패', e); }
    // sample — ㄱ자 구조 (3개 회전 0 + 1개 회전 90)
    modules = [
      { id: 'lower-0', section: 'lower', W: 2400, H: 860,  D: 650, x: 0,    y: 0,    rotation: 0  },
      { id: 'upper-0', section: 'upper', W: 2400, H: 800,  D: 320, x: 0,    y: 1000, rotation: 0  },
      { id: 'tall-0',  section: 'tall',  W: 600,  H: 2300, D: 650, x: 2500, y: 0,    rotation: 0  },
      { id: 'fridge-0', section: 'fridge', W: 720, H: 1850, D: 700, x: 3200, y: 0,    rotation: 90 },
    ];
  }

  function loadStructures() {
    try {
      const raw = localStorage.getItem(STRUCTURE_KEY);
      structures = raw ? JSON.parse(raw) : {};
    } catch (e) { structures = {}; }
  }
  function saveStructures() {
    localStorage.setItem(STRUCTURE_KEY, JSON.stringify(structures));
  }
  function getStructure(id) {
    if (!structures[id]) structures[id] = defaultStructure();
    return structures[id];
  }

  // ─────────────────────────────────────────────────────────────
  // 좌측 모듈 리스트 렌더
  // ─────────────────────────────────────────────────────────────
  function renderModuleList() {
    const body = document.getElementById('mlBody');
    if (!modules.length) {
      body.innerHTML = '<div class="empty-msg">배치된 모듈 없음<br><span style="font-size:10px">mockup-shell.html 에서 배치 후 돌아오세요</span></div>';
      return;
    }
    body.innerHTML = modules.map(m => `
      <div class="module-item ${m.id === activeId ? 'active' : ''}" data-id="${m.id}">
        <span class="mi-mark"></span>
        <div class="mi-text">
          ${SECTION_CONFIG[m.section].label} ${m.id.split('-')[1] ? `#${parseInt(m.id.split('-')[1])+1}` : ''}
          <span class="mi-dim">W${m.W} × H${m.H} × D${m.D}</span>
        </div>
      </div>
    `).join('');
    body.querySelectorAll('.module-item').forEach(el => {
      el.onclick = () => setActiveModule(el.dataset.id);
    });
  }

  function setActiveModule(id) {
    activeId = id;
    renderModuleList();
    renderFrontView();
    renderRightPanel();
    document.getElementById('curModuleName').textContent = (() => {
      const m = modules.find(x => x.id === id);
      if (!m) return '모듈을 선택하세요';
      const cfg = SECTION_CONFIG[m.section];
      const idx = parseInt(id.split('-')[1] || 0) + 1;
      return `${cfg.label} #${idx}`;
    })();
    document.getElementById('canvasEmpty').style.display = id ? 'none' : 'flex';
    fitToActiveModule();
  }

  // ─────────────────────────────────────────────────────────────
  // 중앙 정면도 (SVG)
  // ─────────────────────────────────────────────────────────────
  const view = { panX: 0, panY: 0, zoom: 1 };
  function applyView() {
    const content = document.getElementById('contentG');
    content.setAttribute('transform', `translate(${view.panX} ${view.panY}) scale(${view.zoom})`);
    const wrap = document.getElementById('canvasWrap');
    const sz = (50 * view.zoom).toFixed(2) + 'px';
    wrap.style.backgroundSize = sz + ' ' + sz;
    wrap.style.backgroundPosition = view.panX + 'px ' + view.panY + 'px';
    document.getElementById('zoomInd').textContent = Math.round(view.zoom * 100) + '%';
  }

  function fitToActiveModule() {
    const m = modules.find(x => x.id === activeId);
    const wrap = document.getElementById('canvasWrap');
    if (!m || !wrap) return;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const pad = 80;
    const targetW = m.W, targetH = m.H;
    const zx = (cw - pad*2) / targetW;
    const zy = (ch - pad*2) / targetH;
    view.zoom = Math.max(0.05, Math.min(zx, zy, 4));
    view.panX = (cw - targetW * view.zoom) / 2;
    view.panY = (ch - targetH * view.zoom) / 2;
    applyView();
  }

  function renderFrontView() {
    const content = document.getElementById('contentG');
    content.innerHTML = '';
    if (!activeId) return;
    const m = modules.find(x => x.id === activeId);
    if (!m) return;
    const s = getStructure(activeId);
    const cfg = SECTION_CONFIG[m.section];
    const ns = 'http://www.w3.org/2000/svg';

    // 모듈 외곽 (참고용, 영역들이 채움)
    const outline = document.createElementNS(ns, 'rect');
    outline.setAttribute('x', 0);
    outline.setAttribute('y', 0);
    outline.setAttribute('width', m.W);
    outline.setAttribute('height', m.H);
    outline.setAttribute('fill', 'none');
    outline.setAttribute('stroke', cfg.stroke);
    outline.setAttribute('stroke-width', 4);
    content.appendChild(outline);

    // 상하 분할
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? s.drawerHeight : 0;
    const topH = m.H - drawerH;
    const topY = 0;
    const drawerY = topH;

    // 상부 영역 (좌우 N 분할)
    const colW = m.W / s.verticalCount;
    for (let i = 0; i < s.verticalCount; i++) {
      const type = s.areaTypes[i] || 'door';
      const dir = s.areaDirections[i] || 'left';
      const x = i * colW;
      const fill = colorForArea(cfg.fill, type);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', x);
      r.setAttribute('y', topY);
      r.setAttribute('width', colW);
      r.setAttribute('height', topH);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (type === 'open') r.setAttribute('stroke-dasharray', '8 4');
      content.appendChild(r);

      // 라벨
      const labFont = Math.min(colW * 0.18, topH * 0.18, 80);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', x + colW/2);
      lab.setAttribute('y', topY + topH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const typeLabel = { door:'도어', drawer:'서랍', open:'오픈' }[type];
      lab.textContent = typeLabel;
      if (type === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      // 도어 열림 방향 화살표
      if (type === 'door') {
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(colW * 0.15, 60));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (dir === 'left') {
          arrow.setAttribute('x', x + colW * 0.15);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', x + colW * 0.85);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
    }

    // 하부 (도어+서랍 모드일 때만)
    if (s.horizontalLayout === 'doorTopDrawerBottom' && drawerH > 0) {
      const fill = colorForArea(cfg.fill, s.bottomType);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', 0);
      r.setAttribute('y', drawerY);
      r.setAttribute('width', m.W);
      r.setAttribute('height', drawerH);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (s.bottomType === 'open') r.setAttribute('stroke-dasharray', '8 4');
      content.appendChild(r);

      const labFont = Math.min(m.W * 0.06, drawerH * 0.4, 70);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', m.W/2);
      lab.setAttribute('y', drawerY + drawerH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const btmLab = { door:'도어', drawer:'서랍', open:'오픈' }[s.bottomType];
      lab.textContent = `${btmLab} H=${drawerH}`;
      if (s.bottomType === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      if (s.bottomType === 'door') {
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(m.W * 0.04, 50));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (s.bottomDirection === 'left') {
          arrow.setAttribute('x', m.W * 0.06);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', m.W * 0.94);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
    }

    // 선반 (위→아래 좌표계에서 바닥부터 mm = m.H 에서 아래로)
    // 정면도 좌표는 위에서 아래로 — 선반 위치 y = m.H - shelf_mm
    s.shelves.forEach(sh => {
      if (sh < 0 || sh > m.H) return;
      const y = m.H - sh;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('class', 'shelf-line');
      line.setAttribute('x1', 8);
      line.setAttribute('y1', y);
      line.setAttribute('x2', m.W - 8);
      line.setAttribute('y2', y);
      content.appendChild(line);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', m.W - 12);
      lab.setAttribute('y', y - 6);
      lab.setAttribute('text-anchor', 'end');
      lab.setAttribute('font-size', Math.min(m.W * 0.02, 24));
      lab.setAttribute('fill', '#5a4d2f');
      lab.setAttribute('font-family', 'monospace');
      lab.textContent = `선반 H=${sh}mm`;
      content.appendChild(lab);
    });

    // 외곽 치수 라벨 (W / H)
    const dimFont = Math.min(m.W, m.H) * 0.04;
    const dimW = document.createElementNS(ns, 'text');
    dimW.setAttribute('class', 'module-dim-label');
    dimW.setAttribute('x', m.W/2);
    dimW.setAttribute('y', m.H + dimFont*1.5);
    dimW.setAttribute('text-anchor', 'middle');
    dimW.setAttribute('font-size', dimFont);
    dimW.textContent = `W ${m.W}mm`;
    content.appendChild(dimW);
    const dimH = document.createElementNS(ns, 'text');
    dimH.setAttribute('class', 'module-dim-label');
    dimH.setAttribute('x', -dimFont*0.8);
    dimH.setAttribute('y', m.H/2);
    dimH.setAttribute('text-anchor', 'end');
    dimH.setAttribute('dominant-baseline', 'central');
    dimH.setAttribute('font-size', dimFont);
    dimH.textContent = `H ${m.H}mm`;
    content.appendChild(dimH);
  }

  // ─────────────────────────────────────────────────────────────
  // 우측 패널 — 4 섹션 동적 렌더
  // ─────────────────────────────────────────────────────────────
  function renderRightPanel() {
    const m = modules.find(x => x.id === activeId);
    if (!m) {
      ['splitBody','areasBody','shelvesBody','handleBody'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="empty-msg">모듈 선택</div>';
      });
      return;
    }
    const s = getStructure(activeId);

    // 분할
    document.getElementById('splitBody').innerHTML = `
      <div class="row">
        <label>좌우 분할</label>
        <input type="number" min="1" max="6" step="1" id="inpVCount" value="${s.verticalCount}">
      </div>
      <div class="row">
        <label>상하 구성</label>
        <select id="selHLayout">
          <option value="doorOnly" ${s.horizontalLayout==='doorOnly'?'selected':''}>도어/서랍만</option>
          <option value="doorTopDrawerBottom" ${s.horizontalLayout==='doorTopDrawerBottom'?'selected':''}>상부 분할 + 하부 영역</option>
        </select>
      </div>
      ${s.horizontalLayout === 'doorTopDrawerBottom' ? `
        <div class="row">
          <label>하부 H (mm)</label>
          <input type="number" min="50" max="${m.H-50}" step="10" id="inpDrawerH" value="${s.drawerHeight}">
        </div>
      ` : ''}
    `;
    document.getElementById('inpVCount').oninput = (e) => {
      const v = Math.max(1, Math.min(6, parseInt(e.target.value)||1));
      s.verticalCount = v;
      while (s.areaTypes.length < v) { s.areaTypes.push('door'); s.areaDirections.push('left'); }
      s.areaTypes.length = v;
      s.areaDirections.length = v;
      renderFrontView(); renderRightPanel();
    };
    document.getElementById('selHLayout').onchange = (e) => {
      s.horizontalLayout = e.target.value;
      renderFrontView(); renderRightPanel();
    };
    const inpDr = document.getElementById('inpDrawerH');
    if (inpDr) inpDr.oninput = (e) => {
      const v = parseInt(e.target.value) || 200;
      s.drawerHeight = Math.max(50, Math.min(m.H-50, v));
      renderFrontView();
    };

    // 영역 타입
    let areaHTML = '';
    for (let i = 0; i < s.verticalCount; i++) {
      const t = s.areaTypes[i] || 'door';
      const d = s.areaDirections[i] || 'left';
      areaHTML += `
        <div class="area-row" data-idx="${i}">
          <span class="a-lab">#${i+1}</span>
          <select class="a-type">
            <option value="door"   ${t==='door'?'selected':''}>도어</option>
            <option value="drawer" ${t==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${t==='open'?'selected':''}>오픈</option>
          </select>
          ${t==='door' ? `
          <select class="a-dir">
            <option value="left"  ${d==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${d==='right'?'selected':''}>우 ▶</option>
          </select>` : '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'}
        </div>
      `;
    }
    if (s.horizontalLayout === 'doorTopDrawerBottom') {
      areaHTML += `
        <div style="margin-top:8px;padding-top:6px;border-top:2px solid var(--brand-mid);font-size:10px;color:var(--text-dim);font-weight:600">하부 영역</div>
        <div class="area-row">
          <span class="a-lab">하부</span>
          <select class="b-type">
            <option value="door"   ${s.bottomType==='door'?'selected':''}>도어</option>
            <option value="drawer" ${s.bottomType==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${s.bottomType==='open'?'selected':''}>오픈</option>
          </select>
          ${s.bottomType==='door' ? `
          <select class="b-dir">
            <option value="left"  ${s.bottomDirection==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${s.bottomDirection==='right'?'selected':''}>우 ▶</option>
          </select>` : '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'}
        </div>
      `;
    }
    document.getElementById('areasBody').innerHTML = areaHTML;
    document.querySelectorAll('#areasBody .area-row').forEach(row => {
      const idx = row.dataset.idx;
      const tSel = row.querySelector('.a-type, .b-type');
      const dSel = row.querySelector('.a-dir, .b-dir');
      if (tSel) tSel.onchange = (e) => {
        if (idx !== undefined) s.areaTypes[+idx] = e.target.value;
        else s.bottomType = e.target.value;
        renderFrontView(); renderRightPanel();
      };
      if (dSel) dSel.onchange = (e) => {
        if (idx !== undefined) s.areaDirections[+idx] = e.target.value;
        else s.bottomDirection = e.target.value;
        renderFrontView();
      };
    });

    // 선반
    let shelfHTML = '';
    s.shelves.forEach((sh, i) => {
      shelfHTML += `
        <div class="shelf-row">
          <input type="number" min="0" max="${m.H}" step="10" data-idx="${i}" value="${sh}">
          <button class="del" data-idx="${i}">×</button>
        </div>
      `;
    });
    if (!s.shelves.length) shelfHTML = '<div style="color:var(--text-faint);font-size:10px;padding:4px 0">선반 없음</div>';
    shelfHTML += '<button class="add-btn" id="addShelf">+ 선반 추가</button>';
    document.getElementById('shelvesBody').innerHTML = shelfHTML;
    document.querySelectorAll('#shelvesBody input[type="number"]').forEach(inp => {
      inp.oninput = (e) => {
        const idx = +e.target.dataset.idx;
        const v = parseInt(e.target.value);
        if (isFinite(v)) { s.shelves[idx] = Math.max(0, Math.min(m.H, v)); renderFrontView(); }
      };
    });
    document.querySelectorAll('#shelvesBody button.del').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.idx;
        s.shelves.splice(idx, 1);
        renderFrontView(); renderRightPanel();
      };
    });
    document.getElementById('addShelf').onclick = () => {
      // 중앙 높이로 추가
      s.shelves.push(Math.round(m.H / 2));
      renderFrontView(); renderRightPanel();
    };

    // 손잡이
    document.getElementById('handleBody').innerHTML = `
      <div class="row">
        <label>타입</label>
        <select id="selHType">
          <option value="channel"   ${s.handleType==='channel'?'selected':''}>찬넬 (매립형)</option>
          <option value="c-channel" ${s.handleType==='c-channel'?'selected':''}>C찬넬</option>
          <option value="push"      ${s.handleType==='push'?'selected':''}>푸쉬 (Push-to-open)</option>
        </select>
      </div>
      <div class="row">
        <label>위치</label>
        <select id="selHPos">
          <option value="top"    ${s.handlePosition==='top'?'selected':''}>상</option>
          <option value="middle" ${s.handlePosition==='middle'?'selected':''}>중</option>
          <option value="bottom" ${s.handlePosition==='bottom'?'selected':''}>하</option>
        </select>
      </div>
    `;
    document.getElementById('selHType').onchange = (e) => { s.handleType = e.target.value; };
    document.getElementById('selHPos').onchange  = (e) => { s.handlePosition = e.target.value; };
  }

  // ─────────────────────────────────────────────────────────────
  // 캔버스 인터랙션 — 휠/팬/단축키
  // ─────────────────────────────────────────────────────────────
  function attachCanvasHandlers() {
    const wrap = document.getElementById('canvasWrap');
    const svg  = document.getElementById('frontSvg');
    // 휠 줌
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
      const newZoom = Math.max(0.05, Math.min(8, view.zoom * factor));
      const wx = (mx - view.panX) / view.zoom;
      const wy = (my - view.panY) / view.zoom;
      view.zoom = newZoom;
      view.panX = mx - wx * newZoom;
      view.panY = my - wy * newZoom;
      applyView();
    }, { passive: false });
    // pan
    let panInfo = null;
    svg.addEventListener('pointerdown', (e) => {
      panInfo = { sx: e.clientX, sy: e.clientY, ox: view.panX, oy: view.panY };
      svg.setPointerCapture(e.pointerId);
      svg.style.cursor = 'grabbing';
    });
    svg.addEventListener('pointermove', (e) => {
      if (!panInfo) return;
      view.panX = panInfo.ox + (e.clientX - panInfo.sx);
      view.panY = panInfo.oy + (e.clientY - panInfo.sy);
      applyView();
    });
    const endPan = () => { panInfo = null; svg.style.cursor = ''; };
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);
    // 키보드
    document.addEventListener('keydown', (e) => {
      if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); fitToActiveModule(); }
      if (e.key === '0') { e.preventDefault(); view.zoom = 1; view.panX = 0; view.panY = 0; applyView(); }
      if (e.key === 'l' || e.key === 'L') { document.getElementById('moduleList').classList.toggle('collapsed'); }
      if (e.key === 'r' || e.key === 'R') { document.getElementById('rightPanel').classList.toggle('collapsed'); }
    });
  }

  // 토스트
  function showToast(text) {
    const wrap = document.getElementById('canvasWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  // ─────────────────────────────────────────────────────────────
  // BottomBar 액션
  // ─────────────────────────────────────────────────────────────
  document.getElementById('reloadBtn').onclick = () => {
    loadModules();
    renderModuleList();
    if (modules.length && !modules.find(m => m.id === activeId)) setActiveModule(modules[0].id);
    showToast(`📥 배치 로드 (모듈 ${modules.length}개)`);
  };
  document.getElementById('saveBtn').onclick = () => {
    saveStructures();
    showToast(`💾 구조 저장 (모듈 ${Object.keys(structures).length}개)`);
  };
  document.getElementById('nextBtn').onclick = () => {
    saveStructures();
    alert('디테일 단계는 다음 PR 에서 구현 예정입니다.\n\n계획:\n- 도어 색상 / 마감 (글로스/매트/엠보)\n- 손잡이 실제 모델\n- BOM 자재 미리보기\n- SketchUp 내보내기');
  };

  // 패널 토글 버튼
  document.getElementById('btnLeft').onclick = (e) => {
    document.getElementById('moduleList').classList.toggle('collapsed');
    e.currentTarget.classList.toggle('on');
  };
  document.getElementById('btnRight').onclick = (e) => {
    document.getElementById('rightPanel').classList.toggle('collapsed');
    e.currentTarget.classList.toggle('on');
  };

  // ─────────────────────────────────────────────────────────────
  // W9-64: 3D Scene (Three.js) — planner-vite App.tsx 패턴 참고
  // ─────────────────────────────────────────────────────────────
  let three = null;  // { renderer, scene, camera, controls, moduleGroup }
  let currentView = '3d';  // '3d' | '2d'

  // W9-67/W9-68: 원점/천정 정보 — mockup-shell.html 의 'dadam_origin_v1' 에서 로드
  let ceilingHeight = 2300;
  let originPos2D = { x: 0, y: 0 };  // 평면도 SVG 좌표
  (function loadOrigin() {
    try {
      const raw = localStorage.getItem('dadam_origin_v1');
      if (raw) {
        const o = JSON.parse(raw);
        if (typeof o.ceiling === 'number') ceilingHeight = o.ceiling;
        if (typeof o.x === 'number' && typeof o.y === 'number') {
          originPos2D = { x: o.x, y: o.y };
        }
      }
    } catch (e) {}
  })();

  // section 별 모듈 base Y (바닥 또는 천정 매달림)
  // W9-69: hood 도 천정 매달림 추가
  function getBaseY(section, moduleH) {
    if (section === 'upper' || section === 'hood') {
      // 상부장/후드: 천정 매달림 — top = ceiling, base = ceiling - moduleH
      return ceilingHeight - moduleH;
    }
    // 하부/키큰/냉장고/분배기/식세기: 바닥에서 시작
    return 0;
  }

  function init3D() {
    if (three || !window.THREE) return;
    const canvas = document.getElementById('canvas3d');
    const wrap = document.getElementById('canvasWrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(w, h, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4efe7);

    const camera = new THREE.PerspectiveCamera(45, w / h, 10, 50000);
    camera.position.set(2000, 1200, 3000);

    // 조명 (planner-vite App.tsx 패턴)
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.8);
    d1.position.set(5000, 8000, 5000); d1.castShadow = true;
    d1.shadow.mapSize.set(1024, 1024);
    scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.6);
    d2.position.set(-3000, 4000, -3000);
    scene.add(d2);

    // Ground grid + plane
    const grid = new THREE.GridHelper(6000, 30, 0xb8956c, 0xe5e0d4);
    grid.position.y = 0;
    scene.add(grid);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xfaf6ee, roughness: 1.0 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // OrbitControls
    const controls = new window.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 600, 0);
    controls.update();

    const moduleGroup = new THREE.Group();
    scene.add(moduleGroup);

    three = { renderer, scene, camera, controls, moduleGroup };

    // W9-79/80: Raycaster + click 핸들러 — entity 클릭 시 우측 패널 갱신
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downXY = null;
    canvas.addEventListener('pointerdown', (e) => { downXY = { x: e.clientX, y: e.clientY }; });
    canvas.addEventListener('pointerup', (e) => {
      if (!downXY) return;
      const dx = Math.abs(e.clientX - downXY.x);
      const dy = Math.abs(e.clientY - downXY.y);
      downXY = null;
      if (dx > 4 || dy > 4) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      pointer.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(moduleGroup.children, true);
      if (!hits.length) return;
      handleEntityClick(hits[0].object);
    });

    // Resize handler
    window.addEventListener('resize', () => {
      if (!three) return;
      const cw = wrap.clientWidth, ch = wrap.clientHeight;
      three.renderer.setSize(cw, ch, false);
      three.camera.aspect = cw / ch;
      three.camera.updateProjectionMatrix();
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      three.controls.update();
      three.renderer.render(three.scene, three.camera);
    }
    animate();
  }

  // W9-82/83: 이전 highlight 추적 (해제용)
  //   - prevHighlighted: 단일 mesh emissive (도어/마감재/선반)
  //   - prevHighlightedGroup: 모듈 단위 — { meshes: [...], prevEmissives: [...] }
  let prevHighlighted = null;
  let prevEmissive = null;
  let prevHighlightedGroup = null;

  function clearHighlight() {
    if (prevHighlighted && prevHighlighted.material && prevEmissive !== null) {
      prevHighlighted.material.emissive && prevHighlighted.material.emissive.setHex(prevEmissive);
    }
    prevHighlighted = null;
    prevEmissive = null;
    if (prevHighlightedGroup) {
      prevHighlightedGroup.meshes.forEach((mh, i) => {
        if (mh.material && mh.material.emissive) {
          mh.material.emissive.setHex(prevHighlightedGroup.prevEmissives[i]);
        }
      });
      prevHighlightedGroup = null;
    }
  }

  function highlightModuleGroup(modG) {
    // 모듈 그룹 내 모든 carcass mesh 에 emissive (전체가 빛나도록)
    const meshes = [];
    const prevEms = [];
    modG.traverse((ch) => {
      if (ch.isMesh && ch.material && ch.material.emissive && ch.userData && ch.userData.entityKind === 'carcass') {
        meshes.push(ch);
        prevEms.push(ch.material.emissive.getHex());
        ch.material.emissive.setHex(0xffaa00);
      }
    });
    prevHighlightedGroup = { meshes, prevEmissives: prevEms };
  }

  // W9-79/80: 클릭된 entity → 우측 패널 갱신 + 선택 시각 효과 (init3D 밖 글로벌)
  function handleEntityClick(mesh) {
    if (!mesh) return;
    clearHighlight();
    // mesh.userData 우선, 없으면 부모 traverse
    const meshUd = mesh.userData || {};
    const kind = meshUd.entityKind;
    // W9-83: carcass 클릭 → 모듈 그룹 전체 highlight
    if (kind === 'carcass') {
      let modG = mesh.parent;
      while (modG && (!modG.userData || modG.userData.entityKind !== 'module')) modG = modG.parent;
      if (modG) highlightModuleGroup(modG);
    } else if (mesh.material && mesh.material.emissive && kind && kind !== 'finishing-edge' && kind !== 'carcass-line') {
      // 단일 entity (마감재/선반) → 자기 자신만 emissive
      prevHighlighted = mesh;
      prevEmissive = mesh.material.emissive.getHex();
      mesh.material.emissive.setHex(0xffaa00);
    }
    let cur = mesh, ud = null;
    while (cur) {
      if (cur.userData && cur.userData.entityKind) { ud = cur.userData; break; }
      cur = cur.parent;
    }
    if (!ud) return;
    if (meshUd.entityKind && meshUd.entityKind !== 'module') ud = meshUd;
    const moduleId = ud.moduleId;
    if (moduleId && moduleId !== activeId) {
      if (viewMode === 'single') {
        setActiveModule(moduleId);
      } else {
        const m = modules.find(x => x.id === moduleId);
        if (m) {
          activeId = moduleId;
          const nameEl = document.getElementById('curModuleName');
          if (nameEl) {
            const idx = parseInt(moduleId.split('-')[1] || 0) + 1;
            nameEl.textContent = SECTION_CONFIG[m.section].label + ' #' + idx;
          }
          renderRightPanel();
        }
      }
    }
    let msg = '';
    if (ud.entityKind === 'finishing') {
      msg = '🎯 마감재: ' + (SECTION_CONFIG[ud.finishingSection] && SECTION_CONFIG[ud.finishingSection].label || ud.finishingSection);
    } else if (ud.entityKind === 'module' || ud.entityKind === 'carcass') {
      const m2 = modules.find(x => x.id === ud.moduleId);
      const lbl = m2 ? SECTION_CONFIG[m2.section].label : '모듈';
      msg = '🎯 ' + lbl + ' 선택';
    } else if (ud.entityKind === 'shelf') {
      msg = '🎯 선반 ' + ((ud.shelfIdx || 0) + 1);
    }
    if (msg && typeof showToast === 'function') showToast(msg);
  }

  // 헬퍼: BoxGeometry 한 면을 mesh 로
  function makeBox(w, h, d, color, opts = {}) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      metalness: opts.metalness ?? 0.05,
      roughness: opts.roughness ?? 0.65,
      transparent: !!opts.transparent,
      opacity:     opts.opacity ?? 1.0,
      wireframe:   !!opts.wireframe,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  // 모듈 3D 렌더 — 외곽 + 도어/서랍 + 선반 + 손잡이
  function renderModule3D(m, s) {
    if (!three) return;
    // 기존 그룹 비우기
    while (three.moduleGroup.children.length) {
      const ch = three.moduleGroup.children[0];
      three.moduleGroup.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material) ch.material.dispose && ch.material.dispose();
    }
    if (!m) return;
    const cfg = SECTION_CONFIG[m.section];
    const W = m.W, H = m.H, D = m.D;
    const T = 18;   // 판 두께

    // 모듈 그룹 (바닥 중앙 origin)
    // W9-67: 상부장은 천정 매달림 — Y offset = ceiling - H
    const baseY = getBaseY(m.section, H);
    const modG = new THREE.Group();
    modG.position.set(0, baseY, 0);  // Y 만큼 위로 들어올림
    modG.userData = { entityKind: 'module', moduleId: m.id };  // W9-79
    three.moduleGroup.add(modG);

    // W9-87: cell 단위 분할 — 도어 개수 = 독립 캐비넷 개수
    const carcassColor = darken3(cfg.fill, 0.05);
    const carcassUd = { entityKind: 'carcass', moduleId: m.id };
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? (s.drawerHeight || 200) : 0;
    const topH = H - drawerH;
    const verticalCount = Math.max(1, s.verticalCount || 1);
    const colW = W / verticalCount;
    for (let i = 0; i < verticalCount; i++) {
      const cellLeft = -W/2 + colW * i;
      const cellCx = cellLeft + colW / 2;
      // cell 뒤판
      const _b = makeBox(colW, H, T, carcassColor); _b.position.set(cellCx, H/2, -D/2 + T/2); _b.userData = Object.assign({ side: 'back', cellIdx: i }, carcassUd); modG.add(_b);
      // W9-88: 각 cell 의 좌+우 측판 모두 생성 (다담 표준)
      const _l = makeBox(T, H, D, carcassColor); _l.position.set(cellLeft + T/2, H/2, 0); _l.userData = Object.assign({ side: 'left', cellIdx: i }, carcassUd); modG.add(_l);
      const _r = makeBox(T, H, D, carcassColor); _r.position.set(cellLeft + colW - T/2, H/2, 0); _r.userData = Object.assign({ side: 'right', cellIdx: i }, carcassUd); modG.add(_r);
      // 바닥 + 천장
      const _bt = makeBox(colW - 2*T, T, D - T, carcassColor); _bt.position.set(cellCx, T/2, T/2); _bt.userData = Object.assign({ side: 'bottom', cellIdx: i }, carcassUd); modG.add(_bt);
      const _tp = makeBox(colW - 2*T, T, D - T, carcassColor); _tp.position.set(cellCx, H - T/2, T/2); _tp.userData = Object.assign({ side: 'top', cellIdx: i }, carcassUd); modG.add(_tp);
      // cell 안 선반
      if (Array.isArray(s.shelves)) {
        s.shelves.forEach((shMM, shIdx) => {
          if (shMM <= T || shMM >= H - T) return;
          const sh = makeBox(colW - 2*T - 4, T, D - T - 4, '#e8d8b8', { roughness: 0.5 });
          sh.position.set(cellCx, shMM, T/2);
          sh.userData = { entityKind: 'shelf', moduleId: m.id, shelfIdx: shIdx, cellIdx: i };
          modG.add(sh);
          const edges = new THREE.EdgesGeometry(sh.geometry);
          const line = new THREE.LineSegments(edges,
            new THREE.LineBasicMaterial({ color: 0x7a6a45, linewidth: 2 }));
          line.position.copy(sh.position);
          modG.add(line);
        });
      }
      // W9-88: 도어/서랍 폭 = colW - 2T - 4 (측판 영역 안 침범)
      const innerW = colW - 2*T - 4;
      // cell 도어
      const type = (s.areaTypes && s.areaTypes[i]) || 'door';
      const dir  = (s.areaDirections && s.areaDirections[i]) || 'left';
      const yCenter = drawerH + topH/2;
      addFrontPanel(modG, cellCx, yCenter, innerW, topH - 4, D/2, type, dir, cfg, s, { moduleId: m.id, areaIdx: i, areaPos: 'top' });
      // cell 서랍
      if (drawerH > 0) {
        addFrontPanel(modG, cellCx, drawerH/2, innerW, drawerH - 4, D/2,
                      s.bottomType || 'drawer', s.bottomDirection || 'left', cfg, s, { moduleId: m.id, areaIdx: -1, areaPos: 'bottom', cellIdx: i });
      }
    }

    // W9-77/85: 자식 마감재 (EP/몰딩/휠라) — fcfg 없어도 진행 (강제 색상)
    if (Array.isArray(m.finishings) && m.finishings.length) {
      console.log('[STRUCT] renderModule3D', m.id, 'finishings:', m.finishings.length);
      m.finishings.forEach((f) => {
        // 평면도 절대 좌표 → 모듈 mesh 로컬 (X=-W/2~W/2, Z=-D/2~D/2)
        const fxCenter = (f.x || 0) + (f.W || 0) / 2;
        const fyCenter = (f.y || 0) + (f.D || 0) / 2;
        const mxCenter = m.x + m.W / 2;
        const myCenter = m.y + m.D / 2;
        const dxRel = fxCenter - mxCenter;
        const dzRel = fyCenter - myCenter;
        const fH = f.H || m.H;
        if (!f.W || !f.D || !isFinite(fH)) {
          console.warn('[STRUCT] finishing skip — invalid dims', f);
          return;
        }
        // W9-82: 마감재는 진한 우드 톤 (모듈과 명확히 구별)
        const finColor = f.section === 'ep' ? '#7a6a45' :       // EP — 진한 우드
                        f.section === 'molding' ? '#5a4d2f' :   // 몰딩 — 더 진한 갈색
                        f.section === 'filler' ? '#8a7858' :    // 휠라 — 중간 우드
                        '#7a6a45';                              // 기본 폴백
        const fbox = makeBox(f.W, fH, f.D, finColor, { roughness: 0.6, metalness: 0.1 });
        fbox.position.set(dxRel, fH / 2, dzRel);
        fbox.userData = { entityKind: 'finishing', moduleId: m.id, finishingSection: f.section };
        const edges = new THREE.EdgesGeometry(fbox.geometry);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x1a0f00, linewidth: 2 })
        );
        line.position.copy(fbox.position);
        line.userData = { entityKind: 'finishing-edge' };
        modG.add(fbox);
        modG.add(line);
      });
    }

    // 카메라 fit
    fitCameraToModule(W, H, D, baseY);
  }

  // W9-65: 도어 표현 제거 — 모든 영역을 단순 panel 로 (회전/손잡이 X)
  // 영역 type 으로 색상/모양 구분
  // W9-79/84: 전면 panel 도 carcass 로 통합 — 도어/서랍/오픈 클릭 → 모듈 전체 선택
  // W9-86: doorVisible=false 면 도어/서랍 mesh skip (오픈 frame 은 항상 표시)
  function addFrontPanel(parent, cx, cy, w, h, frontZ, type, direction, cfg, s, meta) {
    const T = 18;
    const carcassMeta = { entityKind: 'carcass', moduleId: meta.moduleId, side: 'front', areaType: type };
    if (type === 'open') {
      const frame = makeBox(w, h, 2, cfg.stroke, { transparent: true, opacity: 0.25, wireframe: true });
      frame.position.set(cx, cy, frontZ);
      frame.userData = carcassMeta;
      parent.add(frame);
      return;
    }
    // W9-86: 도어 끄기 — 도어/서랍 panel 생략 (내부 선반/마감재 보이도록)
    if (!doorVisible) return;
    const color = type === 'drawer' ? darken3(cfg.fill, 0.15) : cfg.fill;
    const panel = makeBox(w, h, T, color);
    panel.position.set(cx, cy, frontZ);
    panel.userData = carcassMeta;
    parent.add(panel);
    if (type === 'drawer') {
      const line = makeBox(w * 0.85, 2, 1, '#3d342a', { metalness: 0.3, roughness: 0.6 });
      line.position.set(cx, cy, frontZ + T/2 + 0.5);
      line.userData = { entityKind: 'carcass-line', moduleId: meta.moduleId };
      parent.add(line);
    }
  }

  function positionBox(mesh, x, y, z) { mesh.position.set(x, y, z); return mesh; }

  // 카메라 자동 fit — W9-67: baseY 반영 (상부장 등)
  function fitCameraToModule(W, H, D, baseY) {
    if (!three) return;
    const dist = Math.max(W, H, D) * 1.6;
    const cy = (baseY || 0) + H/2;
    three.camera.position.set(dist * 0.7, cy + 200, dist);
    three.controls.target.set(0, cy, 0);
    three.controls.update();
  }

  // 색상 어둡게 헬퍼
  function darken3(hex, factor) {
    const c = new THREE.Color(hex);
    return '#' + c.multiplyScalar(1 - factor).getHexString();
  }

  // View toggle
  function setView(mode) {
    currentView = mode;
    document.getElementById('canvas3d').style.display = mode === '3d' ? 'block' : 'none';
    document.getElementById('frontSvg').style.display = mode === '2d' ? 'block' : 'none';
    document.getElementById('view3dBtn').classList.toggle('active', mode === '3d');
    document.getElementById('view2dBtn').classList.toggle('active', mode === '2d');
    if (mode === '3d' && three) {
      // 사이즈 갱신 (display 변경 후)
      const wrap = document.getElementById('canvasWrap');
      three.renderer.setSize(wrap.clientWidth, wrap.clientHeight, false);
      three.camera.aspect = wrap.clientWidth / wrap.clientHeight;
      three.camera.updateProjectionMatrix();
    }
  }
  document.getElementById('view3dBtn').onclick = () => setView('3d');
  document.getElementById('view2dBtn').onclick = () => setView('2d');

  // W9-86: 도어 표시 on/off 토글
  let doorVisible = true;
  function setDoorVisible(visible) {
    doorVisible = visible;
    document.getElementById('doorToggleBtn').classList.toggle('active', visible);
    // 3D 재렌더 (현재 view mode 에 맞게)
    if (typeof renderFrontView === 'function') renderFrontView();
  }
  document.getElementById('doorToggleBtn').onclick = () => setDoorVisible(!doorVisible);

  // ─────────────────────────────────────────────────────────────
  // W9-65: View mode (개별/세트/전체) + 세트 자동 그룹화
  // ─────────────────────────────────────────────────────────────
  let viewMode = 'single';   // 'single' | 'set' | 'all'
  let activeSetId = null;

  // rotation 별 그룹화 — 같은 회전 = 같은 정면 세트 (ㄱ자/ㄷ자 자동 감지)
  function buildSets() {
    const byRot = new Map();
    modules.forEach((m) => {
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      if (!byRot.has(rot)) byRot.set(rot, []);
      byRot.get(rot).push(m);
    });
    // 각 회전 그룹을 한 세트로
    const arr = [];
    let idx = 0;
    byRot.forEach((mods, rot) => {
      arr.push({
        id: 'set-' + idx,
        rotation: rot,
        modules: mods,
        label: `세트 #${idx+1} (회전 ${rot}°)`,
      });
      idx++;
    });
    return arr;
  }

  function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.ml-mode-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    // W9-72: 세트 모드에서만 자동계산 버튼 표시
    const autoCalcBar = document.getElementById('autoCalcBar');
    if (autoCalcBar) autoCalcBar.style.display = (mode === 'set') ? 'block' : 'none';
    renderModuleList();
    if (mode === 'single') {
      if (modules.length && !modules.find(x => x.id === activeId)) setActiveModule(modules[0].id);
      else if (activeId) setActiveModule(activeId);
    } else if (mode === 'set') {
      const sets = buildSets();
      if (sets.length) setActiveSet(sets[0].id);
    } else if (mode === 'all') {
      activeId = null; activeSetId = null;
      document.getElementById('curModuleName').textContent = `전체 모듈 (${modules.length}개)`;
      document.getElementById('canvasEmpty').style.display = modules.length ? 'none' : 'flex';
      renderAll3D();
    }
  }

  function setActiveSet(setId) {
    activeSetId = setId;
    const sets = buildSets();
    const set = sets.find(s => s.id === setId);
    if (!set) return;
    document.getElementById('curModuleName').textContent = set.label + ` (${set.modules.length}개)`;
    document.getElementById('canvasEmpty').style.display = 'none';
    renderSet3D(set);
    // 좌측 active 표시
    renderModuleList();
  }

  // module list 렌더 — viewMode 별
  const _renderModuleList = renderModuleList;
  renderModuleList = function() {
    const body = document.getElementById('mlBody');
    if (!modules.length) {
      body.innerHTML = '<div class="empty-msg">배치된 모듈 없음<br><span style="font-size:10px">mockup-shell.html 에서 배치 후 돌아오세요</span></div>';
      return;
    }
    if (viewMode === 'set') {
      const sets = buildSets();
      body.innerHTML = sets.map(s => {
        const labels = s.modules.map(m => SECTION_CONFIG[m.section].label).join(' / ');
        return `<div class="set-item ${s.id === activeSetId ? 'active' : ''}" data-set-id="${s.id}">
          <strong>${s.label}</strong>
          <div class="set-meta">${s.modules.length}개 모듈 · ${labels}</div>
        </div>`;
      }).join('');
      body.querySelectorAll('.set-item').forEach(el => {
        el.onclick = () => setActiveSet(el.dataset.setId);
      });
    } else if (viewMode === 'all') {
      body.innerHTML = `<div class="empty-msg" style="padding:20px 8px">전체 모듈 (${modules.length}개)<br><span style="font-size:10px">배치 그대로 3D 표시</span></div>`;
    } else {
      // single — 기존 동작
      _renderModuleList();
    }
  };

  // 전체 모듈 3D 렌더 — 배치 좌표 그대로
  function renderAll3D() {
    if (!three) return;
    const modG = three.moduleGroup;
    while (modG.children.length) {
      const ch = modG.children[0]; modG.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material && ch.material.dispose) ch.material.dispose();
    }
    if (!modules.length) return;
    // W9-68: 원점 (originPos2D) 을 3D (0,0,0) 기준점으로 사용
    // 평면도 → 3D: x = m.x + m.W/2 - origin.x, z = m.y + m.D/2 - origin.y
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    modules.forEach(m => {
      minX = Math.min(minX, m.x); minY = Math.min(minY, m.y);
      maxX = Math.max(maxX, m.x + m.W); maxY = Math.max(maxY, m.y + m.D);
    });
    const ox = originPos2D.x, oy = originPos2D.y;
    modules.forEach(m => {
      const s = getStructure(m.id);
      const moduleMesh = createModuleMesh(m, s);
      // 원점 기준 좌표 — 평면도 (m.x, m.y) - (origin.x, origin.y)
      // W9-67: createModuleMesh 의 baseY 보존 (Y 직접 변경 X)
      moduleMesh.position.x = m.x + m.W/2 - ox;
      moduleMesh.position.z = m.y + m.D/2 - oy;
      moduleMesh.rotation.y = -(m.rotation || 0) * Math.PI / 180;
      modG.add(moduleMesh);
    });
    // 원점 표시 (3D 의 0,0,0)
    addOriginMarker3D(modG);
    // 카메라 fit — 원점부터 모듈 전체까지 보이게
    const extentX = Math.max(Math.abs(minX - ox), Math.abs(maxX - ox));
    const extentZ = Math.max(Math.abs(minY - oy), Math.abs(maxY - oy));
    fitCameraToBounds(Math.max(extentX, extentZ, ceilingHeight) * 2);
    three.controls.target.set(0, ceilingHeight/2, 0);
    three.controls.update();
  }

  // 3D 원점 마커 (작은 cross at 0,0,0)
  function addOriginMarker3D(parent) {
    const ns = 'three';
    const mat = new THREE.LineBasicMaterial({ color: 0x1976d2 });
    const sz = 200;
    const points = [
      new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0),
      new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz),
      new THREE.Vector3(0, 0, 0),   new THREE.Vector3(0, sz*0.5, 0),
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const lines = new THREE.LineSegments(geo, mat);
    parent.add(lines);
  }

  // 세트 3D 렌더 — 같은 회전 모듈들을 원점 기준 원래 배치 좌표로 표시
  // W9-69: 인위적 일렬 정렬 (curX) 제거, renderAll3D 와 동일한 원점 기준 좌표
  function renderSet3D(set) {
    if (!three) return;
    const modG = three.moduleGroup;
    while (modG.children.length) {
      const ch = modG.children[0]; modG.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material && ch.material.dispose) ch.material.dispose();
    }
    if (!set.modules.length) return;
    const ox = originPos2D.x, oy = originPos2D.y;
    // 세트의 bbox 계산 (원점 기준)
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    set.modules.forEach(m => {
      const s = getStructure(m.id);
      const moduleMesh = createModuleMesh(m, s);
      // 원점 기준 좌표 (renderAll3D 와 동일)
      moduleMesh.position.x = m.x + m.W/2 - ox;
      moduleMesh.position.z = m.y + m.D/2 - oy;
      moduleMesh.rotation.y = -(m.rotation || 0) * Math.PI / 180;
      modG.add(moduleMesh);
      // bbox 업데이트 (원점 기준)
      minX = Math.min(minX, m.x - ox);
      maxX = Math.max(maxX, m.x + m.W - ox);
      minZ = Math.min(minZ, m.y - oy);
      maxZ = Math.max(maxZ, m.y + m.D - oy);
    });
    // 3D 원점 마커
    addOriginMarker3D(modG);
    // 카메라 — 세트의 bbox 중심 ceiling/2
    const cx3 = (minX + maxX) / 2;
    const cz3 = (minZ + maxZ) / 2;
    const extentX = maxX - minX;
    const extentZ = maxZ - minZ;
    const maxTopY = set.modules.reduce((mx, m) => {
      const top = (m.section === 'upper' || m.section === 'hood') ? ceilingHeight : m.H;
      return Math.max(mx, top);
    }, 0);
    const size = Math.max(extentX, extentZ, maxTopY);
    fitCameraToBoundsAt(size, cx3, cz3);
    three.controls.target.set(cx3, maxTopY/2, cz3);
    three.controls.update();
  }

  // W9-69: 카메라 fit + 특정 target 좌표
  function fitCameraToBoundsAt(size, tx, tz) {
    if (!three) return;
    const dist = size * 1.4;
    three.camera.position.set(tx + dist * 0.7, dist * 0.5, tz + dist);
    three.camera.updateProjectionMatrix();
  }

  function fitCameraToBounds(size) {
    if (!three) return;
    const dist = size * 1.4;
    three.camera.position.set(dist * 0.7, dist * 0.5, dist);
    three.camera.updateProjectionMatrix();
  }

  // 단일 모듈 mesh 생성 (외곽 + 분할 + 선반) — renderModule3D 의 logic 재사용
  // W9-67: 상부장은 천정 매달림 (Y offset = ceiling - H)
  function createModuleMesh(m, s) {
    const g = new THREE.Group();
    g.userData = { entityKind: 'module', moduleId: m.id };  // W9-79
    const cfg = SECTION_CONFIG[m.section];
    if (!cfg) return g;
    const W = m.W, H = m.H, D = m.D, T = 18;
    const carcassColor = darken3(cfg.fill, 0.05);
    // 모듈 base Y (section 따라)
    const baseY = getBaseY(m.section, H);
    g.position.y = baseY;
    // W9-87: 도어 개수 = cell 개수 → 각 cell 마다 독립 캐비넷 (몸통 분할)
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? (s.drawerHeight || 200) : 0;
    const topH = H - drawerH;
    const vCount = Math.max(1, s.verticalCount || 1);
    const colW = W / vCount;
    const carcassUd = { entityKind: 'carcass', moduleId: m.id };
    for (let i = 0; i < vCount; i++) {
      const cellLeft = -W/2 + colW * i;
      const cellCx = cellLeft + colW / 2;
      // cell 뒤판
      const cBack = makeBox(colW, H, T, carcassColor);
      cBack.position.set(cellCx, H/2, -D/2 + T/2);
      cBack.userData = Object.assign({ side: 'back', cellIdx: i }, carcassUd);
      g.add(cBack);
      // W9-88: 각 cell 의 좌+우 측판 모두 생성 (다담 표준 — 각 캐비넷 자기 측판)
      const cLeftP = makeBox(T, H, D, carcassColor);
      cLeftP.position.set(cellLeft + T/2, H/2, 0);
      cLeftP.userData = Object.assign({ side: 'left', cellIdx: i }, carcassUd);
      g.add(cLeftP);
      const cRightP = makeBox(T, H, D, carcassColor);
      cRightP.position.set(cellLeft + colW - T/2, H/2, 0);
      cRightP.userData = Object.assign({ side: 'right', cellIdx: i }, carcassUd);
      g.add(cRightP);
      // cell 바닥 + 천장
      const cBottom = makeBox(colW - 2*T, T, D - T, carcassColor);
      cBottom.position.set(cellCx, T/2, T/2);
      cBottom.userData = Object.assign({ side: 'bottom', cellIdx: i }, carcassUd);
      g.add(cBottom);
      const cTopP = makeBox(colW - 2*T, T, D - T, carcassColor);
      cTopP.position.set(cellCx, H - T/2, T/2);
      cTopP.userData = Object.assign({ side: 'top', cellIdx: i }, carcassUd);
      g.add(cTopP);
      // cell 안 선반 (모듈 전체 s.shelves 를 각 cell 에 동일 적용)
      if (Array.isArray(s.shelves)) {
        s.shelves.forEach((shMM, shIdx) => {
          if (shMM <= T || shMM >= H - T) return;
          const sh = makeBox(colW - 2*T - 4, T, D - T - 4, '#e8d8b8', { roughness: 0.5 });
          sh.position.set(cellCx, shMM, T/2);
          sh.userData = { entityKind: 'shelf', moduleId: m.id, shelfIdx: shIdx, cellIdx: i };
          g.add(sh);
          const edges = new THREE.EdgesGeometry(sh.geometry);
          const line = new THREE.LineSegments(edges,
            new THREE.LineBasicMaterial({ color: 0x7a6a45 }));
          line.position.copy(sh.position);
          g.add(line);
        });
      }
      // W9-88: 도어/서랍 폭 = colW - 2T - 4 (양쪽 측판 + 2mm 갭, 측판 영역 안 침범)
      const innerW = colW - 2*T - 4;
      // cell 도어 (상부 영역)
      const type = (s.areaTypes && s.areaTypes[i]) || 'door';
      const yCenter = drawerH + topH/2;
      addFrontPanel(g, cellCx, yCenter, innerW, topH - 4, D/2, type, null, cfg, s, { moduleId: m.id, areaIdx: i, areaPos: 'top' });
      // cell 서랍 (하부 영역 — drawerH > 0)
      if (drawerH > 0) {
        addFrontPanel(g, cellCx, drawerH/2, innerW, drawerH - 4, D/2,
                      s.bottomType || 'drawer', null, cfg, s, { moduleId: m.id, areaIdx: -1, areaPos: 'bottom', cellIdx: i });
      }
    }
    // W9-77/82/83/85: 자식 마감재 (EP/몰딩/휠라) — 진한 우드 톤 + fcfg 없어도 진행
    if (Array.isArray(m.finishings) && m.finishings.length) {
      console.log('[STRUCT] createModuleMesh', m.id, 'finishings:', m.finishings.length);
      m.finishings.forEach((f, fIdx) => {
        // 평면도 절대 좌표 → 모듈 mesh 로컬 (모듈 X/Z 중심=0)
        const fxCenter = (f.x || 0) + (f.W || 0) / 2;
        const fyCenter = (f.y || 0) + (f.D || 0) / 2;
        const mxCenter = m.x + m.W / 2;
        const myCenter = m.y + m.D / 2;
        const dxRel = fxCenter - mxCenter;
        const dzRel = fyCenter - myCenter;
        const fH = f.H || m.H;
        if (!f.W || !f.D || !isFinite(fH)) {
          console.warn('[STRUCT] finishing skip — invalid dims', f);
          return;
        }
        // W9-83: 마감재 색상 — 모듈과 명확 구별 (renderModule3D 와 동일 패턴)
        const finColor = f.section === 'ep' ? '#7a6a45'        // EP 진한 우드
                       : f.section === 'molding' ? '#5a4d2f'   // 몰딩 진갈색
                       : f.section === 'filler' ? '#8a7858'    // 휠라 중간 우드
                       : '#7a6a45';                            // 기본 폴백
        const fbox = makeBox(f.W, fH, f.D, finColor, { roughness: 0.6, metalness: 0.1 });
        fbox.position.set(dxRel, fH / 2, dzRel);
        fbox.userData = { entityKind: 'finishing', moduleId: m.id, finishingSection: f.section, finishingIdx: fIdx };
        const edges = new THREE.EdgesGeometry(fbox.geometry);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x1a0f00, linewidth: 2 })
        );
        line.position.copy(fbox.position);
        line.userData = { entityKind: 'finishing-edge' };
        g.add(fbox);
        g.add(line);
      });
    }
    return g;
  }

  // renderFrontView / renderRightPanel 호출 시 3D 도 같이 갱신 (single mode 만)
  const _origSetActive = setActiveModule;
  setActiveModule = function(id) {
    _origSetActive(id);
    if (viewMode !== 'single') return;
    const m = modules.find(x => x.id === id);
    const s = m ? getStructure(id) : null;
    if (m && s) renderModule3D(m, s);
  };
  const _origRenderFront = renderFrontView;
  renderFrontView = function() {
    _origRenderFront();
    if (viewMode === 'single') {
      if (!activeId) return;
      const m = modules.find(x => x.id === activeId);
      if (!m) return;
      const s = getStructure(activeId);
      renderModule3D(m, s);
    } else if (viewMode === 'set' && activeSetId) {
      const sets = buildSets();
      const set = sets.find(x => x.id === activeSetId);
      if (set) renderSet3D(set);
    } else if (viewMode === 'all') {
      renderAll3D();
    }
  };

  // view mode toggle button click
  document.querySelectorAll('.ml-mode-toggle button').forEach(b => {
    b.onclick = () => setViewMode(b.dataset.mode);
  });

  // ─────────────────────────────────────────────────────────────
  // W9-72: 자동계산 (다담 표준 규칙 — 세트 일괄)
  // ─────────────────────────────────────────────────────────────
  // 도어 개수 (다담 표준: 목표 450mm, 범위 350-600)
  function calcDoorCount(W) {
    if (W <= 600)  return 1;
    if (W <= 1000) return 2;
    if (W <= 1400) return 3;
    if (W <= 1800) return 4;
    if (W <= 2200) return 5;
    return Math.max(1, Math.round(W / 450));
  }
  // 도어 열림 방향 — 양문 패턴 (인접 도어 반대)
  function calcDoorDirections(n) {
    if (n === 1) return ['left'];
    if (n === 2) return ['left', 'right'];
    const dirs = [];
    for (let i = 0; i < n; i++) dirs.push(i % 2 === 0 ? 'left' : 'right');
    return dirs;
  }
  // 선반 (등간격 — 하부 1, 상부 2, 키큰 3)
  function calcDefaultShelves(section, H) {
    let count;
    if (section === 'lower') count = 1;
    else if (section === 'upper') count = 2;
    else if (section === 'tall' || section === 'fridge') count = 3;
    else count = 0;
    if (count === 0) return [];
    const step = H / (count + 1);
    const arr = [];
    for (let i = 1; i <= count; i++) arr.push(Math.round(step * i));
    return arr;
  }
  // 영역 [x0,x1] 이 ranges 중 어느 것과 25%+ 겹치면 true
  function overlapsAny(x0, x1, ranges) {
    return ranges.some(r => {
      const ov = Math.max(0, Math.min(x1, r.x1) - Math.max(x0, r.x0));
      return ov > (x1 - x0) * 0.25;
    });
  }
  // 세트의 가전 X 범위 수집
  function collectXRanges(set, section) {
    return set.modules.filter(m => m.section === section).map(m => ({ x0: m.x, x1: m.x + m.W }));
  }

  // 단일 모듈 자동계산 — 가전 위치 (sink/hood/dishwasher) 고려
  function autoCalcModule(m, s, applianceRanges) {
    const W = m.W, H = m.H;
    const moduleX0 = m.x;
    // 1. 도어 개수
    s.verticalCount = calcDoorCount(W);
    // 2. 소구조
    if (m.section === 'lower') {
      s.horizontalLayout = 'doorTopDrawerBottom';
      s.drawerHeight = 200;
      s.bottomType = 'drawer';
      s.bottomDirection = 'left';
    } else {
      s.horizontalLayout = 'doorOnly';
    }
    // 3. 영역 타입 — 가전 X 범위 겹치면 'open'
    const colW = W / s.verticalCount;
    const dirsBase = calcDoorDirections(s.verticalCount);
    s.areaTypes = [];
    s.areaDirections = [];
    for (let i = 0; i < s.verticalCount; i++) {
      const areaX0 = moduleX0 + colW * i;
      const areaX1 = moduleX0 + colW * (i + 1);
      let type = 'door';
      if (m.section === 'upper' && applianceRanges) {
        if (overlapsAny(areaX0, areaX1, applianceRanges.hood)) type = 'open';
      }
      if (m.section === 'lower' && applianceRanges) {
        if (overlapsAny(areaX0, areaX1, applianceRanges.sink)) type = 'open';
        if (overlapsAny(areaX0, areaX1, applianceRanges.dishwasher)) type = 'open';
      }
      s.areaTypes.push(type);
      s.areaDirections.push(type === 'door' ? dirsBase[i] : 'left');
    }
    // 4. 선반
    s.shelves = calcDefaultShelves(m.section, H);
    // 5. 손잡이 (다담 매립형)
    s.handleType = 'channel';
    s.handlePosition = (m.section === 'upper') ? 'bottom'
                     : (m.section === 'lower') ? 'top'
                     : 'middle';
  }

  // 세트 일괄 자동계산
  function autoCalcForSet(set) {
    if (!set || !set.modules.length) return 0;
    const applianceRanges = {
      sink:       collectXRanges(set, 'sink'),
      hood:       collectXRanges(set, 'hood'),
      dishwasher: collectXRanges(set, 'dishwasher'),
    };
    let count = 0;
    set.modules.forEach((m) => {
      // 가전 자체는 skip (사용자 설정 유지)
      if (['sink', 'hood', 'dishwasher'].includes(m.section)) return;
      const s = getStructure(m.id);
      autoCalcModule(m, s, applianceRanges);
      count++;
    });
    return count;
  }

  // [⚡ 자동계산] 버튼 핸들러
  const autoCalcBtnEl = document.getElementById('autoCalcBtn');
  if (autoCalcBtnEl) autoCalcBtnEl.addEventListener('click', () => {
    if (viewMode !== 'set' || !activeSetId) {
      alert('세트 보기 모드에서 세트 선택 후 사용 가능합니다.');
      return;
    }
    const sets = buildSets();
    const set = sets.find(x => x.id === activeSetId);
    if (!set) return;
    const generalCount = set.modules.filter(m => !['sink','hood','dishwasher'].includes(m.section)).length;
    if (!generalCount) {
      alert('자동계산할 일반 모듈 없음 (가전은 자동계산 skip).');
      return;
    }
    if (!confirm(`${set.label} 의 일반 모듈 ${generalCount}개를 자동 계산합니다.\n\n· 도어 개수 (W 기준 450mm)\n· 하부장 = 도어+서랍 / 그 외 = 도어만\n· 선반 등간격\n· 손잡이 매립형 (위치 section 별)\n· 분배기/후드 X 범위는 'open'\n\n기존 설정 덮어쓰기.`)) return;
    const n = autoCalcForSet(set);
    renderRightPanel();
    renderSet3D(set);
    showToast(`⚡ ${set.label} 자동계산 완료 (${n}개 모듈)`);
  });

  // ─────────────────────────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────────────────────────
  loadModules();
  loadStructures();
  renderModuleList();
  attachCanvasHandlers();
  // Three.js 로드 후 init3D
  if (window.THREE) init3D();
  else window.addEventListener('three-ready', init3D);
  // 초기 모듈 활성화 — Three.js init 다음에
  setTimeout(() => {
    if (modules.length) setActiveModule(modules[0].id);
  }, 100);
  applyView();
</script>
</body>
</html>
