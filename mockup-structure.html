      vGuide.setAttribute('x1', 0); vGuide.setAttribute('y1', -100);
      vGuide.setAttribute('x2', 0); vGuide.setAttribute('y2', ceilingHeight + 40);
      vGuide.setAttribute('stroke', '#b8956c');
      vGuide.setAttribute('stroke-width', 2);
      vGuide.setAttribute('stroke-dasharray', '8 4');
      vGuide.setAttribute('opacity', 0.4);
      content.appendChild(vGuide);
    }
  }

  // W9-102: 단일 모듈 정면도 헬퍼 (offset 받음)

  /**
   * W12-30: 정면도의 칸을 **도어 방향 컨트롤**로 만든다.
   *
   * 예전엔 팔레트 팝업 안의 작은 미리보기가 이 일을 했다. 정면도와 같은 그림을
   * 두 번 그리던 것이라 정면도 하나만 남겼다 — 지금은 여기가 유일한 경로다.
   *
   * 규칙은 미리보기와 **같다** — 도어이고 양문이 아닐 때만 방향을 뒤집는다.
   * 양문은 좌우가 이미 정해져 있고(#471), 서랍·오픈·먹장은 여는 방향이 없다.
   * 그 밖의 클릭은 모듈 선택으로만 쓴다.
   */
  function bindFrontCell(rect, m, s, idx, type, is2D) {
    const canToggle = type === 'door' && !is2D;
    // `data-module-id` 는 **모듈당 하나**(외곽 rect)라는 규약이 있다 —
    // 여러 테스트가 그걸로 모듈을 센다. 칸에는 다른 이름을 쓴다.
    rect.setAttribute('data-cell-of', m.id);
    rect.setAttribute('data-cell-idx', String(idx));
    rect.style.cursor = 'pointer';
    rect.addEventListener('click', (e) => {
      e.stopPropagation();
      if (activeId !== m.id) { setActiveModule(m.id); if (!canToggle) return; }
      if (!canToggle) return;
      if (idx === 'bottom') {
        s.bottomDirection = s.bottomDirection === 'left' ? 'right' : 'left';
      } else {
        const i = +idx;
        s.areaDirections[i] = s.areaDirections[i] === 'left' ? 'right' : 'left';
      }
      panelCommit();
    });
  }

  function renderModuleFront(content, m, s, offsetX, offsetY) {
    const cfg = SECTION_CONFIG[m.section];
    const ns = 'http://www.w3.org/2000/svg';

    // W12-13: 마감재는 판 한 장이다 — 칸·도어·서랍을 그리지 않는다.
    // 폭이 20~60mm 인데 칸을 나누면 도어가 음수 폭이 된다.
    if (m.isFinishing || isFinishingSection(m.section)) {
      // W12-19: 잡아 둔 폭이 아니라 부재 폭으로 그린다 (EP 20 잡고 18T 판).
      const partW = Math.min(m.W, finishingPartWidthOf(m.section));
      const panel = document.createElementNS(ns, 'rect');
      panel.setAttribute('x', offsetX + (m.W - partW) / 2);
      panel.setAttribute('y', offsetY);
      panel.setAttribute('width', partW);
      panel.setAttribute('height', m.H);
      panel.setAttribute('fill', cfg.fill);
      panel.setAttribute('stroke', cfg.stroke);
      panel.setAttribute('stroke-width', 4);
      panel.setAttribute('data-module-id', m.id);
      panel.setAttribute('pointer-events', 'all');
      panel.style.cursor = 'pointer';
      panel.addEventListener('click', (e) => { e.stopPropagation(); setActiveModule(m.id); });
      content.appendChild(panel);
      return;
    }

    // 모듈 외곽 — 클릭 대상이자 옵션 팔레트의 앵커.
    // 예전엔 정면도에서 모듈을 고를 방법이 없어 좌측 목록이나 3D 를 거쳐야 했다.
    const outline = document.createElementNS(ns, 'rect');
    outline.setAttribute('x', offsetX);
    outline.setAttribute('y', offsetY);
    outline.setAttribute('width', m.W);
    outline.setAttribute('height', m.H);
    outline.setAttribute('fill', 'none');
    // W12-30: 고른 모듈을 도면에서 알아볼 수 있게 한다. 팔레트가 없어지면
    //   "무엇이 선택됐나"를 알려 주는 것이 이 테두리뿐이다.
    //   renderAreas 의 `const on = a.id === activeAreaId` 와 같은 방식이다.
    const on = m.id === activeId;
    outline.setAttribute('stroke', on ? 'var(--brand-deep, #6a4b2a)' : cfg.stroke);
    outline.setAttribute('stroke-width', on ? 8 : 4);
    outline.setAttribute('data-module-id', m.id);
    outline.setAttribute('pointer-events', 'all');
    outline.style.cursor = 'pointer';
    outline.addEventListener('click', (e) => {
      e.stopPropagation();
      setActiveModule(m.id);
    });
    content.appendChild(outline);

    // 상하 분할
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? s.drawerHeight : 0;
    const topH = m.H - drawerH;
    const topY = offsetY;             // 모듈 위쪽 (천장 매달림이면 ceiling=0)
    const drawerY = offsetY + topH;   // 하부 서랍 영역 시작

    // W9-95: 불균등 cell 폭 (areaWidths) — fallback 균등.
    // W12-30: 같은 규칙이 여기와 cellWidthsOf 두 곳에 있었다 — 하나로 모은다.
    const vCount = Math.max(1, s.verticalCount || 1);
    const cellWidths = cellWidthsOf(m, s);
    let xAcc = offsetX;
    for (let i = 0; i < vCount; i++) {
      const colW = cellWidths[i];
      const type = s.areaTypes[i] || 'door';
      const dir = s.areaDirections[i] || 'left';
      const is2D = !!(s.areaIs2D && s.areaIs2D[i]);
      // W9-112: 도어 외경 정렬 — cell 외측 갭 2mm 씩 빼서 도어 영역만 표시
      const GAP_HALF = MASTER_RULES.DOOR_GAP / 2;
      const x = xAcc + GAP_HALF;
      const doorW = colW - MASTER_RULES.DOOR_GAP;
      const fill = colorForArea(cfg.fill, type);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', x);
      r.setAttribute('y', topY + GAP_HALF);
      r.setAttribute('width', doorW);
      r.setAttribute('height', topH - MASTER_RULES.DOOR_GAP);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (type === 'open') r.setAttribute('stroke-dasharray', '8 4');
      bindFrontCell(r, m, s, i, type, is2D);   // W12-30
      content.appendChild(r);

      // 라벨
      const labFont = Math.min(colW * 0.18, topH * 0.18, 80);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', x + colW/2);
      lab.setAttribute('y', topY + topH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const typeLabel = { door:'도어', drawer:'서랍', open:'오픈' }[type];
      lab.textContent = typeLabel;
      if (type === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      // W9-101: 양문 (is2D) — 가운데 갭 4mm + 처짐방지목 표시
      if (type === 'door' && is2D) {
        const GAP = MASTER_RULES.DOOR_GAP;
        const braceW = MASTER_RULES.BAND_BRACE_W;
        // 가운데 처짐방지목 외곽 (얇은 회색 stroke)
        const brace = document.createElementNS(ns, 'rect');
        brace.setAttribute('x', x + colW/2 - braceW/2);
        brace.setAttribute('y', topY + 4);
        brace.setAttribute('width', braceW);
        brace.setAttribute('height', topH - 8);
        brace.setAttribute('fill', cfg.stroke);
        brace.setAttribute('opacity', 0.15);
        brace.setAttribute('stroke', '#000');
        brace.setAttribute('stroke-width', 1);
        content.appendChild(brace);
        // 가운데 갭 (4mm) — 두꺼운 검은 라인
        const gap = document.createElementNS(ns, 'line');
        gap.setAttribute('x1', x + colW/2); gap.setAttribute('y1', topY);
        gap.setAttribute('x2', x + colW/2); gap.setAttribute('y2', topY + topH);
        gap.setAttribute('stroke', '#000'); gap.setAttribute('stroke-width', 3);
        content.appendChild(gap);
        // 양문 방향 화살표 좌/우 둘 다
        const arrowFont = Math.min(colW * 0.08, 50);
        ['left', 'right'].forEach((dr, di) => {
          const arrow = document.createElementNS(ns, 'text');
          arrow.setAttribute('class', 'open-direction');
          arrow.setAttribute('font-size', arrowFont);
          arrow.setAttribute('text-anchor', 'middle');
          arrow.setAttribute('dominant-baseline', 'central');
          arrow.setAttribute('x', x + (dr === 'left' ? colW * 0.1 : colW * 0.9));
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = dr === 'left' ? '◀' : '▶';
          content.appendChild(arrow);
        });
      } else if (type === 'door') {
        // 단문 화살표 (기존)
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(colW * 0.15, 60));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (dir === 'left') {
          arrow.setAttribute('x', x + colW * 0.15);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', x + colW * 0.85);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
      // W9-95: 먹장 (blank) 표시
      if (type === 'blank') {
        // 회색 cross-hatch
        const blankLab = document.createElementNS(ns, 'text');
        blankLab.setAttribute('x', x + colW/2);
        blankLab.setAttribute('y', topY + topH/2);
        blankLab.setAttribute('text-anchor', 'middle');
        blankLab.setAttribute('dominant-baseline', 'central');
        blankLab.setAttribute('font-size', Math.min(colW * 0.12, topH * 0.12, 40));
        blankLab.setAttribute('fill', '#fff');
        blankLab.textContent = '먹장';
        content.appendChild(blankLab);
        // rect 색을 회색으로 override
        r.setAttribute('fill', '#a89c84');
        lab.setAttribute('opacity', 0);   // 도어 라벨 숨김
      }
      xAcc += colW;   // 다음 cell
    }

    // 하부 (도어+서랍 모드일 때만)
    if (s.horizontalLayout === 'doorTopDrawerBottom' && drawerH > 0) {
      const fill = colorForArea(cfg.fill, s.bottomType);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', offsetX);
      r.setAttribute('y', drawerY);
      r.setAttribute('width', m.W);
      r.setAttribute('height', drawerH);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (s.bottomType === 'open') r.setAttribute('stroke-dasharray', '8 4');
      bindFrontCell(r, m, s, 'bottom', s.bottomType, false);   // W12-30
      content.appendChild(r);

      const labFont = Math.min(m.W * 0.06, drawerH * 0.4, 70);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', offsetX + m.W/2);
      lab.setAttribute('y', drawerY + drawerH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const btmLab = { door:'도어', drawer:'서랍', open:'오픈' }[s.bottomType];
      lab.textContent = `${btmLab} H=${drawerH}`;
      if (s.bottomType === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      if (s.bottomType === 'door') {
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(m.W * 0.04, 50));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (s.bottomDirection === 'left') {
          arrow.setAttribute('x', offsetX + m.W * 0.06);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', offsetX + m.W * 0.94);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
    }

    // 선반 — 모듈 내부 (offsetY 기준)
    // 정면도 Y down: 선반 위치 y = offsetY + (m.H - shelf_mm)
    s.shelves.forEach(sh => {
      if (sh < 0 || sh > m.H) return;
      const y = offsetY + m.H - sh;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('class', 'shelf-line');
      line.setAttribute('x1', offsetX + 8);
      line.setAttribute('y1', y);
      line.setAttribute('x2', offsetX + m.W - 8);
      line.setAttribute('y2', y);
      content.appendChild(line);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', offsetX + m.W - 12);
      lab.setAttribute('y', y - 6);
      lab.setAttribute('text-anchor', 'end');
      lab.setAttribute('font-size', Math.min(m.W * 0.02, 24));
      lab.setAttribute('fill', '#5a4d2f');
      lab.setAttribute('font-family', 'monospace');
      lab.textContent = `H=${sh}`;
      content.appendChild(lab);
    });

    // W9-102: 마감재 (finishings) 정면도 표시 — 모듈 옆/위 (EP/몰딩/휠라)
    if (Array.isArray(m.finishings)) {
      m.finishings.forEach((f) => {
        if (!f.W || !f.H) return;
        // 평면도 절대 좌표 → 정면도 (offset 기준 모듈 안 상대 X)
        const fx = (f.x || 0) - (m.x || 0);   // 모듈 좌측 기준 상대 X
        const fH = f.H || m.H;
        const fY = offsetY + m.H - fH;        // 모듈 바닥 기준 H 위쪽
        const finColor = f.section === 'ep' ? '#7a6a45'
                       : f.section === 'molding' ? '#5a4d2f'
                       : f.section === 'filler' ? '#8a7858'
                       : '#7a6a45';
        const fr = document.createElementNS(ns, 'rect');
        fr.setAttribute('x', offsetX + fx);
        fr.setAttribute('y', fY);
        fr.setAttribute('width', f.W);
        fr.setAttribute('height', fH);
        fr.setAttribute('fill', finColor);
        fr.setAttribute('stroke', '#000');
        fr.setAttribute('stroke-width', 2);
        fr.setAttribute('opacity', 0.9);
        content.appendChild(fr);
      });
    }

    // 외곽 치수 라벨 (W / H)
    const dimFont = Math.min(m.W, m.H) * 0.04;
    const dimW = document.createElementNS(ns, 'text');
    dimW.setAttribute('class', 'module-dim-label');
    dimW.setAttribute('x', offsetX + m.W/2);
    dimW.setAttribute('y', offsetY + m.H + dimFont*1.5);
    dimW.setAttribute('text-anchor', 'middle');
    dimW.setAttribute('font-size', dimFont);
    dimW.textContent = `W ${m.W}mm`;
    content.appendChild(dimW);
    const dimH = document.createElementNS(ns, 'text');
    dimH.setAttribute('class', 'module-dim-label');
    dimH.setAttribute('x', offsetX - dimFont*0.8);
    dimH.setAttribute('y', offsetY + m.H/2);
    dimH.setAttribute('text-anchor', 'end');
    dimH.setAttribute('dominant-baseline', 'central');
    dimH.setAttribute('font-size', dimFont);
    dimH.textContent = `H ${m.H}mm`;
    content.appendChild(dimH);
  }

  // ─────────────────────────────────────────────────────────────
  // 우측 패널 — 4 섹션 동적 렌더
  // ─────────────────────────────────────────────────────────────
  /**
   * CD-2: 모듈 높이 구성 — 전체높이를 부위별로 나눈다.
   *
   * 플래너가 다루는 H 는 **전체 높이**이고 BOM 은 몸통 높이를 쓴다.
   * 그 사이 값(다리발·상판·상몰딩·좌대)을 모듈마다 지정할 수 있게 한다.
   * 부위 구성은 섹션마다 다르다:
   *   하부장  다리발 + 몸통 + 상판
   *   상부장  몸통 + 상몰딩
   *   키큰장  좌대 + 몸통 + 상몰딩       (docs/design-rules/sink.md §5)
   *
   * 값은 structures[id] 에 담는다 — 이미 저장·전송 경로를 타므로
   * 별도 배선 없이 BOM 까지 간다.
   */
  // W12-38: **받침** — 몸통을 바닥에서 받치는 부재. 다리발이거나 좌대이고,
  //   한 모듈에 **하나만** 선다. 예전엔 섹션이 정해 버려(하부장=다리발,
  //   키큰장/냉장고장=좌대) 사람이 고를 수 없었다.
  const BASE_KINDS = [['legH', '다리발'], ['pedestalH', '좌대']];
  const PEDESTAL_H_DEFAULT = 60;

  /** 그 섹션이 원래 쓰던 받침 — 사람이 안 고르면 이것 (예전 동작 그대로) */
  function defaultBaseKind(sec) {
    return (sec === 'tall' || sec === 'fridge') ? 'pedestalH' : 'legH';
  }
  function baseKindOf(m, s) {
    const k = s && s.baseKind;
    return (k === 'legH' || k === 'pedestalH') ? k : defaultBaseKind(m && m.section);
  }

  function heightPartsOf(m, s) {
    const sec = m.section;
    const num = (v, d) => {
      const x = parseFloat(v);
      return Number.isFinite(x) && x >= 0 ? x : d;
    };
    // 상부장은 매달리므로 받침이 없다.
    if (sec === 'upper') {
      return [{ key: 'moldingH', label: '상몰딩', value: num(s.moldingH, getMoldingH('upper')) }];
    }
    const kind = baseKindOf(m, s);
    const base = kind === 'pedestalH'
      ? { key: 'pedestalH', label: '좌대', value: num(s.pedestalH, PEDESTAL_H_DEFAULT), isBase: true }
      : { key: 'legH', label: '다리발', value: num(s.legH, MASTER_RULES.SINK_LEG), isBase: true };
    if (sec === 'tall' || sec === 'fridge') {
      return [base,
        { key: 'moldingH', label: '상몰딩', value: num(s.moldingH, getMoldingH(sec) || MASTER_RULES.CROWN_MOLDING_SINK) }];
    }
    return [base, { key: 'topT', label: '상판', value: num(s.topT, 12) }];
  }

  // 실효 높이 부위 — s 에 값이 있으면 그걸, 없으면 마스터 상수를 쓴다.
  //
  // 왜 헬퍼로 빼는가: 높이 패널은 예전부터 legH/moldingH 를 **편집**하게 해뒀는데,
  // 정면도·3D·선반 계산은 MASTER_RULES 를 직접 읽고 있었다. 즉 사용자가 다리발을
  // 바꿔도 몸통 숫자만 변하고 그림은 그대로였다 — 값이 흘러가는 길이 끊겨 있었다.
  // 렌더러가 전부 이 두 함수를 거치게 해서 길을 잇는다.
  /** 실효 다리발 H (하부장만 존재) */
  function legHOf(m, s) {
    // W12-38: 받침으로 좌대를 고르면 다리발은 서지 않는다. heightPartsOf 가
    //   그 판단을 갖고 있으므로 여기서 다시 하지 않는다.
    if (!m || m.section !== 'lower') return 0;
    if (baseKindOf(m, s) !== 'legH') return 0;
    const v = parseFloat(s && s.legH);
    return Number.isFinite(v) && v >= 0 ? v : MASTER_RULES.SINK_LEG;
  }
  /**
   * W12-6: 단(段)별 손잡이 기본형.
   *   하부장 → 목찬넬 (따내기 + ㄴ자 부재)
   *   중간장 → 푸쉬
   *   상부장 → 도어 내림 (도어를 몸통보다 아래로 빼서 그 밑단을 잡는다)
   * 키큰장·냉장고장은 한 영역이 세 단으로 쌓이므로 `m.part` 로 단을 가른다.
   */
  function defaultHandleType(m) {
    const part = m && m.part;
    // W12-10: 스택(키큰장·냉장고장)의 중간장·상부장은 푸쉬다. 손이 닿는 높이가
    // 아니라 도어 밑단을 잡는 방식이 안 맞는다. 하부장 단은 아래로 빠져 목찬넬.
    if (part === '중간장' || part === '상부장') return 'push';
    // 도어 내림은 **독립 싱크 상부장**에만 쓴다 (도어 = 장H + 15, 아래로 15).
    if (m && m.section === 'upper') return 'door-drop';
    return 'wood-channel';
  }

  /**
   * 저장된 값에서 실제 손잡이를 정한다.
   *
   * `'auto'` 는 아직 안 고른 상태고, `'channel'` 은 **예전 기본값**이다.
   * 예전엔 모든 모듈이 `'channel'` 로 시작해 알루미늄 막대가 전 섹션에 붙었다 —
   * 고른 것이 아니라 아무도 안 골라서 남은 값이다. 그래서 둘 다 기본형으로 읽는다.
   * 알루미늄 찬넬을 **직접 고르면** `'alu-channel'` 로 저장되므로 섞이지 않는다.
   */
  function handleTypeOf(m, s) {
    const v = s && s.handleType;
    if (!v || v === 'auto' || v === 'channel') return defaultHandleType(m);
    return v;
  }

  /**
   * W12-5: 목찬넬 손잡이인가 — 측판 따내기가 붙는 조건.
   * 독립 하부장과 스택의 '하부장' 단이 대상이다. 상부장 목찬넬은 도어 H 가
   * `H+20` 이라 매립 방식이 다르고 그 규칙이 아직 정본에 없다.
   * BOM 쪽(extractors.js)은 `specs.handle.includes('목찬넬')` 로 판별하므로
   * 브릿지가 보내는 문자열도 '목찬넬' 을 담아야 한다.
   */
  function isWoodChannel(m, s) {
    if (!m) return false;
    const lower = m.section === 'lower' || m.part === '하부장';
    return lower && handleTypeOf(m, s) === 'wood-channel';
  }

  /** 도어 내림 폭 — 도어가 몸통 밑으로 내려오는 길이. 0 이면 내림 아님. */
  function doorDropOf(m, s) {
    return handleTypeOf(m, s) === 'door-drop' ? MASTER_RULES.SINK_UPPER_DOOR_H_PLUS : 0;
  }

  /**
   * W12-8: 도어 상단을 몸통 상단보다 얼마나 내리는가.
   *
   * 목찬넬은 그 틈으로 손을 넣는다 — 없으면 도어가 목찬넬을 덮어 손잡이가 사라진다.
   * 정본은 `design_rules` 싱크하부장도어H / `sink.md` 하부장 부재표 `(H-30)` 이고
   * `SINK_LOWER_DOOR_H_MINUS` 로 옮겨져 있었지만 **아무도 쓰지 않아** 플래너는
   * 도어를 몸통H − 4(갭)로 그렸다. 실측 상단 틈이 2mm 였다.
   *
   * 목찬넬일 때만 적용한다. 푸쉬·알루미늄 찬넬 하부장까지 30mm 를 벌리면
   * 그 손잡이들에는 없는 틈이 생긴다.
   */
  function doorTopGapOf(m, s) {
    return isWoodChannel(m, s) ? MASTER_RULES.SINK_LOWER_DOOR_H_MINUS : 0;
  }

  /** 팔레트에 띄우는 손잡이 설명 — 무엇이 그려지는지 그대로 적는다. */
  function handleNoteFor(m, s) {
    const R = MASTER_RULES;
    switch (handleTypeOf(m, s)) {
      case 'wood-channel':
        return isWoodChannel(m, s)
          ? `측판·칸막이 상단 전면을 ${R.CHANNEL_NOTCH_H}×${R.CHANNEL_NOTCH_D} 따내고, `
            + `지면판 ${R.CHANNEL_BACK_W}×${R.CHANNEL_BOARD_T}T 위에 전면판 ${R.CHANNEL_FRONT_W}×${R.CHANNEL_BOARD_T}T 를 얹습니다.`
          : '목찬넬 따내기는 하부장에만 그립니다 — 상부장 매립 규칙이 아직 없습니다.';
      case 'door-drop':
        return `도어를 몸통보다 ${R.SINK_UPPER_DOOR_H_PLUS}mm 아래로 빼서 그 밑단을 잡습니다.`;
      case 'push':
        return '푸쉬 — 손잡이 부재가 없습니다. 도어를 눌러 엽니다.';
      case 'alu-channel':
        return `알루미늄 찬넬 ${R.CHANNEL_FRONT_W}×${R.CHANNEL_DEPTH} 를 도어 뒤에 매립합니다.`;
      default:
        return 'C찬넬 — 3D 표현이 아직 없습니다.';
    }
  }
  /** 실효 상몰딩 H */
  function moldingHOf(m, s) {
    const v = parseFloat(s && s.moldingH);
    return Number.isFinite(v) && v >= 0 ? v : getMoldingH(m && m.section);
  }
  /** heightPartsOf 가 내는 부위 하나 — 그 섹션에 없는 부위면 0 */
  function heightPartOf(m, s, key) {
    const p = heightPartsOf(m, s).find((x) => x.key === key);
    return p ? p.value : 0;
  }
  /** 상판 두께 (하부장) */
  function topTOf(m, s) { return heightPartOf(m, s, 'topT'); }
  /** 좌대 H (키큰장·냉장고장) */
  function pedestalHOf(m, s) { return heightPartOf(m, s, 'pedestalH'); }
  /** 몸통이 시작하는 바닥 offset — 하부장은 다리발, 키큰장/냉장고장은 좌대, 상부장은 0.
   *  legH 와 pedestalH 는 heightPartsOf 에서 서로 다른 갈래라 동시에 존재하지 않는다. */
  function baseOffsetOf(m, s) {
    return heightPartOf(m, s, 'legH') + heightPartOf(m, s, 'pedestalH');
  }

  /** 전체높이에서 부위를 뺀 몸통(카카스) 높이 */
  function bodyHeightOf(m, s) {
    const parts = heightPartsOf(m, s);
    const sum = parts.reduce((a, p) => a + p.value, 0);
    return Math.max(0, (Number(m.H) || 0) - sum);
  }


  // ── 편집 규칙 ────────────────────────────────────────────────
  // W12-31: 같은 판단이 두 곳(우측 패널·팔레트)에 있으면 한쪽만 고쳐진다.
  // 실제로 그랬다 — 몸통 50mm 가드가 문구까지 다르게 두 벌이었고, 치수 입력은
  // 팔레트에만 있어 areaWidths 를 비우지 않았다. 규칙은 여기 하나씩만 산다.

  /**
   * 모듈 치수 한 값을 바꾼다.
   *
   * 폭을 바꾸면 `areaWidths` 를 비운다. 그 배열은 자동계산이 잡아 준 **파생값**이라
   * 폭이 달라지면 근거가 사라진다 — 안 비우면 낡은 셀 폭이 그대로 남아 정면도가
   * 모듈 밖으로 삐져나온다 (syncCellArrays 가 갯수를 바꿀 때 하는 것과 같은 이유).
   */
  function applyModuleDim(m, s, k, raw) {
    const v = Math.max(100, parseInt(raw) || 0);
    m[k] = v;
    if (k === 'H') s.shelves = (s.shelves || []).filter((sh) => sh < v);
    if (k === 'W') { s.areaWidths = []; s.areaIs2D = []; }
    saveLayoutFromModules();
    return v;
  }

  /**
   * 높이 부위 하나를 바꾼다. 몸통이 50mm 미만이 되면 **되돌리고** false 를 낸다.
   * 되돌릴 때 `delete` 가 아니라 이전 값을 되놓는다 — 미지정과 0 은 다르다.
   */
  function applyHeightPart(m, s, key, raw) {
    const label = (heightPartsOf(m, s).find((p) => p.key === key) || {}).label || key;
    const prev = s[key];
    s[key] = Math.max(0, parseFloat(raw) || 0);
    if (bodyHeightOf(m, s) >= 50) return true;
    if (prev === undefined) delete s[key]; else s[key] = prev;
    showToast(`⚠ ${label}이 커서 몸통이 50mm 미만이 됩니다 — 전체 높이를 먼저 키우세요`);
    return false;
  }

  /**
   * W12-29: 우측 패널에서 값 하나를 바꾼 뒤 부르는 커밋.
   *
   * 예전에는 우측 패널의 대부분이 `renderFrontView()` 만 부르고 **저장을 안 했다**
   * — 그때는 떠 있는 팔레트가 저장을 대신하고 있어 드러나지 않았을 뿐,
   * 우측에서 분할·도어·선반·손잡이를 바꾸면 새로고침에 사라졌다.
   *
   * `focusSel` 은 다시 그린 뒤 포커스를 돌려줄 입력이다. 패널을 통째로 다시
   * 그리므로 안 돌려주면 한 글자 고칠 때마다 포커스가 날아간다.
   */
  function panelCommit(focusSel) {
    persistPlannerState();
    renderFrontView();
    renderRightPanel();
    if (typeof renderAll3D === 'function' && currentView === '3d') {
      try { renderAll3D({ fit: false }); } catch (_) {}
    }
    if (focusSel) {
      const el = document.querySelector(focusSel);
      if (el && el.focus) el.focus();
    }
  }

  function renderHeightPanel(m, s) {
    const host = document.getElementById('heightBody');
    if (!host) return;
    const parts = heightPartsOf(m, s);
    const body = bodyHeightOf(m, s);
    // W12-38: 받침(다리발·좌대)은 **한 항목**이다 — 무엇으로 받칠지 고르고
    //   그 높이를 정한다. 예전엔 섹션이 정해 버려 고를 수 없었다.
    const rows = parts
      .map((p) => p.isBase ? `
      <div class="row">
        <label>받침</label>
        <select id="selBaseKind">
          ${BASE_KINDS.map(([k, l]) => `<option value="${k}" ${p.key === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <label style="padding-left:10px">└ ${p.label} (mm)</label>
        <input type="number" min="0" max="500" step="1" data-hpart="${p.key}" value="${p.value}">
      </div>` : `
      <div class="row">
        <label>${p.label} (mm)</label>
        <input type="number" min="0" max="500" step="1" data-hpart="${p.key}" value="${p.value}">
      </div>`)
      .join('');
    host.innerHTML = `
      ${rows}
      <div class="row">
        <label>몸통 (mm)</label>
        <input type="number" min="50" step="1" id="inpBodyH" value="${body}">
      </div>
      <div class="row" style="opacity:.75">
        <label>전체 높이</label>
        <span style="font-weight:600">${Math.round(Number(m.H) || 0)} mm</span>
      </div>
      <div style="font-size:10px;color:#888;line-height:1.4;margin-top:4px">
        전체 = ${parts.map((p) => p.label).join(' + ')} + 몸통.<br>
        BOM 은 <b>몸통</b> 치수로 재단합니다.
      </div>
    `;

    // 받침 종류 — 다리발 ↔ 좌대. 높이는 각자의 값을 그대로 들고 있는다.
    const selBase = document.getElementById('selBaseKind');
    if (selBase) selBase.onchange = () => {
      s.baseKind = selBase.value;
      persistPlannerState();
      renderRightPanel();
      if (typeof renderFrontView === 'function') renderFrontView();
      showToast(`✓ 받침 ${BASE_KINDS.find(([k]) => k === s.baseKind)[1]}`);
    };

    // 부위 변경 → 전체높이 유지, 몸통이 흡수한다
    host.querySelectorAll('input[data-hpart]').forEach((inp) => {
      inp.addEventListener('change', () => {
        const key = inp.getAttribute('data-hpart');
        if (!applyHeightPart(m, s, key, inp.value)) { renderHeightPanel(m, s); return; }
        persistPlannerState();
        renderHeightPanel(m, s);
        if (typeof renderFrontView === 'function') renderFrontView();
        showToast(`✓ ${key} = ${s[key]}mm`);
      });
    });

    // 몸통 변경 → 부위는 그대로, 전체높이가 따라 커진다
    const bodyInp = document.getElementById('inpBodyH');
    if (bodyInp) {
      bodyInp.addEventListener('change', () => {
        const nextBody = Math.max(50, parseFloat(bodyInp.value) || 0);
        const sum = heightPartsOf(m, s).reduce((a, p) => a + p.value, 0);
        m.H = nextBody + sum;
        m.isFixed = true; // 사용자가 정한 높이는 자동계산이 건드리지 않는다
        persistPlannerState();
        renderHeightPanel(m, s);
        if (typeof renderFrontView === 'function') renderFrontView();
        if (typeof updateViewportRulers === 'function') updateViewportRulers();
        showToast(`✓ 몸통 ${nextBody}mm → 전체 ${m.H}mm (고정)`);
      });
    }
  }

  // ── 우측 패널의 두 모드 ────────────────────────────────────────
  // 섹션 마크업은 하나뿐이고, 모드가 **무엇을 보일지와 제목**만 정한다.
  // 모드마다 마크업을 따로 두면 둘이 어긋난다.
  const PANEL_SEC_TITLE = {
    size: '크기', height: '높이 구성', split: '분할',
    areas: '영역 타입 + 도어 열림', shelves: '선반 (내부 mm)', handle: '손잡이', finish: '마감',
  };
  const PANEL_LAYOUT = {
    module: { title: '구조 편집', secs: ['size', 'height', 'split', 'areas', 'shelves', 'handle'],
              titles: { size: '크기 · 고정' } },
    // 영역은 배치 공간이다 — 담을 그릇의 치수·높이 부위·양 끝 마감만 정한다.
    area:   { title: '영역 편집', secs: ['size', 'height', 'finish'],
              titles: { size: '영역 크기', height: '높이 구성 (좌대 · 상몰딩)' } },
  };

  function panelModeNow() {
    const a = areaById(activeAreaId);
    const m = modules.find((x) => x.id === activeId);
    if (panelTarget === 'area' && a) return 'area';
    if (m) return 'module';
    return a ? 'area' : 'module';
  }

  function applyPanelLayout(mode) {
    const spec = PANEL_LAYOUT[mode] || PANEL_LAYOUT.module;
    const head = document.querySelector('.panel-header-title');
    if (head) head.textContent = spec.title;
    document.querySelectorAll('#rightPanel .section[data-sec]').forEach((sec) => {
      const k = sec.getAttribute('data-sec');
      const on = spec.secs.indexOf(k) >= 0;
      sec.style.display = on ? '' : 'none';
      const t = sec.querySelector('.sec-title');
      // 제목은 늘 다시 쓴다 — 안 그러면 영역 모드가 바꾼 제목이 모듈 모드에 남는다.
      if (t) t.textContent = (spec.titles && spec.titles[k]) || PANEL_SEC_TITLE[k] || k;
    });
  }

  /**
   * 마감재 치수를 영역에 다시 맞춘다.
   *
   * W12-31: 마감재는 만들 때 영역의 H·D 를 받아 간다 (W12-18 — 냉장고장 영역
   * H2300·D700 이면 EP 도 2300×700). 그런데 그 뒤 **영역 크기를 고치면
   * 마감재는 옛 치수로 남았다** — 2300→2100 으로 줄여도 EP 는 2300 인 채였다.
   * 영역 값이 바뀌는 자리에서 다시 맞춘다. 폭은 마감재 종류가 정하므로 건드리지 않는다.
   */
  function syncFinishingsToAreas() {
    let touched = 0;
    modules.forEach((f) => {
      if (!f.isFinishing) return;
      const area = areaById(f.areaId);
      if (!area) return;
      // W12-42: 높이·바닥은 종류가 정한다 — 만들 때와 같은 함수를 쓴다.
      const span = finishingSpanOf(area, f.section, moduleById(f.hostId));
      if (f.H === span.H && f.D === area.D && f.baseY === span.baseY) return;
      f.H = span.H; f.D = area.D; f.baseY = span.baseY;
      touched++;
    });
    return touched;
  }

  /** 영역 값이 바뀌었을 때. 영역은 도구·목록·정면도·3D 를 모두 건드리므로
   *  모듈용 panelCommit 보다 손이 넓다. */
  function areaPanelCommit(focusSel) {
    syncFinishingsToAreas();
    saveStructModules();
    persistPlannerState();
    renderAreaTools();
    renderModuleList();
    renderFrontView();
    renderRightPanel();
    if (typeof renderAll3D === 'function' && currentView === '3d') { try { renderAll3D({ fit: false }); } catch (_) {} }
    if (focusSel) { const el = document.querySelector(focusSel); if (el && el.focus) el.focus(); }
  }

  const DIM_ROWS = [['W', '폭 W', 6000], ['H', '높이 H', 3000], ['D', '깊이 D', 1200]];
  const dimRowsHTML = (o, maxW) => DIM_ROWS.map(([k, lab, max]) => `
      <div class="row">
        <label>${lab} (mm)</label>
        <input type="number" min="100" max="${k === 'W' && maxW ? maxW : max}" step="10"
               data-dim="${k}" value="${Math.round(Number(o[k]) || 0)}">
      </div>`).join('');

  /** 모듈 크기 + 고정. 팔레트의 '크기'·'고정' 이 있던 자리다. */
  function renderSizePanel(m, s) {
    const host = document.getElementById('sizeBody');
    if (!host) return;
    host.innerHTML = `
      ${dimRowsHTML(m)}
      <label class="chk-row"><input type="checkbox" id="chkFixed" ${m.isFixed ? 'checked' : ''}>
        자동계산 시 이 모듈을 보존</label>
      <div style="font-size:10px;color:#888;line-height:1.4;margin-top:6px">
        폭을 바꾸면 칸 폭 배분은 균등으로 되돌아갑니다.
      </div>`;
    host.querySelectorAll('input[data-dim]').forEach((inp) => {
      inp.onchange = () => {
        const k = inp.getAttribute('data-dim');
        applyModuleDim(m, s, k, inp.value);
        panelCommit(`#sizeBody input[data-dim="${k}"]`);
      };
    });
    const fx = document.getElementById('chkFixed');
    if (fx) fx.onchange = () => {
      m.isFixed = fx.checked;
      saveLayoutFromModules();
      panelCommit('#chkFixed');
    };
  }

  // ── 영역 모드 ────────────────────────────────────────────────
  function renderAreaPanel(a) {
    if (!a) {
      ['sizeBody', 'heightBody', 'finishBody'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="empty-msg">영역 선택</div>';
      });
      return;
    }
    const cfg = SECTION_CONFIG[a.section] || {};
    const size = document.getElementById('sizeBody');
    if (size) {
      size.innerHTML = `
        ${dimRowsHTML(a, 8000)}
        <div style="font-size:10px;color:#888;line-height:1.4;margin-top:6px">
          ${cfg.label || a.section} 배치 공간입니다 — 고치면 배치 단계에도 되쓰입니다.
        </div>`;
      size.querySelectorAll('input[data-dim]').forEach((inp) => {
        inp.onchange = () => {
          const k = inp.getAttribute('data-dim');
          a[k] = Math.max(100, parseInt(inp.value) || 0);
          saveLayoutFromAreas();
          areaPanelCommit(`#sizeBody input[data-dim="${k}"]`);
        };
      });
    }
    renderAreaHeightPanel(a);
    renderAreaFinishPanel(a);
  }

  /**
   * 영역 높이 부위. W12-38 로 항목이 셋이다 — 받침(다리발·좌대) · 상판 · 상몰딩.
   * 영역 값은 그 영역의 **모든 모듈에 함께 적용**한다. 영역에만 적어 두면
   * 값이 소비처(정면도·3D·BOM)에 닿지 않는다 — 이 저장소가 여러 번 밟은 함정이다.
   */
  function areaBaseKindOf(a) {
    const k = a && a.baseKind;
    return (k === 'legH' || k === 'pedestalH') ? k : defaultBaseKind(a && a.section);
  }

  /**
   * 영역 높이 구성. W12-39: **그 섹션이 실제로 가진 부위만** 낸다 — 하부장 영역에
   * 상몰딩 칸이 뜨지 않는다. 모듈 패널은 처음부터 그랬으므로 두 패널이 이제 같다.
   * (W12-18 은 팔레트 시절 "항목 수를 섹션마다 다르게 두지 않는다" 였는데,
   *  없는 부위를 막아 두는 대신 아예 안 내는 편이 읽기 쉽다.)
   */
  const AREA_PART_NOTE = {
    legH: '몸통을 바닥에서 받칩니다.',
    pedestalH: '자동계산이 맨 아래 단에 실어 줍니다.',
    topT: '배치 사각형 폭·깊이를 꽉 채웁니다.',
    moldingH: '자동계산이 맨 위 단에 실어 줍니다.',
  };

  function renderAreaHeightPanel(a) {
    const host = document.getElementById('heightBody');
    if (!host) return;
    const kind = areaBaseKindOf(a);
    const probe = { section: a.section, H: a.H };
    const own = { baseKind: kind, legH: a.legH, pedestalH: a.pedestalH, topT: a.topT, moldingH: a.moldingH };
    const parts = heightPartsOf(probe, own);
    const bodyH = Math.round((Number(a.H) || 0) - parts.reduce((sum, p) => sum + p.value, 0));
    const hasBase = parts.some((p) => p.isBase);
    const baseRow = hasBase ? `
      <div class="row">
        <label>받침</label>
        <select id="selAreaBaseKind">
          ${BASE_KINDS.map(([k, l]) => `<option value="${k}" ${kind === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
      </div>` : '';
    host.innerHTML = baseRow + parts
      .map((p) => {
        const isBase = !!p.isBase;
        return `
        <div class="row">
          <label${isBase ? ' style="padding-left:10px"' : ''}>${isBase ? '└ ' : ''}${p.label} (mm)</label>
          <input type="number" min="0" max="300" step="5" data-apart="${p.key}" value="${p.value}">
        </div>
        <div style="font-size:10px;color:#888;line-height:1.4;margin:-2px 0 8px">${AREA_PART_NOTE[p.key] || ''}</div>`;
      }).join('') + `
      <div class="row" style="opacity:.75;border-top:1px solid var(--line);padding-top:6px">
        <label>몸통 (mm)</label>
        <span style="font-weight:600">${bodyH}</span>
      </div>
      <div class="row" style="opacity:.75">
        <label>배치 공간 높이</label>
        <span style="font-weight:600">${Math.round(Number(a.H) || 0)} mm</span>
      </div>
      <div style="font-size:10px;color:#888;line-height:1.4;margin-top:4px">
        전체 ${Math.round(Number(a.H) || 0)} = ${parts.map((p) => p.label + ' ' + p.value).join(' + ')} + 몸통 ${bodyH}.<br>
        배치 공간이 <b>제한 기준</b>입니다 — 모듈 높이는 여기서 받습니다.
      </div>`;

    const sel = document.getElementById('selAreaBaseKind');
    if (sel) sel.onchange = () => {
      a.baseKind = sel.value;
      applyAreaHeightPart(a, 'baseKind', sel.value);
      saveLayoutFromAreas();
      areaPanelCommit('#selAreaBaseKind');
    };
    host.querySelectorAll('input[data-apart]').forEach((inp) => {
      inp.onchange = () => {
        const k = inp.getAttribute('data-apart');
        const v = parseInt(inp.value);
        const val = Number.isFinite(v) && v >= 0 ? v : undefined;
        a[k] = val;
        applyAreaHeightPart(a, k, val);
        saveLayoutFromAreas();
        areaPanelCommit(`#heightBody input[data-apart="${k}"]`);
      };
    });
  }

  /** 영역 값을 그 영역의 모든 모듈에 함께 적는다 — 값이 소비처에 닿게 한다. */
  function applyAreaHeightPart(a, key, value) {
    let n = 0;
    modules.forEach((m) => {
      if (m.areaId !== a.id || m.isFinishing) return;
      const st = getStructure(m.id);
      if (value === undefined) delete st[key]; else st[key] = value;
      n++;
    });
    return n;
  }

  function renderAreaFinishPanel(a) {
    const host = document.getElementById('finishBody');
    if (!host) return;
    const hosts = modules.filter((m) => m.areaId === a.id && !m.isFinishing);
    host.innerHTML = `
      ${FINISH_SIDES.map((side) => {
        const cur = areaFinishOn(a.id, side);
        return `
        <div class="row">
          <label>${side === 'left' ? '좌' : '우'} 끝</label>
          <select data-fin="${side}">
            <option value="" ${cur ? '' : 'selected'}>없음</option>
            ${FINISHING_SECTIONS.map((k) => `<option value="${k}"
              ${cur && cur.section === k ? 'selected' : ''}>${finishLabel(k)}</option>`).join('')}
          </select>
        </div>`;
      }).join('')}
      <div style="font-size:10px;color:#888;line-height:1.4;padding-top:4px">${hosts.length
        ? `배치 공간 양 끝에 한 장씩 섭니다 — 높이 ${Math.round(a.H)} · 깊이 ${Math.round(a.D)}.
           폭은 끝쪽 모듈이 내놓고 영역 폭은 그대로입니다.`
        : '모듈을 먼저 넣으세요 — 마감재가 폭을 받아올 모듈이 없습니다.'}</div>`;
    host.querySelectorAll('select[data-fin]').forEach((sl) => {
      sl.onchange = () => {
        setAreaFinish(a.id, sl.getAttribute('data-fin'), sl.value);
        saveLayoutFromModules();
        areaPanelCommit();
      };
    });
  }

  function renderRightPanel() {
    const mode = panelModeNow();
    applyPanelLayout(mode);
    if (mode === 'area') { renderAreaPanel(areaById(activeAreaId)); return; }

    const m = modules.find(x => x.id === activeId);
    if (!m) {
      ['sizeBody','heightBody','splitBody','areasBody','shelvesBody','handleBody'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="empty-msg">모듈 선택</div>';
      });
      return;
    }
    const s = getStructure(activeId);
    renderSizePanel(m, s);
    renderHeightPanel(m, s);

    // 분할
    document.getElementById('splitBody').innerHTML = `
      <div class="row">
        <label>좌우 분할</label>
        <input type="number" min="1" max="6" step="1" id="inpVCount" value="${s.verticalCount}">
      </div>
      <div class="row">
        <label>상하 구성</label>
        <select id="selHLayout">
          <option value="doorOnly" ${s.horizontalLayout==='doorOnly'?'selected':''}>도어/서랍만</option>
          <option value="doorTopDrawerBottom" ${s.horizontalLayout==='doorTopDrawerBottom'?'selected':''}>상부 분할 + 하부 영역</option>
        </select>
      </div>
      ${s.horizontalLayout === 'doorTopDrawerBottom' ? `
        <div class="row">
          <label>하부 H (mm)</label>
          <input type="number" min="50" max="${m.H-50}" step="10" id="inpDrawerH" value="${s.drawerHeight}">
        </div>
        <div class="row">
          <label>서랍 단수</label>
          <input type="number" min="1" max="5" step="1" id="inpDrawerCount" value="${Number(s.drawerCount) || 1}">
        </div>
        <div style="font-size:10px;color:#888;line-height:1.4">
          서랍 1단마다 전후판 2장·측판 2장·밑판 1장이 자재로 잡힙니다.
        </div>
      ` : ''}
    `;
    // W12-29: **oninput 이 아니라 onchange** 다. syncCellArrays 는 areaWidths·
    //   areaIs2D 를 비우는데, oninput 이면 "12" 를 치는 중 "1" 에서 한 번 비운다 —
    //   자동계산이 잡아 둔 셀 폭이 타이핑만으로 사라졌다.
    document.getElementById('inpVCount').onchange = (e) => {
      // 팔레트와 같은 동기화를 쓴다 — 예전엔 여기서 areaWidths·areaIs2D 를 놔둬
      // 길이가 어긋난 채 남았다(정면도가 균등분할 fallback 으로 조용히 되돌아간다).
      const v = Math.max(1, Math.min(6, parseInt(e.target.value) || 1));
      e.target.value = v;
      syncCellArrays(s, v);
      panelCommit('#inpVCount');
    };
    document.getElementById('selHLayout').onchange = (e) => {
      s.horizontalLayout = e.target.value;
      panelCommit('#selHLayout');
    };
    const inpDr = document.getElementById('inpDrawerH');
    if (inpDr) inpDr.onchange = (e) => {
      const v = parseInt(e.target.value) || 200;
      s.drawerHeight = Math.max(50, Math.min(m.H - 50, v));
      e.target.value = s.drawerHeight;
      panelCommit('#inpDrawerH');
    };

    // CD-2: 서랍 단수 — 예전엔 지정할 수단이 없어 브리지가 항상 1단으로 넘겼다.
    // 1단마다 전후판 2·측판 2·밑판 1 이 잡히므로 BOM 수량에 직접 영향을 준다.
    const inpDrC = document.getElementById('inpDrawerCount');
    if (inpDrC) inpDrC.onchange = (e) => {
      const v = Math.max(1, Math.min(5, parseInt(e.target.value) || 1));
      s.drawerCount = v;
      e.target.value = v;
      persistPlannerState();
      renderFrontView();
      showToast(`✓ 서랍 ${v}단`);
    };

    // 영역 타입
    let areaHTML = '';
    for (let i = 0; i < s.verticalCount; i++) {
      const t = s.areaTypes[i] || 'door';
      const d = s.areaDirections[i] || 'left';
      // 양문(is2D) cell 은 방향 개념이 없다. autoCalcModule 이 dir='both' 를 넣는데
      // select 에 그 옵션이 없어 "좌 ◀" 가 선택된 것처럼 보였다(값은 'both').
      // 게다가 여기서 좌/우로 바꿔도 정면도는 is2D 로 먼저 분기해 양문을 그리므로
      // 아무 효과가 없었다 — 동작하지 않는 컨트롤 대신 상태를 그대로 적는다.
      const is2DCell = !!(s.areaIs2D && s.areaIs2D[i]);
      areaHTML += `
        <div class="area-row" data-idx="${i}">
          <span class="a-lab">#${i+1}</span>
          <select class="a-type">
            <option value="door"   ${t==='door'?'selected':''}>도어</option>
            <option value="drawer" ${t==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${t==='open'?'selected':''}>오픈</option>
            <option value="blank"  ${t==='blank'?'selected':''}>먹장</option>
          </select>
          ${t!=='door'
            ? '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'
            : is2DCell
              ? '<span style="font-size:9px;color:var(--text-dim);text-align:center">양문 ◀▶</span>'
              : `
          <select class="a-dir">
            <option value="left"  ${d==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${d==='right'?'selected':''}>우 ▶</option>
          </select>`}
        </div>
      `;
    }
    if (s.horizontalLayout === 'doorTopDrawerBottom') {
      areaHTML += `
        <div style="margin-top:8px;padding-top:6px;border-top:2px solid var(--brand-mid);font-size:10px;color:var(--text-dim);font-weight:600">하부 영역</div>
        <div class="area-row">
          <span class="a-lab">하부</span>
          <select class="b-type">
            <option value="door"   ${s.bottomType==='door'?'selected':''}>도어</option>
            <option value="drawer" ${s.bottomType==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${s.bottomType==='open'?'selected':''}>오픈</option>
            <option value="blank"  ${s.bottomType==='blank'?'selected':''}>먹장</option>
          </select>
          ${s.bottomType==='door' ? `
          <select class="b-dir">
            <option value="left"  ${s.bottomDirection==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${s.bottomDirection==='right'?'selected':''}>우 ▶</option>
          </select>` : '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'}
        </div>
      `;
    }
    document.getElementById('areasBody').innerHTML = areaHTML;
    document.querySelectorAll('#areasBody .area-row').forEach(row => {
      const idx = row.dataset.idx;
      const tSel = row.querySelector('.a-type, .b-type');
      const dSel = row.querySelector('.a-dir, .b-dir');
      if (tSel) tSel.onchange = (e) => {
        if (idx !== undefined) s.areaTypes[+idx] = e.target.value;
        else s.bottomType = e.target.value;
        panelCommit();
      };
      if (dSel) dSel.onchange = (e) => {
        if (idx !== undefined) s.areaDirections[+idx] = e.target.value;
        else s.bottomDirection = e.target.value;
        panelCommit();
      };
    });

    // 선반
    let shelfHTML = '';
    s.shelves.forEach((sh, i) => {
      shelfHTML += `
        <div class="shelf-row">
          <input type="number" min="0" max="${m.H}" step="10" data-idx="${i}" value="${sh}">
          <button class="del" data-idx="${i}">×</button>
        </div>
      `;
    });
    if (!s.shelves.length) shelfHTML = '<div style="color:var(--text-faint);font-size:10px;padding:4px 0">선반 없음</div>';
    shelfHTML += '<button class="add-btn" id="addShelf">+ 선반 추가</button>';
    // W12-32: 팔레트의 '선반 갯수' 가 하던 일. 개수를 입력받는 대신 버튼으로 둔다
    //   — 개별 위치를 통째로 날리는 동작이라 그렇게 보여야 한다.
    if (s.shelves.length) {
      shelfHTML += '<button class="add-btn" id="evenShelf">균등 재배치</button>';
    }
    document.getElementById('shelvesBody').innerHTML = shelfHTML;
    // W12-29: oninput 이면 한 글자마다 저장·재렌더가 돌아 포커스가 튄다.
    document.querySelectorAll('#shelvesBody input[type="number"]').forEach(inp => {
      inp.onchange = (e) => {
        const idx = +e.target.dataset.idx;
        const v = parseInt(e.target.value);
        if (!isFinite(v)) return;
        s.shelves[idx] = Math.max(0, Math.min(m.H, v));
        e.target.value = s.shelves[idx];
        panelCommit(`#shelvesBody input[data-idx="${idx}"]`);
      };
    });
    document.querySelectorAll('#shelvesBody button.del').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.idx;
        s.shelves.splice(idx, 1);
        panelCommit();
      };
    });
    document.getElementById('addShelf').onclick = () => {
      // 중앙 높이로 추가
      s.shelves.push(Math.round(m.H / 2));
      panelCommit();
    };
    const even = document.getElementById('evenShelf');
    if (even) even.onclick = () => {
      s.shelves = shelvesForCount(m, s, s.shelves.length);
      panelCommit();
      showToast(`✓ 선반 ${s.shelves.length}개 균등 배치`);
    };

    // 손잡이 — 저장값이 아니라 해석된 값을 보여준다 (미지정이면 단별 기본형)
    const hType = handleTypeOf(m, s);
    document.getElementById('handleBody').innerHTML = `
      <div class="row">
        <label>타입</label>
        <select id="selHType">
          ${[['wood-channel','목찬넬'],['door-drop','도어 내림'],['push','푸쉬'],['alu-channel','알루미늄 찬넬'],['c-channel','C찬넬']]
              .map(([v, l]) => `<option value="${v}" ${hType===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <label>위치</label>
        <select id="selHPos">
          <option value="top"    ${s.handlePosition==='top'?'selected':''}>상</option>
          <option value="middle" ${s.handlePosition==='middle'?'selected':''}>중</option>
          <option value="bottom" ${s.handlePosition==='bottom'?'selected':''}>하</option>
        </select>
      </div>
      <div style="font-size:10px;color:#888;line-height:1.4;padding-top:4px">${handleNoteFor(m, s)}</div>
    `;
    // W12-29: 예전엔 대입만 하고 저장·재렌더가 없었다. 손잡이는
    //   isWoodChannel / doorDropOf / doorTopGapOf 를 통해 **3D·정면도 형상을
    //   실제로 바꾼다** — 목찬넬이면 측판을 따내고 도어를 30 내리고, 도어 내림이면
    //   도어를 15 아래로 뺀다. 바꿔도 화면이 그대로고 새로고침하면 사라졌다.
    document.getElementById('selHType').onchange = (e) => {
      s.handleType = e.target.value;
      panelCommit('#selHType');
    };
    document.getElementById('selHPos').onchange = (e) => {
      s.handlePosition = e.target.value;
      panelCommit('#selHPos');
    };
  }

  // ─────────────────────────────────────────────────────────────
  // 영역 — 배치에서 온 사각형. 모듈을 담는 그릇.
  // ─────────────────────────────────────────────────────────────

  /** 새 모듈 기본값. 상판은 옵션이라 기본이 없다(topT 0) —
   *  그래야 H850 = 다리발 150 + 몸통 700 이 그대로 성립한다.
   *  선반은 지어내지 않고 calcDefaultShelves 가 내는 값을 쓴다(이 크기에선 1개). */
  const NEW_MODULE = { W: 600, H: 850, D: 550, legH: 150, topT: 0 };

  // W12-5: 목찬넬 부재 색 — 몸통은 PB, 목찬넬은 18T MDF 로 BOM 상 EP(마감재)다.
  // 3D 에서 몸통과 구분되도록 마감재와 같은 진한 우드 톤을 쓴다.
  // W12-25: 몸통 판 두께. data-constants.js 의 BODY_THICKNESS_DEFAULT 가 정본이고
  //   현장 기준 15T 90% / 18T 가끔이다. 플래너는 그 파일을 읽지 않아 값을 옮겨 적는다
  //   — 바뀌면 같이 고쳐야 한다. (design_rules '몸통자재' 15/18 도 같은 값)
  const BODY_T = 15;
  // 도어·마감재는 18T MDF 로 몸통과 **무관한 별개 값**이다 (data-constants.js 주석).
  const DOOR_T = 18;

  const CHANNEL_COLOR = '#7a6a45';

  // W12-17: 도어 뒤 그림자판을 얼마나 어둡게 할지. 도어 사이 4mm 는 화면에서
  // 1px 안팎이라 대비가 낮으면 그냥 사라진다.
  const DOOR_REVEAL_DARKEN = 0.9;

  function areaById(id) { return areas.find((a) => a.id === id); }

  // ── 마감재 (EP · 몰딩 · 휠라) ─────────────────────────────────
  const FINISHING_SECTIONS = ['ep', 'molding', 'filler'];
  function isFinishingSection(k) { return FINISHING_SECTIONS.indexOf(k) >= 0; }
  // 도구를 다시 그려도 고른 마감재가 유지되도록 기억한다 — 안 하면 추가할 때마다
  // 기본값으로 되돌아가 같은 것을 두 번 넣기가 번거롭다.
  let lastFinishing = 'ep';

  /**
   * 마감재가 런에서 차지하는 폭.
   *
   * PLANNER_SECTIONS 의 `adjacent` 가 이미 성격을 정해 두었다:
   *   depthAndHeight (EP)   w 는 인접 모듈의 **깊이**, 런에서 차지하는 건 두께 h
   *   heightOnly (몰딩·휠라) w 가 곧 폭, h 는 두께
   * 값을 새로 만들지 않고 그 정의를 그대로 읽는다.
   */
  /**
   * 마감재가 **잡아 두는 폭** (공간 설계값).
   * EP 는 부재가 18T 지만 실제 설치 여유를 위해 20 을 잡는다 (spaceW).
   * 모듈 폭을 줄이거나 영역 잔여를 셀 때는 늘 이 값을 쓴다.
   */
  function finishingWidthOf(section) {
    const cfg = SECTION_CONFIG[section] || {};
    if (cfg.adjacent === 'depthAndHeight') return cfg.spaceW || cfg.h || 20;
    return cfg.w || 60;
  }

  /**
   * 마감재 **부재 자체의 폭** (제작 치수).
   * EP 는 18T 판 한 장이다 — 잡아 둔 20 안에 서고 2mm 가 설치 여유로 남는다.
   * 몰딩·휠라는 폭 60 이 부재이자 공간이라 둘이 같다.
   */
  function finishingPartWidthOf(section) {
    const cfg = SECTION_CONFIG[section] || {};
    if (cfg.adjacent === 'depthAndHeight') return cfg.h || 18;
    return cfg.w || 60;
  }


  /** 선택지 표기 — 잡는 폭과 부재가 다르면 둘 다 보여 준다 (EP 20mm · 부재 18T). */
  function finishLabel(k) {
    const label = (SECTION_CONFIG[k] || {}).label || k;
    const space = finishingWidthOf(k);
    const part = finishingPartWidthOf(k);
    return space === part ? `${label} ${space}mm` : `${label} ${space}mm · 부재 ${part}T`;
  }

  /**
   * 영역에 마감재를 넣는다. **영역 밖으로 못 나간다** —
   * 남은 폭보다 두꺼우면 만들지 않는다(폭을 깎아 넣지도 않는다).
   */
  function addFinishingToArea(areaId, section) {
    const area = areaById(areaId);
    if (!area || !isFinishingSection(section)) return null;
    if (area.isFinishing) { showToast('⚠ 마감재 영역에는 넣을 수 없습니다'); return null; }
    const W = finishingWidthOf(section);
    const used = usedWidthOf(areaId);
    const room = area.W - used;
    if (W > room) {
      showToast(`⚠ 남은 폭 ${Math.max(0, Math.round(room))}mm — ${(SECTION_CONFIG[section] || {}).label} ${W}mm 가 들어가지 않습니다`);
      return null;
    }
    const id = nextModuleId(section);
    const m = {
      id, areaId, section,
      W, D: area.D,
      // W12-42: 높이·바닥은 종류가 정한다 (몰딩은 상판 아래, 휠라는 인접 도어).
      ...finishingSpanOf(area, section, modules.find((x) => x.areaId === areaId && !x.isFinishing)),
      x: (area.x || 0) + used, y: area.y || 0, rotation: area.rotation || 0,
      isFinishing: true, finishings: [],
    };
    modules.push(m);
    saveStructModules();
    persistPlannerState();
    return m;
  }



  /**
   * W12-20: **영역 끝** 마감재. 배치 패널에서 쓴다.
   *
   * 모듈마다 붙이는 것이 아니라 배치 공간의 좌·우 끝에 한 장씩만 세운다.
   * 모듈마다 붙이면 나란한 모듈 사이에 마감재 두 장이 맞닿아 실제 제작과 다르다.
   * 폭은 그 끝의 **바깥쪽 모듈**이 내놓는다 — 영역 안 총 폭은 그대로다.
   */
  function areaEdgeHost(areaId, side) {
    const hosts = modules
      .filter((m) => m.areaId === areaId && !m.isFinishing)
      .sort((a, b) => (a.x || 0) - (b.x || 0));
    if (!hosts.length) return null;
    return side === 'left' ? hosts[0] : hosts[hosts.length - 1];
  }



  /**
   * W12-24: 마감재가 설 바닥 높이. **영역과 같아야 한다.**
   *
   * 상부장은 천장 매달림이라 `getBaseY('upper', H) = ceiling - H` 다. 그런데
   * 마감재의 section 은 'ep'·'molding'·'filler' 라 같은 함수가 바닥(0)을 준다.
   * 그래서 상부장 영역에 마감재를 붙이면 영역보다 1520mm 아래에 서서
   * "마감재가 안 생긴다" 로 보였다 — 실제로는 엉뚱한 데 있었다.
   */
  /**
   * 인접 도어의 세로 범위 (모듈 로컬 y). 휠라가 이걸 그대로 쓴다.
   * 도어는 몸통 바닥에서 시작해 몸통 상단에서 끝나되,
   * 목찬넬이면 위로 30 물러나고(doorTopGap) 도어 내림이면 아래로 15 나온다(doorDrop).
   */
  function doorSpanOf(m, s) {
    const legH = baseOffsetOf(m, s);
    const bottom = Math.max(0, legH - doorDropOf(m, s));
    const top = legH + bodyHeightOf(m, s) - doorTopGapOf(m, s);
    return { bottom, H: Math.max(0, top - bottom) };
  }

  /**
   * W12-42: 마감재의 세로 범위. **종류마다 기준이 다르다.**
   *
   *   EP    **상판 아래에서 멈춘다** — 상판이 그 위를 덮고 지나간다
   *   몰딩  같다
   *   휠라  **인접한 도어와 같다** — 도어 옆에 서는 것이라 그 선을 따라간다
   *
   * 상판이 없는 섹션(상부장·키큰장·냉장고장)은 뺄 것이 없어 배치 공간 전체가 된다
   * — 냉장고장 2300 이면 EP 도 2300 이다 (§9.2).
   *
   * 스택 영역(키큰장·냉장고장)의 휠라는 단이 셋이라 "인접 도어" 가 하나로
   * 정해지지 않는다 — 배치 공간 전체를 쓴다.
   */
  function finishingSpanOf(area, section, host) {
    const areaH = (area && Number(area.H)) || (host && Number(host.H)) || 0;
    const baseY = area ? finishBaseYFor(area) : baseYOf(host);
    if ((section === 'molding' || section === 'ep') && area) {
      const topT = heightPartOf({ section: area.section, H: areaH }, { topT: area.topT }, 'topT');
      return { H: Math.max(0, areaH - topT), baseY };
    }
    if (section === 'filler' && host) {
      const sp = doorSpanOf(host, getStructure(host.id));
      if (sp.H > 0) return { H: sp.H, baseY: baseYOf(host) + sp.bottom };
    }
    return { H: areaH, baseY };
  }

  function finishBaseYFor(area) {
    if (!area) return 0;
    return getBaseY(area.section, area.H);
  }

  /**
   * W12-22: 스택 영역(키큰장·냉장고장)인가.
   * 자동계산이 세로로 쌓는 영역이면 단들이 **같은 x·같은 W** 를 쓴다.
   */
  function isStackedArea(area) {
    return !!area && stackForArea(area) !== null;
  }

  /** 영역에 붙은 스택 마감재 (모듈이 아니라 영역에 매인다) */
  function stackFinishOn(areaId, side) {
    return modules.find((f) => f.isFinishing && f.hostAreaId === areaId && f.hostSide === side) || null;
  }

  /**
   * W12-22: 스택 영역의 마감재.
   *
   * 스택은 3단이 모두 영역 폭을 그대로 쓴다. 한 단만 줄이면 나머지 단이
   * 마감재를 뚫고 나온다 — 실제로 하부장만 880 이 되고 중간장·상부장은 900 이었다.
   * **모든 단이 함께** 폭을 내놓아야 한다.
   */
  function setStackAreaFinish(area, side, section) {
    const parts = () => modules.filter((m) => m.areaId === area.id && !m.isFinishing);
    // 기존 것을 떼고 모든 단에 폭을 돌려준다
    const prev = stackFinishOn(area.id, side);
    if (prev) {
      parts().forEach((m) => { m.W += prev.W; if (side === 'left') m.x -= prev.W; });
      delete structures[prev.id];
      modules.splice(modules.indexOf(prev), 1);
    }
    if (!section || !isFinishingSection(section)) {
      saveStructModules(); persistPlannerState();
      return null;
    }
    const ps = parts();
    if (!ps.length) { showToast('⚠ 이 영역에 모듈이 없습니다'); return null; }
    const W = finishingWidthOf(section);
    const MIN_W = MASTER_RULES.DOOR_W_MIN;
    const tooNarrow = ps.find((m) => m.W - W < MIN_W);
    if (tooNarrow) {
      showToast(`⚠ ${(SECTION_CONFIG[section] || {}).label} ${W}mm 를 빼면 단 폭이 도어 최소 ${MIN_W}mm 보다 좁아집니다`);
      return null;
    }
    const x = side === 'left' ? ps[0].x : ps[0].x + ps[0].W - W;
    // W12-44: 셀 폭도 같이 줄인다 — 안 줄이면 도어가 옛 폭으로 그려져 넘친다.
    ps.forEach((m) => { const oldW = m.W; m.W -= W; if (side === 'left') m.x += W;
      rescaleCellWidths(getStructure(m.id), oldW, m.W); });
    const f = {
      id: nextModuleId(section), areaId: area.id, section,
      W, D: area.D,
      // W12-42: 스택은 단이 셋이라 "인접 도어" 가 하나로 정해지지 않는다 — 전체 높이.
      ...finishingSpanOf(area, section, null),
      x, y: area.y || 0, rotation: area.rotation || 0,
      isFinishing: true, finishings: [],
      hostAreaId: area.id, hostSide: side,
    };
    modules.push(f);
    saveStructModules();
    persistPlannerState();
    return f;
  }

  // W12-35: 좌우 EP 가 기본인 섹션.
  //   냉장고장은 냉장고와 벽 사이에 세우는 장이라 **옆면이 늘 드러난다** —
  //   마감이 없으면 몸통 PB 가 그대로 보인다. 나란한 장에 가려지는 다른 섹션과 다르다.
  const DEFAULT_EP_SECTIONS = ['fridge'];

  /**
   * 그 영역의 기본 마감을 세운다. **이미 그 쪽에 마감재가 있으면 두지 않는다** —
   * 사람이 없앤 것을 되살리지 않는다.
   *
   * 모듈이 하나도 없으면 아무것도 안 한다. 마감재는 폭을 내놓을 모듈이 있어야
   * 설 수 있다 (W12-20). 그래서 **영역을 채운 뒤**에 부른다.
   */
  function applyDefaultAreaFinish(areaId) {
    const area = areaById(areaId);
    if (!area || DEFAULT_EP_SECTIONS.indexOf(area.section) < 0) return 0;
    if (!modules.some((m) => m.areaId === areaId && !m.isFinishing)) return 0;
    let n = 0;
    FINISH_SIDES.forEach((side) => {
      if (areaFinishOn(areaId, side)) return;
      if (setAreaFinish(areaId, side, 'ep')) n++;
    });
    return n;
  }

  /** 영역 끝에 지금 붙어 있는 마감재 (없으면 null) */
  function areaFinishOn(areaId, side) {
    const stack = stackFinishOn(areaId, side);
    if (stack) return stack;
    const host = areaEdgeHost(areaId, side);
    return host ? moduleFinishOn(host.id, side) : null;
  }

  /**
   * 마감재를 뺀 자리에 모듈을 **균등 분배**한다 (W12-45).
   *
   * 마감재를 붙이면 그 폭만큼 자리가 준다. 예전엔 **끝 모듈 하나만** 줄어
   * (960/960/480 → 940/960/460) 칸이 들쭉날쭉했다. 자리가 바뀌면 남은 공간을
   * 다시 고르게 나눈다.
   *
   * 고정 모듈(`isFixed`)은 폭을 지키고 그 나머지만 나눈다 — 사람이 정한 치수를
   * 자동 동작이 덮으면 안 된다. 한 칸이라도 도어 최소폭보다 좁아지면 아무것도
   * 하지 않는다(전부 되돌린다) — 반쯤 좁혀 놓는 것이 더 나쁘다.
   *
   * 셀 폭도 같이 데려간다 (§9.15) — 안 그러면 도어가 옛 폭으로 그려져 넘친다.
   */
  function redistributeAreaWidths(areaId) {
    const area = areaById(areaId);
    if (!area || isStackedArea(area)) return 0;      // 스택은 단이 겹쳐 서므로 나눌 것이 없다
    const mods = modules
      .filter((m) => m.areaId === areaId && !m.isFinishing)
      .sort((a, b) => (a.x || 0) - (b.x || 0));
    if (!mods.length) return 0;

    const fins = modules.filter((m) => m.areaId === areaId && m.isFinishing);
    const leftW = fins.filter((f) => f.hostSide === 'left').reduce((sum, f) => sum + (f.W || 0), 0);
    const rightW = fins.filter((f) => f.hostSide === 'right').reduce((sum, f) => sum + (f.W || 0), 0);
    const x0 = (area.x || 0) + leftW;
    const span = (area.W || 0) - leftW - rightW;

    const free = mods.filter((m) => !m.isFixed);
    if (!free.length) return 0;
    const fixedW = mods.filter((m) => m.isFixed).reduce((sum, m) => sum + (m.W || 0), 0);
    const room = span - fixedW;
    const each = Math.floor(room / free.length);
    if (each < MASTER_RULES.DOOR_W_MIN) {
      showToast(`⚠ 남은 폭 ${Math.max(0, Math.round(room))}mm — ${free.length}칸으로 나누면 도어 최소 ${MASTER_RULES.DOOR_W_MIN}mm 보다 좁아집니다`);
      return 0;
    }
    // 나머지는 마지막 비고정 칸이 흡수한다 — 합이 자리와 어긋나면 틈이 생긴다.
    const last = free[free.length - 1];
    let n = 0, cursor = x0;
    mods.forEach((m) => {
      const w = m.isFixed ? m.W : (each + (m === last ? room - each * free.length : 0));
      if (m.x !== cursor || m.W !== w) n++;
      const oldW = m.W;
      m.x = cursor;
      m.W = w;
      if (oldW !== w) rescaleCellWidths(getStructure(m.id), oldW, w);
      cursor += w;
    });
    return n;
  }

  /** 영역 끝 마감재를 정한다. `section` 이 비면 뗀다. */
  function setAreaFinish(areaId, side, section) {
    const area = areaById(areaId);
    // W12-22: 스택 영역은 단들이 같은 자리에 쌓여 있어 좌우 끝을 x 로 못 고른다.
    if (isStackedArea(area)) return setStackAreaFinish(area, side, section);
    const host = areaEdgeHost(areaId, side);
    if (!host) { showToast('⚠ 이 영역에 모듈이 없습니다'); return null; }
    const f = setModuleFinish(host.id, side, section, { evenAfter: true });
    // W12-45: 자리가 바뀌었으니 남은 공간을 다시 고르게 나눈다.
    if (redistributeAreaWidths(areaId)) { saveStructModules(); persistPlannerState(); }
    return f;
  }

  // W12-21: applyFinishToArea 를 없앴다. 모듈 팔레트의 일괄 버튼이 유일한
  //   호출부였고, 마감재는 이제 배치 공간 양 끝에 한 장씩 선다 (setAreaFinish).

  /**
   * 지금 **영역 보기**인가.
   *   영역 보기 — 배치 좌표 그대로. 영역 + 그 안의 모듈 전부
   *   모듈 상세 — 모듈 하나를 원점에 확대
   * 2D 와 3D 가 같은 답을 써야 한다. 한쪽만 영역 보기면 다른 쪽이 모듈 하나만
   * 남기고 나머지를 지운다 (도어 on/off 로 플래너가 초기화되던 원인).
   */
  function isAreaView() { return !modules.length || !!activeAreaId; }

  /** 영역 안에서 이미 모듈이 차지한 폭 */
  function usedWidthOf(areaId) {
    return modules.filter((m) => m.areaId === areaId).reduce((sum, m) => sum + (m.W || 0), 0);
  }

  // ── 모듈 마감재 (W12-11) ──────────────────────────────────────
  // 모듈 좌/우에 EP·몰딩·휠라를 붙인다. **영역 폭은 그대로 두고 모듈이 줄어든다** —
  // 마감재가 차지한 만큼 모듈에서 빼야 영역을 넘지 않는다. 영역 폭을 늘리면
  // 옆 모듈이 밀려나고, 안 줄이면 마지막 모듈이 영역 밖으로 나간다.
  const FINISH_SIDES = ['left', 'right'];

  function moduleById(id) { return modules.find((m) => m.id === id) || null; }

  /** 모듈의 한쪽에 붙어 있는 마감재 모듈 (없으면 null) */
  function moduleFinishOn(hostId, side) {
    return modules.find((f) => f.isFinishing && f.hostId === hostId && f.hostSide === side) || null;
  }

  /**
   * 모듈 폭이 바뀌면 저장된 셀 폭도 같은 비율로 줄인다.
   *
   * W12-44: 마감재를 붙이면 모듈 폭은 주는데 `areaWidths` 는 그대로 남았다 —
   * 도어가 옛 폭으로 그려져 옆 모듈·마감재를 파고들었다 (실측 16mm).
   * 손으로 폭을 고치는 길(applyModuleDim)은 배열을 **비워** 균등분할로 되돌리지만,
   * 마감재는 갯수·양문 배치를 바꾸는 것이 아니라 폭만 깎는 것이라 **비율로 줄인다**.
   * 반올림 오차는 마지막 칸이 흡수한다 — 합이 폭과 어긋나면 또 넘친다.
   */
  function rescaleCellWidths(s, oldW, newW) {
    if (!s || !Array.isArray(s.areaWidths) || !s.areaWidths.length) return;
    if (!(oldW > 0) || !(newW > 0)) { s.areaWidths = []; return; }
    const k = newW / oldW;
    const out = s.areaWidths.map((w) => Math.round((Number(w) || 0) * k));
    out[out.length - 1] += newW - out.reduce((a, b) => a + b, 0);
    s.areaWidths = out;
  }

  /** 마감재를 떼고 가져갔던 폭을 모듈에 돌려준다. */
  function removeModuleFinish(hostId, side) {
    const f = moduleFinishOn(hostId, side);
    if (!f) return false;
    const m = moduleById(hostId);
    if (m) {
      const oldW = m.W;
      m.W += f.W;
      if (side === 'left') m.x -= f.W;   // 왼쪽 마감재 자리를 모듈이 되찾는다
      rescaleCellWidths(getStructure(m.id), oldW, m.W);   // W12-44
    }
    delete structures[f.id];
    modules.splice(modules.indexOf(f), 1);
    return true;
  }

  /**
   * 모듈 한쪽의 마감재를 정한다. `section` 이 비면 떼기만 한다.
   * 같은 쪽에 이미 있으면 먼저 떼고(폭 복원) 새로 붙인다 — 안 그러면 뗄 때마다
   * 폭이 어긋나 모듈이 조금씩 좁아진다.
   */
  /**
   * 마감재 폭 `W` 를 뺀 뒤 균등 분배하면 한 칸이 얼마가 되나 (W12-45).
   * 폭 판정을 호스트 하나로 하면 세 칸으로 나누면 들어갈 것을 못 붙인다.
   */
  function evenWidthAfterFinish(m, W) {
    const area = areaOfModule(m);
    if (!area || isStackedArea(area)) return m.W - W;
    const mods = modules.filter((x) => x.areaId === area.id && !x.isFinishing);
    const free = mods.filter((x) => !x.isFixed);
    if (!free.length) return m.W - W;
    const finW = modules.filter((x) => x.areaId === area.id && x.isFinishing)
      .reduce((sum, f) => sum + (f.W || 0), 0) + W;
    const fixedW = mods.filter((x) => x.isFixed).reduce((sum, x) => sum + (x.W || 0), 0);
    return Math.floor(((area.W || 0) - finW - fixedW) / free.length);
  }

  function setModuleFinish(hostId, side, section, opts) {
    const m = moduleById(hostId);
    if (!m || m.isFinishing) return null;
    if (FINISH_SIDES.indexOf(side) < 0) return null;
    removeModuleFinish(hostId, side);
    if (!section || !isFinishingSection(section)) {
      saveStructModules(); persistPlannerState();
      return null;
    }
    const W = finishingWidthOf(section);
    const MIN_W = MASTER_RULES.DOOR_W_MIN;
    // W12-45: 영역 경로는 붙인 뒤 균등 분배가 이어진다 — 판정도 **나눈 뒤 값**으로.
    const after = (opts && opts.evenAfter) ? evenWidthAfterFinish(m, W) : m.W - W;
    if (after < MIN_W) {
      showToast(`⚠ ${(SECTION_CONFIG[section] || {}).label} ${W}mm 를 빼면 칸이 ${Math.max(0, Math.round(after))}mm — 도어 최소 ${MIN_W}mm 보다 좁아집니다`);
      saveStructModules(); persistPlannerState();
      return null;
    }
    const id = nextModuleId(section);
    // 왼쪽이면 모듈이 오른쪽으로 물러나고 그 자리를, 오른쪽이면 줄어든 끝을 쓴다.
    const x = side === 'left' ? m.x : m.x + (m.W - W);
    const oldW = m.W;
    m.W -= W;
    if (side === 'left') m.x += W;
    rescaleCellWidths(getStructure(m.id), oldW, m.W);   // W12-44
    // W12-18: 마감재는 **배치 공간(영역)** 을 기준으로 선다 — 모듈이 아니다.
    //   냉장고장 영역 H2300 · D700 이면 EP 는 2300 × 700 × 18T 여야 한다.
    //   호스트 모듈 치수를 쓰면 스택의 한 단(예: 상부장 400)만큼만 서서 반토막이 난다.
    const area = areaById(m.areaId);
    const f = {
      id, areaId: m.areaId, section,
      W,
      // W12-42: 높이·바닥은 종류가 정한다. host 가 인접 모듈이다.
      ...finishingSpanOf(area, section, m),
      D: (area && area.D) || m.D,
      // W12-33: 마감재는 배치 공간 깊이 그대로라 **영역 앞뒤에 꽉 찬다**.
      //   host 모듈은 앞선에 맞춰 뒤가 비어 있으므로 m.y 를 따라가면 안 된다.
      x, y: (area && area.y) || m.y, rotation: m.rotation || 0,
      isFinishing: true, finishings: [],
      hostId: m.id, hostSide: side,
    };
    // 모듈 목록에서 host 바로 앞/뒤에 넣어야 좌→우 순서가 화면과 맞는다.
    const at = modules.indexOf(m);
    modules.splice(side === 'left' ? at : at + 1, 0, f);
    saveStructModules();
    persistPlannerState();
    return f;
  }

  function nextModuleId(section) {
    let n = 0;
    while (modules.some((m) => m.id === section + '-' + n)) n++;
    return section + '-' + n;
  }

  /** 영역에 기본 모듈 하나를 붙인다. 남는 폭이 모자라면 만들지 않는다. */
  /**
   * Q5 — 한 영역에 넣을 수 있는 섹션.
   *
   * 기준을 새로 만들지 않는다. `getBaseY` 가 이미 두 무리를 가른다:
   *   바닥 기준   lower · tall · fridge · sink · dishwasher · refrigerator
   *   천장 매달림 upper · hood
   * 무리가 다르면 Y 가 어긋나 모듈이 영역 밖에 뜬다. 그래서 같은 무리만 허용한다.
   * (하부장 라인 가운데 개수대·식기세척기가 끼는 실제 구성이 이걸로 열린다)
   */
  function sectionsFor(area) {
    if (!area) return [];
    // 마감재는 모듈이 아니라 모듈에 붙는 부속이다 — loadAreas 가 영역에서
    // 빼는 것과 같은 규칙을 쓴다.
    const FINISHING = ['ep', 'molding', 'filler'];
    // 붙박이장은 배치 폭(w) 정본이 아직 없다 (planner-sections.js 주석, 확장은 P11).
    // 값을 지어내지 않기 위해 목록에서 뺀다.
    const NOT_PLACEABLE = ['wardrobe'];
    const hung = getBaseY(area.section, 100) !== 0;
    return Object.keys(SECTION_CONFIG)
      .filter((k) => FINISHING.indexOf(k) < 0 && NOT_PLACEABLE.indexOf(k) < 0)
      .filter((k) => (getBaseY(k, 100) !== 0) === hung)
      .sort((a, b) => (a === area.section ? -1 : b === area.section ? 1 : 0));
  }

  /**
   * Q4 — 남은 폭이 기본 폭보다 좁을 때.
   *
   * 무조건 막으면 영역 끝의 자투리를 채울 방법이 없다. 그렇다고 아무 폭이나
   * 만들면 도어를 못 넣는 조각이 남는다. 경계는 `MASTER_RULES.DOOR_W_MIN`(350) 이다 —
   * 기존 규칙이 이미 "350 미만 세그먼트는 도어 대신 먹장"(BLANK_THRESHOLD)이라고
   * 말하고 있으므로, 그보다 좁은 모듈은 만들지 않는다. 지어낸 값이 아니다.
   */
  function addModuleToArea(areaId, opts) {
    const area = areaById(areaId);
    if (!area) return null;
    const section = (opts && opts.section) || area.section;
    if (sectionsFor(area).indexOf(section) < 0) {
      showToast(`⚠ ${(SECTION_CONFIG[section] || {}).label || section} 은 이 영역에 넣을 수 없습니다`);
      return null;
    }
    const cfg = SECTION_CONFIG[section] || {};
    // 하부장은 요청 스펙(600·850·550), 나머지는 그 섹션의 배치 기본값을 쓴다.
    const base = section === 'lower'
      ? { W: NEW_MODULE.W, H: NEW_MODULE.H, D: NEW_MODULE.D }
      : { W: cfg.w || NEW_MODULE.W, H: cfg.moduleH || NEW_MODULE.H, D: cfg.h || NEW_MODULE.D };
    // W12-39: **배치 공간이 제한 기준이다** — 높이는 영역에서 받는다.
    //   예전엔 섹션 기본값(하부장 850)을 써서, 영역이 870 이어도 모듈은 850 이었다.
    //   높이 모델은 그 안에서 나뉜다: 870 = 다리발 150 + 상판 12 + 몸통 708.
    //   섹션이 영역과 다르면 그 섹션 기본 높이를 쓰되 영역을 넘지 않는다.
    if (area.H) {
      base.H = section === area.section ? area.H : Math.min(base.H, area.H);
    }
    // W12-25: 배치 공간 깊이 = **몸통 + 도어**. 몸통을 영역 깊이 그대로 잡으면
    //   도어가 영역 밖으로 나가거나(W12-24 전) 몸통 속으로 파고든다(W12-24 후).
    //   도어 두께만큼 얕게 잡아야 둘 다 안 생긴다.
    const roomD = (area.D || 0) - DOOR_T;
    if (roomD > 0) base.D = Math.min(base.D, roomD);

    const used = usedWidthOf(areaId);
    const room = area.W - used;
    const MIN_W = MASTER_RULES.DOOR_W_MIN;
    // opts.W / opts.x 는 자동계산이 폭과 자리를 직접 정할 때 쓴다.
    // 손으로 넣을 때(opts 없음)는 기본 폭을 쓰되 남은 폭에 맞춘다.
    const fixedW = opts && Number.isFinite(opts.W) ? opts.W : null;
    if (!fixedW && room < MIN_W) {
      showToast(`⚠ 남은 폭 ${Math.max(0, Math.round(room))}mm — 도어 최소 ${MIN_W}mm 보다 좁아 넣을 수 없습니다`);
      return null;
    }
    const W = fixedW != null ? fixedW : Math.min(base.W, room);
    if (!fixedW && W < base.W) showToast(`남은 폭에 맞춰 ${Math.round(W)}mm 로 넣었습니다`);

    const id = nextModuleId(section);
    const m = {
      id, areaId, section,
      W, H: base.H, D: base.D,
      x: (opts && Number.isFinite(opts.x)) ? opts.x : (area.x || 0) + used,
      y: area.y || 0, rotation: area.rotation || 0,
      finishings: [],
    };
    modules.push(m);
    seatModuleDepth(m);   // W12-33: 배치 공간 앞선에 붙인다

    const s = getStructure(id);
    // W12-39: 상판은 높이 모델의 한 부위다 — heightPartsOf 의 기본값(12)을 쓴다.
    //   예전엔 0 으로 눌러 놔서 870 영역에 넣어도 상판이 없었다.
    delete s.topT;
    s.verticalCount = 1;
    s.areaTypes = ['door'];
    s.areaDirections = ['left'];
    s.areaWidths = [];
    s.areaIs2D = [];
    s.horizontalLayout = 'doorOnly';
    s.handleType = 'auto';   // W12-6: 단별 기본형은 defaultHandleType 이 정한다
    // 손잡이 위치와 선반은 **모듈의 섹션**을 따른다 (영역이 아니라).
    // autoCalcModule 이 쓰는 규칙과 같다.
    s.handlePosition = section === 'upper' ? 'bottom' : section === 'lower' ? 'top' : 'middle';
    s.legH = section === 'lower' ? NEW_MODULE.legH : 0;
    s.shelves = calcDefaultShelves(section, bodyHeightOf(m, s));

    saveStructModules();
    persistPlannerState();
    return m;
  }

  /**
   * 영역 자동계산 — 배치 사각형 폭을 자동계산 규칙으로 나눠 모듈을 채운다.
   *
   * 규칙은 새로 만들지 않는다. `distributeModules` 가 이미 도어 폭 350~600,
   * 목표 450, 잔여 ≤10 을 지키며 양문 페어링까지 해준다. 영역 1800 이면
   * 900(양문) 두 개, 1200 이면 800(양문)+400 이 나온다.
   * (규칙 정본은 docs/01-plan/autocalc-rules.md §2)
   *
   * 고정된 모듈은 건드리지 않는다 — autoCalcForSet 이 isFixed 를 보존하는 것과
   * 같은 규칙이다. 고정 모듈이 쓰는 폭을 뺀 나머지만 다시 배치한다.
   */
  /**
   * 키큰장·냉장고장은 가로로 나누는 게 아니라 **세로로 쌓는다.**
   * 높이 계산은 `js/detaildesign/ui-fridge-el.js` 가 정본이고 그대로 따른다:
   *
   *   상부장  = min(FRIDGE_UPPER_H_MAX, 전체 − 냉장고 − 상단간격 − 상몰딩)
   *   몸통    = 전체 − 상몰딩 − 상부장 − 좌대
   *   중간장  = floor(몸통 × 0.55)      하부장 = 몸통 − 중간장
   *
   * 냉장고장은 냉장고가 들어갈 자리를 비우므로 **상부장 하나만** 만든다.
   * 섹션은 영역 그대로 둔다 — 브리지가 section 으로 BOM 을 잡기 때문에
   * 표시용으로만 part 를 붙인다.
   */
  function stackForArea(area) {
    const probe = { section: area.section, H: area.H };
    // W12-16: 영역이 직접 정한 좌대·상몰딩이 있으면 그것을 쓴다 (없으면 마스터 기본값).
    const own = { pedestalH: area.pedestalH, moldingH: area.moldingH };
    const molding = heightPartOf(probe, own, 'moldingH');
    const pedestal = heightPartOf(probe, own, 'pedestalH');

    if (area.section === 'fridge') {
      const fridgeH = (SECTION_CONFIG.refrigerator || {}).moduleH || 1850;
      const upperH = Math.max(0, Math.min(
        MASTER_RULES.FRIDGE_UPPER_H_MAX,
        area.H - fridgeH - MASTER_RULES.FRIDGE_TOP_GAP - molding
      ));
      if (upperH <= 0) return [];
      // 냉장고 자리(바닥~fridgeH)와 상단 간격은 비워 둔다.
      // 상몰딩은 맨 위 단이 짊어진다 — 그래야 몰딩 mesh 가 그려진다.
      return [{ part: '상부장', H: upperH + molding, baseY: fridgeH + MASTER_RULES.FRIDGE_TOP_GAP,
                pedestalH: 0, moldingH: molding }];
    }

    if (area.section === 'tall') {
      const upperH = MASTER_RULES.FRIDGE_UPPER_H_MAX;
      const body = area.H - molding - upperH - pedestal;
      if (body <= 0) return [];
      const middleH = Math.floor(body * MASTER_RULES.MIDDLE_BODY_RATIO);
      const lowerH = body - middleH;
      // 좌대와 상몰딩은 **장 전체**의 것이다. 단마다 또 빼면 단 사이에
      // 그만큼 빈 틈이 생겨 서로 떠 보인다 (실제로 120mm 씩 벌어져 있었다).
      // 맨 아래 단이 좌대를, 맨 위 단이 상몰딩을 짊어지고 나머지는 0 이다.
      return [
        { part: '하부장', H: pedestal + lowerH, baseY: 0,
          pedestalH: pedestal, moldingH: 0 },
        { part: '중간장', H: middleH,           baseY: pedestal + lowerH,
          pedestalH: 0, moldingH: 0 },
        { part: '상부장', H: upperH + molding,  baseY: pedestal + lowerH + middleH,
          pedestalH: 0, moldingH: molding },
      ];
    }
    return null;   // 가로 분할로 간다
  }

  /** 세로 스택 영역(키큰장·냉장고장)을 채운다 */
  function autoCalcStack(area, stack) {
    for (let i = modules.length - 1; i >= 0; i--) {
      const m = modules[i];
      if (m.areaId === area.id && !m.isFixed && !isFinishingSection(m.section)) { delete structures[m.id]; modules.splice(i, 1); }
    }
    orphanHostFinishings(area.id);
    // W12-22: 이미 놓인 마감재가 차지한 폭을 빼고 그 옆에서 시작한다.
    //   빼지 않으면 새 단이 영역 폭 그대로 만들어져 마감재를 뚫고 나온다.
    const fins = modules.filter((m) => m.areaId === area.id && m.isFinishing);
    const finW = fins.reduce((sum, f) => sum + (f.W || 0), 0);
    const leftW = fins.filter((f) => f.hostSide === 'left').reduce((sum, f) => sum + (f.W || 0), 0);
    let made = 0;
    stack.forEach((part) => {
      const m = addModuleToArea(area.id, {
        section: area.section, W: area.W - finW, x: (area.x || 0) + leftW,
      });
      if (!m) return;
      m.H = part.H;
      m.baseY = part.baseY;
      m.part = part.part;
      const s = getStructure(m.id);
      s.legH = 0;                       // 스택 안에서는 다리발이 아니라 좌대가 받친다
      // 좌대·상몰딩을 단마다 빼지 않게 명시한다. 안 하면 heightPartsOf 의
      // 기본값(각 60)이 단마다 적용돼 단 사이가 벌어진다.
      s.pedestalH = part.pedestalH;
      s.moldingH = part.moldingH;
      s.shelves = calcDefaultShelves(area.section, bodyHeightOf(m, s));
      made++;
    });
    applyDefaultAreaFinish(area.id);   // W12-35 — 스택은 단들이 함께 폭을 내놓는다
    saveStructModules();
    persistPlannerState();
    return made;
  }

  /**
   * W12-11: 주인이 사라진 모듈 마감재를 **영역 마감재로 승격**한다.
   * 자동계산은 마감재를 보존하지만 호스트 모듈은 지운다. 연결만 끊어 두면
   * `moduleFinishOn` 이 못 찾는 유령이 되고, 지우면 사람이 놓은 것을 없애게 된다.
   */
  function orphanHostFinishings(areaId) {
    modules.forEach((f) => {
      if (!f.isFinishing || f.areaId !== areaId || !f.hostId) return;
      if (modules.some((m) => m.id === f.hostId)) return;
      delete f.hostId;
      delete f.hostSide;
    });
  }

  function autoCalcArea(areaId) {
    const area = areaById(areaId);
    if (!area) return 0;
    const stack = stackForArea(area);
    if (stack) {
      if (!stack.length) { showToast('⚠ 높이가 모자라 자동계산할 수 없습니다'); return 0; }
      return autoCalcStack(area, stack);
    }
    // 마감재는 자동계산이 만들어 내는 것이 아니라 사람이 놓은 것이다.
    // 고정 모듈과 같이 보존하고, 그 폭을 뺀 나머지만 다시 채운다.
    const kept = modules.filter((m) => m.areaId === areaId
      && (m.isFixed || isFinishingSection(m.section)));
    const room = area.W - kept.reduce((sum, m) => sum + (m.W || 0), 0);
    if (room < MASTER_RULES.DOOR_W_MIN) {
      showToast(`⚠ 남은 폭 ${Math.max(0, Math.round(room))}mm — 자동계산할 자리가 없습니다`);
      return 0;
    }
    const dist = distributeModules(room);
    if (!dist.modules.length) { showToast('⚠ 자동계산이 배치를 찾지 못했습니다'); return 0; }

    // 잔여는 셀에 고루 나누고 끝이 나머지를 흡수한다 — autoCalcModule 과 같은 방식.
    const widths = dist.modules.map((d) => d.w);
    const N = widths.length;
    if (dist.gap > 0 && N > 0) {
      const per = Math.floor(dist.gap / N);
      const extra = dist.gap - per * N;
      for (let i = 0; i < N; i++) widths[i] += per + (i === N - 1 ? extra : 0);
    }

    // 비고정 모듈만 걷어낸다.
    // 배열을 **제자리에서** 고친다 — 재할당하면 이 배열을 이미 붙잡고 있는 쪽이
    // 옛 배열을 계속 보게 된다 (테스트 하네스가 그래서 빈 결과를 봤다).
    for (let i = modules.length - 1; i >= 0; i--) {
      const m = modules[i];
      if (m.areaId === areaId && !m.isFixed && !isFinishingSection(m.section)) {
        delete structures[m.id];
        modules.splice(i, 1);
      }
    }
    orphanHostFinishings(areaId);

    // 고정 모듈 뒤부터 왼쪽→오른쪽으로 채운다
    let x = (area.x || 0) + kept.reduce((sum, m) => sum + (m.W || 0), 0);
    dist.modules.forEach((d, i) => {
      const m = addModuleToArea(areaId, { section: area.section, W: widths[i], x });
      if (!m) return;
      const s = getStructure(m.id);
      // 양문이면 한 칸에 도어 두 장 — 방향 대신 'both' (#471 규칙)
      s.areaIs2D = [!!d.is2D];
      s.areaDirections = [d.is2D ? 'both' : 'left'];
      s.areaWidths = [widths[i]];
      x += widths[i];
    });
    applyDefaultAreaFinish(areaId);   // W12-35
    saveStructModules();
    persistPlannerState();
    return dist.modules.length;
  }

  function removeActiveModule() {
    const i = modules.findIndex((m) => m.id === activeId);
    if (i < 0) { showToast('⚠ 지울 모듈을 먼저 고르세요'); return false; }
    const gone = modules[i];
    modules.splice(i, 1);
    delete structures[gone.id];
    // W12-11: 이 모듈에 붙어 있던 좌·우 마감재도 같이 지운다. 남겨 두면 주인이
    // 없는 부재가 영역에 떠 있고, 폭을 돌려줄 곳도 사라진다.
    for (let j = modules.length - 1; j >= 0; j--) {
      if (modules[j].isFinishing && modules[j].hostId === gone.id) {
        delete structures[modules[j].id];
        modules.splice(j, 1);
      }
    }
    activeId = modules.length ? modules[0].id : null;
    saveStructModules();
    persistPlannerState();
    return true;
  }

  /** 영역을 고르면 우측 상단에 모듈 추가·제거 버튼이 뜬다 */
  function setActiveArea(id) {
    // **다른 영역으로 옮길 때만** 화면을 다시 맞춘다.
    // 같은 영역을 다시 누르거나 옵션을 바꿔 다시 그릴 때까지 맞추면,
    // 사용자가 돌려놓은 줌·팬이 클릭마다 되돌아간다.
    const moved = id && id !== activeAreaId;
    activeAreaId = id;
    panelTarget = 'area';
    renderAreaTools();
    renderModuleList();   // W12-15: 배치 목록의 선택 표시를 따라오게 한다
    renderRightPanel();   // W12-31: 우측 패널을 영역 모드로 바꾼다 — 예전엔 우측이
                          //   모듈 전용이라 영역을 골라도 다시 그릴 이유가 없었다.
    renderFrontView();
    syncCanvasEmpty();
    if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: false }); } catch (_) {} }
    if (moved) {
      fitToAreas();
      try { fitCameraToAreas(); } catch (_) {}
    }
  }

  /** 빈 화면 안내 — 영역조차 없을 때만 띄운다.
   *  예전엔 "활성 모듈이 없으면" 이었다. 새 방식은 모듈 0개로 시작하므로
   *  그대로 두면 첫 화면이 안내 문구에 통째로 가려진다. */
  function syncCanvasEmpty() {
    const el = document.getElementById('canvasEmpty');
    if (!el) return;
    const nothing = !areas.length && !modules.length;
    el.style.display = nothing ? 'flex' : 'none';
    if (!nothing && !modules.length) {
      // 영역은 있는데 모듈이 없는 상태 — 무엇을 해야 하는지 알려 준다
      el.style.display = 'none';
    }
  }

  function renderAreaTools() {
    document.querySelectorAll('.area-tools').forEach((n) => n.remove());
    const area = areaById(activeAreaId);
    if (!area) return;
    const cfg = SECTION_CONFIG[area.section] || {};
    const used = usedWidthOf(area.id);
    const el = document.createElement('div');
    el.className = 'area-tools';
    const room = area.W - used;
    const opts = sectionsFor(area);
    el.innerHTML = `
      <div class="at-title">${cfg.label || area.section} 영역</div>
      <div class="at-room">${Math.round(used)} / ${Math.round(area.W)} mm 사용 · 남은 ${Math.max(0, Math.round(room))}mm</div>
      ${opts.length > 1 ? `
      <div class="at-sec">
        <label>넣을 것</label>
        <select class="at-section">
          ${opts.map((k) => `<option value="${k}">${(SECTION_CONFIG[k] || {}).label || k}</option>`).join('')}
        </select>
      </div>` : ''}
      ${area.isFinishing ? `
      <div class="at-note">배치에서 놓은 마감재입니다. 모듈을 넣는 자리가 아닙니다.</div>`
      : `
      <div class="at-btns">
        <button class="at-add">＋ 모듈 추가</button>
        <button class="at-del">− 모듈 제거</button>
      </div>
      <button class="at-auto">⚡ 이 영역 자동계산</button>
      <div class="at-sec at-fin">
        <select class="at-fintype">
          ${FINISHING_SECTIONS.map((k) => `<option value="${k}" ${k === lastFinishing ? 'selected' : ''}>${(SECTION_CONFIG[k] || {}).label || k} ${finishingWidthOf(k)}mm</option>`).join('')}
        </select>
        <button class="at-finadd">＋ 마감재</button>
      </div>`}`;
    document.body.appendChild(el);
    // 마감재 영역에는 모듈 버튼이 없다 — 없는 것을 묶으려 하면 여기서 죽는다.
    const on = (sel, fn) => { const b = el.querySelector(sel); if (b) b.onclick = fn; };

    on('.at-finadd', () => {
      const sel = el.querySelector('.at-fintype');
      if (sel) lastFinishing = sel.value;      // 다시 그려도 고른 것이 남는다
      const m = addFinishingToArea(area.id, lastFinishing);
      renderAreaTools();
      if (!m) return;
      renderFrontView();
      renderModuleList();
      if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: false }); } catch (_) {} }
      showToast(`${(SECTION_CONFIG[m.section] || {}).label} ${m.W}mm 추가`);
    });

    on('.at-add', () => {
      const secSel = el.querySelector('.at-section');
      // W12-35: 처음 채우는 순간에만 기본 마감을 세운다. 뒤에 모듈을 더 넣을 때도
      //   세우면, 사람이 없앤 EP 가 되살아난다.
      const first = !modules.some((x) => x.areaId === area.id && !x.isFinishing);
      const m = addModuleToArea(area.id, { section: secSel ? secSel.value : area.section });
      if (m && first) applyDefaultAreaFinish(area.id);
      renderAreaTools();
      if (m) setActiveModule(m.id);
      else renderFrontView();
      if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: false }); } catch (_) {} }
      // 화면을 다시 맞추지 않는다 — 모듈은 지금 보고 있는 영역 안에 들어가므로
      // 맞출 이유가 없고, 맞추면 사용자가 잡아둔 줌·팬이 튄다.
    });
    on('.at-auto', () => {
      const n = autoCalcArea(area.id);
      if (!n) { renderAreaTools(); return; }
      renderAreaTools();
      renderFrontView();
      renderModuleList();
      renderRightPanel();
      if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: false }); } catch (_) {} }
      showToast(`⚡ 자동계산 — 모듈 ${n}개`);
    });
    on('.at-del', () => {
      if (removeActiveModule()) { renderAreaTools(); renderFrontView(); renderRightPanel(); }
    });
  }

  // ─────────────────────────────────────────────────────────────
  // 셀 배열 — 분할 갯수를 바꾸면 파생 배열들도 함께 맞춘다
  //
  // W12-32: 예전엔 여기부터 떠 있는 옵션 팔레트가 있었다. 같은 값을 고치는 자리가
  // 두 곳이 되면서 저장이 한쪽으로만 흘렀고(W12-28~29), 같은 판단이 문구까지 다르게
  // 두 벌씩 생겼다(W12-31). 편집 지점은 이제 **우측 패널 하나**다.
  // ─────────────────────────────────────────────────────────────

  /** verticalCount 를 v 로 맞추면서 cell 배열 4종의 길이를 함께 맞춘다.
   *  areaWidths·areaIs2D 를 빼먹으면 정면도가 길이 불일치 fallback 으로 조용히
   *  균등분할로 돌아가거나, 양문 표시가 예전 cell 을 따라간다. */
  function syncCellArrays(s, v) {
    s.verticalCount = v;
    if (!Array.isArray(s.areaTypes)) s.areaTypes = [];
    if (!Array.isArray(s.areaDirections)) s.areaDirections = [];
    while (s.areaTypes.length < v) s.areaTypes.push('door');
    while (s.areaDirections.length < v) s.areaDirections.push('left');
    s.areaTypes.length = v;
    s.areaDirections.length = v;
    // 폭·양문은 자동계산이 만드는 파생값이다. 손으로 갯수를 바꾸면 근거가 사라지므로
    // 비워서 균등분할 fallback 으로 되돌린다 (지어낸 값을 남기지 않는다).
    s.areaWidths = [];
    s.areaIs2D = [];
  }

  /** 선반 n 개를 몸통 높이에 균등 분배한다.
   *  간격 공식은 calcDefaultShelves 와 같다 — step = H/(n+1). */
  function shelvesForCount(m, s, n) {
    if (n <= 0) return [];
    const H = Math.max(0, (Number(m.H) || 0) - legHOf(m, s) - moldingHOf(m, s));
    if (H <= 0) return [];
    const step = H / (n + 1);
    return Array.from({ length: n }, (_, i) => Math.round(step * (i + 1)));
  }

  function cellWidthsOf(m, s) {
    const n = Math.max(1, s.verticalCount || 1);
    return (Array.isArray(s.areaWidths) && s.areaWidths.length === n)
      ? s.areaWidths.slice()
      : Array(n).fill(m.W / n);
  }

  /**
   * 도어 옵션의 정면 미리보기.
   *
   * 숫자와 드롭다운만으로는 "어느 칸이 어느 쪽으로 열리는가" 가 안 잡힌다.
   * 모듈의 실제 W:H 비율과 칸별 폭을 그대로 써서, 보이는 대로 누르면 되게 한다.
   * 칸을 누르면 방향이 바뀐다 — 양문(is2D)은 방향 개념이 없어 잠근다(#471 규칙).
   */
  // ─────────────────────────────────────────────────────────────
  // 캔버스 인터랙션 — 휠/팬/단축키
  // ─────────────────────────────────────────────────────────────
  function attachCanvasHandlers() {
    const wrap = document.getElementById('canvasWrap');
    const svg  = document.getElementById('frontSvg');
    // 휠 줌
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
      const newZoom = Math.max(0.05, Math.min(8, view.zoom * factor));
      const wx = (mx - view.panX) / view.zoom;
      const wy = (my - view.panY) / view.zoom;
      view.zoom = newZoom;
