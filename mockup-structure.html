<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다담AI — Step 2 구조 (mockup)</title>
<style>
  :root{
    --brand-deep:#6a4b2a;
    --brand-mid:#b8956c;
    --brand-soft:#f3ead9;
    --bg:#fbfaf6;
    --bg-canvas:#f4efe7;
    --line:#e5e0d4;
    --text:#3d342a;
    --text-dim:#7a7062;
    --text-faint:#a89c84;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* ── TopBar h:40 ─────────────────────────────────── */
  .topbar{height:40px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .step-pill{display:flex;align-items:center;gap:0;padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600}
  .step-pill button{border:none;background:transparent;padding:3px 10px;border-radius:999px;cursor:pointer;color:var(--text-dim);font-size:11px;font-weight:600;display:flex;gap:4px;align-items:center}
  .step-pill button.active{background:var(--brand-deep);color:#fff;box-shadow:0 2px 5px rgba(106,75,42,.25)}
  .step-pill .sep{width:14px;height:2px;background:var(--line);display:inline-block}
  .topbar .spacer{flex:1}
  .module-name{font-size:12px;color:var(--text);font-weight:600;background:var(--brand-soft);padding:4px 10px;border-radius:5px;border:1px solid var(--brand-mid)}
  /* W9-64: View toggle (3D / 2D) */
  .view-toggle{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px}
  .view-toggle button{padding:3px 10px;border:none;background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;border-radius:4px}
  .view-toggle button.active{background:var(--brand-deep);color:#fff}
  .panel-toggle{display:flex;gap:3px}
  .panel-toggle button{width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text)}
  .panel-toggle button.on{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}

  /* ── Mid (3-column) ─────────────────────────────── */
  .mid{flex:1;display:flex;min-height:0;overflow:hidden}
  .module-list{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
  .module-list.collapsed{width:32px}
  .module-list.collapsed .ml-body,.module-list.collapsed .ml-header-title{display:none}
  .ml-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-header-title{font-size:11px;color:var(--text);font-weight:600}
  /* W9-65: view mode toggle */
  .ml-mode-toggle{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ml-mode-toggle button{flex:1;padding:4px 0;border:1px solid var(--line);background:#fff;color:var(--text-dim);font-size:10px;font-weight:600;cursor:pointer;border-radius:3px}
  .ml-mode-toggle button.active{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .set-item{padding:8px 8px;margin:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font-size:11px}
  .set-item:hover{background:var(--bg)}
  .set-item.active{background:var(--brand-soft);border-color:var(--brand-deep);font-weight:600}
  .set-item .set-meta{font-size:9px;color:var(--text-faint);margin-top:2px}
  .ml-body{flex:1;overflow-y:auto;padding:6px 4px}
  .module-item{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--text);transition:background .12s ease;border-left:3px solid transparent}
  .module-item:hover{background:var(--bg)}
  .module-item.active{background:var(--brand-soft);border-left-color:var(--brand-deep);font-weight:600}
  .module-item .mi-mark{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid var(--text-dim)}
  .module-item.active .mi-mark{background:var(--brand-deep);border-color:var(--brand-deep)}
  .module-item .mi-text{flex:1;line-height:1.3}
  .module-item .mi-dim{display:block;font-size:9px;color:var(--text-faint);margin-top:1px;font-family:monospace}

  /* ── Canvas (정면도) ────────────────────────────── */
  .canvas-wrap{flex:1;min-width:0;position:relative;background:var(--bg-canvas);overflow:hidden;background-image:linear-gradient(rgba(184,149,108,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(184,149,108,.08) 1px,transparent 1px);background-size:50px 50px}
  .canvas-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none}
  .canvas-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px;text-align:center;line-height:1.6}
  /* 정면도 영역 */
  .area-rect{cursor:pointer;transition:opacity .12s ease}
  .area-rect:hover{opacity:0.85}
  /* W9-110: viewport sticky ruler bar (HTML, pan/zoom 따라가지 않음) */
  .ruler-top{position:absolute;top:0;left:30px;right:30px;height:30px;background:#fff;border-bottom:1px solid var(--line);z-index:10;cursor:crosshair;overflow:hidden;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none}
  .ruler-right{position:absolute;top:30px;right:0;bottom:30px;width:30px;background:#fff;border-left:1px solid var(--line);z-index:10;cursor:crosshair;overflow:hidden;font-family:monospace;font-size:10px;color:var(--text-dim);user-select:none}
  .ruler-corner{position:absolute;top:0;right:0;width:30px;height:30px;background:#fbfaf6;border-bottom:1px solid var(--line);border-left:1px solid var(--line);z-index:11}
  .ruler-tick{position:absolute;background:#3d342a;pointer-events:none}
  .ruler-top .ruler-tick{top:0;width:1px;height:8px}
  .ruler-top .ruler-tick.major{height:14px;background:#1a1a1a}
  .ruler-right .ruler-tick{left:0;height:1px;width:8px}
  .ruler-right .ruler-tick.major{width:14px;background:#1a1a1a}
  .ruler-label{position:absolute;font-family:monospace;font-size:9px;color:var(--text);pointer-events:none;white-space:nowrap}
  .ruler-top .ruler-label{top:14px;transform:translateX(-50%)}
  .ruler-right .ruler-label{left:14px;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
  .ruler-cursor{position:absolute;background:#b8956c;z-index:5;pointer-events:none;opacity:0.7}
  .ruler-top .ruler-cursor{top:0;width:2px;height:30px}
  .ruler-right .ruler-cursor{left:0;height:2px;width:30px}
  .area-label{font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700;fill:#fff;pointer-events:none}
  .area-label-small{font-size:10px;fill:#fff;opacity:0.85;pointer-events:none}
  .module-dim-label{fill:var(--text-dim);font-size:11px;font-weight:600;font-family:monospace;pointer-events:none}
  .shelf-line{stroke:#5a4d2f;stroke-width:2;stroke-dasharray:10 4;opacity:0.6}
  .open-direction{fill:#fff;font-size:14px;pointer-events:none;font-weight:700}
  /* 줌 안내 */
  .canvas-help{position:absolute;bottom:8px;left:8px;color:var(--text-faint);font-size:10px;padding:4px 8px;background:rgba(255,255,255,0.75);border-radius:4px;border:1px solid var(--line)}

  /* ── 우측 패널 ────────────────────────────── */
  .right-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
  .right-panel.collapsed{width:32px}
  .right-panel.collapsed .section,.right-panel.collapsed .panel-header-title{display:none}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);font-size:11px;color:var(--text);font-weight:600}
  .panel-header button{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px}
  .sections{overflow-y:auto;flex:1}
  .section{border-bottom:1px solid var(--line)}
  .section-header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--text)}
  .section-header:hover{background:var(--bg)}
  .section-header .chev{font-size:10px;color:var(--text-faint);transition:transform .15s ease}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .section.collapsed .section-body{display:none}
  .section-body{padding:8px 10px 12px;background:#fff;font-size:11px;color:var(--text)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:5px 0}
  .row label{color:var(--text-dim);font-size:11px}
  .row input[type="number"],.row select{padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:11px;background:#fff;color:var(--text);font-family:inherit}
  .row input[type="number"]{width:72px;text-align:right;font-family:monospace}
  .row select{font-family:inherit}
  .area-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:5px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
  .area-row:last-child{border-bottom:none}
  .area-row .a-lab{font-size:10px;color:var(--text);font-weight:600;font-family:monospace}
  .area-row select{padding:2px 4px;font-size:10px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .shelf-row{display:flex;align-items:center;gap:4px;margin:4px 0}
  .shelf-row input{flex:1;padding:3px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;text-align:right;font-family:monospace}
  .shelf-row button.del{padding:3px 6px;border:1px solid #c0392b;background:#fef0ed;color:#c0392b;border-radius:3px;font-size:10px;cursor:pointer;font-weight:600}
  .shelf-row button.del:hover{background:#fde0d8}
  .add-btn{display:block;width:100%;padding:5px;margin-top:6px;border:1px dashed var(--brand-mid);background:transparent;color:var(--brand-deep);border-radius:4px;font-size:11px;font-weight:600;cursor:pointer}
  .add-btn:hover{background:var(--brand-soft)}
  .empty-msg{padding:20px 8px;color:var(--text-faint);font-size:11px;text-align:center;line-height:1.5}

  /* ── BottomBar h:32 ──────────────────────────── */
  .bottombar{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(0,0,0,.04);font-size:11px;color:var(--text-dim)}
  .bottombar .actions{display:flex;gap:6px}
  .bottombar button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer}
  .bottombar button:hover{background:var(--brand-soft)}
  .bottombar button.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
  .bottombar button.primary:hover{background:#553b22}
  .bottombar button.next{background:#1976d2;color:#fff;border-color:#0d47a1}
  .bottombar button.next:hover{background:#0d47a1}

  /* 토스트 */
  .toast{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(122,72,16,0.92);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;z-index:100;pointer-events:none;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,-4px)}to{opacity:1;transform:translateX(-50%)}}
</style>
</head>
<body>

<!-- TopBar -->
<div class="topbar">
  <div class="step-pill">
    <button onclick="sessionStorage.setItem('fromStructure','1'); location.href='mockup-shell'">📐 1.배치</button><span class="sep"></span>
    <button class="active">📦 2.구조</button><span class="sep"></span>
    <button>🎨 3.디테일</button>
  </div>
  <div class="module-name" id="curModuleName">모듈을 선택하세요</div>
  <div class="spacer"></div>
  <!-- W9-64: View toggle (3D / 정면도) -->
  <div class="view-toggle">
    <button id="view3dBtn" class="active" data-view="3d" title="3D 뷰">🧊 3D</button>
    <button id="view2dBtn" data-view="2d" title="정면도 (2D)">📐 정면도</button>
  </div>
  <!-- W9-86: 도어 표시 on/off -->
  <div class="view-toggle">
    <button id="doorToggleBtn" class="active" title="도어 표시 on/off">🚪 도어</button>
  </div>
  <!-- W9-108: 정면도 시점 회전 (정면/우측/뒷면/좌측) -->
  <div class="view-toggle" id="viewRotateBar" style="display:none">
    <button id="viewRotateBtn" title="시점 회전 (90° 시계방향)">↻ <span id="viewRotateLabel">정면</span></button>
  </div>
  <div class="panel-toggle">
    <button id="btnLeft" class="on" title="좌측 패널 (L)">⬛</button>
    <button id="btnRight" class="on" title="우측 패널 (R)">▦</button>
  </div>
</div>

<!-- Middle -->
<div class="mid">

  <!-- 좌측 모듈 리스트 -->
  <div class="module-list" id="moduleList">
    <div class="ml-header">
      <span class="ml-header-title">배치된 모듈</span>
      <button style="border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px"
              onclick="document.getElementById('moduleList').classList.toggle('collapsed')">«</button>
    </div>
    <!-- W9-65: view mode toggle — 개별 / 세트 / 전체 -->
    <div class="ml-mode-toggle">
      <button class="active" data-mode="single" title="개별 모듈 1개씩 보기">개별</button>
      <button data-mode="set" title="ㄱ자/ㄷ자 세트 (정면 묶음)">세트</button>
      <button data-mode="all" title="전체 모듈 한 번에">전체</button>
    </div>
    <div class="ml-body" id="mlBody">
      <div class="empty-msg">로딩 중...</div>
    </div>
  </div>

  <!-- 캔버스: 3D + 정면도 toggle -->
  <div class="canvas-wrap" id="canvasWrap">
    <!-- W9-64: 3D canvas (Three.js) -->
    <canvas id="canvas3d" style="position:absolute;inset:0;width:100%;height:100%;display:block;outline:none"></canvas>
    <!-- 기존 2D SVG 정면도 -->
    <svg class="canvas-svg" id="frontSvg" style="display:none">
      <g class="content" id="contentG"></g>
    </svg>
    <!-- W9-110: viewport sticky ruler bars (정면도 모드만 표시) -->
    <div class="ruler-top" id="rulerTop" style="display:none"></div>
    <div class="ruler-right" id="rulerRight" style="display:none"></div>
    <div class="ruler-corner" id="rulerCorner" style="display:none"></div>
    <div class="canvas-empty" id="canvasEmpty">
      좌측에서 모듈을 선택하세요<br>
      <span style="font-size:11px;color:var(--text-faint);margin-top:6px;display:inline-block">
        휠 = 줌 · 빈공간 드래그 = 팬 · F = Fit · 0 = Reset
      </span>
    </div>
    <div class="canvas-help">단축키: 휠=줌 · 드래그=팬 · F=Fit · 0=Reset · L/R=패널</div>
  </div>

  <!-- 우측 편집 패널 -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-header">
      <span class="panel-header-title">구조 편집</span>
      <button title="패널 접기" onclick="document.getElementById('rightPanel').classList.toggle('collapsed')">»</button>
    </div>
    <!-- W9-72: 세트 자동계산 버튼 (세트 모드에서만 표시) -->
    <div id="autoCalcBar" style="display:none;padding:8px 10px;background:#fffaf2;border-bottom:1px solid var(--brand-mid)">
      <button id="autoCalcBtn" style="width:100%;padding:8px;border:1px solid var(--brand-deep);background:var(--brand-deep);color:#fff;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer">⚡ 세트 일괄 자동계산</button>
      <div style="font-size:9px;color:var(--text-faint);margin-top:4px;line-height:1.4">분배기/후드 위치 고려 · 다담 표준 (목표 도어 450mm) · 매립형 손잡이</div>
    </div>
    <div class="sections">
      <!-- 분할 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 분할
        </div>
        <div class="section-body" id="splitBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 영역 타입 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 영역 타입 + 도어 열림
        </div>
        <div class="section-body" id="areasBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 선반 -->
      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 선반 (내부 mm)
        </div>
        <div class="section-body" id="shelvesBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
      <!-- 손잡이 -->
      <div class="section collapsed">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 손잡이
        </div>
        <div class="section-body" id="handleBody">
          <div class="empty-msg">모듈 선택</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BottomBar -->
<div class="bottombar">
  <div class="actions">
    <button id="reloadBtn" title="배치 단계 데이터 다시 로드">📥 배치 로드</button>
    <button class="primary" id="saveBtn" title="구조 저장">💾 구조 저장</button>
    <button class="next" id="nextBtn" title="디테일 단계로">디테일 단계 →</button>
  </div>
  <div>ⓘ 줌 <span id="zoomInd">100%</span> · 휠=줌 · 빈공간 드래그=팬 · F=Fit · 0=Reset</div>
</div>

<!-- W9-64: Three.js CDN importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
window.THREE = THREE;
window.OrbitControls = OrbitControls;
// 3D 초기화는 페이지 로드 후 init3D() 가 호출
window.dispatchEvent(new CustomEvent('three-ready'));
</script>

<script>
  // ─────────────────────────────────────────────────────────────
  // SECTION_CONFIG — mockup-shell.html 과 동일
  // ─────────────────────────────────────────────────────────────
  const SECTION_CONFIG = {
    lower:        { fill: '#b8956c', stroke: '#6a4b2a', label: '하부장' },
    upper:        { fill: '#7c9c8f', stroke: '#3d5750', label: '상부장' },
    tall:         { fill: '#9c6e7c', stroke: '#5c3848', label: '키큰장' },
    fridge:       { fill: '#a0a8b0', stroke: '#4a525a', label: '냉장고장' },
    sink:         { fill: '#b0b8c0', stroke: '#5a626a', label: '분배기' },
    hood:         { fill: '#6a727a', stroke: '#2a3238', label: '후드' },
    refrigerator: { fill: '#c8ced4', stroke: '#5a626a', label: '냉장고' },
    dishwasher:   { fill: '#9ca4ac', stroke: '#5a626a', label: '식기세척기' },
    // W9-85: 마감재 — finishings forEach 의 SECTION_CONFIG[f.section] 조회 통과용
    ep:           { fill: '#7a6a45', stroke: '#1a0f00', label: 'EP' },
    molding:      { fill: '#5a4d2f', stroke: '#1a0f00', label: '몰딩' },
    filler:       { fill: '#8a7858', stroke: '#1a0f00', label: '휠라' },
  };
  // 영역 type 별 색상 보정
  function colorForArea(sectionFill, type) {
    if (type === 'door')   return sectionFill;
    if (type === 'drawer') return darken(sectionFill, 0.15);
    if (type === 'open')   return '#fffaf2';
    return sectionFill;
  }
  function darken(hex, factor) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const f = 1 - factor;
    return '#' + [r*f,g*f,b*f].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }

  // 모듈 로드 — localStorage 또는 sample
  function loadModules() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (raw) {
        const layout = JSON.parse(raw);
        if (layout.modules && layout.modules.length) {
          const FINISHING_SECTIONS = ['ep', 'molding', 'filler'];
          // 1) 일반 모듈만 추출
          modules = layout.modules
            .filter(m => SECTION_CONFIG[m.section] && !FINISHING_SECTIONS.includes(m.section))
            .map((m, i) => ({
              id: moduleIdFor(m.section, i),
              section: m.section,
              W: m.w,
              H: m.moduleH,
              D: m.h,
              x: m.x || 0,
              y: m.y || 0,
              rotation: m.rotation || 0,
              // W9-77: 자식 마감재 (attachToSelected 로 추가된 것) 평행 추출
              finishings: (m.finishings || []).map(f => ({
                section: f.section,
                W: f.w,
                H: f.moduleH || m.moduleH,
                D: f.h,
                x: f.x,
                y: f.y,
              })),
            }));
          // 2) W9-84: 사이드바 직접 추가된 standalone 마감재 (top-level modules 의 ep/molding/filler)
          //    → 가장 가까운 모듈의 finishings 에 push (구조 단계에 표시되도록)
          const standalone = layout.modules.filter(m => FINISHING_SECTIONS.includes(m.section));
          console.log('[STRUCT] loadModules', { totalModules: layout.modules.length, regular: modules.length, standaloneFinishings: standalone.length, sections: layout.modules.map(m => m.section) });
          standalone.forEach((fm) => {
            const fxC = (fm.x || 0) + (fm.w || 0) / 2;
            const fyC = (fm.y || 0) + (fm.h || 0) / 2;
            let closest = null, closestDist = Infinity;
            modules.forEach((m) => {
              const mxC = m.x + m.W / 2;
              const myC = m.y + m.D / 2;
              const d = Math.hypot(fxC - mxC, fyC - myC);
              if (d < closestDist) { closestDist = d; closest = m; }
            });
            if (closest) {
              closest.finishings.push({
                section: fm.section,
                W: fm.w,
                H: fm.moduleH || closest.H,
                D: fm.h,
                x: fm.x || 0,
                y: fm.y || 0,
              });
            }
          });
          return;
        }
      }
    } catch (e) { console.warn('layout load 실패', e); }
    // sample — ㄱ자 구조 (3개 회전 0 + 1개 회전 90)

      { id: 'fridge-0', section: 'fridge', W: 720, H: 1850, D: 700, x: 3200, y: 0,    rotation: 90 },
    ];
  }

  // ─────────────────────────────────────────────────────────────
  // 중앙 정면도 (SVG)
  // ─────────────────────────────────────────────────────────────
  const view = { panX: 0, panY: 0, zoom: 1 };
  function applyView() {
    const content = document.getElementById('contentG');
    content.setAttribute('transform', `translate(${view.panX} ${view.panY}) scale(${view.zoom})`);
    const wrap = document.getElementById('canvasWrap');
    const sz = (50 * view.zoom).toFixed(2) + 'px';
    wrap.style.backgroundSize = sz + ' ' + sz;
    wrap.style.backgroundPosition = view.panX + 'px ' + view.panY + 'px';
    document.getElementById('zoomInd').textContent = Math.round(view.zoom * 100) + '%';
    // W9-110: viewport ruler 갱신
    updateViewportRulers();
  }

  // W9-110: viewport ruler — pan/zoom 변경 시 tick + 라벨 재생성
  //   화면 px = (SVG mm * zoom) + panX
  //   화면 px → SVG mm = (px - panX) / zoom
  function updateViewportRulers() {
    const rulerTop = document.getElementById('rulerTop');
    const rulerRight = document.getElementById('rulerRight');
    if (!rulerTop || !rulerRight || rulerTop.style.display === 'none') return;
    const cw = rulerTop.clientWidth, ch = rulerRight.clientHeight;
    const z = view.zoom || 1;
    // tick 간격 — zoom 에 따라 50 / 100 / 500 / 1000 mm
    let tickMM = 100;
    const pxPerMM = z;
    if (pxPerMM < 0.05) tickMM = 1000;
    else if (pxPerMM < 0.15) tickMM = 500;
    else if (pxPerMM < 0.4) tickMM = 200;
    else if (pxPerMM < 1.0) tickMM = 100;
    else tickMM = 50;
    // 가로 ruler
    rulerTop.innerHTML = '';
    const mmStart = Math.floor((-view.panX) / z / tickMM) * tickMM;
    const mmEnd = Math.ceil((cw - view.panX) / z / tickMM) * tickMM;
    for (let mm = mmStart; mm <= mmEnd; mm += tickMM) {
      const px = mm * z + view.panX;
      if (px < 0 || px > cw) continue;
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (mm % (tickMM * 5) === 0 ? ' major' : '');
      tick.style.left = px + 'px';
      rulerTop.appendChild(tick);
      if (mm % (tickMM * 5) === 0) {
        const lab = document.createElement('div');
        lab.className = 'ruler-label';
        lab.style.left = px + 'px';
        lab.textContent = mm;
        rulerTop.appendChild(lab);
      }
    }
    // 세로 ruler
    rulerRight.innerHTML = '';
    const yStart = Math.floor((-view.panY) / z / tickMM) * tickMM;
    const yEnd = Math.ceil((ch - view.panY) / z / tickMM) * tickMM;
    for (let mm = yStart; mm <= yEnd; mm += tickMM) {
      const py = mm * z + view.panY;
      if (py < 0 || py > ch) continue;
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (mm % (tickMM * 5) === 0 ? ' major' : '');
      tick.style.top = py + 'px';
      rulerRight.appendChild(tick);
      if (mm % (tickMM * 5) === 0) {
        const lab = document.createElement('div');
        lab.className = 'ruler-label';
        lab.style.top = py + 'px';
        lab.textContent = mm;
        rulerRight.appendChild(lab);
      }
    }
  }

  // W9-110: ruler 클릭 — 클릭 px 의 SVG mm 좌표 toast
  function attachRulerHandlers() {
    const rulerTop = document.getElementById('rulerTop');
    const rulerRight = document.getElementById('rulerRight');
    if (!rulerTop || !rulerRight) return;
    rulerTop.onclick = (e) => {
      const rect = rulerTop.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const mm = Math.round((px - view.panX) / (view.zoom || 1));
      if (typeof showToast === 'function') showToast('📐 X = ' + mm + ' mm');
    };
    rulerRight.onclick = (e) => {
      const rect = rulerRight.getBoundingClientRect();
      const py = e.clientY - rect.top;
      const mm = Math.round((py - view.panY) / (view.zoom || 1));
      // 정면도 Y 는 위→아래 (천장=0, 바닥=ceilingHeight) → 사람 시점 H 변환
      const h = ceilingHeight - mm;
      if (typeof showToast === 'function') showToast('📐 H = ' + h + ' mm (Y=' + mm + ')');
    };
  }

  function fitToActiveModule() {
    const m = modules.find(x => x.id === activeId);
    const wrap = document.getElementById('canvasWrap');
    if (!m || !wrap) return;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const pad = 80;
    const targetW = m.W, targetH = m.H;
    const zx = (cw - pad*2) / targetW;
    const zy = (ch - pad*2) / targetH;
    view.zoom = Math.max(0.05, Math.min(zx, zy, 4));
    view.panX = (cw - targetW * view.zoom) / 2;
    view.panY = (ch - targetH * view.zoom) / 2;
    applyView();
  }

  // W9-103: viewMode 별 정면도 자동 fit
  function fitFrontView() {
    const wrap = document.getElementById('canvasWrap');
    if (!wrap) return;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const pad = 100;
    if (viewMode === 'single') {
      fitToActiveModule();
      return;
    }
    // set / all — 세트/전체 모듈의 X bbox + ceilingHeight 기반
    let mods = modules;
    if (viewMode === 'set' && activeSetId) {
      const sets = buildSets();
      const set = sets.find(x => x.id === activeSetId);
      if (set) mods = set.modules;
    }
    if (!mods.length) return;
    const ox = getFrontViewOriginX();
    const oy = (personPos && typeof personPos.cy === 'number') ? personPos.cy : originPos2D.y;
    // W9-108: viewRotation 별 footprint X 변환 (renderFrontSet 의 viewX 와 동일 패턴)
    let minX = Infinity, maxX = -Infinity;
    mods.forEach(m => {
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      const planeW = (rot === 90 || rot === 270) ? m.D : m.W;
      const planeD = (rot === 90 || rot === 270) ? m.W : m.D;
      const px = m.x || 0, py = m.y || 0;
      let vx, vw;
      if (viewRotation === 0)        { vx = px - ox; vw = planeW; }
      else if (viewRotation === 90)  { vx = py - oy; vw = planeD; }
      else if (viewRotation === 180) { vx = -(px + planeW - ox); vw = planeW; }
      else                            { vx = -(py + planeD - oy); vw = planeD; }
      minX = Math.min(minX, vx);
      maxX = Math.max(maxX, vx + vw);
    });
    if (!isFinite(minX) || !isFinite(maxX)) return;
    // W9-110: SVG ruler 제거 — viewport ruler 가 외부 → SVG 여유 축소
    const targetW = (maxX - minX) + 300;
    const targetH = ceilingHeight + 250;
    const zx = (cw - pad * 2) / targetW;
    const zy = (ch - pad * 2) / targetH;
    view.zoom = Math.max(0.02, Math.min(zx, zy, 4));
    // panX 는 minX 가 좌측 padding 안에 오도록
    view.panX = (cw - targetW * view.zoom) / 2 - (minX - 150) * view.zoom;
    view.panY = (ch - targetH * view.zoom) / 2;
    applyView();
  }

  // W9-102: 정면도 — viewMode 별 분기 (single / set / all). 배치 단계 X 좌표 + baseY 반영
  function renderFrontView() {
    const content = document.getElementById('contentG');
    content.innerHTML = '';
    if (viewMode === 'set' && activeSetId) {
      const sets = buildSets();
      const set = sets.find(x => x.id === activeSetId);
      if (set) renderFrontSet(content, set.modules);
      return;
    }
    if (viewMode === 'all') {
      renderFrontSet(content, modules);
      return;
    }
    // single mode (기존)
    if (!activeId) return;
    const m = modules.find(x => x.id === activeId);
    if (!m) return;
    const s = getStructure(activeId);
    renderModuleFront(content, m, s, 0, 0);
  }

  // W9-102/104/105/106/107/108: 세트/전체 정면도
  //   W9-108: viewRotation (0/90/180/270) — 시점 회전 (정면/우측/뒷면/좌측)
  //     평면도 좌표 → 정면도 X 변환 + effective rotation = m.rotation - viewRotation
  function renderFrontSet(content, mods) {
    if (!mods || !mods.length) return;
    const ns = 'http://www.w3.org/2000/svg';
    const ox = getFrontViewOriginX();
    const oy = (personPos && typeof personPos.cy === 'number') ? personPos.cy : originPos2D.y;
    // W9-108: 시점 회전에 따라 모듈 X (정면도) 좌표 변환
    //   viewRotation = 0 (정면, Y- 방향 봄): X = m.x - ox
    //   viewRotation = 90 (우측, X+ 방향 봄): X = m.y - oy
    //   viewRotation = 180 (뒷면, Y+ 방향 봄): X = -(m.x + m.W - ox) — 거울
    //   viewRotation = 270 (좌측, X- 방향 봄): X = -(m.y + m.D - oy) — 거울
    function viewX(m) {
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      // 평면도 footprint: 회전 0/180 W방향=m.W, 90/270 W방향=m.D
      const planeW = (rot === 90 || rot === 270) ? m.D : m.W;
      const planeD = (rot === 90 || rot === 270) ? m.W : m.D;
      const px = m.x || 0, py = m.y || 0;
      if (viewRotation === 0)   return { x: px - ox, w: planeW };
      if (viewRotation === 90)  return { x: py - oy, w: planeD };
      if (viewRotation === 180) return { x: -(px + planeW - ox), w: planeW };
      if (viewRotation === 270) return { x: -(py + planeD - oy), w: planeD };
      return { x: px - ox, w: planeW };
    }
    // X 좌표 순서로 정렬 (시점 회전 적용 후 X 기준)
    const sorted = mods.slice().sort((a, b) => viewX(a).x - viewX(b).x);
    let allMinX = Infinity, allMaxX = -Infinity;
    sorted.forEach(m => {
      const s = getStructure(m.id);
      const baseY = getBaseY(m.section, m.H);
      const offsetY = ceilingHeight - (baseY + m.H);
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      // W9-108: 시점 회전 적용 — effective rotation = (m.rotation - viewRotation) mod 360
      //   0   → 도어 면 정면 (W × H)
      //   90  → 우측면 (D × H, 도어 안 보임)
      //   180 → 뒷면 (W × H, 거울 — 단순화: 도어 안 보임)
      //   270 → 좌측면 (D × H)
      const effRot = ((rot - viewRotation) % 360 + 360) % 360;
      const showDoor = (effRot === 0);   // 정면일 때만 도어
      // 정면도 footprint (시점 회전 적용)
      const vx = viewX(m);
      const footprintW = vx.w;
      const footprintX = vx.x;
      // (effRot 0 → 도어 W, 90/270 → 측면 D, 180 → 뒷면 W — 분기 안에서 처리)
      const cfg = SECTION_CONFIG[m.section] || { fill: '#999', stroke: '#333', label: m.section };
      // W9-108: effective rotation 별 mesh 표시
      if (showDoor) {
        // 정면 도어 면 (effRot=0)
        renderModuleFront(content, m, s, footprintX, offsetY);
      } else if (effRot === 180) {
        // 뒷면 — 단순 rect (도어 색 약간 어둡게) + '뒷' 라벨
        const back = document.createElementNS(ns, 'rect');
        back.setAttribute('x', footprintX); back.setAttribute('y', offsetY);
        back.setAttribute('width', footprintW); back.setAttribute('height', m.H);
        back.setAttribute('fill', cfg.fill); back.setAttribute('opacity', 0.5);
        back.setAttribute('stroke', cfg.stroke); back.setAttribute('stroke-width', 3);
        content.appendChild(back);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW / 2);
        lab.setAttribute('y', offsetY + m.H / 2);
        lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', Math.min(footprintW * 0.12, m.H * 0.12, 60));
        lab.setAttribute('fill', cfg.stroke); lab.setAttribute('font-weight', 'bold');
        lab.textContent = '뒷면';
        content.appendChild(lab);
      } else {
        // 측면 (effRot=90/270) — 측판 색 단순 rect + '측' 라벨 + footprint 라벨
        const side = document.createElementNS(ns, 'rect');
        side.setAttribute('x', footprintX); side.setAttribute('y', offsetY);
        side.setAttribute('width', footprintW); side.setAttribute('height', m.H);
        side.setAttribute('fill', cfg.fill); side.setAttribute('opacity', 0.7);
        side.setAttribute('stroke', cfg.stroke); side.setAttribute('stroke-width', 3);
        content.appendChild(side);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW / 2);
        lab.setAttribute('y', offsetY + m.H / 2);
        lab.setAttribute('text-anchor', 'middle'); lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', Math.min(footprintW * 0.18, m.H * 0.12, 50));
        lab.setAttribute('fill', '#fff'); lab.setAttribute('font-weight', 'bold');
        lab.textContent = (effRot === 90) ? '우측면' : '좌측면';
        content.appendChild(lab);
        // footprint W (=D) 라벨 (아래)
        const dimLab = document.createElementNS(ns, 'text');
        dimLab.setAttribute('x', footprintX + footprintW / 2);
        dimLab.setAttribute('y', offsetY + m.H + 50);
        dimLab.setAttribute('text-anchor', 'middle');
        dimLab.setAttribute('font-size', 24);
        dimLab.setAttribute('fill', '#5a4d2f');
        dimLab.setAttribute('font-family', 'monospace');
        dimLab.textContent = 'D=' + Math.round(footprintW);
        content.appendChild(dimLab);
      }
      allMinX = Math.min(allMinX, footprintX);
      allMaxX = Math.max(allMaxX, footprintX + footprintW);
      // W9-108: 회전각 배지 — 모듈 실제 회전 + (effective !== 0 면 effRot 도)
      if (rot !== 0 || !showDoor) {
        const badge = document.createElementNS(ns, 'rect');
        badge.setAttribute('x', footprintX + footprintW - 220);
        badge.setAttribute('y', offsetY - 60);
        badge.setAttribute('width', 200);
        badge.setAttribute('height', 50);
        badge.setAttribute('fill', '#b8956c');
        badge.setAttribute('rx', 8);
        badge.setAttribute('opacity', 0.85);
        content.appendChild(badge);
        const lab = document.createElementNS(ns, 'text');
        lab.setAttribute('x', footprintX + footprintW - 120);
        lab.setAttribute('y', offsetY - 30);
        lab.setAttribute('text-anchor', 'middle');
        lab.setAttribute('dominant-baseline', 'central');
        lab.setAttribute('font-size', 22);
        lab.setAttribute('font-weight', 'bold');
        lab.setAttribute('fill', '#fff');
        lab.textContent = '회전 ' + rot + '° (eff ' + effRot + '°)';
        content.appendChild(lab);
      }
    });
    // ──────────────────────────────────────────────
    // 천장/바닥 가이드 라인 (전체 X 범위)
    // ──────────────────────────────────────────────
    if (!isFinite(allMinX)) { allMinX = 0; allMaxX = 0; }
    const drawGuide = (yMM, label, color) => {
      const ln = document.createElementNS(ns, 'line');
      ln.setAttribute('x1', allMinX - 100); ln.setAttribute('y1', yMM);
      ln.setAttribute('x2', allMaxX + 100); ln.setAttribute('y2', yMM);
      ln.setAttribute('stroke', color); ln.setAttribute('stroke-width', 2);
      ln.setAttribute('stroke-dasharray', '12 6');
      ln.setAttribute('opacity', 0.5);
      content.appendChild(ln);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', allMinX - 110); lab.setAttribute('y', yMM);
      lab.setAttribute('text-anchor', 'end'); lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', 36); lab.setAttribute('fill', color); lab.setAttribute('font-family', 'monospace');
      lab.textContent = label;
      content.appendChild(lab);
    };
    drawGuide(0, '천장 H=' + ceilingHeight, '#6a4b2a');
    drawGuide(ceilingHeight, '바닥 0', '#6a4b2a');
    // W9-110: SVG 안 ruler 제거 — viewport sticky ruler 로 대체
    // W9-105: 사람 위치 마커 — 정면도 X=0 (사람 원의 cx 가 X=0 으로 매핑되므로)
    if (personPos) {
      // 사람 마커 — 정면도 바닥 라인 (Y=ceilingHeight) 에 작은 원
      const personMarker = document.createElementNS(ns, 'circle');
      personMarker.setAttribute('cx', 0);
      personMarker.setAttribute('cy', ceilingHeight + 50);
      personMarker.setAttribute('r', 30);
      personMarker.setAttribute('fill', '#b8956c');
      personMarker.setAttribute('stroke', '#3d342a');
      personMarker.setAttribute('stroke-width', 2);
      personMarker.setAttribute('opacity', 0.85);
      content.appendChild(personMarker);
      // 사람 라벨
      const personLab = document.createElementNS(ns, 'text');
      personLab.setAttribute('x', 0);
      personLab.setAttribute('y', ceilingHeight + 130);
      personLab.setAttribute('text-anchor', 'middle');
      personLab.setAttribute('font-size', 36);
      personLab.setAttribute('fill', '#3d342a');
      personLab.setAttribute('font-weight', 'bold');
      personLab.textContent = '🧍 사람 (X=0)';
      content.appendChild(personLab);
      // X=0 vertical 가이드 (사람 위치 기준선)
      const vGuide = document.createElementNS(ns, 'line');
      vGuide.setAttribute('x1', 0); vGuide.setAttribute('y1', -100);
      vGuide.setAttribute('x2', 0); vGuide.setAttribute('y2', ceilingHeight + 40);
      vGuide.setAttribute('stroke', '#b8956c');
      vGuide.setAttribute('stroke-width', 2);
      vGuide.setAttribute('stroke-dasharray', '8 4');
      vGuide.setAttribute('opacity', 0.4);
      content.appendChild(vGuide);
    }
  }

  // W9-102: 단일 모듈 정면도 헬퍼 (offset 받음)
  function renderModuleFront(content, m, s, offsetX, offsetY) {
    const cfg = SECTION_CONFIG[m.section];
    const ns = 'http://www.w3.org/2000/svg';

    // 모듈 외곽
    const outline = document.createElementNS(ns, 'rect');
    outline.setAttribute('x', offsetX);
    outline.setAttribute('y', offsetY);
    outline.setAttribute('width', m.W);
    outline.setAttribute('height', m.H);
    outline.setAttribute('fill', 'none');
    outline.setAttribute('stroke', cfg.stroke);
    outline.setAttribute('stroke-width', 4);
    content.appendChild(outline);

    // 상하 분할
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? s.drawerHeight : 0;
    const topH = m.H - drawerH;
    const topY = offsetY;             // 모듈 위쪽 (천장 매달림이면 ceiling=0)
    const drawerY = offsetY + topH;   // 하부 서랍 영역 시작

    // W9-95: 불균등 cell 폭 (areaWidths) — fallback 균등
    const vCount = Math.max(1, s.verticalCount || 1);
    const cellWidths = (Array.isArray(s.areaWidths) && s.areaWidths.length === vCount)
      ? s.areaWidths
      : Array(vCount).fill(m.W / vCount);
    let xAcc = offsetX;
    for (let i = 0; i < vCount; i++) {
      const colW = cellWidths[i];
      const type = s.areaTypes[i] || 'door';
      const dir = s.areaDirections[i] || 'left';
      const is2D = !!(s.areaIs2D && s.areaIs2D[i]);
      const x = xAcc;
      const fill = colorForArea(cfg.fill, type);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', x);
      r.setAttribute('y', topY);
      r.setAttribute('width', colW);
      r.setAttribute('height', topH);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (type === 'open') r.setAttribute('stroke-dasharray', '8 4');
      content.appendChild(r);

      // 라벨
      const labFont = Math.min(colW * 0.18, topH * 0.18, 80);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', x + colW/2);
      lab.setAttribute('y', topY + topH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const typeLabel = { door:'도어', drawer:'서랍', open:'오픈' }[type];
      lab.textContent = typeLabel;
      if (type === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      // W9-101: 양문 (is2D) — 가운데 갭 4mm + 처짐방지목 표시
      if (type === 'door' && is2D) {
        const GAP = MASTER_RULES.DOOR_GAP;
        const braceW = MASTER_RULES.BAND_BRACE_W;
        // 가운데 처짐방지목 외곽 (얇은 회색 stroke)
        const brace = document.createElementNS(ns, 'rect');
        brace.setAttribute('x', x + colW/2 - braceW/2);
        brace.setAttribute('y', topY + 4);
        brace.setAttribute('width', braceW);
        brace.setAttribute('height', topH - 8);
        brace.setAttribute('fill', cfg.stroke);
        brace.setAttribute('opacity', 0.15);
        brace.setAttribute('stroke', '#000');
        brace.setAttribute('stroke-width', 1);
        content.appendChild(brace);
        // 가운데 갭 (4mm) — 두꺼운 검은 라인
        const gap = document.createElementNS(ns, 'line');
        gap.setAttribute('x1', x + colW/2); gap.setAttribute('y1', topY);
        gap.setAttribute('x2', x + colW/2); gap.setAttribute('y2', topY + topH);
        gap.setAttribute('stroke', '#000'); gap.setAttribute('stroke-width', 3);
        content.appendChild(gap);
        // 양문 방향 화살표 좌/우 둘 다
        const arrowFont = Math.min(colW * 0.08, 50);
        ['left', 'right'].forEach((dr, di) => {
          const arrow = document.createElementNS(ns, 'text');
          arrow.setAttribute('class', 'open-direction');
          arrow.setAttribute('font-size', arrowFont);
          arrow.setAttribute('text-anchor', 'middle');
          arrow.setAttribute('dominant-baseline', 'central');
          arrow.setAttribute('x', x + (dr === 'left' ? colW * 0.1 : colW * 0.9));
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = dr === 'left' ? '◀' : '▶';
          content.appendChild(arrow);
        });
      } else if (type === 'door') {
        // 단문 화살표 (기존)
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(colW * 0.15, 60));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (dir === 'left') {
          arrow.setAttribute('x', x + colW * 0.15);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', x + colW * 0.85);
          arrow.setAttribute('y', topY + topH * 0.12);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
      // W9-95: 먹장 (blank) 표시
      if (type === 'blank') {
        // 회색 cross-hatch
        const blankLab = document.createElementNS(ns, 'text');
        blankLab.setAttribute('x', x + colW/2);
        blankLab.setAttribute('y', topY + topH/2);
        blankLab.setAttribute('text-anchor', 'middle');
        blankLab.setAttribute('dominant-baseline', 'central');
        blankLab.setAttribute('font-size', Math.min(colW * 0.12, topH * 0.12, 40));
        blankLab.setAttribute('fill', '#fff');
        blankLab.textContent = '먹장';
        content.appendChild(blankLab);
        // rect 색을 회색으로 override
        r.setAttribute('fill', '#a89c84');
        lab.setAttribute('opacity', 0);   // 도어 라벨 숨김
      }
      xAcc += colW;   // 다음 cell
    }

    // 하부 (도어+서랍 모드일 때만)
    if (s.horizontalLayout === 'doorTopDrawerBottom' && drawerH > 0) {
      const fill = colorForArea(cfg.fill, s.bottomType);
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('class', 'area-rect');
      r.setAttribute('x', offsetX);
      r.setAttribute('y', drawerY);
      r.setAttribute('width', m.W);
      r.setAttribute('height', drawerH);
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', cfg.stroke);
      r.setAttribute('stroke-width', 2);
      if (s.bottomType === 'open') r.setAttribute('stroke-dasharray', '8 4');
      content.appendChild(r);

      const labFont = Math.min(m.W * 0.06, drawerH * 0.4, 70);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('class', 'area-label');
      lab.setAttribute('x', offsetX + m.W/2);
      lab.setAttribute('y', drawerY + drawerH/2);
      lab.setAttribute('text-anchor', 'middle');
      lab.setAttribute('dominant-baseline', 'central');
      lab.setAttribute('font-size', labFont);
      const btmLab = { door:'도어', drawer:'서랍', open:'오픈' }[s.bottomType];
      lab.textContent = `${btmLab} H=${drawerH}`;
      if (s.bottomType === 'open') lab.setAttribute('fill', cfg.stroke);
      content.appendChild(lab);

      if (s.bottomType === 'door') {
        const arrow = document.createElementNS(ns, 'text');
        arrow.setAttribute('class', 'open-direction');
        arrow.setAttribute('font-size', Math.min(m.W * 0.04, 50));
        arrow.setAttribute('text-anchor', 'middle');
        arrow.setAttribute('dominant-baseline', 'central');
        if (s.bottomDirection === 'left') {
          arrow.setAttribute('x', offsetX + m.W * 0.06);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '◀';
        } else {
          arrow.setAttribute('x', offsetX + m.W * 0.94);
          arrow.setAttribute('y', drawerY + drawerH * 0.5);
          arrow.textContent = '▶';
        }
        content.appendChild(arrow);
      }
    }

    // 선반 — 모듈 내부 (offsetY 기준)
    // 정면도 Y down: 선반 위치 y = offsetY + (m.H - shelf_mm)
    s.shelves.forEach(sh => {
      if (sh < 0 || sh > m.H) return;
      const y = offsetY + m.H - sh;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('class', 'shelf-line');
      line.setAttribute('x1', offsetX + 8);
      line.setAttribute('y1', y);
      line.setAttribute('x2', offsetX + m.W - 8);
      line.setAttribute('y2', y);
      content.appendChild(line);
      const lab = document.createElementNS(ns, 'text');
      lab.setAttribute('x', offsetX + m.W - 12);
      lab.setAttribute('y', y - 6);
      lab.setAttribute('text-anchor', 'end');
      lab.setAttribute('font-size', Math.min(m.W * 0.02, 24));
      lab.setAttribute('fill', '#5a4d2f');
      lab.setAttribute('font-family', 'monospace');
      lab.textContent = `H=${sh}`;
      content.appendChild(lab);
    });

    // W9-102: 마감재 (finishings) 정면도 표시 — 모듈 옆/위 (EP/몰딩/휠라)
    if (Array.isArray(m.finishings)) {
      m.finishings.forEach((f) => {
        if (!f.W || !f.H) return;
        // 평면도 절대 좌표 → 정면도 (offset 기준 모듈 안 상대 X)
        const fx = (f.x || 0) - (m.x || 0);   // 모듈 좌측 기준 상대 X
        const fH = f.H || m.H;
        const fY = offsetY + m.H - fH;        // 모듈 바닥 기준 H 위쪽
        const finColor = f.section === 'ep' ? '#7a6a45'
                       : f.section === 'molding' ? '#5a4d2f'
                       : f.section === 'filler' ? '#8a7858'
                       : '#7a6a45';
        const fr = document.createElementNS(ns, 'rect');
        fr.setAttribute('x', offsetX + fx);
        fr.setAttribute('y', fY);
        fr.setAttribute('width', f.W);
        fr.setAttribute('height', fH);
        fr.setAttribute('fill', finColor);
        fr.setAttribute('stroke', '#000');
        fr.setAttribute('stroke-width', 2);
        fr.setAttribute('opacity', 0.9);
        content.appendChild(fr);
      });
    }

    // 외곽 치수 라벨 (W / H)
    const dimFont = Math.min(m.W, m.H) * 0.04;
    const dimW = document.createElementNS(ns, 'text');
    dimW.setAttribute('class', 'module-dim-label');
    dimW.setAttribute('x', offsetX + m.W/2);
    dimW.setAttribute('y', offsetY + m.H + dimFont*1.5);
    dimW.setAttribute('text-anchor', 'middle');
    dimW.setAttribute('font-size', dimFont);
    dimW.textContent = `W ${m.W}mm`;
    content.appendChild(dimW);
    const dimH = document.createElementNS(ns, 'text');
    dimH.setAttribute('class', 'module-dim-label');
    dimH.setAttribute('x', offsetX - dimFont*0.8);
    dimH.setAttribute('y', offsetY + m.H/2);
    dimH.setAttribute('text-anchor', 'end');
    dimH.setAttribute('dominant-baseline', 'central');
    dimH.setAttribute('font-size', dimFont);
    dimH.textContent = `H ${m.H}mm`;
    content.appendChild(dimH);
  }

  // ─────────────────────────────────────────────────────────────
  // 우측 패널 — 4 섹션 동적 렌더
  // ─────────────────────────────────────────────────────────────
  function renderRightPanel() {
    const m = modules.find(x => x.id === activeId);
    if (!m) {
      ['splitBody','areasBody','shelvesBody','handleBody'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="empty-msg">모듈 선택</div>';
      });
      return;
    }
    const s = getStructure(activeId);

    // 분할
    document.getElementById('splitBody').innerHTML = `
      <div class="row">
        <label>좌우 분할</label>
        <input type="number" min="1" max="6" step="1" id="inpVCount" value="${s.verticalCount}">
      </div>
      <div class="row">
        <label>상하 구성</label>
        <select id="selHLayout">
          <option value="doorOnly" ${s.horizontalLayout==='doorOnly'?'selected':''}>도어/서랍만</option>
          <option value="doorTopDrawerBottom" ${s.horizontalLayout==='doorTopDrawerBottom'?'selected':''}>상부 분할 + 하부 영역</option>
        </select>
      </div>
      ${s.horizontalLayout === 'doorTopDrawerBottom' ? `
        <div class="row">
          <label>하부 H (mm)</label>
          <input type="number" min="50" max="${m.H-50}" step="10" id="inpDrawerH" value="${s.drawerHeight}">
        </div>
      ` : ''}
    `;
    document.getElementById('inpVCount').oninput = (e) => {
      const v = Math.max(1, Math.min(6, parseInt(e.target.value)||1));
      s.verticalCount = v;
      while (s.areaTypes.length < v) { s.areaTypes.push('door'); s.areaDirections.push('left'); }
      s.areaTypes.length = v;
      s.areaDirections.length = v;
      renderFrontView(); renderRightPanel();
    };
    document.getElementById('selHLayout').onchange = (e) => {
      s.horizontalLayout = e.target.value;
      renderFrontView(); renderRightPanel();
    };
    const inpDr = document.getElementById('inpDrawerH');
    if (inpDr) inpDr.oninput = (e) => {
      const v = parseInt(e.target.value) || 200;
      s.drawerHeight = Math.max(50, Math.min(m.H-50, v));
      renderFrontView();
    };

    // 영역 타입
    let areaHTML = '';
    for (let i = 0; i < s.verticalCount; i++) {
      const t = s.areaTypes[i] || 'door';
      const d = s.areaDirections[i] || 'left';
      areaHTML += `
        <div class="area-row" data-idx="${i}">
          <span class="a-lab">#${i+1}</span>
          <select class="a-type">
            <option value="door"   ${t==='door'?'selected':''}>도어</option>
            <option value="drawer" ${t==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${t==='open'?'selected':''}>오픈</option>
            <option value="blank"  ${t==='blank'?'selected':''}>먹장</option>
          </select>
          ${t==='door' ? `
          <select class="a-dir">
            <option value="left"  ${d==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${d==='right'?'selected':''}>우 ▶</option>
          </select>` : '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'}
        </div>
      `;
    }
    if (s.horizontalLayout === 'doorTopDrawerBottom') {
      areaHTML += `
        <div style="margin-top:8px;padding-top:6px;border-top:2px solid var(--brand-mid);font-size:10px;color:var(--text-dim);font-weight:600">하부 영역</div>
        <div class="area-row">
          <span class="a-lab">하부</span>
          <select class="b-type">
            <option value="door"   ${s.bottomType==='door'?'selected':''}>도어</option>
            <option value="drawer" ${s.bottomType==='drawer'?'selected':''}>서랍</option>
            <option value="open"   ${s.bottomType==='open'?'selected':''}>오픈</option>
            <option value="blank"  ${s.bottomType==='blank'?'selected':''}>먹장</option>
          </select>
          ${s.bottomType==='door' ? `
          <select class="b-dir">
            <option value="left"  ${s.bottomDirection==='left'?'selected':''}>좌 ◀</option>
            <option value="right" ${s.bottomDirection==='right'?'selected':''}>우 ▶</option>
          </select>` : '<span style="font-size:9px;color:var(--text-faint);text-align:center">—</span>'}
        </div>
      `;
    }
    document.getElementById('areasBody').innerHTML = areaHTML;
    document.querySelectorAll('#areasBody .area-row').forEach(row => {
      const idx = row.dataset.idx;
      const tSel = row.querySelector('.a-type, .b-type');
      const dSel = row.querySelector('.a-dir, .b-dir');
      if (tSel) tSel.onchange = (e) => {

      if (dSel) dSel.onchange = (e) => {
        if (idx !== undefined) s.areaDirections[+idx] = e.target.value;
        else s.bottomDirection = e.target.value;

    // 선반
    let shelfHTML = '';
    s.shelves.forEach((sh, i) => {
      shelfHTML += `
        <div class="shelf-row">
          <input type="number" min="0" max="${m.H}" step="10" data-idx="${i}" value="${sh}">

    if (!s.shelves.length) shelfHTML = '<div style="color:var(--text-faint);font-size:10px;padding:4px 0">선반 없음</div>';
    shelfHTML += '<button class="add-btn" id="addShelf">+ 선반 추가</button>';
    document.getElementById('shelvesBody').innerHTML = shelfHTML;
    document.querySelectorAll('#shelvesBody input[type="number"]').forEach(inp => {
      inp.oninput = (e) => {
        const idx = +e.target.dataset.idx;
        const v = parseInt(e.target.value);
        if (isFinite(v)) { s.shelves[idx] = Math.max(0, Math.min(m.H, v)); renderFrontView(); }
      };
    });
    document.querySelectorAll('#shelvesBody button.del').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.dataset.idx;

    document.getElementById('addShelf').onclick = () => {

      s.shelves.push(Math.round(m.H / 2));

    // 손잡이
    document.getElementById('handleBody').innerHTML = `
      <div class="row">
        <label>타입</label>
        <select id="selHType">
          <option value="channel"   ${s.handleType==='channel'?'selected':''}>찬넬 (매립형)</option>
          <option value="c-channel" ${s.handleType==='c-channel'?'selected':''}>C찬넬</option>
          <option value="push"      ${s.handleType==='push'?'selected':''}>푸쉬 (Push-to-open)</option>
        </select>

      <div class="row">

          <option value="top"    ${s.handlePosition==='top'?'selected':''}>상</option>
          <option value="middle" ${s.handlePosition==='middle'?'selected':''}>중</option>
          <option value="bottom" ${s.handlePosition==='bottom'?'selected':''}>하</option>

    document.getElementById('selHType').onchange = (e) => { s.handleType = e.target.value; };
    document.getElementById('selHPos').onchange  = (e) => { s.handlePosition = e.target.value; };
  }

  // ─────────────────────────────────────────────────────────────
  // 캔버스 인터랙션 — 휠/팬/단축키
  // ─────────────────────────────────────────────────────────────
  function attachCanvasHandlers() {
    const wrap = document.getElementById('canvasWrap');
    const svg  = document.getElementById('frontSvg');
    // 휠 줌
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
      const newZoom = Math.max(0.05, Math.min(8, view.zoom * factor));
      const wx = (mx - view.panX) / view.zoom;
      const wy = (my - view.panY) / view.zoom;
      view.zoom = newZoom;
      view.panX = mx - wx * newZoom;
      view.panY = my - wy * newZoom;
      applyView();
    }, { passive: false });
    // pan
    let panInfo = null;
    svg.addEventListener('pointerdown', (e) => {
      panInfo = { sx: e.clientX, sy: e.clientY, ox: view.panX, oy: view.panY };
      svg.setPointerCapture(e.pointerId);
      svg.style.cursor = 'grabbing';
    });
    svg.addEventListener('pointermove', (e) => {
      if (!panInfo) return;
      view.panX = panInfo.ox + (e.clientX - panInfo.sx);
      view.panY = panInfo.oy + (e.clientY - panInfo.sy);
      applyView();
    });
    const endPan = () => { panInfo = null; svg.style.cursor = ''; };
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);
    // 키보드
    document.addEventListener('keydown', (e) => {
      if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); fitToActiveModule(); }
      if (e.key === '0') { e.preventDefault(); view.zoom = 1; view.panX = 0; view.panY = 0; applyView(); }
      if (e.key === 'l' || e.key === 'L') { document.getElementById('moduleList').classList.toggle('collapsed'); }
      if (e.key === 'r' || e.key === 'R') { document.getElementById('rightPanel').classList.toggle('collapsed'); }
    });
  }

  // 토스트
  function showToast(text) {
    const wrap = document.getElementById('canvasWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
