      view.panX = mx - wx * newZoom;
      view.panY = my - wy * newZoom;
      applyView();
    }, { passive: false });
    // pan
    //
    // W12-30: 예전엔 pointerdown 에서 곧바로 setPointerCapture 를 걸었다.
    //   포인터 캡처는 이후 이벤트를 **전부 SVG 로 돌려보내므로**, 자식(모듈 외곽·칸)의
    //   click 핸들러가 실제 마우스로는 한 번도 불리지 않았다 — 정면도에서 모듈을
    //   고르지 못하던 것도 이 때문이다. (dispatchEvent 로는 멀쩡히 동작해서
    //   테스트로는 안 잡혔다.)
    //   이제 **실제로 움직인 뒤에만** 팬으로 넘어간다. 그 전까지는 클릭이다.
    const PAN_SLOP = 4;   // px — 손떨림은 클릭으로 본다
    let panInfo = null;
    svg.addEventListener('pointerdown', (e) => {
      panInfo = { sx: e.clientX, sy: e.clientY, ox: view.panX, oy: view.panY, id: e.pointerId, moved: false };
    });
    svg.addEventListener('pointermove', (e) => {
      if (!panInfo) return;
      const dx = e.clientX - panInfo.sx;
      const dy = e.clientY - panInfo.sy;
      if (!panInfo.moved) {
        if (Math.abs(dx) < PAN_SLOP && Math.abs(dy) < PAN_SLOP) return;
        panInfo.moved = true;
        try { svg.setPointerCapture(panInfo.id); } catch (_) {}
        svg.style.cursor = 'grabbing';
      }
      view.panX = panInfo.ox + dx;
      view.panY = panInfo.oy + dy;
      applyView();
    });
    const endPan = () => { panInfo = null; svg.style.cursor = ''; };
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);
    // 키보드
    document.addEventListener('keydown', (e) => {
      if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
      if (e.key === 'f' || e.key === 'F') { e.preventDefault(); fitToActiveModule(); }
      if (e.key === '0') { e.preventDefault(); view.zoom = 1; view.panX = 0; view.panY = 0; applyView(); }
      if (e.key === 'l' || e.key === 'L') { document.getElementById('moduleList').classList.toggle('collapsed'); }
      if (e.key === 'r' || e.key === 'R') { document.getElementById('rightPanel').classList.toggle('collapsed'); }
    });
  }

  // 토스트
  function showToast(text) {
    const wrap = document.getElementById('canvasWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }

  // ─────────────────────────────────────────────────────────────
  // BottomBar 액션
  // ─────────────────────────────────────────────────────────────
  document.getElementById('reloadBtn').onclick = () => {
    loadModules();
    loadPerson();   // W9-105
    renderModuleList();
    if (modules.length && !modules.find(m => m.id === activeId)) setActiveModule(modules[0].id);
    showToast(`📥 배치 로드 (모듈 ${modules.length}개)`);
  };
  document.getElementById('saveBtn').onclick = () => {
    persistPlannerState();
    showToast(`💾 구조 저장 (모듈 ${Object.keys(structures).length}개)`);
  };
  // W11-9: 여기가 업무 루프의 끊긴 지점이었다.
  // 이 페이지는 detaildesign.html 의 Step 2 안에서 iframe 으로 도는데,
  // "다음" 이 alert 만 띄우고 끝나 BOM(Step 3) 으로 갈 방법이 없었다.
  // 부모에게 알려 Step 3 로 진행시킨다. 부모가 없으면(단독 접속) 안내만 한다.
  /**
   * W11-11/W11-14: 배치+구조를 부모(detaildesign)로 넘겨 BOM 의 입력이 되게 한다.
   * 이전에는 structures 가 localStorage 에만 남아 BOM 에 전혀 반영되지 않았다.
   * 가전(sink/hood/dishwasher/...)도 함께 보낸다 — 부모가 X 범위 겹침으로
   * 개수대/후드장을 판정하는 데 쓴다.
   */
  function buildPlannerPayload(type) {
    // 마감재는 **모듈이 아니라 모듈에 붙는 부속**이다. 브리지도 그렇게 받는다
    // (loadModulesLegacy 가 배치의 마감재를 가장 가까운 모듈의 finishings 로
    //  접어 넣던 것과 같은 규칙 — 나가는 길에서도 같게 맞춘다).
    const real = modules.filter((m) => !isFinishingSection(m.section));
    const fins = modules.filter((m) => isFinishingSection(m.section));
    const extra = {};
    fins.forEach((f) => {
      let best = null, bestD = Infinity;
      real.forEach((m) => {
        const d = Math.hypot((f.x + f.W / 2) - (m.x + m.W / 2), (f.y || 0) - (m.y || 0));
        if (d < bestD) { bestD = d; best = m; }
      });
      if (!best) return;
      (extra[best.id] || (extra[best.id] = [])).push({
        section: f.section, W: f.W, H: f.H, D: f.D, x: f.x, y: f.y,
      });
    });
    return {
      type: type,
      source: 'mockup-structure',
      modules: real.map((m) => ({
        id: m.id,
        section: m.section,
        W: m.W,
        H: m.H,
        D: m.D,
        x: m.x,
        y: m.y,
        rotation: m.rotation,
        isFixed: !!m.isFixed,
        // CD-3: 도면에 붙인 마감재(EP/몰딩/휠라). 예전엔 payload 에서 빠져
        // 부모가 알 수 없었고, BOM 은 Step2 스펙의 finishLeft/RightType 만 봤다.
        // 그래서 플래너에서 마감재를 아무리 배치해도 자재에 반영되지 않았다.
        finishings: (m.finishings || []).map((f) => ({
          section: f.section, W: f.W, H: f.H, D: f.D, x: f.x, y: f.y,
        })).concat(extra[m.id] || []),   // 구조 단계에서 넣은 마감재도 같이
      })),
      structures: structures,
      // 자동계산을 한 번이라도 돌렸는지 — 부모가 안내에 쓴다
      hasStructures: Object.keys(structures || {}).length > 0,
    };
  }

  function sendPlannerState(type) {
    if (!window.parent || window.parent === window) return false;
    try {
      window.parent.postMessage(buildPlannerPayload(type), '*');
      return true;
    } catch (e) {
      return false;
    }
  }

  // W11-14: 부모(툴바 "BOM 산출")가 언제든 현재 상태를 요청할 수 있게 한다.
  // "다음" 을 누르지 않아도 BOM 으로 갈 수 있어야 한다.
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'REQUEST_PLANNER_STATE') return;
    persistPlannerState();
    sendPlannerState('PLANNER_STATE');
  });

  document.getElementById('nextBtn').onclick = () => {
    persistPlannerState();
    if (sendPlannerState('PLANNER_DONE')) {
      showToast('구조 저장 · BOM 산출로 이동합니다');
      return;
    }
    alert(
      '구조를 저장했습니다.\n\n' +
        'BOM 산출은 상세설계 화면에서 진행합니다.\n' +
        '이 페이지를 상세설계(Step 2) 안에서 열면 자동으로 넘어갑니다.'
    );
  };

  // 패널 토글 버튼
  document.getElementById('btnLeft').onclick = (e) => {
    document.getElementById('moduleList').classList.toggle('collapsed');
    e.currentTarget.classList.toggle('on');
  };
  document.getElementById('btnRight').onclick = (e) => {
    document.getElementById('rightPanel').classList.toggle('collapsed');
    e.currentTarget.classList.toggle('on');
  };

  // ─────────────────────────────────────────────────────────────
  // W9-64: 3D Scene (Three.js) — planner-vite App.tsx 패턴 참고
  // ─────────────────────────────────────────────────────────────
  let three = null;  // { renderer, scene, camera, controls, moduleGroup }
  let currentView = '3d';  // '3d' | '2d'

  // W9-67/W9-68: 원점/천정 정보 — mockup-shell.html 의 'dadam_origin_v1' 에서 로드
  let ceilingHeight = 2300;
  let originPos2D = { x: 0, y: 0 };  // 평면도 SVG 좌표
  // W9-105: 사람 원 위치 (정면도 X 원점 기준) — layout.person 에서 로드
  let personPos = null;   // { cx, cy } 또는 null
  (function loadOrigin() {
    try {
      const raw = localStorage.getItem(ORIGIN_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        if (typeof o.ceiling === 'number') ceilingHeight = o.ceiling;
        if (typeof o.x === 'number' && typeof o.y === 'number') {
          originPos2D = { x: o.x, y: o.y };
        }
      }
    } catch (e) {}
  })();
  function loadPerson() {
    try {
      const raw = localStorage.getItem(LAYOUT_KEY);
      if (raw) {
        const layout = JSON.parse(raw);
        if (layout.person && typeof layout.person.cx === 'number') {
          personPos = { cx: layout.person.cx, cy: layout.person.cy };
          return;
        }
      }
    } catch (e) {}
    personPos = null;
  }
  // W9-105: 정면도 X 원점 — 사람 원 우선, 없으면 모듈 원점
  function getFrontViewOriginX() {
    return (personPos && typeof personPos.cx === 'number') ? personPos.cx : originPos2D.x;
  }

  // section 별 모듈 base Y (바닥 또는 천정 매달림)
  // W9-69: hood 도 천정 매달림 추가
  /**
   * 모듈의 바닥 높이. 섹션 기본(getBaseY) 위에 **모듈이 직접 정한 값**을 우선한다.
   *
   * 키큰장·냉장고장 자동계산은 한 영역 안에 모듈을 세로로 쌓는다. 그때는
   * 섹션만으로 높이를 정할 수 없어(같은 'tall' 이 셋) 모듈이 자기 자리를 갖는다.
   */
  function baseYOf(m) {
    if (!m) return 0;
    const v = parseFloat(m.baseY);
    return Number.isFinite(v) ? v : getBaseY(m.section, m.H);
  }

  function getBaseY(section, moduleH) {
    if (section === 'upper' || section === 'hood') {
      // 상부장/후드: 천정 매달림 — top = ceiling, base = ceiling - moduleH
      return ceilingHeight - moduleH;
    }
    // 하부/키큰/냉장고/분배기/식세기: 바닥에서 시작
    return 0;
  }

  function init3D() {
    if (three || !window.THREE) return;
    const canvas = document.getElementById('canvas3d');
    const wrap = document.getElementById('canvasWrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(w, h, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf4efe7);

    const camera = new THREE.PerspectiveCamera(45, w / h, 10, 50000);
    camera.position.set(2000, 1200, 3000);

    // 조명 (planner-vite App.tsx 패턴)
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.8);
    d1.position.set(5000, 8000, 5000); d1.castShadow = true;
    d1.shadow.mapSize.set(1024, 1024);
    scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.6);
    d2.position.set(-3000, 4000, -3000);
    scene.add(d2);

    // Ground grid + plane
    const grid = new THREE.GridHelper(6000, 30, 0xb8956c, 0xe5e0d4);
    grid.position.y = 0;
    scene.add(grid);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xfaf6ee, roughness: 1.0 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // OrbitControls
    const controls = new window.OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 600, 0);
    controls.update();

    const moduleGroup = new THREE.Group();
    scene.add(moduleGroup);

    three = { renderer, scene, camera, controls, moduleGroup };

    // W9-79/80: Raycaster + click 핸들러 — entity 클릭 시 우측 패널 갱신
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downXY = null;
    canvas.addEventListener('pointerdown', (e) => { downXY = { x: e.clientX, y: e.clientY }; });
    canvas.addEventListener('pointerup', (e) => {
      if (!downXY) return;
      const dx = Math.abs(e.clientX - downXY.x);
      const dy = Math.abs(e.clientY - downXY.y);
      downXY = null;
      if (dx > 4 || dy > 4) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      pointer.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(moduleGroup.children, true);
      const picked = pickEntityHit(hits);
      if (picked) handleEntityClick(picked);
    });

    // Resize handler
    window.addEventListener('resize', () => {
      if (!three) return;
      const cw = wrap.clientWidth, ch = wrap.clientHeight;
      three.renderer.setSize(cw, ch, false);
      three.camera.aspect = cw / ch;
      three.camera.updateProjectionMatrix();
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      three.controls.update();
      keepDoorEdgesVisible();
      three.renderer.render(three.scene, three.camera);
    }
    animate();
    // three 가 준비된 시점에 한 번 그린다. init3D 는 three-ready 이벤트로 늦게 올 수
    // 있어서, 초기화 쪽에서 부른 renderAll3D 가 three 없이 빈손으로 돌아갔을 수 있다.
    try { renderAll3D({ fit: false }); } catch (_) {}
  }

  // W9-82/83: 이전 highlight 추적 (해제용)
  //   - prevHighlighted: 단일 mesh emissive (도어/마감재/선반)
  //   - prevHighlightedGroup: 모듈 단위 — { meshes: [...], prevEmissives: [...] }
  let prevHighlighted = null;
  let prevEmissive = null;
  let prevHighlightedGroup = null;

  function clearHighlight() {
    if (prevHighlighted && prevHighlighted.material && prevEmissive !== null) {
      prevHighlighted.material.emissive && prevHighlighted.material.emissive.setHex(prevEmissive);
    }
    prevHighlighted = null;
    prevEmissive = null;
    if (prevHighlightedGroup) {
      prevHighlightedGroup.meshes.forEach((mh, i) => {
        if (mh.material && mh.material.emissive) {
          mh.material.emissive.setHex(prevHighlightedGroup.prevEmissives[i]);
        }
      });
      prevHighlightedGroup = null;
    }
  }

  function highlightModuleGroup(modG) {
    // 모듈 그룹 내 모든 carcass mesh 에 emissive (전체가 빛나도록)
    const meshes = [];
    const prevEms = [];
    modG.traverse((ch) => {
      if (ch.isMesh && ch.material && ch.material.emissive && ch.userData && ch.userData.entityKind === 'carcass') {
        meshes.push(ch);
        prevEms.push(ch.material.emissive.getHex());
        ch.material.emissive.setHex(0xffaa00);
      }
    });
    prevHighlightedGroup = { meshes, prevEmissives: prevEms };
  }

  // W9-79/80: 클릭된 entity → 우측 패널 갱신 + 선택 시각 효과 (init3D 밖 글로벌)
  /**
   * raycast 결과에서 실제로 고를 대상을 정한다.
   *
   * 영역 상자는 모듈을 **감싸고** 있어 언제나 먼저 맞는다. `hits[0]` 을 그대로 쓰면
   * 모듈을 눌러도 영역이 선택되고, setActiveArea 가 팔레트를 닫아 버린다 —
   * 모듈을 만든 뒤 팔레트를 다시 열 수 없던 원인이 이것이었다.
   * 안에 든 것을 먼저 보고, 영역은 아무것도 없을 때만 고른다.
   *
   * three.js 없이 검사할 수 있도록 따로 뺐다. 예전엔 이 판단이 클릭 핸들러 안에
   * 묻혀 있어, handleEntityClick 을 직접 부르는 테스트가 버그를 통과시켰다.
   */
  function pickEntityHit(hits) {
    if (!hits || !hits.length) return null;
    const kindOf = (h) => (h && h.object && h.object.userData && h.object.userData.entityKind) || null;
    const inner = hits.find((h) => { const k = kindOf(h); return k && k !== 'area'; });
    return (inner || hits[0]).object;
  }

  function handleEntityClick(mesh) {
    if (!mesh) return;
    // 영역을 누르면 모듈이 아니라 영역이 선택된다 — 추가/제거 버튼이 뜬다.
    if (mesh.userData && mesh.userData.entityKind === 'area') {
      clearHighlight();
      setActiveArea(mesh.userData.areaId);
      if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: false }); } catch (_) {} }
      return;
    }
    clearHighlight();
    // mesh.userData 우선, 없으면 부모 traverse
    const meshUd = mesh.userData || {};
    const kind = meshUd.entityKind;
    // W9-83: carcass 클릭 → 모듈 그룹 전체 highlight
    if (kind === 'carcass') {
      let modG = mesh.parent;
      while (modG && (!modG.userData || modG.userData.entityKind !== 'module')) modG = modG.parent;
      if (modG) highlightModuleGroup(modG);
    } else if (mesh.material && mesh.material.emissive && kind && kind !== 'finishing-edge' && kind !== 'carcass-line') {
      // 단일 entity (마감재/선반) → 자기 자신만 emissive
      prevHighlighted = mesh;
      prevEmissive = mesh.material.emissive.getHex();
      mesh.material.emissive.setHex(0xffaa00);
    }
    let cur = mesh, ud = null;
    while (cur) {
      if (cur.userData && cur.userData.entityKind) { ud = cur.userData; break; }
      cur = cur.parent;
    }
    if (!ud) return;
    if (meshUd.entityKind && meshUd.entityKind !== 'module') ud = meshUd;
    const moduleId = ud.moduleId;
    // W12-32: 이미 고른 모듈을 다시 눌러도 할 일이 없다 — 우측 패널이 이미
    //   그 모듈을 보여주고 있다. 예전엔 여기가 팔레트를 여는 유일한 길이었다.
    if (moduleId && moduleId !== activeId) {
      if (viewMode === 'single') {
        setActiveModule(moduleId);
      } else {
        const m = modules.find(x => x.id === moduleId);
        if (m) {
          activeId = moduleId;
          panelTarget = 'module';
          const nameEl = document.getElementById('curModuleName');
          if (nameEl) {
            const idx = parseInt(moduleId.split('-')[1] || 0) + 1;
            nameEl.textContent = SECTION_CONFIG[m.section].label + ' #' + idx;
          }
          renderRightPanel();   // 세트/전체 모드에서도 옵션을 만질 수 있어야 한다
        }
      }
    }
    let msg = '';
    if (ud.entityKind === 'finishing') {
      msg = '🎯 마감재: ' + (SECTION_CONFIG[ud.finishingSection] && SECTION_CONFIG[ud.finishingSection].label || ud.finishingSection);
    } else if (ud.entityKind === 'blank') {
      msg = '🎯 먹장 (blank panel)';
    } else if (ud.entityKind === 'brace') {
      msg = '🎯 처짐방지목 (가운데 분리판)';
    } else if (ud.entityKind === 'leg') {
      // 마스터 상수가 아니라 이 모듈의 실효값을 읽는다 — 모듈별로 다를 수 있다.
      const _lm = modules.find(x => x.id === ud.moduleId);
      msg = '🎯 다리발 (H=' + legHOf(_lm, getStructure(ud.moduleId)) + 'mm)';
    } else if (ud.entityKind === 'toe-kick') {
      const _km = modules.find((x) => x.id === ud.moduleId);
      msg = '🎯  걸레받이 (H=' + Math.max(0, legHOf(_km || { section: 'lower' }, getStructure(ud.moduleId)) - KICK_FLOOR_GAP)
          + 'mm · 18T · 앞선에서 ' + KICK_SETBACK + 'mm 안쪽)';
    } else if (ud.entityKind === 'molding') {
      const _mm = modules.find(x => x.id === ud.moduleId);
      msg = '🎯 상몰딩 (H=' + moldingHOf(_mm || { section: 'upper' }, getStructure(ud.moduleId)) + 'mm)';
    } else if (ud.entityKind === 'handle') {
      msg = '🎯 목찬넬 (전면 ' + MASTER_RULES.CHANNEL_FRONT_W + 'mm × ' + ud.position + ')';
    } else if (ud.entityKind === 'module' || ud.entityKind === 'carcass') {
      const m2 = modules.find(x => x.id === ud.moduleId);
      const lbl = m2 ? SECTION_CONFIG[m2.section].label : '모듈';
      msg = '🎯 ' + lbl + ' 선택';
    } else if (ud.entityKind === 'shelf') {
      msg = '🎯 선반 ' + ((ud.shelfIdx || 0) + 1);
    }
    if (msg && typeof showToast === 'function') showToast(msg);
  }

  // 헬퍼: BoxGeometry 한 면을 mesh 로
  function makeBox(w, h, d, color, opts = {}) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      metalness: opts.metalness ?? 0.05,
      roughness: opts.roughness ?? 0.65,
      transparent: !!opts.transparent,
      opacity:     opts.opacity ?? 1.0,
      wireframe:   !!opts.wireframe,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  // W9-100: mesh 외곽에 얇은 검은 테두리 — 각 부재 (측판/천지판/선반/도어/마감재) 구별
  function addEdgeOutline(mesh, parent, color, opacity) {
    if (!mesh || !mesh.geometry) return;
    const edges = new THREE.EdgesGeometry(mesh.geometry);
    const mat = new THREE.LineBasicMaterial({
      color: color != null ? color : 0x000000,
      transparent: true,
      opacity: opacity != null ? opacity : 0.6,
      linewidth: 1,
    });
    const line = new THREE.LineSegments(edges, mat);
    line.position.copy(mesh.position);
    line.rotation.copy(mesh.rotation);
    line.userData = { entityKind: 'edge' };
    parent.add(line);
    return line;
  }

  // W9-115: 상몰딩 mesh (상부장 상단 마감) — m.section==='upper' 또는 'fridge'
  // 상판 (하부장 천장 마감) · 좌대 (키큰장/냉장고장 바닥 받침).
  //   몸통이 heightPartsOf 기준으로 줄어든 만큼 그 자리를 실제로 채운다.
  //   안 그리면 3D 에 설명 없는 빈 틈으로 보인다.
  /**
   * 상판은 **배치 공간 단위** 부재다 (W12-38) — 런 전체를 한 장이 덮는다.
   * 모듈 폭에 맞추면 모듈마다 이음매가 생기고 마감재 자리가 빈다.
   * 영역의 **첫 모듈에만** 그리고, 폭·깊이·자리는 영역에서 받는다.
   */
  function addTopPanel(parent, m, cfg, s) {
    const t = topTOf(m, s);
    if (t <= 0) return;
    const area = areaOfModule(m);
    let W = m.W, D = m.D, dx = 0, dz = 0;
    if (area) {
      const first = modules.find((x) => x.areaId === area.id && !x.isFinishing);
      if (first && first.id !== m.id) return;         // 런에 한 장
      W = area.W; D = area.D;
      // 모듈 로컬 좌표 — 영역과 모듈이 같은 각으로 도므로 회전 전 차이를 그대로 쓴다.
      dx = ((area.x || 0) + area.W / 2) - ((m.x || 0) + m.W / 2);
      dz = ((area.y || 0) + area.D / 2) - ((m.y || 0) + m.D / 2);
    }
    const panel = makeBox(W, t, D, darken3(cfg.fill, 0.12), { roughness: 0.5, metalness: 0.1 });
    panel.position.set(dx, m.H - moldingHOf(m, s) - t / 2, dz);
    panel.userData = { entityKind: 'top-panel', moduleId: m.id };
    parent.add(panel);
    addEdgeOutline(panel, parent, 0x000000, 0.7);
  }
  // W12-41: 걸레받이 — 하부장 다리발 자리를 앞에서 막는 판.
  //   치수는 BOM(`js/detaildesign/extractors.js`)이 정본이다:
  //     MDF 18T · 폭 = 런 전폭 · 높이 = 다리발 − 5
  //   5mm 는 바닥 여유다 — 판은 다리발에 걸려 있고 바닥에 닿지 않는다.
  //   앞선에서 **40mm 물러선다** (발끝 자리).
  const KICK_T = 18;
  const KICK_SETBACK = 40;
  const KICK_FLOOR_GAP = 5;

  /**
   * 상판과 같이 **배치 공간 단위** 부재다 — 런 전체를 한 장이 막는다
   * (BOM 도 폭을 effectiveW 로 잡는다). 영역의 첫 모듈에만 그린다.
   * 좌대를 고르면 다리발이 없으므로 걸레받이도 없다.
   */
  /** 앞선 (모듈 로컬 z) — 배치 공간 앞면, 도어 앞면과 같은 평면 */
  function frontLineLocal(m) {
    const area = areaOfModule(m);
    return area
      ? ((area.y || 0) + area.D) - ((m.y || 0) + m.D / 2)
      : m.D / 2 + DOOR_T;
  }

  /** 걸레받이 뒷면 (모듈 로컬 z). 걸레받이가 없으면 null — 다리발이 그만큼 물러난다. */
  function toeKickBackZ(m, s) {
    if (!m || m.section !== 'lower') return null;
    if (legHOf(m, s) <= KICK_FLOOR_GAP) return null;
    return frontLineLocal(m) - KICK_SETBACK - KICK_T;
  }

  function addToeKick(parent, m, cfg, s) {
    if (m.section !== 'lower') return;
    // 이름을 legH 로 두지 않는다 — 3D 렌더러에서 `legH` 는 **몸통 바닥 offset**
    // (다리발 또는 좌대)을 뜻하는 이름이고, 여기 값은 다리발 부재 높이다.
    const legPartH = legHOf(m, s);
    if (legPartH <= KICK_FLOOR_GAP) return;
    const area = areaOfModule(m);
    let W = m.W, dx = 0;
    if (area) {
      const hosts = modules.filter((x) => x.areaId === area.id && !x.isFinishing);
      if (hosts.length && hosts[0].id !== m.id) return;   // 런에 한 장
      // W12-43: 폭은 **모듈 구간**이다 — 영역 전폭이 아니다. 마감재(몰딩·휠라)는
      //   바닥까지 내려오므로, 영역 전폭으로 잡으면 걸레받이가 그 판을 관통한다
      //   (실측 18mm). 상판은 마감재 **위**를 지나가므로 영역 전폭 그대로다.
      const x0 = Math.min(...hosts.map((x) => x.x || 0));
      const x1 = Math.max(...hosts.map((x) => (x.x || 0) + (x.W || 0)));
      W = x1 - x0;
      dx = (x0 + W / 2) - ((m.x || 0) + m.W / 2);
    }
    const h = legPartH - KICK_FLOOR_GAP;
    const kick = makeBox(W, h, KICK_T, darken3(cfg.fill, 0.28), { roughness: 0.7, metalness: 0.04 });
    kick.position.set(dx, KICK_FLOOR_GAP + h / 2, toeKickBackZ(m, s) + KICK_T / 2);
    kick.userData = { entityKind: 'toe-kick', moduleId: m.id };
    parent.add(kick);
    addEdgeOutline(kick, parent, 0x000000, 0.7);
  }

  function addPedestal(parent, m, cfg, s) {
    const h = pedestalHOf(m, s);
    if (h <= 0) return;
    const ped = makeBox(m.W, h, m.D, darken3(cfg.fill, 0.3), { roughness: 0.6, metalness: 0.05 });
    ped.position.set(0, h / 2, 0);
    ped.userData = { entityKind: 'pedestal', moduleId: m.id };
    parent.add(ped);
    addEdgeOutline(ped, parent, 0x000000, 0.7);
  }

  function addCrownMolding(parent, m, cfg, s) {
    const moldingH = moldingHOf(m, s);   // 상수가 아니라 이 모듈의 실효값
    if (moldingH <= 0) return;
    // W12-37: 상몰딩 앞면은 **도어 앞선**에 맞는다. 몸통 앞면에 맞추면 도어
    //   두께만큼 안쪽으로 들어가 앞선이 계단처럼 꺾인다 — 상몰딩은 그 선을
    //   따라가는 마감이다. 뒷면은 몸통 뒷면 그대로라 깊이가 도어 두께만큼 는다.
    //   도어는 몸통 상단에서 끝나므로(높이 = 몸통) 세로로 겹치지 않는다.
    const W = m.W, D = m.D + DOOR_T;
    const moldColor = darken3(cfg.fill, 0.2);   // 카르카스보다 어둡게 (마감 식별)
    const mold = makeBox(W, moldingH, D, moldColor, { roughness: 0.5, metalness: 0.1 });
    mold.position.set(0, m.H - moldingH / 2, DOOR_T / 2);
    mold.userData = { entityKind: 'molding', moduleId: m.id };
    parent.add(mold);
    addEdgeOutline(mold, parent, 0x000000, 0.7);
  }

  // W9-117: 목찬넬 (channel handle) mesh — 마스터 매립형
  //   handlePosition: lower → 'top' (도어 상단), upper → 'bottom' (도어 하단), 기타 → 'middle'
  //   전면 채널: 가로 (모듈 W) × 세로 52mm × 두께 작은 (도어 뒷면 안쪽)
  function addHandle(parent, m, s, cfg) {
    // W12-6: 알루미늄 찬넬을 **직접 고른** 모듈에만 붙는다. 예전엔 기본값이
    // 'channel' 이라 전 섹션에 회색 막대가 붙어 있었다.
    if (handleTypeOf(m, s) !== 'alu-channel') return;
    const W = m.W, D = m.D, T = BODY_T;
    const CW = MASTER_RULES.CHANNEL_FRONT_W;       // 52
    const CDEPTH = MASTER_RULES.CHANNEL_DEPTH;     // 12
    // 본체 Y 범위 (다리발 + 상몰딩 빼고)
    // legH 라는 이름은 하부장 시절 그대로다. 실제로는 **몸통 바닥 offset** —
    // 하부장이면 다리발, 키큰장/냉장고장이면 좌대다.
    const legH = baseOffsetOf(m, s);
    const moldingH = moldingHOf(m, s);
    // 몸통은 heightPartsOf 합을 뺀 값이 정본이다. 예전엔 H - legH - moldingH 로
    // 계산해 하부장 상판 12mm·키큰장 좌대 60mm 를 빠뜨렸다.
    const carcassH = bodyHeightOf(m, s);
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? (s.drawerHeight || 200) : 0;
    // 채널 Y 위치 — 도어 영역의 끝
    const doorBottom = legH + drawerH;   // 도어 영역 하단
    const doorTop = legH + carcassH;     // 도어 영역 상단 (본체 천장)
    let chY;
    if (s.handlePosition === 'top') {
      chY = doorTop - CW / 2 - MASTER_RULES.DOOR_GAP;       // 도어 상단 안쪽
    } else if (s.handlePosition === 'bottom') {
      chY = doorBottom + CW / 2 + MASTER_RULES.DOOR_GAP;    // 도어 하단 안쪽
    } else {
      chY = (doorBottom + doorTop) / 2;                     // 가운데
    }
    // 채널 mesh — 모듈 W 가로, 52 세로, 12 깊이 (도어 뒤 매립)
    const channelColor = '#888888';   // 알루미늄 톤
    const channel = makeBox(W - MASTER_RULES.DOOR_GAP, CW, CDEPTH, channelColor, {
      roughness: 0.3, metalness: 0.7,
    });
    // Z 위치: 도어 안쪽 (모듈 앞면 D/2 - CDEPTH/2)
    channel.position.set(0, chY, D / 2 - CDEPTH / 2);
    channel.userData = { entityKind: 'handle', moduleId: m.id, position: s.handlePosition };
    parent.add(channel);
    addEdgeOutline(channel, parent, 0x000000, 0.7);
  }

  /**
   * 몸통 껍데기 — 측판 2 · 뒤판 · 지판 · 천판. 모듈 하나에 한 벌만 만든다.
   *
   * 예전엔 셀마다 이 다섯을 만들었다(W9-87 "도어 개수 = 독립 캐비넷 개수").
   * 그래서 도어를 2장으로 늘리면 **수납장이 2개**로 보였고, 셀 경계에는
   * 측판이 두 장 맞붙어 두께도 두 배였다. 도어를 나누는 것과 몸통을 나누는 것은
   * 다른 일이다 — 여기서는 몸통만 만들고, 도어 분할은 셀이 맡는다.
   */
  /**
   * W12-5: 상단 전면 모서리를 도려낸 ㄱ자 단면 판재 (목찬넬 따내기).
   *
   * BoxGeometry 두 장을 붙이면 맞댄 자리에 없는 이음선이 그려진다. 그래서 단면을
   * Shape 로 그려 두께만큼 눌러 **한 장**으로 만든다. 단면은 XY 평면(x=깊이,
   * y=높이)에 그리고 rotateY(-90°) 로 두께 축을 X 로 돌린다 — 이때 깊이가 그대로
   * +Z(정면)로 간다. rotateY(+90°) 를 쓰면 깊이가 뒤집혀 따낸 자리가 뒤로 간다.
   */
  function makeNotchedPanel(T, h, d, notchH, notchD, color) {
    const shape = new THREE.Shape();
    const x0 = -d / 2, x1 = d / 2, y0 = -h / 2, y1 = h / 2;
    const nx = x1 - notchD;      // 따낸 자리의 안쪽(뒤) 경계
    const ny = y1 - notchH;      // 따낸 자리의 바닥
    shape.moveTo(x0, y0);
    shape.lineTo(x1, y0);
    shape.lineTo(x1, ny);
    shape.lineTo(nx, ny);
    shape.lineTo(nx, y1);
    shape.lineTo(x0, y1);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false });
    geo.translate(0, 0, -T / 2);
    geo.rotateY(-Math.PI / 2);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color), metalness: 0.05, roughness: 0.65,
    });
    return new THREE.Mesh(geo, mat);
  }

  function addCarcassShell(parent, o) {
    const cyMid = o.legH + o.carcassH / 2;
    const put = (mesh, side) => {
      mesh.userData = Object.assign({ side }, o.ud);
      parent.add(mesh);
      addEdgeOutline(mesh, parent);
    };
    // W12-5: 목찬넬이면 측판·칸막이를 통짜 대신 따낸 판으로 만든다.
    // 지면판이 설치공간 전폭(effectiveW)에 걸쳐 있으므로 칸막이도 같이 따낸다 —
    // 안 그러면 판이 칸막이를 뚫고 지나가는 그림이 된다.
    const notch = !!o.woodChannel;
    const sidePanel = () => (notch
      ? makeNotchedPanel(o.T, o.carcassH, o.D,
          MASTER_RULES.CHANNEL_NOTCH_H, MASTER_RULES.CHANNEL_NOTCH_D, o.color)
      : makeBox(o.T, o.carcassH, o.D, o.color));
    // W12-25: 뒤판은 **측판 사이**에 들어간다. 전폭으로 두면 측판과 두께만큼
    //   겹친다 (실측 18×700×18 두 곳). 부재는 서로 겹칠 수 없다.
    const back = makeBox(o.W - 2 * o.T, o.carcassH, o.T, o.color);
    back.position.set(0, cyMid, -o.D / 2 + o.T / 2);
    put(back, 'back');
    // 좌·우 측판 — 모듈 바깥 끝에만
    const left = sidePanel();
    left.position.set(-o.W / 2 + o.T / 2, cyMid, 0);
    put(left, 'left');
    const right = sidePanel();
    right.position.set(o.W / 2 - o.T / 2, cyMid, 0);
    put(right, 'right');
    // 지판 · 천판 — 측판 사이 전폭
    const inner = o.W - 2 * o.T;
    const bottom = makeBox(inner, o.T, o.D - o.T, o.color);
    bottom.position.set(0, o.legH + o.T / 2, o.T / 2);
    put(bottom, 'bottom');
    // 천판은 목찬넬 자리를 비켜 뒤로 물러난다 — 안 그러면 전면판과 같은 칸을 차지한다.
    // W12-40: 높이는 **몸통 상단**(legH + carcassH)이다. 예전엔 `o.H - moldingH`
    //   로 잡아 상판 두께만큼 위로 떠 있었다 — 측판은 몸통 상단에서 끝나는데
    //   천판만 12mm 더 올라가 상판과 겹쳤다 (실측 12mm). 목찬넬 자리를 잡는
    //   addWoodChannel 은 처음부터 legH + carcassH 를 쓰고 있었다.
    const topD = o.D - o.T - (notch ? MASTER_RULES.CHANNEL_NOTCH_D : 0);
    const top = makeBox(inner, o.T, topD, o.color);
    top.position.set(0, o.legH + o.carcassH - o.T / 2,
      o.T / 2 - (notch ? MASTER_RULES.CHANNEL_NOTCH_D / 2 : 0));
    put(top, 'top');
    if (notch) addWoodChannel(parent, o);
  }

  /**
   * W12-5: 따낸 자리를 채우는 목찬넬 두 장 (ㄴ자 단면).
   *
   *   지면판 40 × 18T 가 따낸 바닥에 깔리고, 그 위에 전면판 52 × 18T 가 선다.
   *   18 + 52 = 70 = 따내기 높이. 전면판은 따낸 자리의 **안쪽**에 서서 앞쪽
   *   40 − 18 = 22mm 를 손 넣을 자리로 비운다. 앞에 세우면 도어 위 30mm 틈을
   *   막아 손잡이 구실을 못 한다 (도어 H = 장H − 30, sink.md).
   *
   *   두 장 모두 18T MDF 로 BOM 상 EP(마감재)에 속한다 — 몸통(PB)과 색을 달리해
   *   3D 에서 구분되게 한다.
   */
  function addWoodChannel(parent, o) {
    const T = MASTER_RULES.CHANNEL_BOARD_T;
    const baseW = MASTER_RULES.CHANNEL_BACK_W;    // 지면판 폭 40
    const faceH = MASTER_RULES.CHANNEL_FRONT_W;   // 전면판 높이 52
    const topY = o.legH + o.carcassH;             // 몸통 상단 = 따낸 자리 윗면
    const frontZ = o.D / 2;
    const color = CHANNEL_COLOR;
    const put = (mesh, side) => {
      mesh.userData = Object.assign({ side }, o.ud);
      parent.add(mesh);
      addEdgeOutline(mesh, parent);
    };
    // 지면판 — 따낸 바닥에 깔린다 (앞면까지 40)
    const base = makeBox(o.W, T, baseW, color);
    base.position.set(0, topY - MASTER_RULES.CHANNEL_NOTCH_H + T / 2, frontZ - baseW / 2);
    put(base, 'channelBase');
    // 전면판 — 지면판 위, 따낸 자리 안쪽에 선다
    const face = makeBox(o.W, faceH, T, color);
    face.position.set(0, topY - faceH / 2, frontZ - baseW + T / 2);
    put(face, 'channelFace');
  }

  /** 셀 경계마다 칸막이 한 장. 양 끝은 측판이 맡으므로 안쪽 경계만 세운다. */
  function addCellDividers(parent, o) {
    const cyMid = o.legH + o.carcassH / 2;
    let x = -o.W / 2;
    o.cellWidths.forEach((w, i) => {
      x += w;
      if (i >= o.cellWidths.length - 1) return;   // 마지막 경계 = 우측판 자리
      // W12-5: 목찬넬 판이 전폭을 지나므로 칸막이도 측판과 같은 자리를 따낸다.
      const div = o.woodChannel
        ? makeNotchedPanel(o.T, o.carcassH, o.D,
            MASTER_RULES.CHANNEL_NOTCH_H, MASTER_RULES.CHANNEL_NOTCH_D, o.color)
        : makeBox(o.T, o.carcassH, o.D, o.color);
      div.position.set(x, cyMid, 0);
      div.userData = Object.assign({ side: 'divider', cellIdx: i }, o.ud);
      parent.add(div);
      addEdgeOutline(div, parent);
    });
  }

  // W9-113: 다리발 4개 mesh (하부장 모듈만, OBJ 표준 — 42×LEG_H×42, 코너 25mm inset)
  function addLegs(parent, m, cfg, s) {
    if (m.section !== 'lower') return;
    const LEG_H = legHOf(m, s);   // 모듈별 다리발 H (없으면 마스터 150)
    const LEG_SIZE = MASTER_RULES.LEG_SIZE;
    const LEG_INSET = MASTER_RULES.LEG_INSET;
    const W = m.W, D = m.D;
    const legColor = darken3(cfg.fill, 0.35);   // 카르카스보다 어둡게 (다리발 식별)
    // 4 코너 (X 양끝 / Z 양끝) — 모듈 외곽에서 안쪽 LEG_INSET mm 떨어진 위치
    const xLeft  = -W/2 + LEG_INSET + LEG_SIZE/2;
    const xRight =  W/2 - LEG_INSET - LEG_SIZE/2;
    const zFront = -D/2 + LEG_INSET + LEG_SIZE/2;
    // 이름과 달리 zBack 이 **월드 앞쪽**이다 (+Z 가 앞). W12-41: 걸레받이가
    //   앞선에서 40 물러선 자리에 서므로, 앞줄 다리는 그 뒤로 물러나야 겹치지
    //   않는다 — 실제로도 걸레받이가 이 다리에 클립으로 걸린다.
    const kickBack = toeKickBackZ(m, s);
    let zBack = D/2 - LEG_INSET - LEG_SIZE/2;
    if (kickBack != null) zBack = Math.min(zBack, kickBack - LEG_SIZE/2);
    const positions = [
      [xLeft,  zFront, 'leftFront'],
      [xLeft,  zBack,  'leftBack'],
      [xRight, zFront, 'rightFront'],
      [xRight, zBack,  'rightBack'],
    ];
    positions.forEach(([lx, lz, side], i) => {
      const leg = makeBox(LEG_SIZE, LEG_H, LEG_SIZE, legColor, { roughness: 0.4, metalness: 0.15 });
      leg.position.set(lx, LEG_H / 2, lz);
      leg.userData = { entityKind: 'leg', moduleId: m.id, legIdx: i, side: side };
      parent.add(leg);
      addEdgeOutline(leg, parent, 0x000000, 0.6);
    });
  }

  // 모듈 3D 렌더 — 외곽 + 도어/서랍 + 선반 + 손잡이
  /**
   * W12-13: 마감재(EP·몰딩·휠라)는 **판 한 장**이다.
   *
   * 예전엔 마감재도 일반 모듈 경로를 타서 캐비넷으로 그려졌다. 폭이 20~60mm 인데
   * 측판을 18mm 씩 두 장 세우니 지판·천판 폭이 **음수**가 됐고(EP 에서 -16),
   * 도어·상판·다리발까지 붙었다. 부재가 아니라 장이 되어 버린 것이다.
   *
   * 마감재는 모듈 전체 높이(H)와 깊이(D)를 그대로 쓰는 한 장으로 세운다 —
   * 옆 모듈에 맞춰 서는 것이 마감재의 뜻이다. 색은 2D 와 같은 것을 쓴다.
   */
  function buildFinishingMesh(parent, m) {
    const cfg = SECTION_CONFIG[m.section] || {};
    // SECTION_CONFIG 는 이미 SECTION_PALETTE_3D 를 덮어쓴 값이다 (buildSectionConfig).
    const color = cfg.fill;
    // W12-19: 잡아 둔 폭(m.W)이 아니라 **부재 폭**으로 그린다. EP 는 20 을 잡고
    // 18T 판이 서므로 2mm 가 설치 여유로 남는다 — 그 여유가 보여야 맞다.
    const partW = Math.min(m.W, finishingPartWidthOf(m.section));
    const panel = makeBox(partW, m.H, m.D, color, { roughness: 0.6, metalness: 0.08 });
    panel.position.set(0, m.H / 2, 0);
    panel.userData = { entityKind: 'carcass', moduleId: m.id, side: 'finish', section: m.section };
    parent.add(panel);
    addEdgeOutline(panel, parent, 0x000000, 0.7);
    return parent;
  }

  function renderModule3D(m, s) {
    if (!three) return;
    // 기존 그룹 비우기
    while (three.moduleGroup.children.length) {
      const ch = three.moduleGroup.children[0];
      three.moduleGroup.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material) ch.material.dispose && ch.material.dispose();
    }
    if (!m) return;
    const cfg = SECTION_CONFIG[m.section];
    // W12-13: 마감재는 판 한 장 — 캐비넷 경로를 타면 안 된다.
    if (m.isFinishing || isFinishingSection(m.section)) {
      const fg = new THREE.Group();
      fg.position.set(0, baseYOf(m), 0);
      fg.userData = { entityKind: 'module', moduleId: m.id };
      three.moduleGroup.add(fg);
      buildFinishingMesh(fg, m);
      fitCameraToModule(m.W, m.H, m.D, baseYOf(m));
      return;
    }
    const W = m.W, H = m.H, D = m.D;
    const T = BODY_T;   // 몸통 판 두께 (15T 기본)

    // 모듈 그룹 (바닥 중앙 origin)
    // W9-67: 상부장은 천정 매달림 — Y offset = ceiling - H
    const baseY = baseYOf(m);
    const modG = new THREE.Group();
    modG.position.set(0, baseY, 0);  // Y 만큼 위로 들어올림
    modG.userData = { entityKind: 'module', moduleId: m.id };  // W9-79
    three.moduleGroup.add(modG);

    // W9-87/95: cell 단위 분할 — 도어 개수 = 독립 캐비넷 개수 + 불균등 폭 지원
    // W9-114/115: 하부장 다리발 + 상부장 상몰딩 Y offset
    const carcassColor = darken3(cfg.fill, 0.05);
    const carcassUd = { entityKind: 'carcass', moduleId: m.id };
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? (s.drawerHeight || 200) : 0;
    const legH = baseOffsetOf(m, s);      // 몸통 바닥 offset (다리발 또는 좌대)
    const moldingH = moldingHOf(m, s);                                  // W9-115
    const carcassH = bodyHeightOf(m, s);  // 상판·좌대까지 반영된 몸통 H
    const topH = carcassH - drawerH;
    const verticalCount = Math.max(1, s.verticalCount || 1);
    const cellWidths = (Array.isArray(s.areaWidths) && s.areaWidths.length === verticalCount)
      ? s.areaWidths
      : Array(verticalCount).fill(W / verticalCount);
    // 몸통은 하나 — createModuleMesh 와 같은 규칙 (아래 addCarcassShell 주석 참고)
    const woodChannel = isWoodChannel(m, s);   // W12-5
    addCarcassShell(modG, { W, D, T, legH, carcassH, H, moldingH, color: carcassColor, ud: carcassUd, woodChannel });
    addCellDividers(modG, { cellWidths, W, D, T, legH, carcassH, color: carcassColor, ud: carcassUd, woodChannel });

    let cellLeftAccum = -W / 2;
    for (let i = 0; i < verticalCount; i++) {
      const colW = cellWidths[i];
      const cellLeft = cellLeftAccum;
      const cellCx = cellLeft + colW / 2;
      // 지판·천판은 몸통 껍데기(addCarcassShell)가 전폭으로 한 장씩 만든다.
      // cell 안 선반 — 본체 기준 sh (legH 더하기)
      if (Array.isArray(s.shelves)) {
        s.shelves.forEach((shMM, shIdx) => {
          if (shMM <= T || shMM >= carcassH - T) return;
          const sh = makeBox(colW - 2*T - 4, T, D - T - 4, '#e8d8b8', { roughness: 0.5 });
          sh.position.set(cellCx, legH + shMM, T/2);
          sh.userData = { entityKind: 'shelf', moduleId: m.id, shelfIdx: shIdx, cellIdx: i };
          modG.add(sh);
          addEdgeOutline(sh, modG);
        });
      }
      // W9-112: 도어 외경 기준 overlay 정렬 — innerW = colW - 4 (외측 갭 2mm × 2)
      const innerW = colW - MASTER_RULES.DOOR_GAP;
      const topDoorH = topH - MASTER_RULES.DOOR_GAP;
      const topDoorY = legH + drawerH + topH / 2;   // W9-114: 본체 안 도어 Y
      // cell 도어
      const type = (s.areaTypes && s.areaTypes[i]) || 'door';
      addFrontPanel(modG, cellCx, topDoorY, innerW, topDoorH, D/2, type, cfg, s, Object.assign({ moduleId: m.id, areaIdx: i, areaPos: 'top', is2D: !!(s.areaIs2D && s.areaIs2D[i]), doorDrop: doorDropOf(m, s), doorTopGap: doorTopGapOf(m, s) }, areaLimitsFor(m)));
      // cell 서랍 — W9-114: 본체 안 (legH 위부터)
      if (drawerH > 0) {
        addFrontPanel(modG, cellCx, legH + drawerH/2, innerW, drawerH - MASTER_RULES.DOOR_GAP, D/2,
                      s.bottomType || 'drawer', cfg, s, { moduleId: m.id, areaIdx: -1, areaPos: 'bottom', cellIdx: i });
      }
      cellLeftAccum += colW;
    }
    // W9-113: 다리발 4개 (하부장만)
    addLegs(modG, m, cfg, s);
    // W9-115: 상몰딩 (상부장/냉장고장 상단)
    addCrownMolding(modG, m, cfg, s);
    addTopPanel(modG, m, cfg, s);
    addPedestal(modG, m, cfg, s);
    addToeKick(modG, m, cfg, s);   // W12-41
    // W9-117: 목찬넬 손잡이 (handleType='channel')
    addHandle(modG, m, s, cfg);

    // W9-77/85: 자식 마감재 (EP/몰딩/휠라) — fcfg 없어도 진행 (강제 색상)
    if (Array.isArray(m.finishings) && m.finishings.length) {
      console.log('[STRUCT] renderModule3D', m.id, 'finishings:', m.finishings.length);
      m.finishings.forEach((f) => {
        // 평면도 절대 좌표 → 모듈 mesh 로컬 (X=-W/2~W/2, Z=-D/2~D/2)
        const fxCenter = (f.x || 0) + (f.W || 0) / 2;
        const fyCenter = (f.y || 0) + (f.D || 0) / 2;
        const mxCenter = m.x + m.W / 2;
        const myCenter = m.y + m.D / 2;
        const dxRel = fxCenter - mxCenter;
        const dzRel = fyCenter - myCenter;
        const fH = f.H || m.H;
        if (!f.W || !f.D || !isFinite(fH)) {
          console.warn('[STRUCT] finishing skip — invalid dims', f);
          return;
        }
        // W9-82: 마감재는 진한 우드 톤 (모듈과 명확히 구별)
        const finColor = f.section === 'ep' ? '#7a6a45' :       // EP — 진한 우드
                        f.section === 'molding' ? '#5a4d2f' :   // 몰딩 — 더 진한 갈색
                        f.section === 'filler' ? '#8a7858' :    // 휠라 — 중간 우드
                        '#7a6a45';                              // 기본 폴백
        const fbox = makeBox(f.W, fH, f.D, finColor, { roughness: 0.6, metalness: 0.1 });
        fbox.position.set(dxRel, fH / 2, dzRel);
        fbox.userData = { entityKind: 'finishing', moduleId: m.id, finishingSection: f.section };
        modG.add(fbox);
        addEdgeOutline(fbox, modG, 0x000000, 0.7);   // W9-100: 검은 통일
      });
    }

    // 카메라 fit
    fitCameraToModule(W, H, D, baseY);
  }

  // W9-65: 도어 표현 제거 — 모든 영역을 단순 panel 로 (회전/손잡이 X)
  // 영역 type 으로 색상/모양 구분
  // W9-79/84/95: 전면 panel 통합 — 도어/서랍/오픈/먹장 (blank) → 모듈 선택
  // W9-86: doorVisible=false 면 도어/서랍/먹장 mesh skip (오픈 frame 은 항상)
  // W9-100: 아웃도어 (overlay) — panel 뒷면이 모듈 앞면과 일치, 앞으로 튀어나옴
  //         panel.z = frontZ + T/2 (frontZ = 모듈 앞면, T/2 = panel 두께 절반)
  // 도어 열림 방향은 받지 않는다. 예전엔 `direction` 파라미터가 있었으나 본문에서
  // 한 번도 쓰이지 않았고(호출부 하나는 이미 null 을 넘기고 있었다), 3D 뷰는
  // 열림 방향을 표현하지 않는다. 표현하려면 파라미터를 되살리는 게 아니라
  // 여닫이 mesh 를 만드는 별도 작업이 필요하다.
  /**
   * 도어 사이 갭을 **그림자로 보이게** 하는 뒷면.
   *
   * 도어는 몸통과 같은 색이고 갭은 4mm 다. 경계를 나누는 건 WebGL 라인뿐인데
   * linewidth 는 대부분의 환경에서 1px 로 고정이라, 줌을 줄이면 도어들이
   * 한 덩어리로 뭉쳐 보였다. 도어 바로 뒤에 어두운 판을 깔면 그 4mm 가
   * 그림자가 되어 줌과 무관하게 경계가 읽힌다.
   */
  function addDoorReveal(parent, cx, cy, w, h, frontZ, cfg, meta) {
    const G = MASTER_RULES.DOOR_GAP;
    // W12-17: 도어 사이로 보이는 것은 **어두운 안쪽**이다. 예전 0.55 는 도어색과
    // 대비가 약해(#b8956c → #806749) 줌을 줄이면 경계가 묻혔다. 그림자에 가깝게
    // 낮춰 1px 만 남아도 선으로 읽히게 한다.
    const back = makeBox(w + G, h + G, 2, darken3(cfg.fill, DOOR_REVEAL_DARKEN));
    back.position.set(cx, cy, frontZ - 1);
    back.userData = { entityKind: 'reveal', moduleId: meta && meta.moduleId };
    parent.add(back);
    // W12-17: 도어 앞면에 어두운 **테두리**를 두른다. 4mm 갭은 화면에서 1~2px 라
    // 줌을 줄이면 사라진다. 테두리 두께를 줌에 맞춰 키워 늘 보이게 한다
    // (keepDoorEdgesVisible). 도어 면을 덮는 대신 가장자리만 두른다.
    addDoorEdgeFrame(parent, cx, cy, w, h, frontZ + 19, darken3(cfg.fill, DOOR_REVEAL_DARKEN));
  }


  /**
   * W12-17: 도어 가장자리 테두리 4줄. `baseW/baseH` 와 방향을 userData 에 남겨
   * keepDoorEdgesVisible 이 두께만 다시 잡을 수 있게 한다.
   */
  function addDoorEdgeFrame(parent, cx, cy, w, h, z, color) {
    const mk = (axis) => {
      const bar = makeBox(1, 1, 1, color, { roughness: 0.9 });
      bar.userData = { entityKind: 'doorEdge', axis, baseW: w, baseH: h, cx, cy, z };
      parent.add(bar);
      return bar;
    };
    ['left', 'right', 'top', 'bottom'].forEach(mk);
  }

  /** 화면에서 mm 하나가 몇 px 인지 — 카메라 거리·화각·캔버스 높이로 잰다. */
  function mmPerPixel() {
    if (!three || !three.camera || !three.renderer || !three.controls) return 1;
    const cam = three.camera;
    const dist = cam.position.distanceTo(three.controls.target) || 1;
    const h = three.renderer.domElement.clientHeight || 1;
    const visible = 2 * dist * Math.tan((cam.fov * Math.PI / 180) / 2);
    return visible / h;
  }

  /**
   * 도어 테두리 두께를 화면 기준으로 유지한다.
   * 실제 갭(4mm)은 멀어지면 1px 미만이 되어 사라진다. 테두리를 **최소 몇 px**
   * 로 잡아 주면 줌과 무관하게 도어가 낱장으로 읽힌다. 가까이서는 4mm 그대로다.
   */
  const DOOR_EDGE_MIN_PX = 1.6;
  function keepDoorEdgesVisible() {
    if (!three || !three.moduleGroup) return;
    const t = Math.max(MASTER_RULES.DOOR_GAP / 2, DOOR_EDGE_MIN_PX * mmPerPixel());
    three.moduleGroup.traverse((o) => {
      const ud = o.userData;
      if (!ud || ud.entityKind !== 'doorEdge') return;
      const { axis, baseW, baseH, cx, cy, z } = ud;
      if (axis === 'left' || axis === 'right') {
        o.scale.set(t, baseH, 1);
        o.position.set(cx + (axis === 'left' ? -1 : 1) * (baseW / 2 - t / 2), cy, z);
      } else {
        o.scale.set(baseW, t, 1);
        o.position.set(cx, cy + (axis === 'top' ? 1 : -1) * (baseH / 2 - t / 2), z);
      }
    });
  }


  /**
   * W12-24: 모듈이 속한 **배치 공간의 경계**. 도어가 이걸 넘으면 안 된다.
   *   frontLimit  — 영역 앞면 (모듈 로컬 z). 지금은 몸통을 도어 두께만큼 얕게
   *                 잡아(addModuleToArea) 도어가 알아서 안에 들어오므로 쓰이지 않는다.
   *                 예전 설계(몸통이 영역만큼 깊은 것)를 열었을 때를 위해 남긴다.
   *   bottomLimit — 영역 바닥 (모듈 로컬 y). 도어 내림이 여기서 멈춘다.
   * 영역을 못 찾으면 아무것도 제한하지 않는다 (예전 그대로 그린다).
   */
  function areaLimitsFor(m) {
    const area = areaOfModule(m);
    if (!area) return {};
    const rot = ((m.rotation || 0) % 360 + 360) % 360;
    const bottomLimit = (getBaseY(area.section, area.H)) - baseYOf(m);
    // W12-33: 회전이 없으면 **실제 좌표로 잰다**. 모듈은 앞선에 맞춰 앉으므로
    //   (seatModuleDepth) 남은 여유는 정확히 도어 두께다. 예전엔 모듈이 영역
    //   가운데 있다고 가정해 어림했는데, 뒤에 붙어 있었으니 틀린 값이었다.
    if (rot === 0) {
      return {
        frontLimit: ((area.y || 0) + (area.D || 0)) - ((m.y || 0) + (m.D || 0) / 2),
        bottomLimit,
      };
    }
    // 90/270 은 깊이 좌표가 정해져 있지 않다 (§10 미해결) — 예전 어림값을 그대로 쓴다.
    const areaD = area.W;
    const modD = m.W;
    return {
      frontLimit: modD / 2 + Math.max(0, (areaD - modD) / 2),
      bottomLimit,
    };
  }

  function addFrontPanel(parent, cx, cy, w, h, frontZ, type, cfg, s, meta) {
    const T = DOOR_T;
    // W12-24: 배치 공간은 **제한 공간**이다. overlay 도어는 몸통 앞면에 붙어
    //   frontZ + T 까지 나가는데, 영역 깊이가 몸통과 같으면 그만큼 밖으로 삐져나온다.
    //   영역 앞면을 넘지 않도록 도어를 안쪽으로 물린다.
    //   도어는 몸통 **앞면에 붙어** 밖으로 선다. 몸통 속으로 밀어 넣으면 부재가
    //   겹친다 — 몸통 깊이를 도어 두께만큼 얕게 잡아(areaLimitsFor) 둘 다 만족시킨다.
    const overlayZ = frontZ + T / 2;           // W9-100: overlay 도어 z 중심
    // W12-6: 도어 내림 — 도어만 몸통보다 아래로 내려온다. 그 밑단이 손잡이다.
    // 서랍·오픈·먹장은 해당 없다 (도어가 아니다).
    // W12-8: 목찬넬 도어는 몸통 상단보다 30 내려온다 — 그 틈이 손 넣는 자리다.
    // 도어 세로 = 장H − 30, 밑단은 다리발 위(몸통 바닥)에 맞춘다.
    const topGap = (type === 'door' && meta && meta.doorTopGap) ? meta.doorTopGap : 0;
    if (topGap) {
      const G = MASTER_RULES.DOOR_GAP;
      const bodyBottom = cy - h / 2 - G / 2;   // 갭을 되돌린 몸통 바닥
      const bodyTop = cy + h / 2 + G / 2;      // 몸통 상단
      const newTop = bodyTop - topGap;
      if (newTop > bodyBottom) { h = newTop - bodyBottom; cy = (newTop + bodyBottom) / 2; }
    }
    // W12-24: 도어 내림이 영역 아래를 넘지 않게 자른다.
    let drop = (type === 'door' && meta && meta.doorDrop) ? meta.doorDrop : 0;
    if (drop && meta && Number.isFinite(meta.bottomLimit)) {
      const bodyBottom0 = cy - h / 2 - MASTER_RULES.DOOR_GAP / 2;
      drop = Math.max(0, Math.min(drop, bodyBottom0 - meta.bottomLimit));
    }
    if (drop) {
      // 도어 세로 = 장H + drop (design_rules 싱크상부장도어H). 넘어온 h 는 이미
      // 갭 4 를 뺀 값이라 그대로 더하면 장H + 16 이 된다 — 갭을 되돌리고 더한다.
      // 윗변은 몸통 상단에 맞추고 밑단만 drop 만큼 내려온다.
      const G = MASTER_RULES.DOOR_GAP;
      const top = cy + h / 2 + G / 2;
      h = h + G + drop;
      cy = top - h / 2;
    }
    const carcassMeta = { entityKind: 'carcass', moduleId: meta.moduleId, side: 'front', areaType: type };
    if (type === 'open') {
      // open frame 은 모듈 앞면 위 wireframe (그대로 frontZ)
      const frame = makeBox(w, h, 2, cfg.stroke, { transparent: true, opacity: 0.25, wireframe: true });
      frame.position.set(cx, cy, frontZ);
      frame.userData = carcassMeta;
      parent.add(frame);
      return;
    }
    if (type === 'blank') {
      if (!doorVisible) return;
      const blank = makeBox(w, h, T, '#a89c84', { roughness: 0.7, opacity: 0.75, transparent: true });
      blank.position.set(cx, cy, overlayZ);
      blank.userData = { entityKind: 'blank', moduleId: meta.moduleId, areaIdx: meta.areaIdx };
      parent.add(blank);
      addEdgeOutline(blank, parent, 0x000000, 0.8);
      return;
    }
    if (!doorVisible) return;
    const color = type === 'drawer' ? darken3(cfg.fill, 0.15) : cfg.fill;
    // W9-101: 양문 (2D) — 도어 2장 + 가운데 처짐방지목 + 4mm 갭
    if (type === 'door' && meta.is2D) {
      const GAP = MASTER_RULES.DOOR_GAP;          // 가운데 갭 4
      const halfW = (w - GAP) / 2;                // 도어 1장 폭
      // W12-27: 양문은 **도어 한 장씩** 그림자판과 테두리를 두른다.
      //   예전엔 셀 전체에 한 번만 둘러, 셀 안쪽 두 도어 사이에는 테두리가
      //   없었다. 하부장은 자동계산이 양문을 자주 만들어 그 셀의 가운데 선만
      //   유독 얇아 보였다 — "하부장만 윤곽선이 안 굵어진다" 의 정체다.
      const lx = cx - GAP / 2 - halfW / 2;
      const rx = cx + GAP / 2 + halfW / 2;
      addDoorReveal(parent, lx, cy, halfW, h, frontZ, cfg, meta);
      addDoorReveal(parent, rx, cy, halfW, h, frontZ, cfg, meta);
      // 좌 도어
      const dLeft = makeBox(halfW, h, T, color);
      dLeft.position.set(lx, cy, overlayZ);
      dLeft.userData = Object.assign({}, carcassMeta, { side: 'front', doorIdx: 0 });
      parent.add(dLeft);
      addEdgeOutline(dLeft, parent, 0x000000, 0.9);
      // 우 도어
      const dRight = makeBox(halfW, h, T, color);
      dRight.position.set(rx, cy, overlayZ);
      dRight.userData = Object.assign({}, carcassMeta, { side: 'front', doorIdx: 1 });
      parent.add(dRight);
      addEdgeOutline(dRight, parent, 0x000000, 0.9);
      // 가운데 처짐방지목 (cell 안쪽, 모듈 내부) — Z 는 측판과 같은 평면
      // 마스터: 가로 60 × 세로 (모듈 H - 2T) 안쪽, 두께 15
      const braceW = MASTER_RULES.BAND_BRACE_W;
      const braceT = MASTER_RULES.BAND_BRACE_THICK;
      const brace = makeBox(braceW, h * 0.9, braceT, darken3(cfg.fill, 0.1), { roughness: 0.7 });
      brace.position.set(cx, cy, frontZ - braceT / 2 - 2);  // 도어 뒤쪽 (모듈 안)
      brace.userData = { entityKind: 'brace', moduleId: meta.moduleId, areaIdx: meta.areaIdx };
      parent.add(brace);
      addEdgeOutline(brace, parent, 0x000000, 0.6);
      return;
    }
    addDoorReveal(parent, cx, cy, w, h, frontZ, cfg, meta);
    const panel = makeBox(w, h, T, color);
    panel.position.set(cx, cy, overlayZ);
    panel.userData = carcassMeta;
    parent.add(panel);
    addEdgeOutline(panel, parent, 0x000000, 0.9);
    if (type === 'drawer') {
      // 서랍 분할선 = 도어 앞면 (z = overlayZ + T/2) 살짝 앞
      const line = makeBox(w * 0.85, 2, 1, '#3d342a', { metalness: 0.3, roughness: 0.6 });
      line.position.set(cx, cy, overlayZ + T / 2 + 0.5);
      line.userData = { entityKind: 'carcass-line', moduleId: meta.moduleId };
      parent.add(line);
    }
  }

  function positionBox(mesh, x, y, z) { mesh.position.set(x, y, z); return mesh; }

  // 카메라 자동 fit — W9-67: baseY 반영 (상부장 등)
  function fitCameraToModule(W, H, D, baseY) {
    if (!three) return;
    const dist = Math.max(W, H, D) * 1.6;
    const cy = (baseY || 0) + H/2;
    three.camera.position.set(dist * 0.7, cy + 200, dist);
    three.controls.target.set(0, cy, 0);
    three.controls.update();
  }

  // 색상 어둡게 헬퍼
  function darken3(hex, factor) {
    const c = new THREE.Color(hex);
    return '#' + c.multiplyScalar(1 - factor).getHexString();
  }

  // View toggle
  function setView(mode) {
    currentView = mode;
    document.getElementById('canvas3d').style.display = mode === '3d' ? 'block' : 'none';
    document.getElementById('frontSvg').style.display = mode === '2d' ? 'block' : 'none';
    document.getElementById('view3dBtn').classList.toggle('active', mode === '3d');
    document.getElementById('view2dBtn').classList.toggle('active', mode === '2d');
    if (mode === '3d' && three) {
      // 사이즈 갱신 (display 변경 후)
      const wrap = document.getElementById('canvasWrap');
      three.renderer.setSize(wrap.clientWidth, wrap.clientHeight, false);
      three.camera.aspect = wrap.clientWidth / wrap.clientHeight;
      three.camera.updateProjectionMatrix();
    } else if (mode === '2d') {
      // W9-103: 정면도 진입 시 viewMode 별 자동 fit
      renderFrontView();
      fitFrontView();
    }
    // W9-110: viewport ruler — 2D 모드에서만 표시
    const showRuler = (mode === '2d');
    document.getElementById('rulerTop').style.display = showRuler ? 'block' : 'none';
    document.getElementById('rulerRight').style.display = showRuler ? 'block' : 'none';
    document.getElementById('rulerCorner').style.display = showRuler ? 'block' : 'none';
    // W9-120: 4 섹션 ruler 도 2D off 시 hidden (실제 표시는 renderRulerButtons 가 자동 감지 결정)
    if (!showRuler) {
      ['upper','lower','tall','wardrobe'].forEach(sec => {
        const wb = document.getElementById('rulerTop' + cap(sec));
        const hc = document.getElementById('rulerRight' + cap(sec));
        if (wb) wb.style.display = 'none';
        if (hc) hc.style.display = 'none';
      });
      const rp = document.getElementById('sectionRestorePanel');
      if (rp) rp.style.display = 'none';
    }
    if (showRuler) updateViewportRulers();
  }
  document.getElementById('view3dBtn').onclick = () => setView('3d');
  document.getElementById('view2dBtn').onclick = () => setView('2d');

  // W9-86: 도어 표시 on/off 토글
  let doorVisible = true;
  function setDoorVisible(visible) {
    doorVisible = visible;
    document.getElementById('doorToggleBtn').classList.toggle('active', visible);
    // 3D 재렌더 (현재 view mode 에 맞게)
    if (typeof renderFrontView === 'function') renderFrontView();
  }
  document.getElementById('doorToggleBtn').onclick = () => setDoorVisible(!doorVisible);

  // W9-108/121: 정면도 시점 회전 (0/90/180/270 — 정면/우측/뒷면/좌측)
  //   W9-121: 단일 ↻ 버튼을 ◀ ▶ 좌우 뷰 이동으로 분리
  let viewRotation = 0;
  const VIEW_ROTATION_LABELS = { 0: '정면', 90: '우측', 180: '뒷면', 270: '좌측' };
  function rotateView(delta) {
    viewRotation = ((viewRotation + delta) % 360 + 360) % 360;
    const lab = document.getElementById('viewRotateLabel');
    if (lab) lab.textContent = VIEW_ROTATION_LABELS[viewRotation];
    if (typeof renderFrontView === 'function') renderFrontView();
    if (typeof fitFrontView === 'function' && currentView === '2d') fitFrontView();
  }
  const _btnL = document.getElementById('viewRotateLeftBtn');
  const _btnR = document.getElementById('viewRotateRightBtn');
  if (_btnL) _btnL.onclick = () => rotateView(-90);   // 좌측 = 반시계
  if (_btnR) _btnR.onclick = () => rotateView(+90);   // 우측 = 시계

  // ─────────────────────────────────────────────────────────────
  // W9-65: View mode (개별/세트/전체) + 세트 자동 그룹화
  // ─────────────────────────────────────────────────────────────
  let viewMode = 'single';   // 'single'(모듈) | 'area'(배치 영역) | 'all'(전체)

  // rotation 별 그룹화 — 같은 회전 = 같은 정면 세트 (ㄱ자/ㄷ자 자동 감지)
  function buildSets() {
    const byRot = new Map();
    modules.forEach((m) => {
      const rot = ((m.rotation || 0) % 360 + 360) % 360;
      if (!byRot.has(rot)) byRot.set(rot, []);
      byRot.get(rot).push(m);
    });
    // 각 회전 그룹을 한 세트로
    const arr = [];
    let idx = 0;
    byRot.forEach((mods, rot) => {
      arr.push({
        id: 'set-' + idx,
        rotation: rot,
        modules: mods,
        label: `세트 #${idx+1} (회전 ${rot}°)`,
      });
      idx++;
    });
    return arr;
  }

  function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.ml-mode-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    // W9-108/111: 시점 회전 버튼 — 전체 모드에서만
    const viewRotateBar = document.getElementById('viewRotateBar');
    if (viewRotateBar) viewRotateBar.style.display = (mode === 'all') ? 'flex' : 'none';
    renderModuleList();
    if (mode === 'single') {
      if (modules.length && !modules.find(x => x.id === activeId)) setActiveModule(modules[0].id);
      else if (activeId) setActiveModule(activeId);
    } else if (mode === 'area') {
      // 배치 단계에서 잡은 영역을 고른다. 이미 고른 영역이 있으면 그대로 둔다.
      const keep = areas.find((a) => a.id === activeAreaId);
      if (keep) setActiveArea(keep.id);
      else if (areas.length) setActiveArea(areas[0].id);
    } else if (mode === 'all') {
      activeId = null; activeAreaId = null;
      document.getElementById('curModuleName').textContent = `전체 모듈 (${modules.length}개)`;
      document.getElementById('canvasEmpty').style.display = modules.length ? 'none' : 'flex';
      renderAll3D();
      // W9-103: 전체 모드 진입 시 정면도 갱신 + fit
      renderFrontView();
      if (currentView === '2d') fitFrontView();
    }
  }

  // module list 렌더 — viewMode 별
  const _renderModuleList = renderModuleList;
  renderModuleList = function() {
    const body = document.getElementById('mlBody');
    // W12-16: 배치 모드는 **모듈이 없어도** 영역을 보여준다. 예전엔 이 가드가
    // 먼저 걸려 모듈을 넣기 전에는 영역 목록이 아예 뜨지 않았다.
    if (!modules.length && viewMode !== 'area') {
      body.innerHTML = areas.length
        ? '<div class="empty-msg">아직 모듈이 없습니다<br><span style="font-size:10px">도면의 영역을 클릭해 모듈을 추가하세요</span></div>'
        : '<div class="empty-msg">배치된 영역 없음<br><span style="font-size:10px">mockup-shell.html 에서 배치 후 돌아오세요</span></div>';
      return;
    }
    if (viewMode === 'area') {
      // W12-15: 배치 단계에서 잡은 영역을 그대로 보여준다. 고르면 그 영역이 선택돼
      // 도면·3D 가 영역 보기로 가고, 영역 도구(모듈 추가·자동계산)가 뜬다.
      if (!areas.length) {
        body.innerHTML = '<div class="empty-msg">배치된 영역 없음<br><span style="font-size:10px">배치 단계에서 사각형을 그린 뒤 돌아오세요</span></div>';
        return;
      }
      body.innerHTML = areas.map((a) => {
        const mods = modules.filter((m) => m.areaId === a.id);
        const used = mods.reduce((sum, m) => sum + (m.W || 0), 0);
        const label = (SECTION_CONFIG[a.section] || {}).label || a.section;
        const kinds = mods.length
          ? [...new Set(mods.map((m) => (SECTION_CONFIG[m.section] || {}).label || m.section))].join(' / ')
          : '모듈 없음';
        return `<div class="set-item ${a.id === activeAreaId ? 'active' : ''}" data-area-pick="${a.id}">
          <strong>${label} · W${Math.round(a.W)}</strong>
          <div class="set-meta">모듈 ${mods.length}개 · ${Math.round(used)}/${Math.round(a.W)}mm · ${kinds}</div>
        </div>`;
      }).join('');
      body.querySelectorAll('[data-area-pick]').forEach((el) => {
        el.onclick = () => setActiveArea(el.dataset.areaPick);
      });
    } else if (viewMode === 'all') {
      body.innerHTML = `<div class="empty-msg" style="padding:20px 8px">전체 모듈 (${modules.length}개)<br><span style="font-size:10px">배치 그대로 3D 표시</span></div>`;
    } else {
      // single — 기존 동작
      _renderModuleList();
    }
  };

  // 전체 모듈 3D 렌더 — 배치 좌표 그대로
  /** 영역을 3D 에 반투명 상자 + 외곽선으로 깐다. 클릭하면 영역이 선택된다. */
  function renderAreas3D(parent) {
    if (!three || !window.THREE || !areas.length) return;
    const ox = originPos2D.x, oy = originPos2D.y;
    areas.forEach((a) => {
      const cfg = SECTION_CONFIG[a.section] || { fill: '#999', stroke: '#333' };
      // W12-36: 배치 단계와 같은 방식 — 제자리에서 **자기 중심으로** 돈다.
      //   예전엔 폭·깊이만 맞바꿔 (x, y) 를 좌상단으로 썼다. 회전 영역이
      //   (W−D)/2 만큼 어긋난 자리에 그려졌다.
      const B = planeBoxOf(a);
      const on = a.id === activeAreaId;
      const box = makeBox(a.W, a.H, a.D, cfg.fill, { transparent: true, opacity: on ? 0.22 : 0.09 });
      box.position.set(B.cx - ox, getBaseY(a.section, a.H) + a.H / 2, B.cy - oy);
      box.rotation.y = -(a.rotation || 0) * Math.PI / 180;
      box.userData = { entityKind: 'area', areaId: a.id };
      parent.add(box);
      addEdgeOutline(box, parent, 0x6a4b2a, on ? 0.9 : 0.45);
    });
  }

  /** 영역 전체가 보이도록 카메라를 뺀다 — 모듈이 없을 때의 3D fit */
  function fitCameraToAreas() {
    if (!three || !areas.length) return;
    let minX = Infinity, minZ = Infinity, maxX = -Infinity, maxZ = -Infinity, maxY = 0;
    areas.forEach((a) => {
      const B = planeBoxOf(a);                          // W12-36
      minX = Math.min(minX, B.x); maxX = Math.max(maxX, B.x + B.w);
      minZ = Math.min(minZ, B.y); maxZ = Math.max(maxZ, B.y + B.d);
      maxY = Math.max(maxY, getBaseY(a.section, a.H) + a.H);
    });
    if (!isFinite(minX)) return;
    fitCameraToBoundsAt(
      Math.max(maxX - minX, maxZ - minZ, maxY),
      (minX + maxX) / 2 - originPos2D.x,
      (minZ + maxZ) / 2 - originPos2D.y
    );
  }

  /**
   * @param {{fit?: boolean}} [opts] fit:false 면 카메라를 건드리지 않는다.
   *
   * 이 함수는 끝에서 카메라를 다시 맞추고 controls.target 을 리셋한다. 원래는
   * '전체' 모드로 들어갈 때만 불렸으니 문제가 없었는데, 영역 보기를 만들며
   * 거의 모든 상호작용에 물리면서 **클릭할 때마다 화면이 초기화되는** 증상이 됐다.
   * 화면을 맞추는 것은 "무엇을 보여줄지가 바뀌는 순간" 에만 할 일이다.
   */
  function renderAll3D(opts) {
    if (!three) return;
    const modG = three.moduleGroup;
    while (modG.children.length) {
      const ch = modG.children[0]; modG.remove(ch);
      if (ch.geometry) ch.geometry.dispose();
      if (ch.material && ch.material.dispose) ch.material.dispose();
    }
    // 영역을 먼저 깐다. 기본 화면이 3D 라서, 여기 안 그리면 배치만 하고 넘어온
    // 사용자에게는 빈 바닥만 보인다 (정면도에만 그렸던 것이 그 상태였다).
    renderAreas3D(modG);
    if (!modules.length) {
      if (!opts || opts.fit !== false) fitCameraToAreas();
      return;
    }
    // W9-68: 원점 (originPos2D) 을 3D (0,0,0) 기준점으로 사용
    // 평면도 → 3D: x = m.x + m.W/2 - origin.x, z = m.y + m.D/2 - origin.y
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    modules.forEach(m => {
      const B = modulePlaneBox(m);                      // W12-36
      minX = Math.min(minX, B.x); minY = Math.min(minY, B.y);
      maxX = Math.max(maxX, B.x + B.w); maxY = Math.max(maxY, B.y + B.d);
    });
    const ox = originPos2D.x, oy = originPos2D.y;
    modules.forEach(m => {
      const s = getStructure(m.id);
      const moduleMesh = createModuleMesh(m, s);
      // 원점 기준 좌표 — 평면도 (m.x, m.y) - (origin.x, origin.y)
      // W9-67: createModuleMesh 의 baseY 보존 (Y 직접 변경 X)
      // W12-36: 회전축은 **영역 중심**이다. 제 중심으로 돌리면 영역 밖으로
      //   흩어진다 — §10 "90° 회전 영역" 이 그것이다.
      const B = modulePlaneBox(m);
      moduleMesh.position.x = B.cx - ox;
      moduleMesh.position.z = B.cy - oy;
      moduleMesh.rotation.y = -(m.rotation || 0) * Math.PI / 180;
      modG.add(moduleMesh);
    });
    // 원점 표시 (3D 의 0,0,0)
    addOriginMarker3D(modG);
    // 카메라 fit — 원점부터 모듈 전체까지 보이게. 요청했을 때만 한다.
    if (!opts || opts.fit !== false) {
      const extentX = Math.max(Math.abs(minX - ox), Math.abs(maxX - ox));
      const extentZ = Math.max(Math.abs(minY - oy), Math.abs(maxY - oy));
      fitCameraToBounds(Math.max(extentX, extentZ, ceilingHeight) * 2);
      three.controls.target.set(0, ceilingHeight/2, 0);
      three.controls.update();
    }
  }

  // 3D 원점 마커 (작은 cross at 0,0,0)
  function addOriginMarker3D(parent) {
    const ns = 'three';
    const mat = new THREE.LineBasicMaterial({ color: 0x1976d2 });
    const sz = 200;
    const points = [
      new THREE.Vector3(-sz, 0, 0), new THREE.Vector3(sz, 0, 0),
      new THREE.Vector3(0, 0, -sz), new THREE.Vector3(0, 0, sz),
      new THREE.Vector3(0, 0, 0),   new THREE.Vector3(0, sz*0.5, 0),
    ];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const lines = new THREE.LineSegments(geo, mat);
    parent.add(lines);
  }

  // 세트 3D 렌더 — 같은 회전 모듈들을 원점 기준 원래 배치 좌표로 표시
  // W9-69: 인위적 일렬 정렬 (curX) 제거, renderAll3D 와 동일한 원점 기준 좌표
  // W12-15: renderSet3D 를 없앴다. 세트 모드가 사라져 부르는 곳이 없다 —
  //   배치 보기는 renderAll3D 가 영역째 그린다.

  // W9-69: 카메라 fit + 특정 target 좌표
  function fitCameraToBoundsAt(size, tx, tz) {
    if (!three) return;
    const dist = size * 1.4;
    three.camera.position.set(tx + dist * 0.7, dist * 0.5, tz + dist);
    three.camera.updateProjectionMatrix();
  }

  function fitCameraToBounds(size) {
    if (!three) return;
    const dist = size * 1.4;
    three.camera.position.set(dist * 0.7, dist * 0.5, dist);
    three.camera.updateProjectionMatrix();
  }

  // 단일 모듈 mesh 생성 (외곽 + 분할 + 선반) — renderModule3D 의 logic 재사용
  // W9-67: 상부장은 천정 매달림 (Y offset = ceiling - H)
  function createModuleMesh(m, s) {
    const g = new THREE.Group();
    g.userData = { entityKind: 'module', moduleId: m.id };  // W9-79
    const cfg = SECTION_CONFIG[m.section];
    if (!cfg) return g;
    // W12-13: 마감재는 판 한 장 — 캐비넷 경로를 타면 안 된다.
    if (m.isFinishing || isFinishingSection(m.section)) {
      g.position.y = baseYOf(m);
      return buildFinishingMesh(g, m);
    }
    const W = m.W, H = m.H, D = m.D, T = BODY_T;
    const carcassColor = darken3(cfg.fill, 0.05);
    // 모듈 base Y (section 따라)
    const baseY = baseYOf(m);
    g.position.y = baseY;
    // W9-87/95: 도어 개수 = cell 개수 → 각 cell 독립 캐비넷
    // W9-114/115: 하부장 다리발 + 상부장 상몰딩 Y offset
    const drawerH = s.horizontalLayout === 'doorTopDrawerBottom' ? (s.drawerHeight || 200) : 0;
    const legH = baseOffsetOf(m, s);     // 몸통 바닥 offset (다리발 또는 좌대)
    const moldingH = moldingHOf(m, s);                                 // W9-115
    const carcassH = bodyHeightOf(m, s); // 상판·좌대까지 반영된 몸통 H
    const topH = carcassH - drawerH;
    const vCount = Math.max(1, s.verticalCount || 1);
    const cellWidths = (Array.isArray(s.areaWidths) && s.areaWidths.length === vCount)
      ? s.areaWidths
      : Array(vCount).fill(W / vCount);
    const carcassUd = { entityKind: 'carcass', moduleId: m.id };
    // 몸통은 **하나**다. 도어를 몇 장으로 나누든 측판·뒤판·지판·천판은 모듈 전체를
    // 감싼다. 예전엔 셀마다 이 다섯을 만들어(W9-87 "도어 개수 = 독립 캐비넷 개수")
    // 도어를 2장으로 늘리면 수납장이 2개로 보였다. 셀 경계에는 칸막이 한 장만 세운다.
    const woodChannel = isWoodChannel(m, s);   // W12-5
    addCarcassShell(g, { W, D, T, legH, carcassH, H, moldingH, color: carcassColor, ud: carcassUd, woodChannel });
    addCellDividers(g, { cellWidths, W, D, T, legH, carcassH, color: carcassColor, ud: carcassUd, woodChannel });

    let cellLeftAccum = -W / 2;
    for (let i = 0; i < vCount; i++) {
      const colW = cellWidths[i];
      const cellLeft = cellLeftAccum;
      const cellCx = cellLeft + colW / 2;
      // cell 안 선반 — 본체 기준 sh (legH 더하기)
      if (Array.isArray(s.shelves)) {
        s.shelves.forEach((shMM, shIdx) => {
          if (shMM <= T || shMM >= carcassH - T) return;
          const sh = makeBox(colW - 2*T - 4, T, D - T - 4, '#e8d8b8', { roughness: 0.5 });
          sh.position.set(cellCx, legH + shMM, T/2);
          sh.userData = { entityKind: 'shelf', moduleId: m.id, shelfIdx: shIdx, cellIdx: i };
          g.add(sh);
          addEdgeOutline(sh, g);
        });
      }
      // W9-112: 도어 외경 기준 overlay
      const innerW = colW - MASTER_RULES.DOOR_GAP;
      const topDoorH = topH - MASTER_RULES.DOOR_GAP;
      const topDoorY = legH + drawerH + topH / 2;   // W9-114: 본체 안 도어 Y
      const type = (s.areaTypes && s.areaTypes[i]) || 'door';
      addFrontPanel(g, cellCx, topDoorY, innerW, topDoorH, D/2, type, cfg, s, Object.assign({ moduleId: m.id, areaIdx: i, areaPos: 'top', is2D: !!(s.areaIs2D && s.areaIs2D[i]), doorDrop: doorDropOf(m, s), doorTopGap: doorTopGapOf(m, s) }, areaLimitsFor(m)));
      // cell 서랍 — W9-114: 본체 안 (legH 위부터)
      if (drawerH > 0) {
        addFrontPanel(g, cellCx, legH + drawerH/2, innerW, drawerH - MASTER_RULES.DOOR_GAP, D/2,
                      s.bottomType || 'drawer', cfg, s, { moduleId: m.id, areaIdx: -1, areaPos: 'bottom', cellIdx: i });
      }
      cellLeftAccum += colW;
    }
    // W9-113: 다리발 4개 (하부장만)
    addLegs(g, m, cfg, s);
    // W9-115: 상몰딩 (상부장/냉장고장 상단)
    addCrownMolding(g, m, cfg, s);
    addTopPanel(g, m, cfg, s);
    addPedestal(g, m, cfg, s);
    addToeKick(g, m, cfg, s);   // W12-41
    // W9-117: 목찬넬 손잡이
    addHandle(g, m, s, cfg);

    // W9-77/82/83/85: 자식 마감재 (EP/몰딩/휠라) — 진한 우드 톤 + fcfg 없어도 진행
    if (Array.isArray(m.finishings) && m.finishings.length) {
      console.log('[STRUCT] createModuleMesh', m.id, 'finishings:', m.finishings.length);
      m.finishings.forEach((f, fIdx) => {
        // 평면도 절대 좌표 → 모듈 mesh 로컬 (모듈 X/Z 중심=0)
        const fxCenter = (f.x || 0) + (f.W || 0) / 2;
        const fyCenter = (f.y || 0) + (f.D || 0) / 2;
        const mxCenter = m.x + m.W / 2;
        const myCenter = m.y + m.D / 2;
        const dxRel = fxCenter - mxCenter;
        const dzRel = fyCenter - myCenter;
        const fH = f.H || m.H;
        if (!f.W || !f.D || !isFinite(fH)) {
          console.warn('[STRUCT] finishing skip — invalid dims', f);
          return;
        }
        // W9-83: 마감재 색상 — 모듈과 명확 구별 (renderModule3D 와 동일 패턴)
        const finColor = f.section === 'ep' ? '#7a6a45'        // EP 진한 우드
                       : f.section === 'molding' ? '#5a4d2f'   // 몰딩 진갈색
                       : f.section === 'filler' ? '#8a7858'    // 휠라 중간 우드
                       : '#7a6a45';                            // 기본 폴백
        const fbox = makeBox(f.W, fH, f.D, finColor, { roughness: 0.6, metalness: 0.1 });
        fbox.position.set(dxRel, fH / 2, dzRel);
        fbox.userData = { entityKind: 'finishing', moduleId: m.id, finishingSection: f.section, finishingIdx: fIdx };
        g.add(fbox);
        addEdgeOutline(fbox, g, 0x000000, 0.7);   // W9-100: 검은 outline 통일
      });
    }
    return g;
  }

  // renderFrontView / renderRightPanel 호출 시 3D 도 같이 갱신 (single mode 만)
  const _origSetActive = setActiveModule;
  setActiveModule = function(id) {
    _origSetActive(id);
    // 영역 보기에서는 모듈 하나만 남기면 안 된다 — 영역과 이웃 모듈이 사라진다.
    if (isAreaView()) { renderAll3D({ fit: false }); return; }
    if (viewMode !== 'single') return;
    const m = modules.find(x => x.id === id);
    const s = m ? getStructure(id) : null;
    if (m && s) {
      renderModule3D(m, s);
      // W9-103: 정면도 모드면 자동 fit
      if (currentView === '2d') fitFrontView();
    }
  };
  const _origRenderFront = renderFrontView;
  renderFrontView = function() {
    _origRenderFront();
    // 영역 보기면 3D 도 영역째 그린다 — 2D 와 같은 갈림을 쓴다.
    //
    // 이 갈림이 없으면 renderModule3D 가 **활성 모듈 하나만** 3D 에 남기고
    // 영역과 나머지 모듈을 지운다. 도어 on/off 처럼 renderFrontView 를 부르는
    // 버튼이면 무엇이든 플래너가 초기화된 것처럼 보였다.
    if (isAreaView()) { renderAll3D({ fit: false }); return; }
    if (viewMode === 'single') {
      if (!activeId) return;
      const m = modules.find(x => x.id === activeId);
      if (!m) return;
      const s = getStructure(activeId);
      renderModule3D(m, s);
    } else if (viewMode === 'area') {
      renderAll3D({ fit: false });   // W12-15: 영역 보기는 전부 그린다
    } else if (viewMode === 'all') {
      renderAll3D();
    }
  };

  // view mode toggle button click
  document.querySelectorAll('.ml-mode-toggle button').forEach(b => {
    b.onclick = () => setViewMode(b.dataset.mode);
  });

  // ─────────────────────────────────────────────────────────────
  // W9-72: 자동계산 (다담 표준 규칙 — 세트 일괄)
  // ─────────────────────────────────────────────────────────────
  // 삭제됨 — W9-72 가 만들었으나 후속 단계가 더 정확한 방식으로 대체했다:
  //   calcDoorDirections(n)  좌/우 교대 방향. W9-96 이 distributeModules 2D 페어링으로
  //                          대체하며 호출부가 사라졌다 (지금은 dir='both' 로 표현).
  //   overlapsAny(x0,x1,r)   가전 겹침 25% 근사. W9-95 가 splitModuleByAppliance 의
  //                          정확한 경계 분할로 대체하며 호출부 3곳이 사라졌다.
  // 둘 다 저장소 전체에서 호출부 0건인 상태로 남아 있었다.

  // W9-118: 비고정 모듈 W 균등 재분배 (자동계산 트리거 시)
  //   같은 section row 내에서 고정 모듈을 경계로 끊고, 비고정 연속 구간을 균등 폭으로 재배치
  //   run.length===1 도 처리 (단일 비고정 모듈도 span 갱신 가능 — 사실 단일이면 변동 없음)
  //   each<100 시 경고 + skip
  function redistributeNonFixedWidths(set) {
    let warnTooNarrow = 0;
    ['lower', 'upper'].forEach(section => {
      const rowMods = set.modules
        .filter(m => m.section === section)
        .sort((a, b) => (a.x || 0) - (b.x || 0));
      if (rowMods.length === 0) return;
      let run = [];
      const finishRun = () => {
        if (run.length === 0) { return; }
        // 단일 비고정 모듈: 재분배 의미 없음 — span 변동 없음 (skip silently)
        if (run.length === 1) { run = []; return; }
        const first = run[0], last = run[run.length - 1];
        const x0 = first.x || 0;
        const x1 = (last.x || 0) + last.W;
        const span = x1 - x0;
        const each = Math.floor(span / run.length / 10) * 10;   // 10mm 단위
        if (each < 100) { warnTooNarrow++; run = []; return; }
        const remainder = span - each * run.length;
        let cursor = x0;
        run.forEach((m, i) => {
          m.x = cursor;
          m.W = each + (i === run.length - 1 ? remainder : 0);
          cursor += m.W;
        });
        run = [];
      };
      for (const m of rowMods) {
        if (m.isFixed) finishRun();
        else run.push(m);
      }
      finishRun();
    });
    if (warnTooNarrow > 0 && typeof showToast === 'function') {
      showToast(`⚠ ${warnTooNarrow}개 비고정 구간이 너무 좁아 재분배 skip (각 100mm 미만)`);
    }
  }

  // 세트 일괄 자동계산
  function autoCalcForSet(set) {
    if (!set || !set.modules.length) return 0;
    // W9-118: 자동계산 진입 시 비고정 모듈 W 균등 재분배 (고정 모듈 보존)
    redistributeNonFixedWidths(set);
    const applianceRanges = {
      sink:       collectXRanges(set, 'sink'),
      hood:       collectXRanges(set, 'hood'),
      dishwasher: collectXRanges(set, 'dishwasher'),
      fridge:     collectXRanges(set, 'fridge'),   // W9-99: 냉장고 니치 X 범위
    };
    // W9-90: 마스터 필수장 검증
    const hasKitchen = set.modules.some(m => m.section === 'lower' || m.section === 'upper');
    if (hasKitchen) {
      if (applianceRanges.sink.length === 0) {
        showToast('⚠ 개수대 모듈 없음 (마스터 표준: 기본 1개 필수)');
      }
      if (applianceRanges.hood.length === 0) {
        showToast('⚠ 가스대/후드 모듈 없음 (마스터 표준: 기본 1개 필수)');
      }
    }
    // W9-99: 냉장고 W 마스터 검증 (900 ± 50)
    applianceRanges.fridge.forEach(r => {
      const w = r.x1 - r.x0;
      if (Math.abs(w - MASTER_RULES.FRIDGE_NICHE_W) > MASTER_RULES.FRIDGE_NICHE_W_TOL) {
        showToast('⚠ 냉장고 W=' + w + ' ≠ 마스터 니치 ' + MASTER_RULES.FRIDGE_NICHE_W + '±' + MASTER_RULES.FRIDGE_NICHE_W_TOL);
      }
    });
    let count = 0;
    let preserved = 0;
    set.modules.forEach((m) => {
      // 가전 자체는 skip — W9-99: fridge 도 skip 추가
      if (['sink', 'hood', 'dishwasher', 'fridge'].includes(m.section)) return;
      const s = getStructure(m.id);

      // CD-2: '모듈 고정' 은 "자동계산 시 보존" 이라고 적혀 있는데 지켜지지 않았다.
      // autoCalcModule 이 areaTypes/areaWidths/areaIs2D/verticalCount 를 무조건
      // 재생성해서, 셀 폭을 손으로 맞춰둬도 자동계산을 다시 돌리면 사라졌다.
      // 단, 아직 한 번도 계산된 적 없는(=셀 정보가 없는) 모듈은 비워두면
      // 브리지가 통짜 1개로 잡으므로 최초 1회는 계산한다.
      const hasCells = Array.isArray(s.areaWidths) && s.areaWidths.length > 0;
      if (m.isFixed && hasCells) { preserved++; return; }

      autoCalcModule(m, s, applianceRanges);
      // CD-6: 자동계산이 낸 값을 그대로 남겨둔다.
      // 사용자가 이후 손본 최종값과 비교해야 "자동 분배가 어디서 틀리는지" 를
      // 학습할 수 있는데, 지금까지는 최종값만 남아 그 신호가 통째로 없었다.
      s._autoCalc = snapshotAutoCalc(m, s);
      count++;
    });
    if (preserved > 0) {
      showToast(`🔒 고정 모듈 ${preserved}개는 그대로 뒀습니다`);
    }
    // CD-3: 자동계산은 redistributeNonFixedWidths 로 모듈 W/x 를 재배치한다.
    // 저장하지 않으면 그 재배치가 새로고침 시 사라진다.
    persistPlannerState();
    return count;
  }

  // W12-15: 세트 일괄 자동계산 버튼을 없앴다 (세트 모드 폐지).
  // 자동계산은 영역 도구의 '이 영역 자동계산' 이 맡는다.
  // autoCalcForSet / buildSets 는 골든 스냅샷이 직접 부르므로 함수는 남긴다.

  // ─────────────────────────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────────────────────────
  loadModules();
  loadStructures();
  loadPerson();   // W9-105: 사람 원 위치 (정면도 X 원점)
  renderModuleList();
  attachCanvasHandlers();
  attachRulerHandlers();   // W9-110: viewport ruler 클릭 핸들러
  // Three.js 로드 후 init3D
  if (window.THREE) init3D();
  else window.addEventListener('three-ready', init3D);
  // 초기 화면 — Three.js init 다음에.
  //   모듈이 없으면 **영역 보기**로 시작한다. 예전엔 이 자리에서 모듈이 있을 때만
  //   setActiveModule 을 불렀고, 그것이 정면도를 그리는 유일한 경로였다.
  //   그래서 배치만 하고 넘어오면 캔버스가 비어 보였다.
  setTimeout(() => {
    // 언제나 **영역 보기**로 연다. 모듈이 있어도 마찬가지다 —
    // 새로고침했더니 계획(영역)이 사라지고 모듈 하나만 확대돼 있으면
    // 지금 어디를 보고 있는지 알 수 없다. 상세는 좌측 목록으로 들어간다.
    if (modules.length) {
      const first = modules[0];
      activeId = first.id;                 // 우측 패널에 내용이 차도록
      renderModuleList();
      renderRightPanel();
      setActiveArea(first.areaId || (areas[0] && areas[0].id) || null);
    }
    renderFrontView();
    fitToAreas();
    syncCanvasEmpty();
    // 기본 화면이 3D 다. 여기서 안 그리면 배치만 하고 넘어온 사용자에게
    // 빈 바닥만 보인다 — renderAll3D 는 '전체' 모드에서만 불리고 있었다.
    // 첫 화면은 맞춘다. 이후 상호작용에서는 맞추지 않는다.
    if (typeof renderAll3D === 'function') { try { renderAll3D({ fit: true }); } catch (_) {} }
  }, 100);
  applyView();
</script>
</body>
</html>
