<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>다담가구 — AI가 설계하는 프리미엄 맞춤 가구</title>
    <meta
      name="description"
      content="공간 사진과 참고 이미지를 넣으면 연출컷이 생성됩니다. 다담가구 AI 이미지 스튜디오."
    />

    <!-- 메인 화면은 AI 스튜디오다.
         스튜디오 본체를 여기로 복사하지 않고 넘기는 이유:
         두 벌이 되면 한쪽만 고치는 날이 반드시 온다. 정본은 ai-design.html 하나다.

         자바스크립트가 꺼져 있어도 넘어가도록 meta refresh 를 함께 둔다.
         canonical 은 실제 내용이 있는 주소를 가리킨다. -->
    <link rel="canonical" href="https://dadamfurniture.com/ai-design.html" />
    <meta http-equiv="refresh" content="0; url=ai-design.html" />
    <script>
      // meta refresh 는 뒤로 가기 기록을 남겨 '뒤로' 가 무한히 되돌아온다.
      // 스크립트가 살아 있으면 기록을 남기지 않는 replace 로 넘긴다.
      location.replace('ai-design.html' + location.search + location.hash);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-v5.css" />
    <style>
      .idx-main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 40px;
        text-align: center;
      }
      .idx-mark {
        font-family: var(--v5-display);
        font-weight: 300;
        font-size: 30px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        color: var(--v5-navy);
      }
      .idx-msg {
        margin-top: 18px;
        font-weight: 300;
        font-size: 12.5px;
        letter-spacing: 0.06em;
        color: var(--v5-ink-45);
      }
      .idx-msg a {
        color: var(--v5-ink-62);
        border-bottom: 1px solid var(--v5-line-18);
        text-decoration: none;
      }
    </style>
  </head>
  <body class="v5-page">
    <!-- 넘어가기 전 잠깐 보이는 화면. 스크립트가 꺼져 있으면 여기서 링크로 간다. -->
    <main class="idx-main">
      <div>
        <div class="idx-mark">DADAM</div>
        <p class="idx-msg">AI 스튜디오로 이동합니다 · <a href="ai-design.html">바로 가기</a></p>
      </div>
    </main>
  </body>
</html>
