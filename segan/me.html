<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>내 정보 · SEGAN</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg?v=2026102802" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png?v=2026102802" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png?v=2026102802" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2026102802" />
    <meta name="apple-mobile-web-app-title" content="SEGAN" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shell.css?v=2026102802" />
    <!-- 업체 칸의 입력 · 버튼 — 만들기 탭과 같은 모양 (consult.html · renders.html 처럼 싣는다) -->
    <link rel="stylesheet" href="make.css?v=2026102802" />
    <!-- 로그인 상태 · 역할 메뉴 — 기존 사이트의 판정 모듈을 그대로 싣는다 (segan/shell.js 머리말) -->
    <script src="../js/config.js?v=2026102802"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="../js/admin-access.js?v=2026102802"></script>
    <script src="../js/detaildesign-access.js?v=2026102802"></script>
    <script src="../js/mypage-work.js?v=2026102802"></script>
    <!-- 업체 칸: Expert 카드 등록 · Agent 결제 — pricing.html 과 같은 토스 결제창 -->
    <script src="https://js.tosspayments.com/v1/payment" defer></script>
    <script src="regions.js?v=2026102802" defer></script>
    <script src="partner.js?v=2026102802" defer></script>
    <script src="shell.js?v=2026102802" defer></script>
    <script src="make.js?v=2026102802" defer></script>
    <script src="me.js?v=2026102802" defer></script>
  </head>
  <body class="sg-app" data-tab="me">
    <div data-segan-shell="header"></div>

    <main class="sg-main" id="main">
      <h1 class="sg-h1">내 정보</h1>

      <div class="sg-checking" data-auth-view="checking">
        <p class="sg-note">확인하는 중…</p>
      </div>
      <div data-auth-view="signed-out" hidden>
        <div data-segan-shell="gate"></div>
      </div>
      <div data-auth-view="signed-in" hidden>
        <p class="sg-account" id="sgAccountEmail"></p>

        <!-- 내 프로젝트 — workflow-api GET /me/projects. 읽은 뒤에만 보인다 (못 읽으면 칸째 감춘다) -->
        <section class="sg-section" id="meProjectSection" aria-labelledby="meProjectTitle" hidden>
          <h2 id="meProjectTitle">내 프로젝트</h2>
          <ul class="sg-rows" id="meProjects"></ul>
          <p class="me-empty" id="meProjectEmpty" hidden>진행 중인 프로젝트가 없습니다.</p>
        </section>

        <!-- 업체 — account-api GET /partner/me. 읽은 뒤에만 보인다 (못 읽으면 · 본사 구성원이면 칸째 감춘다).
             me.html#partner 로 바로 온다 (pricing.html 의 Expert · Agent 버튼) -->
        <section class="sg-section me-pt" id="partner" aria-labelledby="mePartnerTitle" hidden>
          <h2 id="mePartnerTitle">업체</h2>
          <div id="mePartner"></div>
        </section>

        <!-- 상담 내역 — 본인 consultations (최신순) -->
        <section class="sg-section" aria-labelledby="meConsultTitle">
          <h2 id="meConsultTitle">상담 내역</h2>
          <ul class="sg-rows" id="meConsults"></ul>
          <p class="me-empty" id="meConsultEmpty" hidden>아직 상담 신청이 없습니다.</p>
        </section>

        <!-- 크레딧 · 구독 — 사이트 헤더 · billing.html 과 같은 출처. 바꾸기는 billing.html -->
        <section class="sg-section" aria-labelledby="mePlanTitle">
          <h2 id="mePlanTitle">크레딧 · 구독</h2>
          <ul class="sg-rows">
            <li>
              <span class="sg-row">등급<span class="me-val" id="meTier">…</span></span>
            </li>
            <li>
              <span class="sg-row">남은 크레딧<span class="me-val" id="meCredits">…</span></span>
            </li>
            <li>
              <span class="sg-row">구독<span class="me-val" id="meSub">…</span></span>
            </li>
            <li><a class="sg-row" href="../billing.html">구독 관리</a></li>
          </ul>
        </section>

        <div data-segan-shell="roles"></div>

        <section class="sg-section" aria-labelledby="sgAccountTitle">
          <h2 id="sgAccountTitle">계정</h2>
          <ul class="sg-rows">
            <!-- 프로필 수정 · 회원 탈퇴는 지금은 사이트 마이페이지에서 -->
            <li><a class="sg-row" href="../mypage.html">설정 · 프로필 · 탈퇴</a></li>
            <li><button type="button" class="sg-row" id="sgLogout">로그아웃</button></li>
          </ul>
        </section>
      </div>

      <div data-segan-shell="biz"></div>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
