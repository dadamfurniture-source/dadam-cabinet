<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>내 연출컷 · SEGAN</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg?v=2026111102" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png?v=2026111102" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png?v=2026111102" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2026111102" />
    <meta name="apple-mobile-web-app-title" content="SEGAN" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shell.css?v=2026111102" />
    <link rel="stylesheet" href="make.css?v=2026111102" />
    <!-- 로그인 상태 · 내 연출컷 — 기존 사이트와 같은 Supabase 설정 · 라이브러리 · 서명 URL 도우미(my-designs.html 과 같다) -->
    <script src="../js/config.js?v=2026111102"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <!-- 관리 탭 — 관리자에게만 연다 (segan/shell.js applyAdminTab) -->
    <script src="../js/admin-access.js?v=2026111102"></script>
    <!-- 작업 탭 — 작업자에게만 연다 (segan/shell.js applyRoleTabs · GET /work/me) -->
    <script src="../js/mypage-work.js?v=2026111102"></script>
    <script src="../js/storage-urls.js?v=2026111102"></script>
    <script src="shell.js?v=2026111102" defer></script>
    <!-- SEGAN 비서 — 위 막대 「비서」 · PC 아래 입력 줄 (안내 모드, 로그인 전에는 자주 묻는 것) -->
    <script src="guide.js?v=2026111102" defer></script>
    <script src="make.js?v=2026111102" defer></script>
    <script src="renders.js?v=2026111102" defer></script>
  </head>
  <body class="sg-app" data-tab="renders">
    <div data-segan-shell="header"></div>

    <main class="sg-main" id="main">
      <h1 class="sg-h1">내 연출컷</h1>
      <!-- 결과 화면에서 지우고 왔을 때 한 번 (segan/renders.js takeNotice) -->
      <p class="rd-notice" id="rdNotice" role="status"></p>

      <div class="sg-checking" data-auth-view="checking">
        <p class="sg-note">확인하는 중…</p>
      </div>
      <div data-auth-view="signed-out" hidden>
        <div data-segan-shell="gate"></div>
      </div>
      <div data-auth-view="signed-in" hidden>
        <!-- 목록 — 하나를 누르면 만들기 ③ 결과 화면(./?g=<id>#result)으로 간다 -->
        <section class="rd-list" id="rdList" aria-label="내 연출컷 목록">
          <p class="rd-state" id="rdState" role="status"></p>
          <div class="rd-grid" id="rdGrid"></div>
          <div class="sg-panel" id="rdEmpty" hidden>
            <p class="sg-title">아직 만든 연출컷이 없습니다</p>
            <p class="sg-note">만들기에서 공간 사진으로 연출컷을 만들어 보세요.</p>
            <a class="mk-btn mk-btn--solid" href="./">만들기</a>
          </div>
        </section>
      </div>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
