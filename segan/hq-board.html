      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:wght@500;600&display=swap"

    <link rel="stylesheet" href="make.css?v=2026111110" />
    <link rel="stylesheet" href="hq-board.css?v=2026111110" />
    <!-- 로그인 상태 · 관리자 판정 — 기존 사이트의 판정 모듈을 그대로 싣는다 (segan/shell.js 머리말) -->
    <script src="../js/config.js?v=2026111110"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="../js/admin-access.js?v=2026111110"></script>
    <script src="../js/mypage-work.js?v=2026111110"></script>
    <!-- 움직임 한 벌 — 숫자 굴리기 · 막대 · 선 · 탭 넘기기 · 시트 끌기 (CLAUDE.md 「SEGAN 모션 규칙」) -->
    <script src="motion.js?v=2026111110" defer></script>
    <script src="shell.js?v=2026111110" defer></script>
    <!-- SEGAN 비서 — 위 막대 「비서」 · PC 아래 입력 줄 (안내 모드, 로그인 전에는 자주 묻는 것) -->
    <script src="guide.js?v=2026111110" defer></script>
    <script src="hq-board.js?v=2026111110" defer></script>
  </head>
  <body class="sg-app" data-tab="me">
    <div data-segan-shell="header"></div>

    <!-- 본사 대시보드 — 경영 대시보드 조각 넷을 앱 화면으로 (segan/hq-board.js 머리말).
         #profit 종합 대시보드 › 이익 · 목표, #finance · #cash · #forecast 회계관리 › 손익 분석 · 현금 · 미수 · 매출 예측 -->
    <main class="sg-main hb-main" id="main">
      <a class="mk-link mk-back" href="me.html">‹ 마이페이지</a>
      <h1 class="sg-h1" id="hbTitle">본사 대시보드</h1>

      <div class="sg-checking" data-auth-view="checking">
        <p class="sg-note">확인하는 중…</p>
      </div>
      <div data-auth-view="signed-out" hidden>
        <div data-segan-shell="gate"></div>
      </div>
      <div data-auth-view="signed-in" hidden>
        <!-- 관리자가 아니면 이 줄만 (서버도 관리자만 답한다) -->
        <div class="sg-panel" id="hbDenied" hidden>
          <p class="sg-title">관리자만 볼 수 있습니다</p>
          <p class="sg-note">관리자 계정으로 로그인해 주세요.</p>
        </div>

        <div class="hb-board" id="hbBoard" hidden>
          <!-- 같은 메뉴 조각끼리 (회계관리 셋) — 차례대로 좌우로 들어오고 나간다 -->
          <div class="hb-tabs" role="tablist" aria-label="회계관리" id="hbTabs" hidden>
            <span class="hb-tab-ind" aria-hidden="true"></span>
          </div>

          <!-- 달 — 이익 식 · 손익 분석만 (현금 · 예측은 오늘부터) -->
          <div class="hb-month" id="hbMonth" hidden>
            <button type="button" class="hb-step" id="hbPrev" aria-label="지난 달">‹</button>
            <span class="hb-month-label num" id="hbMonthLabel" aria-live="polite"></span>
            <button type="button" class="hb-step" id="hbNext" aria-label="다음 달">›</button>
          </div>

          <p class="hb-status" id="hbStatus" role="status"></p>

          <div class="hb-views" id="hbViews">
            <section class="hb-view" id="hbProfit" data-part="profit" aria-label="이익 · 목표" hidden></section>
            <section class="hb-view" id="hbFinance" data-part="finance" aria-label="손익 분석" hidden></section>
            <section class="hb-view" id="hbCash" data-part="cash" aria-label="현금 · 미수" hidden></section>
            <section class="hb-view" id="hbForecast" data-part="forecast" aria-label="매출 예측" hidden></section>
          </div>

          <p class="hb-pc" id="hbPc"></p>
        </div>
      </div>

      <div data-segan-shell="biz"></div>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
