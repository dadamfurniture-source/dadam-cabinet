<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>연결이 끊겼습니다 · SEGAN</title>

    <!-- 서비스 워커가 아무 segan 주소에나 이 문서를 대신 내주므로 주소는 모두 /segan/ 기준 절대 경로다.
         (상대 경로면 문서 주소에 따라 다른 파일을 찾는다.) 글꼴은 오프라인에서 못 받으니 기본 글꼴로 보인다. -->
    <link rel="manifest" href="/segan/manifest.webmanifest" />
    <link rel="icon" href="/segan/icons/icon.svg?v=2026110110" type="image/svg+xml" />
    <link rel="icon" href="/segan/icons/favicon-32.png?v=2026110110" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/segan/icons/apple-touch-icon.png?v=2026110110" />
    <link rel="stylesheet" href="/segan/shell.css?v=2026110110" />
  </head>
  <body>
    <main class="sg-center">
      <div>
        <h1 class="sg-wordmark">
          <img src="/segan/icons/wordmark.svg?v=2026110110" alt="SEGAN" width="477" height="75" />
        </h1>
        <hr class="sg-rule" />
        <p class="sg-title">연결이 끊겼습니다</p>
        <p class="sg-note">인터넷에 다시 연결되면 이어서 볼 수 있습니다.</p>
        <button type="button" class="sg-btn" id="retry">다시 시도</button>
      </div>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
    </script>
  </body>
</html>
