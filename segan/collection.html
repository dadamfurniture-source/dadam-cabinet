<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>시공사례 · SEGAN</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg?v=2026103007" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png?v=2026103007" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png?v=2026103007" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2026103007" />
    <meta name="apple-mobile-web-app-title" content="SEGAN" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shell.css?v=2026103007" />
    <!-- 시공사례 — 기존 사이트와 같은 설정 · 라이브러리 (collection_posts 는 로그인 없이 읽는다) -->
    <script src="../js/config.js?v=2026103007"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="shell.js?v=2026103007" defer></script>
    <script src="collection.js?v=2026103007" defer></script>
  </head>
  <body class="sg-app" data-tab="collection">
    <div data-segan-shell="header"></div>

    <main class="sg-main" id="main">
      <h1 class="sg-h1">시공사례</h1>
      <div class="cl-tiles" id="clTiles"></div>
      <p class="cl-state" id="clState" role="status"></p>
      <button type="button" class="sg-btn cl-more" id="clMore" hidden>더 보기</button>
      <div id="clSentinel" class="cl-sentinel"></div>
    </main>

    <!-- 크게 보기 — 앱 안에서만. 다운로드 단추 · 링크는 두지 않는다 -->
    <div class="cl-view" id="clView" role="dialog" aria-modal="true" aria-labelledby="clViewCap" hidden>
      <div class="cl-view-img" id="clViewImg" role="img"></div>
      <div class="cl-view-bar">
        <button type="button" class="cl-view-btn" id="clPrev" aria-label="이전 사례">‹</button>
        <p class="cl-view-cap" id="clViewCap"></p>
        <button type="button" class="cl-view-btn" id="clNext" aria-label="다음 사례">›</button>
        <button type="button" class="cl-view-btn cl-view-close" id="clClose">닫기</button>
      </div>
    </div>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
