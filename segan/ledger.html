<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>장부 · SEGAN</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg?v=2026110203" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png?v=2026110203" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png?v=2026110203" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2026110203" />
    <meta name="apple-mobile-web-app-title" content="SEGAN" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shell.css?v=2026110203" />
    <link rel="stylesheet" href="make.css?v=2026110203" />
    <link rel="stylesheet" href="ledger.css?v=2026110203" />
    <!-- 업체 회계장부 — workflow-api /ledger/* (대표 · 실장. 직원은 안내만) -->
    <script src="../js/config.js?v=2026110203"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <!-- 관리 탭 — 관리자에게만 연다 (segan/shell.js applyAdminTab) -->
    <script src="../js/admin-access.js?v=2026110203"></script>
    <!-- 작업 탭 — 작업자에게만 연다 (segan/shell.js applyRoleTabs · GET /work/me) -->
    <script src="../js/mypage-work.js?v=2026110203"></script>
    <script src="shell.js?v=2026110203" defer></script>
    <script src="ledger.js?v=2026110203" defer></script>
  </head>
  <body class="sg-app" data-tab="me">
    <div data-segan-shell="header"></div>

    <main class="sg-main lg" id="main">
      <a class="mk-link mk-back" href="me.html">‹ 내 정보</a>
      <h1 class="sg-h1">장부</h1>

      <div class="sg-checking" data-auth-view="checking">
        <p class="sg-note">확인하는 중…</p>
      </div>
      <div data-auth-view="signed-out" hidden>
        <div data-segan-shell="gate"></div>
      </div>
      <div data-auth-view="signed-in" hidden>
        <p class="lg-keep" id="lgKeep">사진은 확인용입니다. 종이 원본은 5년 보관하세요.</p>
        <p class="lg-state" id="lgState" role="status"></p>

        <div id="lgBody" hidden>
          <p class="lg-readonly" id="lgReadonly" hidden>지금 등급에서는 장부를 보기만 할 수 있습니다.</p>

          <!-- 과세 설정 — 일반과세면 수금을 공급가 · 부가세로 나눠 보인다 -->
          <section class="lg-box" id="lgTax" aria-labelledby="lgTaxTitle">
            <h2 class="lg-box-title" id="lgTaxTitle">과세 설정</h2>
            <p class="mk-note" id="lgTaxNote"></p>
            <div class="lg-row" id="lgTaxForm">
              <label class="mk-input"
                ><span>과세 유형</span
                ><select id="lgVatType">
                  <option value="">고르기</option>
                  <option value="general">일반과세</option>
                  <option value="simplified">간이과세</option>
                  <option value="exempt">면세</option>
                </select></label
              >
              <label class="mk-input"
                ><span>업종</span
                ><select id="lgBizKind">
                  <option value="">고르기</option>
                  <option value="manufacturing">제조</option>
                  <option value="retail">도소매</option>
                </select></label
              >
              <button type="button" class="mk-btn" id="lgTaxSave">저장</button>
            </div>
          </section>

          <!-- 달 바꾸기 · 달 요약 -->
          <div class="me-bk-nav lg-nav">
            <button type="button" class="mk-btn me-bk-step" id="lgPrev" aria-label="지난달">‹</button>
            <p class="me-bk-month" id="lgMonth" aria-live="polite"></p>
            <button type="button" class="mk-btn me-bk-step" id="lgNext" aria-label="다음 달">›</button>
          </div>
          <dl class="lg-sum" id="lgSum"></dl>
          <p class="mk-note" id="lgSumNote" hidden></p>

          <div class="lg-acts">
            <button type="button" class="mk-btn mk-btn--solid" id="lgAdd">직접 입력</button>
            <label class="lg-check"><input type="checkbox" id="lgShowVoid" /> 취소한 줄도 보기</label>
          </div>

          <!-- 직접 입력 · 고치기 -->
          <form class="lg-box lg-form" id="lgForm" hidden novalidate>
            <h2 class="lg-box-title" id="lgFormTitle">직접 입력</h2>
            <div class="lg-grid">
              <label class="mk-input"><span>일자</span><input type="date" id="lgDate" required /></label>
              <label class="mk-input"
                ><span>구분</span
                ><select id="lgDir">
                  <option value="expense">비용</option>
                  <option value="income">수입</option>
                  <option value="asset_buy">자산 사기</option>
                  <option value="asset_sell">자산 팔기</option>
                </select></label
              >
              <label class="mk-input"
                ><span>계정</span
                ><select id="lgAccount"></select
              ></label>
              <label class="mk-input"
                ><span>내용</span><input type="text" id="lgDesc" maxlength="200" placeholder="예: 11월 임대료"
              /></label>
              <label class="mk-input"
                ><span>거래처</span><input type="text" id="lgCpName" maxlength="100" placeholder="상호"
              /></label>
              <label class="mk-input"
                ><span>사업자등록번호</span
                ><input type="text" id="lgCpBiz" inputmode="numeric" maxlength="12" placeholder="숫자 10자리"
              /></label>
              <label class="mk-input"
                ><span>금액 (부가세 뺀 공급가)</span
                ><input type="number" id="lgAmount" min="1" step="1" inputmode="numeric"
              /></label>
              <label class="mk-input"
                ><span>공제되는 부가세</span
                ><input type="number" id="lgVat" min="0" step="1" inputmode="numeric" placeholder="0"
              /></label>
              <label class="mk-input"
                ><span>증빙</span
                ><select id="lgEvidence"></select
              ></label>
              <label class="mk-input"
                ><span>결제 수단</span
                ><select id="lgMethod"></select
              ></label>
              <label class="mk-input lg-reason" id="lgReasonRow" hidden
                ><span>고치는 이유 · 필수</span><input type="text" id="lgReason" maxlength="300"
              /></label>
            </div>
            <p class="mk-note">
              공제되지 않는 부가세(간이영수증 · 간이과세 공급처 · 접대비)는 합계를 금액에 적고 부가세는 0으로 둡니다.
            </p>
            <p class="mk-error" id="lgFormError" hidden></p>
            <div class="lg-acts">
              <button type="submit" class="mk-btn mk-btn--solid" id="lgSave">저장</button>
              <button type="button" class="mk-btn" id="lgCancel">닫기</button>
            </div>
          </form>

          <ul class="lg-list" id="lgList" aria-label="장부 줄"></ul>
          <p class="mk-note">수주 수금 · 원가는 PC ERP에서 적고, 여기에는 받은 날 · 낸 날 기준으로 함께 보입니다.</p>
        </div>
      </div>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
