  <!-- ④ 상담 신청 — 만들기의 마지막 단계라 만들기 탭에 둔다. 지금은 자리표시 (연출컷 id 를 받는다) -->
  <body class="sg-app" data-tab="make">
    <div data-segan-shell="header"></div>

    <main class="sg-main mk" id="main">
      <section class="mk-step" aria-labelledby="csTitle">
        <a class="mk-link mk-back" id="csBack" href="./">‹ 결과로 돌아가기</a>
        <h1 class="mk-h1" id="csTitle">이 연출컷으로 상담받기</h1>
        <div class="sg-panel">
          <p class="sg-title">준비 중</p>
          <p class="sg-note">상담 신청서는 곧 열립니다. 지금은 전화로 상담할 수 있습니다.</p>
          <a class="mk-btn mk-btn--solid" id="csTel" href="tel:">전화 걸기</a>
        </div>
        <!-- 상담 신청서가 이 연출컷을 붙인다 -->
        <input type="hidden" id="csGen" name="generation_id" value="" />
      </section>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
