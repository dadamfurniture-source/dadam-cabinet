<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>구독 관리 · SEGAN</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg?v=2026111110" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png?v=2026111110" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png?v=2026111110" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2026111110" />
    <meta name="apple-mobile-web-app-title" content="SEGAN" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shell.css?v=2026111110" />
    <!-- 버튼 — 만들기 탭과 같은 모양 -->
    <link rel="stylesheet" href="make.css?v=2026111110" />
    <!-- 로그인 · 등급 · 크레딧 · 결제 내역(Supabase) · 구독(payments-api) — billing.html 과 같은 길 -->
    <script src="../js/config.js?v=2026111110"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <!-- 관리 · 작업 탭 — 관리자 · 작업자에게만 연다 (segan/shell.js applyRoleTabs) -->
    <script src="../js/admin-access.js?v=2026111110"></script>
    <script src="../js/mypage-work.js?v=2026111110"></script>
    <!-- 카드 바꾸기(결제 실패 재시도 중) · 업체 결제 — billing.html 과 같은 토스 결제창 v1 -->
    <script src="https://js.tosspayments.com/v1/payment" defer></script>
    <script src="shell.js?v=2026111110" defer></script>
    <!-- SEGAN 비서 — 위 막대 「비서」 · PC 아래 입력 줄 (안내 모드, 로그인 전에는 자주 묻는 것) -->
    <script src="guide.js?v=2026111110" defer></script>
    <script src="billing.js?v=2026111110" defer></script>
  </head>
  <!-- 내 정보 › 크레딧 · 구독 › 구독 관리 — 내 정보 탭 안의 화면이라 그 탭을 켠다.
       토스 카드 등록이 ?card=ok|fail · ?pay=fail 로 이 화면에 돌아온다 (segan/billing.js) -->
  <body class="sg-app" data-tab="me">
    <div data-segan-shell="header"></div>

    <main class="sg-main bl" id="main">
      <a class="mk-link mk-back" href="me.html">‹ 마이페이지</a>
      <h1 class="sg-h1">구독 관리</h1>

      <div class="sg-checking" data-auth-view="checking">
        <p class="sg-note">확인하는 중…</p>
      </div>
      <div data-auth-view="signed-out" hidden>
        <div data-segan-shell="gate"></div>
      </div>
      <div data-auth-view="signed-in" hidden>
        <p class="bl-status" id="blStatus" role="status" hidden></p>

        <section class="sg-section" aria-labelledby="blPlanTitle">
          <h2 id="blPlanTitle">구독</h2>
          <ul class="sg-rows" id="blPlanRows"></ul>
          <div class="rd-acts bl-acts" id="blActions"></div>
          <!-- 구독 해지 — 한 번 더 묻는다 (billing.html 의 confirm 과 같은 글) -->
          <div class="rd-confirm me-pt-ask bl-acts" id="blAsk" hidden>
            <p class="mk-note" id="blAskText"></p>
            <div class="rd-acts">
              <button type="button" class="mk-btn bl-danger" id="blAskYes">구독 해지</button>
              <button type="button" class="mk-btn" id="blAskNo">그만두기</button>
            </div>
          </div>
        </section>

        <section class="sg-section" aria-labelledby="blHistTitle">
          <h2 id="blHistTitle">결제 내역</h2>
          <div id="blHistory"><p class="me-empty">불러오는 중…</p></div>
        </section>
      </div>
    </main>

    <div data-segan-shell="footer"></div>
    <div data-segan-shell="tabbar"></div>
  </body>
</html>
