<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>비밀번호 재설정 — 다담가구</title>
    <meta name="description" content="비밀번호를 잊으셨나요? 가입하신 이메일로 재설정 링크를 보내드립니다." />
    <!-- 재설정 링크가 담긴 주소다. 색인·참조자 노출을 막는다 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-v5.css" />
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <style>
      .rp-main {
        display: grid;
        place-items: center;
        padding: 72px var(--v5-px) 96px;
        background: var(--v5-work);
        min-height: calc(100vh - var(--v5-header) - 60px);
      }
      .rp-card {
        width: 100%;
        max-width: 420px;
        background: var(--v5-card);
        border: 1px solid var(--v5-line);
        padding: 40px 36px;
      }
      .rp-eyebrow {
        font-weight: 300;
        font-size: 11px;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        color: var(--v5-tan);
        text-align: center;
      }
      .rp-title {
        font-family: var(--v5-display);
        font-weight: 300;
        font-size: 26px;
        text-align: center;
        margin: 14px 0 10px;
        color: var(--v5-ink);
      }
      .rp-lede {
        font-weight: 300;
        font-size: 12.5px;
        line-height: 1.9;
        color: var(--v5-ink-60);
        text-align: center;
        margin-bottom: 28px;
      }
      .rp-field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }
      .rp-field label {
        font-weight: 300;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--v5-ink-45);
      }
      .rp-field input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid var(--v5-line-18);
        background: var(--v5-paper);
        font-weight: 300;
        font-size: 13px;
        color: var(--v5-ink);
      }
      .rp-field input:focus-visible {
        outline: 1px solid var(--v5-tan);
        outline-offset: 1px;
      }
      .rp-submit {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--v5-ink);
        background: var(--v5-ink);
        color: var(--v5-invert);
        font-weight: 400;
        font-size: 12.5px;
        letter-spacing: 0.14em;
        cursor: pointer;
        margin-top: 8px;
      }
      .rp-submit[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .rp-status {
        font-weight: 300;
        font-size: 12.5px;
        line-height: 1.8;
        margin-bottom: 18px;
        padding: 12px 14px;
        border: 1px solid var(--v5-line-18);
        background: var(--v5-well);
        color: var(--v5-ink-62);
      }
      .rp-status.err {
        color: #c0392b;
        border-color: rgba(192, 57, 43, 0.3);
      }
      .rp-status.ok {
        color: var(--v5-tan);
        border-color: rgba(138, 116, 87, 0.35);
      }
      .rp-foot {
        margin-top: 22px;
        text-align: center;
        font-weight: 300;
        font-size: 12px;
        color: var(--v5-ink-45);
      }
      .rp-foot a {
        color: var(--v5-ink-62);
        text-decoration: none;
        border-bottom: 1px solid var(--v5-line-18);
      }
      .rp-foot a:hover {
        color: var(--v5-ink);
      }
      .rp-hint {
        font-weight: 300;
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--v5-ink-45);
        margin-top: -6px;
        margin-bottom: 18px;
      }
    </style>
  </head>
  <body class="v5-page">
    <div data-site-shell="header" data-nav=""></div>

    <main class="rp-main">
      <div class="rp-card">
        <p class="rp-eyebrow">PASSWORD</p>

        <!-- ① 재설정 링크 요청 -->
        <section id="modeRequest">
          <h1 class="rp-title">비밀번호 재설정</h1>
          <p class="rp-lede">가입하신 이메일로 재설정 링크를 보내드립니다.</p>
          <div class="rp-status" id="reqStatus" hidden></div>
          <form id="reqForm">
            <div class="rp-field">
              <label for="email">이메일</label>
              <input type="email" id="email" autocomplete="email" placeholder="example@email.com" required />
            </div>
            <button type="submit" class="rp-submit" id="reqBtn">재설정 링크 받기</button>
          </form>
          <p class="rp-foot">비밀번호가 기억나셨나요? <a href="login.html">로그인</a></p>
        </section>

        <!-- ② 새 비밀번호 입력 (메일 링크로 들어왔을 때) -->
        <section id="modeUpdate" hidden>
          <h1 class="rp-title">새 비밀번호</h1>
          <p class="rp-lede">앞으로 사용하실 비밀번호를 입력해 주세요.</p>
          <div class="rp-status" id="updStatus" hidden></div>
          <form id="updForm">
            <div class="rp-field">
              <label for="pw1">새 비밀번호</label>
              <input type="password" id="pw1" autocomplete="new-password" minlength="8" required />
            </div>
            <p class="rp-hint">8자 이상</p>
            <div class="rp-field">
              <label for="pw2">새 비밀번호 확인</label>
              <input type="password" id="pw2" autocomplete="new-password" minlength="8" required />
            </div>
            <button type="submit" class="rp-submit" id="updBtn">비밀번호 변경</button>
          </form>
        </section>
      </div>
    </main>

    <div data-site-shell="footer"></div>
    <script src="js/site-shell.js" defer></script>

    <script>
      (function () {
        'use strict';

        var $ = function (id) {
          return document.getElementById(id);
        };

        // 해시를 **클라이언트를 만들기 전에** 붙잡는다.
        // supabase-js 는 detectSessionInUrl 로 주소의 토큰을 읽은 뒤 해시를 지운다.
        // 나중에 location.hash 를 보면 이미 비어 있어 재설정 모드로 못 들어간다.
        var urlHash = location.hash || '';

        var sb = null;
        try {
          if (window.DADAM_CONFIG && window.supabase) {
            sb = window.supabase.createClient(window.DADAM_CONFIG.supabase.url, window.DADAM_CONFIG.supabase.anonKey);
          }
        } catch (e) {
          console.warn('[reset] supabase init:', e);
        }

        function say(id, msg, kind) {
          var el = $(id);
          el.textContent = msg || '';
          el.className = 'rp-status' + (kind ? ' ' + kind : '');
          el.hidden = !msg;
        }

        function showUpdateMode() {
          $('modeRequest').hidden = true;
          $('modeUpdate').hidden = false;
        }

        // ── 메일 링크로 들어온 경우 ──
        // supabase-js 는 주소의 #access_token 을 스스로 읽어 복구 세션을 만들고
        // PASSWORD_RECOVERY 를 쏜다. 다만 이 스크립트가 그 이벤트보다 늦게 붙을 수
        // 있어서, 해시를 직접 보는 경로도 함께 둔다.
        if (sb) {
          sb.auth.onAuthStateChange(function (event) {
            if (event === 'PASSWORD_RECOVERY') showUpdateMode();
          });
        }
        if (/type=recovery/.test(urlHash) || /type=recovery/.test(location.search)) {
          showUpdateMode();
        }
        // 이미 이 페이지를 열어둔 채 메일 링크를 누르면 해시만 바뀌고
        // 문서는 다시 로드되지 않는다 — 그때도 재설정 모드로 넘어가야 한다.
        window.addEventListener('hashchange', function () {
          if (/type=recovery/.test(location.hash)) showUpdateMode();
        });

        // 링크가 만료됐을 때 Supabase 는 에러를 해시에 담아 돌려준다.
        var errMatch = urlHash.match(/error_description=([^&]+)/);
        if (errMatch) {
          say('reqStatus', '링크가 만료되었거나 이미 사용되었습니다. 다시 요청해 주세요.', 'err');
        }

        // ── ① 재설정 링크 요청 ──
        $('reqForm').onsubmit = async function (e) {
          e.preventDefault();
          if (!sb) {
            say('reqStatus', '서비스에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.', 'err');
            return;
          }
          var btn = $('reqBtn');
          btn.disabled = true;
          say('reqStatus', '보내는 중…');

          var email = $('email').value.trim();
          var res = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: location.origin + location.pathname,
          });

          btn.disabled = false;
          if (res.error) {
            // 주소가 등록돼 있는지는 알려주지 않는다 — 가입 여부를 흘리지 않기 위해서다.
            console.warn('[reset] request:', res.error.message);
          }
          say(
            'reqStatus',
            '메일을 보냈습니다. 받은 편지함을 확인해 주세요. 몇 분 안에 오지 않으면 스팸함도 확인해 주세요.',
            'ok'
          );
        };

        // ── ② 새 비밀번호 저장 ──
        $('updForm').onsubmit = async function (e) {
          e.preventDefault();
          var pw1 = $('pw1').value;
          var pw2 = $('pw2').value;
          if (pw1 !== pw2) {
            say('updStatus', '두 비밀번호가 다릅니다.', 'err');
            return;
          }
          if (pw1.length < 8) {
            say('updStatus', '비밀번호는 8자 이상이어야 합니다.', 'err');
            return;
          }
          if (!sb) {
            say('updStatus', '서비스에 연결할 수 없습니다.', 'err');
            return;
          }

          var btn = $('updBtn');
          btn.disabled = true;
          say('updStatus', '변경하는 중…');

          var res = await sb.auth.updateUser({ password: pw1 });
          if (res.error) {
            btn.disabled = false;
            // 복구 세션이 없으면 여기서 걸린다 — 링크를 다시 받아야 한다.
            say('updStatus', '변경하지 못했습니다. 재설정 링크를 다시 받아 주세요. (' + res.error.message + ')', 'err');
            return;
          }
          say('updStatus', '비밀번호를 변경했습니다. 잠시 후 로그인 화면으로 이동합니다.', 'ok');
          setTimeout(function () {
            location.href = 'login.html';
          }, 1800);
        };
      })();
    </script>
  </body>
</html>
