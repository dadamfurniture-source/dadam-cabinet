<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>비밀번호 로그인 안내 — 다담가구</title>
    <meta name="description" content="다담가구는 카카오 · 구글 계정으로만 로그인합니다." />
    <!-- 옛 재설정 메일 링크가 이 주소로 온다(주소에 토큰이 붙어 있을 수 있다). 색인·참조자 노출을 막는다 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-v5.css" />
    <!-- 앱과 같은 유리 머리 · 누름 · 흐려지기 전환 -->
    <link rel="stylesheet" href="css/dadam-v5-layer.css" />
    <style>
      .rp-main {
        display: grid;
        place-items: center;
        padding: 72px var(--v5-px) 96px;
        background: var(--v5-work);
        min-height: calc(100vh - var(--v5-header) - 60px);
      }
      .rp-card {
        width: 100%;
        max-width: 420px;
        background: var(--v5-card);
        border: 1px solid var(--v5-line);
        padding: 40px 36px;
      }
      .rp-eyebrow {
        font-weight: 300;
        font-size: 11px;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        color: var(--v5-tan);
        text-align: center;
      }
      .rp-title {
        font-family: var(--v5-display);
        font-weight: 300;
        font-size: 26px;
        text-align: center;
        margin: 14px 0 10px;
        color: var(--v5-ink);
      }
      .rp-lede {
        font-weight: 300;
        font-size: 12.5px;
        line-height: 1.9;
        color: var(--v5-ink-60);
        text-align: center;
        margin-bottom: 28px;
      }
      .rp-submit {
        display: block;
        width: 100%;
        padding: 14px;
        border: 1px solid var(--v5-ink);
        background: var(--v5-ink);
        color: var(--v5-invert);
        font-weight: 400;
        font-size: 12.5px;
        letter-spacing: 0.14em;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body class="v5-page">
    <div data-site-shell="header" data-nav=""></div>

    <!-- 2026-11-23 대표님: 이메일 · 비밀번호 로그인을 없앴다 — 카카오 · 구글만.
         비밀번호를 바꾸는 길도 없다. 옛 재설정 메일 · 링크로 들어온 분께 같은 이메일의 소셜 계정으로 들어오는 길만 알린다 -->
    <main class="rp-main">
      <div class="rp-card">
        <p class="rp-eyebrow">LOGIN</p>
        <h1 class="rp-title">비밀번호 로그인은 쓰지 않습니다</h1>
        <p class="rp-lede" id="rpLede">
          다담가구는 카카오 · 구글 계정으로만 로그인합니다. 이메일로 가입하셨던 분은 같은 이메일의 구글 · 카카오
          계정으로 들어오시면 그 계정으로 이어집니다.
        </p>
        <a class="rp-submit" id="rpLogin" href="login.html">로그인 화면으로</a>
      </div>
    </main>

    <div data-site-shell="footer"></div>
    <script src="js/site-shell.js" defer></script>
  </body>
</html>
