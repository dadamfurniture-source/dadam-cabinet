<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>다담 — SketchUp 2026 스타일 layout mockup (W8-5-1)</title>
<style>
  :root {
    --brand-deep:#6a4b2a; --brand-mid:#b8956c; --brand-soft:#f3ead9;
    --bg:#fbfaf6; --bg-canvas:#f4efe7; --line:#e5e0d4;
    --text:#3d342a; --text-dim:#7a7062; --text-faint:#a89c84;
    --shadow-sm:0 1px 4px rgba(0,0,0,0.04);
    --shadow-md:0 2px 8px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text);background:var(--bg-canvas);overflow:hidden}

  /* ── App shell ─────────────────────────────────────── */
  .shell{display:flex;flex-direction:column;height:100vh;width:100vw}

  /* ── TopBar (h:40) ─────────────────────────────────── */
  .topbar{height:40px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
  .step-pill{display:flex;align-items:center;gap:0;padding:3px 6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600}
  .step-pill button{border:none;background:transparent;padding:3px 10px;border-radius:999px;cursor:pointer;color:var(--text-dim);font-size:11px;font-weight:600;display:flex;gap:4px;align-items:center}
  .step-pill button.active{background:var(--brand-deep);color:#fff;box-shadow:0 2px 5px rgba(106,75,42,.25)}
  .step-pill .sep{width:14px;height:2px;background:var(--line);display:inline-block}
  .dim-group{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--brand-deep);font-weight:600}
  .dim-group label{display:flex;align-items:center;gap:3px}
  .dim-group span.k{color:var(--text-dim)}
  .dim-group input{width:54px;padding:2px 4px;border:1px solid #d9d2bf;border-radius:4px;font-size:11px;text-align:right}
  .dim-group span.u{color:var(--text-faint);font-size:10px}
  .spacer{flex:1}
  .view-toggle{display:flex;gap:2px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
  .view-toggle button{border:none;padding:3px 12px;border-radius:999px;background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer}
  .view-toggle button.active{background:var(--brand-deep);color:#fff}
  .panel-toggle{display:flex;gap:4px}
  .panel-toggle button{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:13px;color:var(--text-dim)}
  .panel-toggle button.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-mid)}

  /* ── Middle row (left tools + canvas + right panel) ── */
  .mid{flex:1;min-height:0;display:flex}

  /* ── Left toolbar (w:48) ───────────────────────────── */
  .left-tools{width:48px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;transition:width .18s ease;overflow:hidden}
  .left-tools.collapsed{width:0;border-right:0}
  .tool-btn{width:38px;height:38px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);position:relative;font-size:18px;transition:all .12s ease}
  .tool-btn:hover{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand-mid)}
  .tool-btn .badge{position:absolute;top:2px;right:2px;background:var(--brand-deep);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;padding:0 3px;display:flex;align-items:center;justify-content:center}
  .tool-sep{width:28px;height:1px;background:var(--line);margin:4px 0}

  /* ── Main canvas ───────────────────────────────────── */
  .canvas-wrap{flex:1;min-width:0;position:relative;background:var(--bg-canvas);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:14px;background-image:linear-gradient(rgba(184,149,108,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(184,149,108,.08) 1px,transparent 1px);background-size:50px 50px}
  .canvas-placeholder{text-align:center}
  .canvas-placeholder .big{font-size:48px;opacity:.3;margin-bottom:8px}
  /* W9-11: 사각형 인터랙션 — 선택 강조 + 호버 */
  .canvas-svg{user-select:none}
  .sect-rect rect:not(.resize-handle){transition:stroke-width .15s ease, filter .15s ease}
  .sect-rect:hover rect:not(.resize-handle){stroke-width:3}
  /* W9-22: filter 제거 — drop-shadow 가 isolate group 생성해서 multiply blend 깨짐 */
  .sect-rect.selected rect:not(.resize-handle){stroke-width:5 !important;stroke:#2a1f10 !important}
  .sect-rect{cursor:move}
  /* W9-22: 겹친 부분 자동 식별 — multiply blend (두 색 곱셈으로 어두워짐 = 겹침 시각화) */
  /* content layer 내부에서만 작동하도록 isolate (배경 그리드 영향 X) */
  svg.canvas-svg g.content{isolation:isolate}
  .sect-rect rect:not(.resize-handle){mix-blend-mode:multiply}
  /* W9-24: X 버튼 — blend 영향 안 받게 normal + hover 강조 */
  .sect-rect g.close-btn{mix-blend-mode:normal}
  .sect-rect g.close-btn circle{transition:fill .12s ease}
  .sect-rect g.close-btn:hover circle{fill:#fee}
  .sect-rect g.close-btn:hover path{stroke:#c0392b}
  /* W9-14: resize handle 제거 — W/D 입력 popup 으로 대체 */
  .sect-rect .resize-handle{display:none !important}
  /* W9-14: W/D 입력 popup — 선택 사각형 위에 floating */
  #dimPopup{position:absolute;display:none;background:#fff;border:1px solid #b8956c;border-radius:6px;padding:5px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:60;font-size:11px;color:#3d342a}
  #dimPopup label{display:inline-flex;align-items:center;gap:3px;margin-right:6px}
  #dimPopup label:last-child{margin-right:0}
  #dimPopup .k{color:#7a7062;font-weight:600}
  #dimPopup input{width:54px;padding:2px 4px;border:1px solid #d9d2bf;border-radius:3px;font-size:11px;text-align:right}
  #dimPopup .u{color:#a89c84;font-size:10px}
  /* W9-14: 자석 snap 시각 표시 (드래그 중) */
  .magnet-hint{stroke:#e74c3c;stroke-width:2;stroke-dasharray:4 3;fill:none;pointer-events:none;opacity:.8}

  /* ── Right panel (w:280, collapsed:32) ─────────────── */
  .right-panel{width:280px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease;overflow:hidden}
  .right-panel.collapsed{width:32px}
  .right-panel.collapsed .section,.right-panel.collapsed .panel-header-title{display:none}
  .panel-header{height:28px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:600;color:var(--text-dim)}
  .right-panel.collapsed .panel-header{justify-content:center;padding:0;writing-mode:vertical-rl;height:100%}
  .panel-header button{border:none;background:transparent;cursor:pointer;color:var(--text-dim);font-size:14px;padding:2px 4px}
  .section{border-bottom:1px solid var(--line)}
  .section-header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--text)}
  .section-header:hover{background:var(--bg)}
  .section-header .chev{font-size:10px;color:var(--text-faint);transition:transform .15s ease}
  .section.collapsed .chev{transform:rotate(-90deg)}
  .section.collapsed .section-body{display:none}
  .section-body{padding:6px 10px 12px;background:#fff;font-size:11px;color:var(--text-dim)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
  .row label{color:var(--text-dim)}
  .row input,.row select{padding:2px 5px;border:1px solid var(--line);border-radius:3px;font-size:11px;width:90px}
  .swatch-row{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .swatch{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);cursor:pointer}
  .swatch.sel{outline:2px solid var(--brand-deep);outline-offset:1px}

  /* ── BottomBar (h:32) ──────────────────────────────── */
  .bottombar{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(0,0,0,.04);font-size:11px;color:var(--text-dim)}
  .bottombar .actions{display:flex;gap:6px}
  .bottombar button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer}
  .bottombar button.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
</style>
</head>
<body>
<div class="shell">

  <!-- ── TopBar ── -->
  <div class="topbar">
    <div class="step-pill">
      <button class="active">📐 1.배치</button><span class="sep"></span>
      <button>📦 2.구조</button><span class="sep"></span>
      <button>🎨 3.디테일</button>
    </div>
    <div class="dim-group">
      <span>가구</span>
      <label><span class="k">W</span><input type="number" value="4200" step="50"><span class="u">mm</span></label>
      <label><span class="k">H</span><input type="number" value="2310" step="50"><span class="u">mm</span></label>
      <label><span class="k">D</span><input type="number" value="650" step="50"><span class="u">mm</span></label>
    </div>
    <div class="spacer"></div>
    <div class="view-toggle">
      <button>📐 도면</button><button class="active">🧊 3D</button>
    </div>
    <div class="panel-toggle">
      <button id="btnLeft" class="on" title="좌측 도구 (L)">⬛</button>
      <button id="btnRight" class="on" title="우측 패널 (R)">▦</button>
    </div>
  </div>

  <!-- ── Middle row ── -->
  <div class="mid">

    <!-- Left toolbar -->
    <div class="left-tools" id="leftTools">
      <button class="tool-btn" title="싱크대">🚰<span class="badge">2</span></button>
      <button class="tool-btn" title="가스대/쿡탑">🔥</button>
      <button class="tool-btn" title="후드">💨</button>
      <button class="tool-btn" title="냉장고">🧊<span class="badge">1</span></button>
      <button class="tool-btn" title="식기세척기">🍽️</button>
      <div class="tool-sep"></div>
      <!-- W9-10: 하부장/상부장/키큰장 — 직사각형 비율 SVG + 클릭 시 도면에 색상별 배치 -->
      <button class="tool-btn rect-btn" title="하부장 추가 (도면에 배치)" data-section="lower">
        <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true">
          <rect x="2" y="3" width="18" height="11" fill="#b8956c" stroke="#6a4b2a" stroke-width="1.5" rx="1"/>
          <line x1="8" y1="3" x2="8" y2="14" stroke="#6a4b2a" stroke-width="1"/>
          <line x1="14" y1="3" x2="14" y2="14" stroke="#6a4b2a" stroke-width="1"/>
        </svg>
      </button>
      <button class="tool-btn rect-btn" title="상부장 추가 (도면에 배치)" data-section="upper">
        <svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true">
          <rect x="2" y="1" width="18" height="9" fill="#7c9c8f" stroke="#3d5750" stroke-width="1.5" rx="1"/>
          <line x1="11" y1="1" x2="11" y2="10" stroke="#3d5750" stroke-width="1"/>
        </svg>
      </button>
      <button class="tool-btn rect-btn" title="키큰장 추가 (도면에 배치)" data-section="tall">
        <svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true">
          <rect x="2" y="2" width="14" height="18" fill="#9c6e7c" stroke="#5c3848" stroke-width="1.5" rx="1"/>
          <line x1="2" y1="8" x2="16" y2="8" stroke="#5c3848" stroke-width="1"/>
          <line x1="2" y1="14" x2="16" y2="14" stroke="#5c3848" stroke-width="1"/>
        </svg>
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" title="멍장(blind corner)">◣</button>
      <button class="tool-btn" title="필러">┃</button>
    </div>

    <!-- Canvas placeholder -->
    <div class="canvas-wrap">
      <!-- W9-14: 선택 사각형 W/D 입력 popup -->
      <div id="dimPopup">
        <label><span class="k">W</span><input id="dimW" type="number" step="1" min="1"><span class="u">mm</span></label>
        <label><span class="k">D</span><input id="dimD" type="number" step="1" min="1"><span class="u">mm</span></label>
      </div>
      <div class="canvas-placeholder">
        <div class="big">🧊</div>
        <div>메인 캔버스 (3D View / 도면)</div>
        <div style="font-size:11px;margin-top:6px">SegmentEditor · StructureEditor · ModuleDetailPanel · R3F Canvas</div>
        <div style="font-size:10px;margin-top:14px;color:#b8956c">단축키: <kbd style="border:1px solid #b8956c;padding:1px 5px;border-radius:3px;font-family:monospace">L</kbd> 좌측 토글 · <kbd style="border:1px solid #b8956c;padding:1px 5px;border-radius:3px;font-family:monospace">R</kbd> 우측 토글</div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel" id="rightPanel">
      <div class="panel-header">
        <span class="panel-header-title">기본 트레이</span>
        <button title="패널 접기" onclick="document.getElementById('rightPanel').classList.toggle('collapsed')">»</button>
      </div>

      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 가구 정보
        </div>
        <div class="section-body">
          <div class="row"><label>선택</label><span>하부장 #3</span></div>
          <div class="row"><label>W × H × D</label><span>800 × 870 × 650</span></div>
          <div class="row"><label>카테고리</label><span>싱크대</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 도어 / 손잡이
        </div>
        <div class="section-body">
          <div class="row"><label>도어 색상</label>
            <div class="swatch-row" style="margin:0">
              <span class="swatch sel" style="background:#e8dcc4"></span>
              <span class="swatch" style="background:#3d342a"></span>
              <span class="swatch" style="background:#b8956c"></span>
              <span class="swatch" style="background:#fff"></span>
            </div>
          </div>
          <div class="row"><label>도어 개수</label><input type="number" value="2"></div>
          <div class="row"><label>손잡이</label>
            <select><option>매립형</option><option>막대형</option><option>노브</option></select>
          </div>
        </div>
      </div>

      <div class="section collapsed">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> 마감 / 조명
        </div>
        <div class="section-body">
          <div class="row"><label>몰딩 높이</label><input type="number" value="80"></div>
          <div class="row"><label>걸레받이</label><input type="number" value="100"></div>
          <div class="row"><label>LED 라인</label><select><option>없음</option><option>하부</option><option>상부</option></select></div>
        </div>
      </div>

      <div class="section collapsed">
        <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="chev">▼</span> BOM 미리보기
        </div>
        <div class="section-body">
          <div class="row"><label>총 모듈</label><span>14 개</span></div>
          <div class="row"><label>도어 패널</label><span>22 장</span></div>
          <div class="row"><label>예상 자재비</label><span>2,840,000원</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── BottomBar ── -->
  <div class="bottombar">
    <div class="actions">
      <button class="primary">📤 SketchUp 보내기</button>
      <button>📥 가져오기</button>
    </div>
    <div>ⓘ 휠=줌 · 빈공간 드래그=팬 · 우클릭=회전 · F=Fit · 0=Reset · 줌 <span id="zoomInd">100%</span></div>
  </div>
</div>

<script>
  const lt = document.getElementById('leftTools'), btnL = document.getElementById('btnLeft');
  const rp = document.getElementById('rightPanel'), btnR = document.getElementById('btnRight');
  btnL.onclick = () => { lt.classList.toggle('collapsed'); btnL.classList.toggle('on'); };
  btnR.onclick = () => { rp.classList.toggle('collapsed'); btnR.classList.toggle('on'); };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'l' || e.key === 'L') btnL.click();
    if (e.key === 'r' || e.key === 'R') btnR.click();
  });
  // W9-10: 하부장/상부장/키큰장 — 도면 (canvas-wrap) 에 색상별 직사각형 추가
  // W9-20: 표준 모듈 치수 (mm)
  // - 하부장: W2400 × D650 (싱크대 표준 깊이)
  // - 상부장: W2400 × D320 (벽장 표준 깊이)
  // - 키큰장: W600 × D650 (냉장고/오븐장 표준)
  const SECTION_CONFIG = {
    lower: { fill: '#b8956c', stroke: '#6a4b2a', w: 2400, h: 650, label: '하부장' },
    upper: { fill: '#7c9c8f', stroke: '#3d5750', w: 2400, h: 320, label: '상부장' },
    tall:  { fill: '#9c6e7c', stroke: '#5c3848', w: 600,  h: 650, label: '키큰장' },
  };

  // W9-25: 라벨을 두 줄로 분할 — 이름(큰 글자) / 치수(작은 글자)
  // 두 줄 동시 만족하는 최대 name 폰트 크기 반환
  function computeNameFontSize(w, h, name, dim) {
    const nameLen = Math.max(name.length, 1);
    const dimLen = Math.max(dim.length, 1);
    const dimRatio = 0.6; // dim 폰트 = name * 0.6
    const charW = 0.58;   // 평균 글자폭/font-size (한글 ≈ 0.6, 숫자 ≈ 0.55)
    // 폭 제약: name 한 줄, dim 한 줄 각자 사각형 폭의 88% 차지
    const nameByW = (w * 0.88) / nameLen / charW;
    const dimByW  = (w * 0.88) / dimLen / charW / dimRatio;
    // 높이 제약: 두 줄 + 줄간격 (name + dim*ratio + gap) ≤ h * 0.85
    // → name * (1 + dimRatio + 0.15) ≤ h * 0.85
    const byH = (h * 0.85) / (1 + dimRatio + 0.15);
    return Math.max(10, Math.min(nameByW, dimByW, byH, 360));
  }

  // 라벨 텍스트 두 tspan 갱신 (신규/리사이즈 공용)
  function applyLabel(textEl, cx, cy, w, h, name, dim) {
    const nameSize = computeNameFontSize(w, h, name, dim);
    const dimSize = nameSize * 0.6;
    textEl.setAttribute('x', cx);
    textEl.setAttribute('y', cy);
    textEl.setAttribute('font-size', nameSize);
    // 기존 tspan 모두 제거 후 재구성
    while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
    const ns = 'http://www.w3.org/2000/svg';
    const t1 = document.createElementNS(ns, 'tspan');
    t1.setAttribute('x', cx);
    t1.setAttribute('dy', -nameSize * 0.30);  // 위쪽 라인
    t1.textContent = name;
    textEl.appendChild(t1);
    const t2 = document.createElementNS(ns, 'tspan');
    t2.setAttribute('x', cx);
    t2.setAttribute('dy', nameSize * 1.05);   // 아래쪽 라인 (name 아래로 1.05 line height)
    t2.setAttribute('font-size', dimSize);
    t2.setAttribute('opacity', '0.88');
    t2.textContent = dim;
    textEl.appendChild(t2);
  }
  let rectIdx = 0;
  // W9-17: pan/zoom view state. content layer 의 transform 으로 적용.
  const view = { panX: 0, panY: 0, zoom: 1 };
  function applyView() {
    const svg = document.querySelector('.canvas-wrap svg.canvas-svg');
    if (!svg) return;
    const content = svg.querySelector('g.content');
    if (content) content.setAttribute('transform', `translate(${view.panX} ${view.panY}) scale(${view.zoom})`);
    // 배경 grid scale 동기화 (50mm * zoom)
    const wrap = document.querySelector('.canvas-wrap');
    if (wrap) {
      const sz = (50 * view.zoom).toFixed(2) + 'px';
      wrap.style.backgroundSize = sz + ' ' + sz;
      wrap.style.backgroundPosition = view.panX + 'px ' + view.panY + 'px';
    }
    const zi = document.getElementById('zoomInd');
    if (zi) zi.textContent = Math.round(view.zoom * 100) + '%';
    if (typeof updateDimPopupPosition === 'function') updateDimPopupPosition();
    // W9-24: X 버튼 위치/크기 zoom 보정 (화면 22px 일정)
    if (typeof updateCloseButtons === 'function') updateCloseButtons();
  }

  // W9-24: X 버튼 — 사각형 우상단 corner 안쪽, 화면 일정 크기 (22px)
  function updateCloseButtons() {
    const z = view.zoom || 1;
    const targetPx = 22;          // 원 지름 24px 목표 → scale = 22/24
    const scale = (targetPx / 24) / z;
    const insetSvg = 14 / z;      // corner 에서 안쪽으로 14 화면 px
    document.querySelectorAll('g.sect-rect g.close-btn').forEach((cb) => {
      const g = cb.parentElement;
      const rect = g.querySelector('rect:not(.resize-handle)');
      if (!rect) return;
      const x = parseFloat(rect.getAttribute('x'));
      const y = parseFloat(rect.getAttribute('y'));
      const w = parseFloat(rect.getAttribute('width'));
      const cx = x + w - insetSvg;
      const cy = y + insetSvg;
      cb.setAttribute('transform', `translate(${cx} ${cy}) scale(${scale})`);
    });
  }

  function ensureCanvasSVG() {
    const wrap = document.querySelector('.canvas-wrap');
    let svg = wrap.querySelector('svg.canvas-svg');
    if (!svg) {
      const ns = 'http://www.w3.org/2000/svg';
      svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('class', 'canvas-svg');
      svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;touch-action:none;';
      // W9-17: content layer — 모든 사각형은 여기 들어감 (pan/zoom 대상)
      const content = document.createElementNS(ns, 'g');
      content.setAttribute('class', 'content');
      svg.appendChild(content);
      wrap.appendChild(svg);
      const ph = wrap.querySelector('.canvas-placeholder');
      if (ph) ph.style.display = 'none';
      attachPanZoomHandlers(svg, wrap);
      // W9-18: 첫 표시 시 가로 7000mm 가 보일 정도로 줌아웃
      setInitialView();
    }
    return svg;
  }

  // W9-18: 기본 view — 가로 7000mm fit (좌우 약간 여백)
  function setInitialView() {
    const wrap = document.querySelector('.canvas-wrap');
    if (!wrap) { applyView(); return; }
    const cw = wrap.clientWidth || 1200;
    const ch = wrap.clientHeight || 700;
    const targetMm = 7000;
    view.zoom = (cw * 0.94) / targetMm;
    view.panX = cw * 0.03;   // 좌측 3% 여백
    view.panY = ch * 0.1;    // 상단 10% 여백 (도면 위쪽 정렬)
    applyView();
  }
  // 외부 resize 대응 — 사각형 없을 때 윈도 리사이즈 시 다시 기본
  window.addEventListener('resize', () => {
    const content = getContent();
    if (!content || !content.querySelector('rect:not(.resize-handle)')) {
      if (document.querySelector('.canvas-wrap svg.canvas-svg')) setInitialView();
    }
  });

  function getContent() {
    const svg = document.querySelector('.canvas-wrap svg.canvas-svg');
    return svg ? svg.querySelector('g.content') : null;
  }

  // W9-17: 마우스 휠 줌 (커서 anchor) + 빈 공간 드래그 = 팬
  function attachPanZoomHandlers(svg, wrap) {
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      const newZoom = Math.max(0.05, Math.min(8, view.zoom * factor));
      // 커서 위치 anchor 유지: world = (screen - pan) / zoom; pan' = screen - world * zoom'
      const wx = (mx - view.panX) / view.zoom;
      const wy = (my - view.panY) / view.zoom;
      view.zoom = newZoom;
      view.panX = mx - wx * newZoom;
      view.panY = my - wy * newZoom;
      applyView();
    }, { passive: false });

    // 빈 공간 (content layer 가 아닌 곳) pointerdown → pan
    let panInfo = null;
    svg.addEventListener('pointerdown', (e) => {
      // g.sect-rect (또는 그 자손) 아래에서 시작한 경우는 pan 안 함
      if (e.target.closest && e.target.closest('g.sect-rect')) return;
      // 미들 버튼 or Space or 그냥 빈 공간
      panInfo = { sx: e.clientX, sy: e.clientY, ox: view.panX, oy: view.panY, pid: e.pointerId };
      svg.setPointerCapture(e.pointerId);
      svg.style.cursor = 'grabbing';
    });
    svg.addEventListener('pointermove', (e) => {
      if (!panInfo) return;
      view.panX = panInfo.ox + (e.clientX - panInfo.sx);
      view.panY = panInfo.oy + (e.clientY - panInfo.sy);
      applyView();
    });
    const endPan = () => { panInfo = null; svg.style.cursor = ''; };
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);

    // 더블 클릭 빈 공간 = Fit All
    svg.addEventListener('dblclick', (e) => {
      if (e.target.closest && e.target.closest('g.sect-rect')) return;
      fitAll();
    });
    // W9-19: 빈 공간 우클릭 메뉴 차단 (사각형은 회전 핸들러로 처리)
    svg.addEventListener('contextmenu', (e) => {
      if (e.target.closest && e.target.closest('g.sect-rect')) return;
      e.preventDefault();
    });
  }

  // W9-17: 모든 사각형이 보이도록 zoom/pan 조정
  function fitAll() {
    const content = getContent();
    const wrap = document.querySelector('.canvas-wrap');
    if (!content || !wrap) return;
    const rects = content.querySelectorAll('rect:not(.resize-handle)');
    if (!rects.length) { view.zoom = 1; view.panX = 0; view.panY = 0; applyView(); return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    rects.forEach((r) => {
      const x = parseFloat(r.getAttribute('x'));
      const y = parseFloat(r.getAttribute('y'));
      const w = parseFloat(r.getAttribute('width'));
      const h = parseFloat(r.getAttribute('height'));
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    const pad = 60;
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const contentW = (maxX - minX) || 1;
    const contentH = (maxY - minY) || 1;
    const z = Math.min((cw - pad * 2) / contentW, (ch - pad * 2) / contentH);
    view.zoom = Math.max(0.05, Math.min(8, z));
    view.panX = pad - minX * view.zoom + (cw - pad * 2 - contentW * view.zoom) / 2;
    view.panY = pad - minY * view.zoom + (ch - pad * 2 - contentH * view.zoom) / 2;
    applyView();
  }

  function resetView() {
    // W9-18: Reset = 기본 view (가로 7000mm fit)
    setInitialView();
  }
  function addSectionRect(section) {
    const cfg = SECTION_CONFIG[section];
    if (!cfg) return;
    ensureCanvasSVG();
    const content = getContent();
    if (!content) return;
    const ns = 'http://www.w3.org/2000/svg';
    // W9-20: 큰 기본 치수 (W2400+) 에 맞춰 placement offset 동적 — 3열, 사각형 폭+100mm 간격
    const baseX = 80, baseY = 80;
    const offsetX = baseX + (rectIdx % 3) * (cfg.w + 100);
    const offsetY = baseY + Math.floor(rectIdx / 3) * (cfg.h + 100);
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'sect-rect ' + section);
    g.style.cursor = 'move';
    const r = document.createElementNS(ns, 'rect');
    r.setAttribute('x', offsetX);
    r.setAttribute('y', offsetY);
    r.setAttribute('width', cfg.w);
    r.setAttribute('height', cfg.h);
    r.setAttribute('fill', cfg.fill);
    r.setAttribute('stroke', cfg.stroke);
    r.setAttribute('stroke-width', '2');
    // W9-15: 사각 코너 (rx 제거) — 90도 각 표현
    // W9-22: 겹침 시각화 multiply blend 와 함께 — opacity 살짝 낮춤
    r.setAttribute('opacity', '0.85');
    g.appendChild(r);
    const txt = document.createElementNS(ns, 'text');
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('fill', '#fff');
    txt.setAttribute('font-weight', '700');
    txt.setAttribute('pointer-events', 'none');
    txt.setAttribute('data-name', cfg.label);  // 라벨 이름 (리사이즈 시 재참조)
    // W9-25: 두 줄 라벨 — 이름(큰) + 치수(작은)
    const dimText = cfg.w + '×' + cfg.h + 'mm';
    applyLabel(txt, offsetX + cfg.w / 2, offsetY + cfg.h / 2, cfg.w, cfg.h, cfg.label, dimText);
    g.appendChild(txt);
    // W9-24: 우측 상단 X 삭제 버튼 (group: 원 + X path). 위치/크기는 updateCloseButtons() 가 zoom 보정.
    const close = document.createElementNS(ns, 'g');
    close.setAttribute('class', 'close-btn');
    close.style.cursor = 'pointer';
    const cBg = document.createElementNS(ns, 'circle');
    cBg.setAttribute('r', '12');
    cBg.setAttribute('fill', '#fff');
    cBg.setAttribute('stroke', '#6a4b2a');
    cBg.setAttribute('stroke-width', '2');
    close.appendChild(cBg);
    const cX = document.createElementNS(ns, 'path');
    cX.setAttribute('d', 'M -5 -5 L 5 5 M -5 5 L 5 -5');
    cX.setAttribute('stroke', '#6a4b2a');
    cX.setAttribute('stroke-width', '2.5');
    cX.setAttribute('stroke-linecap', 'round');
    cX.setAttribute('fill', 'none');
    close.appendChild(cX);
    g.appendChild(close);
    content.appendChild(g);
    rectIdx++;
  }

  // W9-11: 사각형 인터랙션 — 선택 / 드래그 / 더블클릭 회전 / Delete 삭제 / Esc 해제
  let selectedG = null;
  const rotations = new WeakMap();

  function selectG(g) {
    if (selectedG && selectedG !== g) selectedG.classList.remove('selected');
    selectedG = g;
    if (g) g.classList.add('selected');
    // W9-14: dimPopup 위치/값 갱신
    if (typeof updateDimPopupPosition === 'function') updateDimPopupPosition();
  }

  function rotateG(g) {
    if (!g) return;
    const cur = rotations.get(g) || 0;
    const next = (cur + 90) % 360;
    rotations.set(g, next);
    const rect = g.querySelector('rect');
    const cx = parseFloat(rect.getAttribute('x')) + parseFloat(rect.getAttribute('width')) / 2;
    const cy = parseFloat(rect.getAttribute('y')) + parseFloat(rect.getAttribute('height')) / 2;
    g.setAttribute('transform', next === 0 ? '' : `rotate(${next} ${cx} ${cy})`);
  }

  function attachRectHandlers(g) {
    let dragInfo = null;
    g.addEventListener('pointerdown', (e) => {
      // W9-13: resize handle 클릭 시 드래그 안 함 (handle 자체 이벤트 처리)
      if (e.target.classList && e.target.classList.contains('resize-handle')) return;
      // W9-24: X 버튼 클릭 시 드래그 안 함
      if (e.target.closest && e.target.closest('g.close-btn')) return;
      e.stopPropagation();
      selectG(g);
      const rect = g.querySelector('rect:not(.resize-handle)');
      dragInfo = {
        startX: e.clientX, startY: e.clientY,
        origX: parseFloat(rect.getAttribute('x')),
        origY: parseFloat(rect.getAttribute('y')),
      };
      g.setPointerCapture(e.pointerId);
    });
    g.addEventListener('pointermove', (e) => {
      if (!dragInfo) return;
      // W9-17: zoom 보정 — 화면 픽셀 → SVG 단위 (mm)
      const z = view.zoom || 1;
      const dx = (e.clientX - dragInfo.startX) / z;
      const dy = (e.clientY - dragInfo.startY) / z;
      const rect = g.querySelector('rect:not(.resize-handle)');
      const text = g.querySelector('text');
      // W9-12: 격자 snap 50mm. Shift 누른 채 드래그 시 자유.
      // W9-21: 자석을 grid 보다 먼저 시도 — raw 위치에서 검색 (grid 격자에 갇혀 자석 못 닿는 문제 해결)
      const GRID = 50;
      const rawX = dragInfo.origX + dx;
      const rawY = dragInfo.origY + dy;
      let newX, newY;
      if (e.shiftKey) {
        // Shift: 자석/grid 모두 비활성 (1mm 정밀)
        newX = rawX; newY = rawY;
      } else {
        const mag = findMagnetSnap(g, rawX, rawY);
        if (mag) {
          newX = mag.x; newY = mag.y;
        } else {
          newX = Math.round(rawX / GRID) * GRID;
          newY = Math.round(rawY / GRID) * GRID;
        }
      }
      rect.setAttribute('x', newX);
      rect.setAttribute('y', newY);
      const w = parseFloat(rect.getAttribute('width'));
      const h = parseFloat(rect.getAttribute('height'));
      if (text) {
        // W9-25: 두 줄 tspan 도 새 cx 로 갱신
        const cx = newX + w / 2;
        text.setAttribute('x', cx);
        text.setAttribute('y', newY + h / 2);
        text.querySelectorAll('tspan').forEach(ts => ts.setAttribute('x', cx));
      }
      // 회전 transform 의 pivot 도 갱신
      const cur = rotations.get(g) || 0;
      if (cur) {
        g.setAttribute('transform', `rotate(${cur} ${newX + w / 2} ${newY + h / 2})`);
      }
      // W9-14: 드래그 중 dimPopup 위치 따라가기
      if (g === selectedG && typeof updateDimPopupPosition === 'function') {
        updateDimPopupPosition();
      }
      // W9-24: 드래그 중 X 버튼 위치도 갱신
      if (typeof updateCloseButtons === 'function') updateCloseButtons();
    });
    g.addEventListener('pointerup', () => { dragInfo = null; });
    g.addEventListener('pointercancel', () => { dragInfo = null; });
    // W9-19: 더블클릭 회전 제거, 우클릭(contextmenu) 회전으로 변경
    g.addEventListener('contextmenu', (e) => {
      // W9-24: X 버튼 우클릭은 회전 안 함 (메뉴만 차단)
      if (e.target.closest && e.target.closest('g.close-btn')) { e.preventDefault(); return; }
      e.preventDefault();
      e.stopPropagation();
      selectG(g);
      rotateG(g);
    });
    // W9-24: X 버튼 클릭 → 사각형 삭제
    const closeBtn = g.querySelector('g.close-btn');
    if (closeBtn) {
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (selectedG === g) selectedG = null;
        g.remove();
        if (typeof updateDimPopupPosition === 'function') updateDimPopupPosition();
      });
    }
  }

  // W9-14: 꼭지점 자석 snap — 다른 사각형의 4 꼭지점과 일정 거리 이내 시 정확 일치
  // W9-19: 회전 각도 반영
  // W9-21: threshold 를 화면 픽셀 기준 (15px) → 줌에 무관하게 일정한 끌림
  //        + 90도 배수일 때 정확한 sin/cos (부동소수점 오차 제거)
  const MAGNET_THRESHOLD_PX = 15;
  function getRotatedCorners(x, y, w, h, angle) {
    const corners = [
      { x: x, y: y }, { x: x + w, y: y },
      { x: x + w, y: y + h }, { x: x, y: y + h },
    ];
    if (!angle) return corners;
    const cx = x + w / 2, cy = y + h / 2;
    // W9-21: 90도 배수는 정확값 사용 — Math.sin(π/2) ≈ 6.12e-17 같은 오차 제거
    let cos, sin;
    const a = ((angle % 360) + 360) % 360;
    if (a === 0)        { cos = 1;  sin = 0;  }
    else if (a === 90)  { cos = 0;  sin = 1;  }
    else if (a === 180) { cos = -1; sin = 0;  }
    else if (a === 270) { cos = 0;  sin = -1; }
    else {
      const rad = angle * Math.PI / 180;
      cos = Math.cos(rad); sin = Math.sin(rad);
    }
    return corners.map(c => {
      const dx = c.x - cx, dy = c.y - cy;
      return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
    });
  }
  function getRectCorners(rectEl, gEl) {
    const x = parseFloat(rectEl.getAttribute('x'));
    const y = parseFloat(rectEl.getAttribute('y'));
    const w = parseFloat(rectEl.getAttribute('width'));
    const h = parseFloat(rectEl.getAttribute('height'));
    const angle = gEl ? (rotations.get(gEl) || 0) : 0;
    return getRotatedCorners(x, y, w, h, angle);
  }
  function findMagnetSnap(currentG, newX, newY) {
    const r = currentG.querySelector('rect:not(.resize-handle)');
    if (!r) return null;
    const w = parseFloat(r.getAttribute('width'));
    const h = parseFloat(r.getAttribute('height'));
    const myAngle = rotations.get(currentG) || 0;
    const myCorners = getRotatedCorners(newX, newY, w, h, myAngle);
    // W9-21: 화면 px 15 를 mm 단위로 환산 (줌 무관 일관 끌림)
    const z = view.zoom || 1;
    const thresholdMm = MAGNET_THRESHOLD_PX / z;
    let bestDx = 0, bestDy = 0, bestDist = thresholdMm + 1;
    document.querySelectorAll('.sect-rect').forEach((other) => {
      if (other === currentG) return;
      const or = other.querySelector('rect:not(.resize-handle)');
      if (!or) return;
      const otherCorners = getRectCorners(or, other);
      myCorners.forEach((mc) => {
        otherCorners.forEach((oc) => {
          const dx = oc.x - mc.x;
          const dy = oc.y - mc.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist; bestDx = dx; bestDy = dy;
          }
        });
      });
    });
    return bestDist <= thresholdMm ? { x: newX + bestDx, y: newY + bestDy } : null;
  }

  // W9-14: dimPopup — 선택 사각형 W/D 입력 popup
  const dimPopup = document.getElementById('dimPopup');
  const dimW = document.getElementById('dimW');
  const dimD = document.getElementById('dimD');

  function updateDimPopupPosition() {
    if (!selectedG) { dimPopup.style.display = 'none'; return; }
    const r = selectedG.querySelector('rect:not(.resize-handle)');
    if (!r) return;
    const x = parseFloat(r.getAttribute('x'));
    const y = parseFloat(r.getAttribute('y'));
    const w = parseFloat(r.getAttribute('width'));
    // W9-17: pan/zoom 적용 위치 — SVG 좌표 → 화면 좌표 (canvas-wrap 기준)
    const z = view.zoom || 1;
    const screenX = (x + w / 2) * z + view.panX;
    const screenY = y * z + view.panY;
    const left = screenX - 80;  // 중앙 정렬 (popup 폭 ~160)
    const top = screenY - 36;
    dimPopup.style.display = 'block';
    dimPopup.style.left = left + 'px';
    dimPopup.style.top = Math.max(4, top) + 'px';
    dimW.value = w;
    dimD.value = parseFloat(r.getAttribute('height'));
  }

  function applyDimToSelected() {
    if (!selectedG) return;
    const r = selectedG.querySelector('rect:not(.resize-handle)');
    if (!r) return;
    // W9-16: 자유 입력 (1mm 최소). 빈값/NaN 입력 중에는 변경 안 함.
    const parsedW = parseFloat(dimW.value);
    const parsedH = parseFloat(dimD.value);
    if (!isFinite(parsedW) || !isFinite(parsedH)) return;
    const newW = Math.max(1, parsedW);
    const newH = Math.max(1, parsedH);
    r.setAttribute('width', newW);
    r.setAttribute('height', newH);
    const text = selectedG.querySelector('text');
    const x = parseFloat(r.getAttribute('x'));
    const y = parseFloat(r.getAttribute('y'));
    if (text) {
      // W9-25: 두 줄 라벨 재구성 (data-name 보존 + 새 W×D 치수)
      const name = text.getAttribute('data-name') || '';
      const dimText = newW + '×' + newH + 'mm';
      applyLabel(text, x + newW / 2, y + newH / 2, newW, newH, name, dimText);
    }
    const cur = rotations.get(selectedG) || 0;
    if (cur) {
      selectedG.setAttribute('transform', `rotate(${cur} ${x + newW / 2} ${y + newH / 2})`);
    }
    updateDimPopupPosition();
    // W9-24: 사각형 크기 변경 시 X 위치 갱신
    if (typeof updateCloseButtons === 'function') updateCloseButtons();
  }
  dimW.addEventListener('input', applyDimToSelected);
  dimD.addEventListener('input', applyDimToSelected);

  // 외부 클릭 → deselect (W9-17: pan 드래그 후가 아닌 단순 클릭일 때만)
  document.querySelector('.canvas-wrap').addEventListener('click', (e) => {
    if (e.target.tagName === 'svg' || e.target.classList.contains('canvas-wrap') ||
        e.target.classList.contains('canvas-placeholder') || e.target.classList.contains('big')) {
      selectG(null);
    }
  });

  // 키보드 — Delete/Backspace 삭제, Esc deselect, W9-17: F = fit all, 0 = reset, +/- = zoom
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedG) {
      e.preventDefault();
      selectedG.remove();
      selectedG = null;
    }
    if (e.key === 'Escape') selectG(null);
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); fitAll(); }
    if (e.key === '0') { e.preventDefault(); resetView(); }
    if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      const wrap = document.querySelector('.canvas-wrap');
      const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2;
      const wx = (cx - view.panX) / view.zoom, wy = (cy - view.panY) / view.zoom;
      view.zoom = Math.min(8, view.zoom * 1.2);
      view.panX = cx - wx * view.zoom; view.panY = cy - wy * view.zoom;
      applyView();
    }
    if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      const wrap = document.querySelector('.canvas-wrap');
      const cx = wrap.clientWidth / 2, cy = wrap.clientHeight / 2;
      const wx = (cx - view.panX) / view.zoom, wy = (cy - view.panY) / view.zoom;
      view.zoom = Math.max(0.05, view.zoom / 1.2);
      view.panX = cx - wx * view.zoom; view.panY = cy - wy * view.zoom;
      applyView();
    }
  });

  // W9-19: 상부장은 항상 하부장/키큰장 위에 — z-order 재정렬
  // SVG DOM 순서 = z-order (뒤일수록 위). lower/tall = 바닥, upper = 그 위.
  function reorderRects() {
    const content = getContent();
    if (!content) return;
    const rects = Array.from(content.querySelectorAll('g.sect-rect'));
    const zOf = (g) => g.classList.contains('upper') ? 1 : 0;
    rects.sort((a, b) => zOf(a) - zOf(b));
    // 안정성 위해 같은 z 끼리 기존 순서 유지 — sort 는 stable (ES2019+)
    rects.forEach(g => content.appendChild(g));
  }

  // addSectionRect 후 신규 g 에 핸들러 부착 (기존 함수 wrap)
  const _addOriginal = addSectionRect;
  addSectionRect = function(section) {
    _addOriginal(section);
    const content = getContent();
    if (!content) return;
    // 신규 g 는 가장 마지막 자식 (방금 append 됨)
    const last = content.lastElementChild;
    if (last && last.tagName.toLowerCase() === 'g' && last.classList.contains('sect-rect')) {
      attachRectHandlers(last);
      selectG(last); // 신규 추가 시 자동 선택
      // W9-19: z-order 재정렬 — 상부장은 항상 위
      reorderRects();
      // W9-24: 신규 X 버튼 초기 위치 적용
      if (typeof updateCloseButtons === 'function') updateCloseButtons();
      // 재정렬 후 selectedG 가 바뀌지 않았는지 확인 (DOM 재배치 — 참조는 유지)
      // W9-17: 화면 밖이면 fitAll — 큰 사각형(4200mm 등) 자동으로 보이게
      const r = last.querySelector('rect:not(.resize-handle)');
      const wrap = document.querySelector('.canvas-wrap');
      if (r && wrap) {
        const w = parseFloat(r.getAttribute('width'));
        const h = parseFloat(r.getAttribute('height'));
        if (w * view.zoom > wrap.clientWidth * 0.8 || h * view.zoom > wrap.clientHeight * 0.8) {
          fitAll();
        }
      }
    }
  };

  document.querySelectorAll('.tool-btn').forEach(b => b.onclick = () => {
    // W9-10: rect-btn (하부장/상부장/키큰장) 은 도면에 직사각형 추가
    if (b.classList.contains('rect-btn')) {
      addSectionRect(b.dataset.section);
      return;
    }
    let badge = b.querySelector('.badge');
    if (!badge) { badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = '0'; b.appendChild(badge); }
    badge.textContent = String(+badge.textContent + 1);
  });
</script>
</body>
</html>
