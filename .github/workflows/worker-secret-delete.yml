name: Delete retired worker secret (generate-api)

# 2026-10-20: 쓰지 않게 된 워커 시크릿을 지우는 수동 실행 워크플로.
#   사장님 지시로 FAL_KEY(ControlNet 경로, #875 에서 코드 삭제)를 지웠다.
#   로컬에 Cloudflare 로그인이 없어 배포용 토큰(CLOUDFLARE_API_TOKEN)으로 지운다.
#   지울 수 있는 것은 아래 choice 목록뿐이다 — 자유 입력을 받지 않는다. 값은 읽지 않는다.
#   저장소가 공개라 실행 로그도 공개다 — 시크릿 이름 목록을 로그에 찍지 않는다.
#
#   MALFORMED_NAMES: 이름이 보통 시크릿 이름(대문자·숫자·밑줄, 예 GEMINI_API_KEY)이 아닌 항목을
#   모두 지운다. 값을 이름 칸에 잘못 넣어 등록한 경우를 위한 것 — 그 이름을 이 파일·로그에
#   쓰지 않고 지울 수 있다. 로그에는 지운 개수만 남긴다.

on:
  workflow_dispatch:
    inputs:
      secret:
        description: 지울 시크릿 이름 (MALFORMED_NAMES = 이름 형식이 잘못된 항목 전부)
        required: true
        type: choice
        options:
          - FAL_KEY
          - MALFORMED_NAMES

jobs:
  delete:
    name: wrangler secret delete
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/generate-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_NAME: ${{ inputs.secret }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (wrangler)
        run: npm ci

      # run 은 블록(|)으로 — 한 줄이면 ": " 로 YAML 이 깨진다
      - name: Delete secret
        if: ${{ inputs.secret != 'MALFORMED_NAMES' }}
        run: |
          echo "y" | npx wrangler secret delete "$SECRET_NAME" > /dev/null
          echo "delete requested: $SECRET_NAME"

      - name: Check the deleted name is gone
        if: ${{ inputs.secret != 'MALFORMED_NAMES' }}
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q "\"$SECRET_NAME\""; then
            echo "::error::$SECRET_NAME is still listed"
            exit 1
          fi
          echo "$SECRET_NAME is gone"

      # 이름을 로그에 찍지 않는다 — 개수만
      - name: Delete malformed names
        if: ${{ inputs.secret == 'MALFORMED_NAMES' }}
        run: |
          npx wrangler secret list 2>/dev/null > /tmp/secrets.json
          node -e '
            const { execFileSync } = require("child_process");
            const list = JSON.parse(require("fs").readFileSync("/tmp/secrets.json", "utf8"));
            const bad = list.map((s) => s.name).filter((n) => !/^[A-Z][A-Z0-9_]*$/.test(n));
            for (const n of bad) {
              execFileSync("npx", ["wrangler", "secret", "delete", n], { input: "y\n", stdio: ["pipe", "ignore", "ignore"] });
            }
            console.log("malformed names deleted: " + bad.length);
          '
          rm -f /tmp/secrets.json

      - name: Check no malformed names remain
        if: ${{ inputs.secret == 'MALFORMED_NAMES' }}
        run: |
          npx wrangler secret list 2>/dev/null > /tmp/secrets.json
          node -e '
            const list = JSON.parse(require("fs").readFileSync("/tmp/secrets.json", "utf8"));
            const bad = list.filter((s) => !/^[A-Z][A-Z0-9_]*$/.test(s.name)).length;
            console.log("malformed names remaining: " + bad + " of " + list.length);
            if (bad) process.exit(1);
          '
          rm -f /tmp/secrets.json
