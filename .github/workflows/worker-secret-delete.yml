name: Delete retired worker secret (generate-api)

# 2026-10-20: 쓰지 않게 된 워커 시크릿을 지우는 수동 실행 워크플로.
#   사장님 지시로 FAL_KEY(ControlNet 경로, #875 에서 코드 삭제)를 지운다.
#   로컬에 Cloudflare 로그인이 없어 배포용 토큰(CLOUDFLARE_API_TOKEN)으로 지운다.
#   지울 수 있는 이름은 아래 choice 목록에 있는 것뿐이다 — 자유 입력을 받지 않는다.
#   값은 읽지 않는다. 확인은 이름 목록(wrangler secret list)으로만 한다.

on:
  workflow_dispatch:
    inputs:
      secret:
        description: 지울 시크릿 이름
        required: true
        type: choice
        options:
          - FAL_KEY

jobs:
  delete:
    name: wrangler secret delete
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/generate-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_NAME: ${{ inputs.secret }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (wrangler)
        run: npm ci

      - name: Secret names before
        run: npx wrangler secret list | grep -o '"name": *"[^"]*"' || true

      - name: Delete secret
        run: echo "y" | npx wrangler secret delete "$SECRET_NAME"

      - name: Secret names after (the deleted name must be gone)
        run: |
          npx wrangler secret list | grep -o '"name": *"[^"]*"' || true
          if npx wrangler secret list | grep -q "\"$SECRET_NAME\""; then
            echo "::error::$SECRET_NAME is still listed"
            exit 1
          fi
