name: Deploy Cloudflare Worker (workflow-api)

on:
  push:
    branches:
      - main
    paths:
      - 'workers/workflow-api/**'
      - '.github/workflows/workflow-api-deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/workflow-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 순수 함수(canonical hash / router / 입력 검증) 단위 테스트.
      # 의존성이 없어 install 없이 node --test 로 바로 돈다.
      - name: Run tests
        run: node --test "test/*.test.js"

  deploy:
    name: wrangler deploy
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/workflow-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
