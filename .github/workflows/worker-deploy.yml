name: Deploy Cloudflare Worker (generate-api)

on:
  push:
    branches:
      - main
    paths:
      - 'workers/generate-api/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/generate-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 프롬프트 스냅샷(옛 경로 불변) · design_spec 검증 · /api/generate 경로.
      # 의존성이 없어 install 없이 node --test 로 바로 돈다 (workflow-api 와 같은 방식).
      - name: Run tests
        run: node --test "test/*.test.js"

  deploy:
    name: wrangler deploy
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/generate-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (wrangler + @anthropic-ai/sdk)
        run: npm ci

      # 번들 실패(예: SDK 가 Node 전용 API 를 요구)를 배포 전에 잡는다
      - name: Bundle check (dry run)
        run: npx wrangler deploy --dry-run --outdir /tmp/dadam-generate-api-dist

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
