name: Deploy Cloudflare Worker (payments-api)

on:
  push:
    branches:
      - main
    paths:
      - 'workers/payments-api/**'
      - '.github/workflows/payments-api-deploy.yml'
  # PR 에서는 시험만 돈다 (배포 잡은 아래 if 로 건너뛴다).
  pull_request:
    branches:
      - main
    paths:
      - 'workers/payments-api/**'
      - '.github/workflows/payments-api-deploy.yml'
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/payments-api
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 정기 결제 · 실패 재시도 · 해지 만료 · 환불 · 첫 결제 되돌리기 · 웹훅 확인.
      # 토스·Supabase 는 가짜 fetch 로 대신한다 — 의존성이 없어 install 없이 돈다.
      - name: Run tests
        run: node --test "test/*.test.js"

  deploy:
    name: wrangler deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/payments-api
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
