name: CI/CD Pipeline

# 비활성화 — 정적 HTML 사이트이므로 CI/CD 불필요
# GitHub Pages 자동 배포는 별도 workflow (pages-build-deployment)
on:
  workflow_dispatch:  # 수동 실행만 허용

env:
  NODE_VERSION: '20'

jobs:
  # HTML 검증
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML files
        run: npx html-validate "*.html" "admin/*.html" --formatter stylish
        continue-on-error: true

  # 링크 체크
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for broken links
        run: npx linkinator "*.html" --skip "^(?!http)" --timeout 10000
        continue-on-error: true

  # 코드 품질 검사
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check formatting with Prettier
        run: npm run format:check
        continue-on-error: true

  # 테스트
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # 보안 검사
  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
        continue-on-error: true

      - name: Check for hardcoded credentials
        run: |
          echo "Checking for potential API keys..."
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.js" --include="*.ts" --include="*.html" . || echo "Warning: Potential API key found"
          ! grep -rn "AKIA[A-Z0-9]\{16\}" --include="*.js" --include="*.ts" --include="*.html" . || echo "Warning: Potential AWS key found"
        continue-on-error: true

  # TypeScript 타입 체크
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit
        continue-on-error: true

  # Next.js 빌드 (archive됨 - 본 job은 비활성화. planner-vite 빌드로 교체 검토 중)
  # 사유: app/, next.config.js 등은 archive/next-planner/로 이동 (커밋 참조)
  # TODO: planner-vite 빌드 + 정적 산출물 검증으로 교체
  # build:
  #   name: Build
  #   runs-on: ubuntu-latest
  #   needs: [lint, typecheck, test]
  #   steps:
  #     ...

  # Lighthouse 성능 테스트 (build 의존 해제, 정적 HTML 직접 측정)
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.staticDistDir=./ --collect.url=index.html || true
        continue-on-error: true

  # 배포 (main 브랜치만) — 실제 GitHub Pages 자동 배포는 pages-build-deployment workflow가 처리.
  # 본 job은 build artifact 없이 placeholder만 남음.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment placeholder
        run: echo "GitHub Pages 자동 배포는 pages-build-deployment workflow에서 처리됩니다."
