name: CAD Oracle

# 다담 CAD 베타 PR8 — 조립 명세를 build123d(OCC)로 실제 솔리드로 지어 JS 조립 검사와 대조한다.
#   docs/01-plan/planner-cad.plan.md §PR8 · docs/design-rules/assembly-spec.md "CAD 검산기"
#
# 게이트 (--strict, 2026-10-24 승격): 불일치가 하나라도 있으면 실패한다. 요약(Step Summary)과 report.json 은 그대로 남긴다.
#   보고만 하던 단계(#1005 ~)의 PR · main · 야간 실행이 모두 골든 9종 불일치 0 이었다.
#   불일치가 나면 3D · CAD 를 근거로 BOM 을 고치지 말고, JS 조립 검사와 OCC 중 어느 쪽이 틀렸는지 먼저 본다.
# 입력은 합성 골든 픽스처만 (test-utils/bom-golden/fixtures.js) — 저장소가 공개라 실제 주문 설계는 넣지 않는다.
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/detaildesign/bom-assembly.js'
      - 'js/detaildesign/assembly-rules.js'
      - 'js/detaildesign/assembly-check.js'
      - 'js/detaildesign/extractors.js'
      - 'js/detaildesign/bom-*-rules.js'
      - 'js/detaildesign/data-constants.js'
      - 'test-utils/bom-golden/**'
      - 'test-utils/assembly-fixtures.js'
      - 'tools/cad/**'
      - '.github/workflows/cad-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'js/detaildesign/bom-assembly.js'
      - 'js/detaildesign/assembly-rules.js'
      - 'js/detaildesign/assembly-check.js'
      - 'js/detaildesign/extractors.js'
      - 'js/detaildesign/bom-*-rules.js'
      - 'js/detaildesign/data-constants.js'
      - 'test-utils/bom-golden/**'
      - 'test-utils/assembly-fixtures.js'
      - 'tools/cad/**'
      - '.github/workflows/cad-oracle.yml'
  schedule:
    # 매일 02:30 KST (17:30 UTC)
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  UV_VERSION: '0.13.1'

jobs:
  oracle:
    name: CAD Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dump assembly specs (synthetic golden fixtures)
        run: node tools/cad/dump-assembly.js cad-oracle/dump

      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"

      - name: Build solids and cross-check (build123d / OCC)
        run: >-
          uv run --no-project --python 3.13
          --with build123d==0.11.1 --with cadquery-ocp-novtk==7.9.3.1.1
          python -I tools/cad/build_from_spec.py cad-oracle/dump --out cad-oracle/out --strict

      - name: Upload STEP / GLB / report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cad-oracle-${{ github.sha }}
          path: |
            cad-oracle/out/
            cad-oracle/dump/
          retention-days: 14
