<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>내 연출컷 - 다담가구</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-v5.css" />
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="js/detaildesign-access.js"></script>
    <script src="js/admin-access.js"></script>
    <style>
      /* 내 연출컷 — generations 테이블 기반 이력. 카드·모달만 이 페이지 것이고 나머지는 v5 토큰. */
      .mg-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .mg-title {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 300;
        font-size: 34px;
        line-height: 1;
        color: var(--v5-ink);
        letter-spacing: 0.01em;
      }
      .mg-title small {
        font-family: var(--v5-sans);
        font-size: 12px;
        font-weight: 300;
        letter-spacing: 0.12em;
        color: var(--v5-ink-45);
        margin-left: 12px;
        vertical-align: middle;
      }
      .mg-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .mg-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 22px 20px;
      }
      .mg-card {
        position: relative; /* 즐겨찾기 별이 썸네일 위에 겹친다 */
        background: var(--v5-card);
        border: 1px solid var(--v5-line-card);
        display: grid;
        grid-template-rows: auto auto auto;
      }
      .mg-thumb {
        position: relative;
        aspect-ratio: 4 / 3;
        background: var(--v5-photo) center / cover no-repeat;
        cursor: pointer;
        border: 0;
        padding: 0;
        width: 100%;
        display: block;
      }
      .mg-thumb:focus-visible {
        outline: 2px solid var(--v5-tan);
        outline-offset: 2px;
      }
      .mg-badge {
        position: absolute;
        left: 10px;
        top: 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        background: rgba(45, 42, 38, 0.78);
        color: var(--v5-invert);
      }
      .mg-badge--fail {
        background: rgba(168, 67, 58, 0.85);
      }
      .mg-fav {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 30px;
        height: 30px;
        border: 0;
        background: rgba(252, 250, 247, 0.85);
        color: var(--v5-ink-45);
        cursor: pointer;
        font-size: 16px;
        line-height: 30px;
        text-align: center;
      }
      .mg-fav[aria-pressed='true'] {
        color: var(--v5-tan);
      }
      .mg-cap {
        padding: 12px 14px 4px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .mg-cap b {
        font-weight: 400;
        font-size: 13.5px;
        color: var(--v5-ink);
      }
      .mg-cap span {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--v5-ink-42);
        white-space: nowrap;
      }
      .mg-acts {
        display: flex;
        gap: 14px;
        padding: 6px 14px 12px;
        flex-wrap: wrap;
      }
      .mg-acts .v5-link {
        font-size: 11.5px;
      }
      .mg-acts .v5-link[disabled] {
        opacity: 0.4;
        cursor: default;
      }
      .mg-empty {
        padding: 64px 0;
        text-align: center;
        color: var(--v5-ink-55);
        font-weight: 300;
        line-height: 2;
      }
      .mg-state {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--v5-ink-42);
        min-height: 18px;
        margin-bottom: 14px;
      }

      /* 상세 모달 */
      .mg-modal {
        position: fixed;
        inset: 0;
        background: rgba(45, 42, 38, 0.55);
        display: none;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        padding: 40px 16px;
        z-index: 200;
      }
      .mg-modal[data-open='true'] {
        display: flex;
      }
      .mg-modal-in {
        background: var(--v5-paper);
        width: min(1100px, 100%);
        padding: 26px 28px 30px;
      }
      .mg-modal-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        border-bottom: 1px solid var(--v5-line-12);
        padding-bottom: 12px;
        margin-bottom: 18px;
      }
      .mg-modal-head b {
        font-weight: 400;
        font-size: 15px;
      }
      .mg-modal-close {
        border: 0;
        background: none;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: var(--v5-ink-55);
      }
      .mg-modal-shots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .mg-modal-shots figure {
        margin: 0;
      }
      .mg-modal-shots img {
        width: 100%;
        display: block;
        background: var(--v5-photo);
      }
      .mg-modal-shots figcaption {
        font-size: 11.5px;
        letter-spacing: 0.06em;
        color: var(--v5-ink-55);
        padding: 8px 2px 0;
      }
      .mg-quote {
        margin-top: 22px;
        border-top: 1px solid var(--v5-line-12);
        font-size: 13px;
      }
      .mg-quote-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 2px;
        border-bottom: 1px solid var(--v5-line);
        color: var(--v5-ink-62);
      }
      .mg-quote-row--total {
        color: var(--v5-ink);
        font-weight: 500;
      }
      .mg-modal-acts {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mg-card {
          transition: border-color 0.2s;
        }
        .mg-card:hover {
          border-color: var(--v5-line-25);
        }
      }
    </style>
  </head>
  <body class="v5-page">
    <!-- 헤더 — js/site-shell.js 가 주입한다 (내비 정본은 그 파일 한 곳) -->
    <div data-site-shell="header" data-nav=""></div>

    <main class="v5-main">
      <div class="v5-wrap">
        <div class="mg-head">
          <div>
            <p class="v5-lede-eyebrow" style="text-align: left; margin-bottom: 8px">MY CREATIVE IMAGES</p>
            <h1 class="mg-title">내 연출컷 <small id="count"></small></h1>
          </div>
          <a class="v5-btn v5-btn--solid" href="ai-design.html">새 연출컷 만들기</a>
        </div>

        <div class="mg-filters" id="filters" role="group" aria-label="필터">
          <button type="button" class="v5-chip" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="v5-chip" data-filter="favorite" aria-pressed="false">즐겨찾기</button>
          <button type="button" class="v5-chip" data-filter="active" aria-pressed="false">진행 중</button>
          <button type="button" class="v5-chip" data-filter="failed" aria-pressed="false">실패</button>
        </div>
        <div class="mg-state" id="state">불러오는 중</div>

        <div class="mg-grid" id="grid"></div>
        <div class="mg-empty" id="empty" hidden>
          아직 만든 연출컷이 없습니다.<br />
          공간 사진과 참고 이미지를 넣으면 네 컷이 생성됩니다.
        </div>
      </div>
    </main>

    <div class="mg-modal" id="modal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="mg-modal-in">
        <div class="mg-modal-head">
          <b id="modalTitle"></b>
          <button type="button" class="mg-modal-close" id="modalClose" aria-label="닫기">&times;</button>
        </div>
        <div class="mg-modal-shots" id="modalShots"></div>
        <div class="mg-quote" id="modalQuote"></div>
        <div class="mg-modal-acts">
          <button type="button" class="v5-btn" id="modalOpen">스튜디오에서 열기</button>
          <button type="button" class="v5-btn v5-btn--solid" id="modalDownload">기본안 다운로드</button>
        </div>
      </div>
    </div>

    <div data-site-shell="footer"></div>
    <script src="js/site-shell.js" defer></script>
    <script>
      (function () {
        'use strict';

        var API_BASE = (
          (window.DADAM_CONFIG && window.DADAM_CONFIG.generateApi && window.DADAM_CONFIG.generateApi.url) ||
          'https://dadam-generate-api.dadamfurniture.workers.dev/api/generate'
        ).replace(/\/api\/generate\/?$/, '');

        // 워커 prompts.js 의 CATEGORIES 와 같은 라벨
        var LABELS = {
          sink: '싱크대',
          island: '아일랜드',
          wardrobe: '붙박이장',
          storage: '수납장',
          fridge: '냉장고장',
          vanity: '화장대',
          shoe: '신발장',
          office: '사무실',
        };
        var ACTIVE = ['queued', 'analyzing', 'rendering', 'qc', 'variants'];
        var POLL_MS = 5000;

        var sb = null;
        var user = null;
        var rows = [];
        var filter = 'all';
        var pollTimer = null;
        var $ = function (id) {
          return document.getElementById(id);
        };
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function label(r) {
          return r.title || (LABELS[r.category] || r.category) + ' 연출컷';
        }
        function when(iso) {
          var d = new Date(iso);
          return (
            d.getFullYear() +
            '.' +
            String(d.getMonth() + 1).padStart(2, '0') +
            '.' +
            String(d.getDate()).padStart(2, '0')
          );
        }
        function thumb(r) {
          return r.images && r.images[0] ? r.images[0].url : '';
        }
        function isActive(r) {
          // 12분 넘게 '진행 중' 이면 죽은 잡으로 본다 (워커와 같은 기준)
          return ACTIVE.indexOf(r.status) >= 0 && Date.now() - new Date(r.created_at).getTime() < 12 * 60000;
        }
        async function authHeaders() {
          var h = { 'Content-Type': 'application/json' };
          var s = await sb.auth.getSession();
          var t = s && s.data && s.data.session && s.data.session.access_token;
          if (t) h.Authorization = 'Bearer ' + t;
          return h;
        }

        // ─── 데이터 ───
        async function load(silent) {
          if (!silent) $('state').textContent = '불러오는 중';
          var res = await sb
            .from('generations')
            .select(
              'id,parent_id,status,progress,step_label,error,category,title,options,quote,images,is_favorite,share_expires_at,share_revoked_at,created_at,completed_at'
            )
            .eq('user_id', user.id)
            .order('created_at', { ascending: false })
            .limit(200);
          if (res.error) {
            $('state').textContent = '불러오지 못했습니다 — ' + res.error.message;
            return;
          }
          rows = res.data || [];
          $('state').textContent = '';
          render();
          // 진행 중인 것이 있으면 다시 읽는다
          clearTimeout(pollTimer);
          if (rows.some(isActive))
            pollTimer = setTimeout(function () {
              load(true);
            }, POLL_MS);
        }

        // ─── 렌더 ───
        function visible() {
          if (filter === 'favorite')
            return rows.filter(function (r) {
              return r.is_favorite;
            });
          if (filter === 'active') return rows.filter(isActive);
          if (filter === 'failed')
            return rows.filter(function (r) {
              return r.status === 'failed';
            });
          return rows;
        }

        function cardHTML(r) {
          var active = isActive(r);
          var failed = r.status === 'failed' || (ACTIVE.indexOf(r.status) >= 0 && !active);
          var badge = active
            ? '<span class="mg-badge">' + esc(r.step_label || '생성 중') + ' · ' + (r.progress || 0) + '%</span>'
            : failed
              ? '<span class="mg-badge mg-badge--fail">실패</span>'
              : r.status === 'done' && r.images && r.images.length < 4
                ? '<span class="mg-badge">' + r.images.length + ' / 4</span>'
                : '';
          var shared = r.share_expires_at && !r.share_revoked_at && new Date(r.share_expires_at) > new Date();
          return (
            '<article class="mg-card" data-id="' +
            esc(r.id) +
            '">' +
            '<button type="button" class="mg-thumb" data-act="detail" aria-label="' +
            esc(label(r)) +
            ' 상세" style="background-image:url(' +
            esc(thumb(r)) +
            ')">' +
            badge +
            '</button>' +
            '<button type="button" class="mg-fav" data-act="fav" aria-pressed="' +
            (r.is_favorite ? 'true' : 'false') +
            '" aria-label="즐겨찾기">' +
            (r.is_favorite ? '★' : '☆') +
            '</button>' +
            '<div class="mg-cap"><b>' +
            esc(label(r)) +
            '</b><span>' +
            when(r.created_at) +
            (shared ? ' · 공유 중' : '') +
            '</span></div>' +
            '<div class="mg-acts">' +
            '<button type="button" class="v5-link" data-act="open">열기</button>' +
            '<button type="button" class="v5-link" data-act="regen"' +
            (active ? ' disabled' : '') +
            '>다시 생성</button>' +
            '<button type="button" class="v5-link" data-act="share"' +
            (r.status !== 'done' ? ' disabled' : '') +
            '>공유</button>' +
            '<button type="button" class="v5-link" data-act="del"' +
            (active ? ' disabled' : '') +
            '>삭제</button>' +
            '</div></article>'
          );
        }

        function render() {
          var list = visible();
          $('count').textContent = rows.length ? rows.length + '건' : '';
          $('grid').innerHTML = list.map(cardHTML).join('');
          $('empty').hidden = list.length > 0;
        }

        // ─── 동작 ───
        function byId(id) {
          return rows.filter(function (r) {
            return r.id === id;
          })[0];
        }

        async function toggleFav(r, btn) {
          var next = !r.is_favorite;
          btn.setAttribute('aria-pressed', String(next));
          btn.textContent = next ? '★' : '☆';
          var res = await sb.from('generations').update({ is_favorite: next }).eq('id', r.id);
          if (res.error) {
            $('state').textContent = '즐겨찾기를 바꾸지 못했습니다';
            btn.setAttribute('aria-pressed', String(r.is_favorite));
            btn.textContent = r.is_favorite ? '★' : '☆';
            return;
          }
          r.is_favorite = next;
          if (filter === 'favorite') render();
        }

        async function share(r) {
          $('state').textContent = '공유 링크를 만드는 중';
          var res = await fetch(API_BASE + '/api/generate/' + r.id + '/share', {
            method: 'POST',
            headers: await authHeaders(),
            body: '{}',
          });
          var data = await res.json();
          if (!res.ok || !data.share_url) {
            $('state').textContent = data.error || '공유 링크를 만들지 못했습니다';
            return;
          }
          try {
            if (navigator.share) await navigator.share({ title: '다담가구 AI 연출컷', url: data.share_url });
            else await navigator.clipboard.writeText(data.share_url);
            $('state').textContent = '공유 링크를 복사했습니다 · ' + when(data.expires_at) + ' 까지';
          } catch (e) {
            $('state').textContent = data.share_url;
          }
          load(true);
        }

        async function remove(r) {
          if (!confirm('이 연출컷을 삭제할까요?\n이미지와 공유 링크가 함께 사라집니다.')) return;
          var res = await fetch(API_BASE + '/api/generate/' + r.id, { method: 'DELETE', headers: await authHeaders() });
          var data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) {
            $('state').textContent = data.error || '삭제하지 못했습니다';
            return;
          }
          rows = rows.filter(function (x) {
            return x.id !== r.id;
          });
          render();
        }

        function won(n) {
          return Number(n || 0).toLocaleString() + '원';
        }

        function openDetail(r) {
          $('modalTitle').textContent = label(r) + ' · ' + when(r.created_at);
          $('modalShots').innerHTML =
            (r.images || [])
              .map(function (im) {
                return (
                  '<figure><img src="' +
                  esc(im.url) +
                  '" alt="' +
                  esc(im.label) +
                  '" loading="lazy" /><figcaption>' +
                  esc(im.label) +
                  '</figcaption></figure>'
                );
              })
              .join('') || '<p class="mg-empty">' + esc(r.error || r.step_label || '이미지가 없습니다') + '</p>';
          var q = r.quote;
          $('modalQuote').innerHTML = q
            ? (q.items || [])
                .map(function (it) {
                  return (
                    '<div class="mg-quote-row"><span>' +
                    esc(it.name) +
                    (it.quantity ? ' · ' + esc(it.quantity) : '') +
                    '</span><span>' +
                    won(it.total != null ? it.total : it.price) +
                    '</span></div>'
                  );
                })
                .join('') +
              '<div class="mg-quote-row mg-quote-row--total"><span>합계 (VAT 포함)</span><span>' +
              won(q.total) +
              '</span></div>'
            : '';
          $('modalOpen').onclick = function () {
            location.href = 'ai-design.html?g=' + encodeURIComponent(r.id);
          };
          $('modalDownload').onclick = async function () {
            var im = r.images && r.images[0];
            if (!im) return;
            try {
              var blob = await (await fetch(im.url)).blob();
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = 'dadam-' + r.category + '.' + (blob.type === 'image/png' ? 'png' : 'jpg');
              a.click();
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 10000);
            } catch (e) {
              window.open(im.url, '_blank');
            }
          };
          $('modal').dataset.open = 'true';
        }
        function closeDetail() {
          $('modal').dataset.open = 'false';
        }

        function bind() {
          $('filters').addEventListener('click', function (e) {
            var b = e.target.closest('[data-filter]');
            if (!b) return;
            filter = b.getAttribute('data-filter');
            document.querySelectorAll('#filters .v5-chip').forEach(function (c) {
              c.setAttribute('aria-pressed', String(c === b));
            });
            render();
          });
          $('grid').addEventListener('click', function (e) {
            var b = e.target.closest('[data-act]');
            if (!b || b.disabled) return;
            var r = byId(b.closest('.mg-card').getAttribute('data-id'));
            if (!r) return;
            var act = b.getAttribute('data-act');
            if (act === 'detail') openDetail(r);
            else if (act === 'fav') toggleFav(r, b);
            else if (act === 'open') location.href = 'ai-design.html?g=' + encodeURIComponent(r.id);
            else if (act === 'regen') location.href = 'ai-design.html?g=' + encodeURIComponent(r.id) + '&regen=1';
            else if (act === 'share') share(r);
            else if (act === 'del') remove(r);
          });
          $('modalClose').onclick = closeDetail;
          $('modal').addEventListener('click', function (e) {
            if (e.target === $('modal')) closeDetail();
          });
          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeDetail();
          });
        }

        async function init() {
          try {
            sb = window.supabase.createClient(window.DADAM_CONFIG.supabase.url, window.DADAM_CONFIG.supabase.anonKey);
          } catch (e) {
            $('state').textContent = '서비스에 연결할 수 없습니다';
            return;
          }
          var s = await sb.auth.getSession();
          if (!s || !s.data || !s.data.session) {
            location.href = 'login.html?redirect=' + encodeURIComponent('my-designs.html');
            return;
          }
          user = s.data.session.user;
          if (window.AdminAccess) {
            try {
              window.AdminAccess.updateNavLinks(await window.AdminAccess.isAdmin(sb));
            } catch (e) {}
          }
          bind();
          await load();
        }
        init();
      })();
    </script>
  </body>
</html>
