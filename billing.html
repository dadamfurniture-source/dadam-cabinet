<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>구독 관리 — 다담가구</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/dadam-v5.css" />
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <!-- 카드 바꾸기(결제 실패 재시도 중) · 업체 다시 결제 — 토스 결제창 v1 -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
      .bl-main {
        background: var(--v5-work);
        padding: 56px var(--v5-px) 96px;
        min-height: calc(100vh - var(--v5-header) - 60px);
      }
      .bl-wrap {
        max-width: 620px;
        margin: 0 auto;
      }
      .bl-eyebrow {
        font-weight: 300;
        font-size: 11px;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        color: var(--v5-tan);
      }
      .bl-title {
        font-family: var(--v5-display);
        font-weight: 300;
        font-size: 30px;
        margin: 12px 0 30px;
      }
      .bl-card {
        background: var(--v5-card);
        border: 1px solid var(--v5-line);
        padding: 30px 28px;
        margin-bottom: 18px;
      }
      .bl-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 0;
        border-bottom: 1px solid var(--v5-line-12);
        font-weight: 300;
        font-size: 13px;
      }
      .bl-row:last-child {
        border-bottom: 0;
      }
      .bl-row span:first-child {
        color: var(--v5-ink-45);
      }
      .bl-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .bl-btn {
        flex: 1;
        min-width: 150px;
        padding: 13px;
        border: 1px solid var(--v5-ink);
        background: var(--v5-ink);
        color: var(--v5-invert);
        font-family: inherit;
        font-weight: 400;
        font-size: 12.5px;
        letter-spacing: 0.14em;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .bl-btn--ghost {
        background: none;
        color: var(--v5-ink-62);
        border-color: var(--v5-line-18);
      }
      .bl-btn--danger {
        background: none;
        color: #a54034;
        border-color: #d9b0ab;
      }
      .bl-btn[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .bl-status {
        padding: 12px 15px;
        border: 1px solid var(--v5-line-18);
        background: var(--v5-well);
        font-weight: 300;
        font-size: 12.5px;
        line-height: 1.8;
        color: var(--v5-ink-62);
        margin-bottom: 18px;
        white-space: pre-line;
      }
      .bl-status.err {
        color: #c0392b;
        border-color: rgba(192, 57, 43, 0.3);
      }
      .bl-hist {
        display: grid;
        gap: 0;
      }
      .bl-empty {
        font-weight: 300;
        font-size: 12.5px;
        color: var(--v5-ink-45);
        padding: 8px 0;
      }
    </style>
  </head>
  <body class="v5-page">
    <div data-site-shell="header" data-nav=""></div>

    <main class="bl-main">
      <div class="bl-wrap">
        <p class="bl-eyebrow">SUBSCRIPTION</p>
        <h1 class="bl-title">구독 관리</h1>

        <div class="bl-status" id="status" hidden></div>

        <div class="bl-card" id="planCard">
          <div class="bl-hist" id="planRows"></div>
          <div class="bl-actions" id="actions"></div>
        </div>

        <div class="bl-card">
          <div class="bl-row"><span>결제 내역</span><span></span></div>
          <div class="bl-hist" id="history"><p class="bl-empty">불러오는 중…</p></div>
        </div>
      </div>
    </main>

    <div data-site-shell="footer"></div>
    <script src="js/site-shell.js" defer></script>

    <script>
      (function () {
        'use strict';
        var $ = function (id) {
          return document.getElementById(id);
        };
        var API = (window.DADAM_CONFIG && window.DADAM_CONFIG.paymentsApi && window.DADAM_CONFIG.paymentsApi.url) || '';

        var sb = null;
        try {
          if (window.DADAM_CONFIG && window.supabase) {
            sb = window.supabase.createClient(window.DADAM_CONFIG.supabase.url, window.DADAM_CONFIG.supabase.anonKey);
          }
        } catch (e) {
          console.warn('[billing] supabase init:', e);
        }

        var session = null;

        function say(msg, kind) {
          var el = $('status');
          el.textContent = msg || '';
          el.className = 'bl-status' + (kind ? ' ' + kind : '');
          el.hidden = !msg;
        }

        function esc(v) {
          return String(v).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function won(n) {
          return Number(n || 0).toLocaleString('ko-KR') + '원';
        }
        function day(d) {
          return d ? new Date(d).toLocaleDateString('ko-KR') : '-';
        }
        function row(k, v) {
          return '<div class="bl-row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
        }

        var STATUS_KO = {
          active: '이용 중',
          cancelled: '해지 예약됨',
          past_due: '결제 실패 · 재시도 중',
          expired: '종료됨',
        };

        // 업체 구독 — 협력업체 구성원이면 GET /subscription 이 company { id, name, plan, next_plan, status } 를 함께 준다.
        //   대표(owner): 업체 구독 + 카드 바꾸기 · 해지 · 다시 결제. 실장 · 직원: 구독 칸 없이 업체 정보만 (role).
        var PLAN_KO = { expert: 'Expert', agent: 'Agent', standard: 'Standard' };
        var COMPANY_STATUS_KO = {
          active: '이용 중',
          suspended: '결제가 멈춰 읽기만 됩니다',
          closed: '해지된 업체',
        };
        function planName(p) {
          return PLAN_KO[p] || (p ? String(p).toUpperCase() : '-');
        }

        // 해지된 구독은 등급을 내린 뒤 ended_at 이 찍힌다 — 그 전이면 「해지 예약됨」, 뒤면 「종료됨」.
        function statusLabel(sub) {
          if (sub.status === 'cancelled' && sub.ended_at) return '종료됨';
          return STATUS_KO[sub.status] || sub.status;
        }

        // 결제 실패·해지 안내. 지금은 고객에게 따로 알림(메일·문자)을 보내지 않으므로
        // 이 화면이 알리는 곳이다. 문구는 payments-api 의 규칙(src/lifecycle.js)과 같아야 한다:
        //   재시도 = 첫 실패 1일 뒤 · 3일 뒤, 마지막도 실패하면 해지 + Standard (결제로 받은 등급만)
        //   업체 구독은 마지막도 실패하면 업체가 정지된다 (읽기만, 연출컷을 만들 수 없다)
        function notice(sub, tier, company) {
          if (sub.status === 'past_due') {
            return {
              kind: 'err',
              text:
                '정기 결제에 실패했습니다. ' +
                day(sub.next_charge_at) +
                '에 다시 결제를 시도합니다. 카드 한도·잔액을 확인해 주세요.\n' +
                '재시도는 첫 실패 후 1일·3일 뒤 두 번이며, 마지막 재시도도 실패하면 구독이 해지되고 ' +
                (company ? '업체가 정지되어 연출컷을 만들 수 없습니다.' : '등급이 Standard 로 바뀝니다.'),
            };
          }
          if (sub.status === 'cancelled' && sub.cancel_reason === 'payment_failed') {
            if (company) {
              return {
                kind: 'err',
                text:
                  '정기 결제가 계속 실패해 ' +
                  day(sub.cancel_at) +
                  '에 구독이 해지되었습니다.' +
                  (company.status === 'suspended' ? ' 업체가 정지되어 읽기만 됩니다.' : '') +
                  ' 다시 시작하시려면 아래 「다시 결제」를 눌러 주세요.',
              };
            }
            return {
              kind: 'err',
              text:
                '정기 결제가 계속 실패해 ' +
                day(sub.cancel_at) +
                '에 구독이 해지되었습니다.' +
                (sub.ended_at && tier === 'standard' ? ' 등급이 Standard 로 바뀌었습니다.' : '') +
                ' 다시 구독하시려면 아래 버튼을 눌러 주세요.',
            };
          }
          if (sub.status === 'cancelled' && sub.cancel_reason === 'refunded') {
            return { kind: '', text: '결제가 환불되어 ' + day(sub.cancel_at) + '에 구독이 종료되었습니다.' };
          }
          return null;
        }

        var cost = null;

        function renderPlan(sub, tier, tierSource, credits, company, role) {
          var rows = '';
          if (company) {
            rows += row('업체', company.name || '-');
            rows += row('업체 등급', planName(company.plan));
            if (company.next_plan) rows += row('다음 결제일부터', planName(company.next_plan));
            rows += row('업체 상태', COMPANY_STATUS_KO[company.status] || company.status || '-');
          } else {
            rows += row('현재 등급', (tier || 'standard').toUpperCase());
          }
          if (credits != null) {
            rows += row(
              company ? '업체 크레딧' : '남은 크레딧',
              credits.toLocaleString('ko-KR') + (cost > 0 ? ' (생성 ' + Math.floor(credits / cost) + '회)' : '')
            );
          }

          // 업체 실장 · 직원 — 구독은 대표가 관리한다
          if (company && role !== 'owner') {
            $('planRows').innerHTML = rows;
            $('actions').innerHTML = '';
            say('업체 구독은 대표가 관리합니다.');
            return;
          }

          if (!sub || sub.plan === 'free') {
            rows += row('구독', '없음');
            $('planRows').innerHTML = rows;
            if (company) {
              // 업체는 있는데 구독이 없다 (관리자가 만든 업체 등) — 대표가 업체 등급으로 첫 결제를 한다
              $('actions').innerHTML = '<button type="button" class="bl-btn" id="payBtn">결제하고 시작</button>';
              $('payBtn').onclick = payCompany;
              if (flash) say(flash.text, flash.kind);
              flash = null;
              return;
            }
            $('actions').innerHTML = '<a class="bl-btn" href="pricing.html">등급 올리기</a>';
            if (tierSource === 'manual' && tier !== 'standard') {
              say('현재 등급은 본사 승인으로 부여된 등급입니다. 구독 결제와는 별개로 유지됩니다.');
            }
            return;
          }

          rows += row('구독 상태', statusLabel(sub));
          rows += row('월 결제액', won(sub.amount_krw));
          rows += row('이번 기간', day(sub.current_period_start) + ' ~ ' + day(sub.current_period_end));
          if (sub.status === 'active') {
            rows += row('다음 결제일', day(sub.next_charge_at));
          } else if (sub.status === 'past_due') {
            rows += row('다음 결제 시도', day(sub.next_charge_at));
          } else if (sub.ended_at) {
            rows += row('종료일', day(sub.ended_at));
          } else if (sub.cancel_at) {
            rows += row('이용 종료일', day(sub.cancel_at));
          }
          $('planRows').innerHTML = rows;

          // 방금 한 일(지금 다시 결제 · 카드 바꾸기)의 결과를 상태 안내 위에 붙인다.
          var n = notice(sub, tier, company);
          var text = [flash && flash.text, n && n.text].filter(Boolean).join('\n\n');
          if (text) say(text, (flash && flash.kind) || (n && n.kind) || '');
          flash = null;

          if (sub.status === 'past_due') {
            // 결제 실패로 재시도 중일 때만: 지금 다시 결제 · 카드 바꾸기.
            // 여기서 실패해도 예정된 재시도(+1일 · +3일)는 그대로 간다 (payments-api).
            // 해지도 할 수 있다 — 해지하면 더는 결제를 시도하지 않는다.
            $('actions').innerHTML =
              '<button type="button" class="bl-btn" id="retryBtn">지금 다시 결제</button>' +
              '<button type="button" class="bl-btn bl-btn--ghost" id="cardBtn">카드 바꾸기</button>' +
              '<button type="button" class="bl-btn bl-btn--danger" id="cancelBtn">구독 해지</button>';
            $('retryBtn').onclick = retryNow;
            $('cardBtn').onclick = changeCard;
            $('cancelBtn').onclick = cancel;
          } else if (sub.status === 'active') {
            $('actions').innerHTML =
              '<a class="bl-btn bl-btn--ghost" href="pricing.html">등급 변경</a>' +
              '<button type="button" class="bl-btn bl-btn--danger" id="cancelBtn">구독 해지</button>';
            $('cancelBtn').onclick = cancel;
          } else if (company) {
            // 정지 · 해지된 업체만 다시 결제한다. 업체가 아직 이용 중이면(해지 예약 — 이용 종료일까지) 단추를 두지 않는다.
            if (company.status !== 'active') {
              $('actions').innerHTML = '<button type="button" class="bl-btn" id="payBtn">다시 결제</button>';
              $('payBtn').onclick = payCompany;
            } else {
              $('actions').innerHTML = '';
            }
          } else {
            $('actions').innerHTML = '<a class="bl-btn" href="pricing.html">다시 구독하기</a>';
          }
        }

        var currentCompany = null; // GET /subscription 의 company (협력업체 구성원일 때)

        var currentSub = null;
        var flash = null; // { text, kind } — 다음 그리기 때 안내 위에 붙는다
        var pendingCard = null; // 토스 카드 등록에서 돌아온 { auth_key, customer_key }

        function authHeaders() {
          return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token };
        }

        function setBusy(on) {
          ['retryBtn', 'cardBtn', 'cancelBtn'].forEach(function (id) {
            var b = $(id);
            if (b) b.disabled = on;
          });
        }

        // 결제 응답 → 안내 종류. 202(결과 확인 중)는 오류로 칠하지 않는다.
        function chargeKind(res, body) {
          var charge = body && body.data && body.data.charge;
          if (!res.ok) return 'err';
          if (charge && (charge.result === 'declined' || charge.result === 'merchant')) return 'err';
          return '';
        }

        async function retryNow() {
          setBusy(true);
          say('결제하는 중입니다…');
          try {
            var res = await fetch(API + '/subscription/retry', { method: 'POST', headers: authHeaders(), body: '{}' });
            var body = await res.json().catch(function () {
              return {};
            });
            var kind = res.status === 202 ? '' : chargeKind(res, body);
            flash = { text: body.message || (res.ok ? '결제했습니다.' : '결제하지 못했습니다.'), kind: kind };
          } catch (e) {
            flash = { text: '결제 요청을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.', kind: 'err' };
          }
          await load();
        }

        var clientKey = null;
        async function tossClientKey() {
          if (clientKey) return clientKey;
          var res = await fetch(API + '/plans');
          var body = await res.json();
          clientKey = (body && body.data && body.data.client_key) || null;
          return clientKey;
        }

        async function changeCard() {
          setBusy(true);
          say('카드 등록 창을 여는 중입니다…');
          try {
            var ck = await tossClientKey();
            if (!ck || !window.TossPayments)
              throw new Error('결제 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
            // 등록이 끝나면 토스가 successUrl 에 authKey · customerKey 를 붙여 돌려보낸다.
            await window.TossPayments(ck).requestBillingAuth('CARD', {
              customerKey: 'dadam-' + session.user.id,
              successUrl: location.origin + '/billing.html?card=ok',
              failUrl: location.origin + '/billing.html?card=fail',
            });
          } catch (err) {
            setBusy(false);
            // 고객이 창을 닫은 경우 — 오류로 소란 떨지 않는다.
            if (err && err.code === 'USER_CANCEL') {
              await load();
              return;
            }
            say('카드 등록 창을 열지 못했습니다. ' + (err && err.message ? err.message : ''), 'err');
          }
        }

        // 업체 첫 결제 · 다시 결제 — 기존 업체로 결제한다 (업체를 새로 만들지 않는다, 등급 = 업체 등급).
        // billing-success.html 이 partnerSignup 의 plan 을 /issue-billing-key 에 보낸다.
        async function payCompany() {
          if (!currentCompany) return;
          var btn = $('payBtn');
          if (btn) btn.disabled = true;
          say('카드 등록 창을 여는 중입니다…');
          try {
            var ck = await tossClientKey();
            if (!ck || !window.TossPayments)
              throw new Error('결제 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
            try {
              sessionStorage.setItem('partnerSignup', JSON.stringify({ plan: currentCompany.plan }));
            } catch (e) {
              /* 저장을 못 해도 successUrl 의 plan 으로 결제한다 */
            }
            await window.TossPayments(ck).requestBillingAuth('CARD', {
              customerKey: 'dadam-' + session.user.id,
              successUrl: location.origin + '/billing-success.html?plan=' + encodeURIComponent(currentCompany.plan),
              failUrl: location.origin + '/billing.html?pay=fail',
            });
          } catch (err) {
            if (btn) btn.disabled = false;
            // 고객이 창을 닫은 경우 — 오류로 소란 떨지 않는다.
            if (err && err.code === 'USER_CANCEL') {
              say('');
              return;
            }
            say('카드 등록 창을 열지 못했습니다. ' + (err && err.message ? err.message : ''), 'err');
          }
        }

        async function submitCard(pc) {
          say('새 카드를 등록하는 중입니다…');
          try {
            var res = await fetch(API + '/subscription/card', {
              method: 'POST',
              headers: authHeaders(),
              body: JSON.stringify(pc),
            });
            var body = await res.json().catch(function () {
              return {};
            });
            flash = {
              text: body.message || (res.ok ? '카드를 바꿨습니다.' : '카드를 바꾸지 못했습니다.'),
              kind: chargeKind(res, body),
            };
          } catch (e) {
            flash = { text: '카드 변경 요청을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.', kind: 'err' };
          }
        }

        // 토스 카드 등록에서 돌아왔는가. 주소창에서는 바로 지운다 — 새로 고침으로 같은 authKey 를 다시 보내지 않게.
        (function readCardReturn() {
          var q = new URLSearchParams(location.search);
          var card = q.get('card');
          // 업체 다시 결제(payCompany)의 카드 등록이 실패해 돌아온 경우
          if (q.get('pay') === 'fail') {
            try {
              history.replaceState(null, '', location.pathname);
            } catch (e) {
              /* 주소를 못 지워도 진행한다 */
            }
            try {
              sessionStorage.removeItem('partnerSignup');
            } catch (e) {
              /* 다음 결제가 새 값으로 덮는다 */
            }
            if (q.get('code') !== 'USER_CANCEL') {
              flash = { text: '카드를 등록하지 못했습니다. ' + (q.get('message') || ''), kind: 'err' };
            }
            return;
          }
          if (!card) return;
          try {
            history.replaceState(null, '', location.pathname);
          } catch (e) {
            /* 주소를 못 지워도 진행한다 */
          }
          if (card === 'ok' && q.get('authKey') && q.get('customerKey')) {
            pendingCard = { auth_key: q.get('authKey'), customer_key: q.get('customerKey') };
          } else if (card === 'fail' && q.get('code') !== 'USER_CANCEL') {
            flash = { text: '카드를 바꾸지 못했습니다. ' + (q.get('message') || ''), kind: 'err' };
          }
        })();

        async function cancel() {
          var pastDue = currentSub && currentSub.status === 'past_due';
          var ask = pastDue
            ? '구독을 해지할까요?\n\n더 이상 결제를 시도하지 않습니다.'
            : '구독을 해지할까요?\n\n이미 결제한 기간까지는 그대로 이용하실 수 있습니다.';
          if (!confirm(ask)) return;
          var btn = $('cancelBtn');
          btn.disabled = true;
          say('해지 처리 중…');
          try {
            var res = await fetch(API + '/cancel', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
              body: JSON.stringify({ reason: 'user_request' }),
            });
            var body = await res.json();
            if (!res.ok || !body.success) throw new Error(body.message || '해지에 실패했습니다.');
            say(
              body.data && body.data.past_due
                ? '해지되었습니다. 더 이상 결제를 시도하지 않습니다.'
                : '해지되었습니다. ' + day(body.data && body.data.cancel_at) + ' 까지 이용하실 수 있습니다.'
            );
            load();
          } catch (e) {
            btn.disabled = false;
            say(e.message || '해지에 실패했습니다.', 'err');
          }
        }

        function renderHistory(rows) {
          if (!rows || !rows.length) {
            $('history').innerHTML = '<p class="bl-empty">결제 내역이 없습니다.</p>';
            return;
          }
          // 실패·환불도 같은 표에 남는다 — 결제된 것처럼 보이지 않게 상태를 붙인다.
          var HIST_KO = { failed: '결제 실패', refunded: '환불', pending: '처리 중' };
          $('history').innerHTML = rows
            .map(function (h) {
              var tag = HIST_KO[h.status] ? ' · ' + HIST_KO[h.status] : '';
              return row(day(h.created_at) + ' · ' + (h.plan || '') + tag, won(h.amount_krw));
            })
            .join('');
        }

        async function load() {
          if (!sb || !API) {
            say('서비스에 연결할 수 없습니다.', 'err');
            return;
          }
          var s = await sb.auth.getSession();
          session = s.data.session;
          if (!session) {
            location.href = 'login.html?redirect=' + encodeURIComponent('billing.html');
            return;
          }

          if (pendingCard) {
            var pc = pendingCard;
            pendingCard = null;
            await submitCard(pc);
          }

          var tier = 'standard';
          var tierSource = 'manual';
          var credits = null;
          try {
            var prof = await sb.from('profiles').select('tier, tier_source').eq('id', session.user.id).maybeSingle();
            if (prof.data) {
              tier = prof.data.tier || 'standard';
              tierSource = prof.data.tier_source || 'manual';
            }
            // 지금 쓰는 통장 — 협력업체 구성원은 업체 통장, 아니면 내 통장 (my_credit_wallet)
            var w = await sb.rpc('my_credit_wallet');
            var wallet = w && Array.isArray(w.data) ? w.data[0] : null;
            if (wallet && typeof wallet.balance === 'number') credits = wallet.balance;
            var cc = await sb.from('credit_costs').select('credits').eq('action', 'generate').maybeSingle();
            if (cc.data) cost = cc.data.credits;
          } catch (e) {
            console.warn('[billing] profile:', e.message);
          }

          var sub = null;
          var company = null;
          var role = null;
          try {
            var res = await fetch(API + '/subscription', {
              headers: { Authorization: 'Bearer ' + session.access_token },
            });
            var body = await res.json();
            sub = body && body.data ? body.data : null;
            // 협력업체 대표 = 업체 구독 + company (role 이 없으면 대표), 실장 · 직원 = data null + company + role
            company = body && body.company ? body.company : null;
            role = company ? body.role || 'owner' : null;
          } catch (e) {
            console.warn('[billing] subscription:', e.message);
          }
          currentSub = sub;
          currentCompany = company;
          renderPlan(sub, tier, tierSource, credits, company, role);

          try {
            var h = await sb
              .from('payment_history')
              .select('created_at, plan, amount_krw, status')
              .order('created_at', { ascending: false })
              .limit(12);
            renderHistory(h.data);
          } catch (e) {
            $('history').innerHTML = '<p class="bl-empty">결제 내역을 불러오지 못했습니다.</p>';
          }
        }

        load();
      })();
    </script>
  </body>
</html>
