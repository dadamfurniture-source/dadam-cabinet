<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection — 다담가구</title>
    <meta name="description" content="다담가구 시공 사례 갤러리" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Noto+Sans+KR:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/dadam-v5.css" />

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45"></script>
    <script src="js/detaildesign-access.js"></script>
    <script src="js/admin-access.js"></script>
  </head>

  <body class="v5-page v5-has-cta">
    <div data-site-shell="header" data-nav="collection"></div>

    <!-- 상단 — 라벨 한 줄만. 제목·통계·안내문 없음 (README §B) -->
    <section class="v5-collection-head">
      <div class="v5-collection-label">COLLECTION</div>
    </section>

    <main class="v5-wrap" style="padding-bottom: 90px">
      <div class="v5-tiles" id="tiles"></div>
      <!-- 센티널 — 뷰포트에 들어오면 다음 배치를 붙인다 -->
      <div id="sentinel" style="height: 1px"></div>
      <p class="v5-hint" id="tileState" style="margin-top: 34px"></p>
    </main>

    <div data-site-shell="footer"></div>

    <!-- 하단 고정 CTA -->
    <div class="v5-cta">
      <div>
        <div class="v5-cta-title">마음에 드는 컷이 있으신가요</div>
        <div class="v5-cta-sub">사진 두 장이면 우리 집 연출컷이 나옵니다</div>
      </div>
      <a class="v5-btn v5-btn--solid" href="ai-design.html">AI 스튜디오로</a>
    </div>

    <script src="js/site-shell.js" defer></script>
    <script>
      (function () {
        'use strict';

        // ── 상수 ────────────────────────────────────────
        var FIRST = 9; // 초기 노출
        var STEP = 6; // 스크롤마다 추가
        var PAGE = 24; // 서버에서 한 번에 가져오는 행 수

        // 정적 시공 사례 — DB 가 비어도 갤러리가 비지 않게.
        // 예전 STATIC_POSTS 를 v5 캡션(지역)에 맞게 옮겼다.
        // TODO(자산): 지역은 임시값이다. collection_posts.region 이 채워지면 그쪽이 정본.
        var STATIC = [
          { image_url: 'app/portfolio/kitchen-n1-1.jpg', region: '서울 논현' },
          { image_url: 'app/portfolio/kitchen-n1-2.jpg', region: '서울 성수' },
          { image_url: 'app/portfolio/kitchen-n1-3.jpg', region: '서울 성수' },
          { image_url: 'app/portfolio/kitchen-n1-4.jpg', region: '서울 반포' },
          { image_url: 'app/portfolio/kitchen-n3-2.jpg', region: '성남 분당' },
          { image_url: 'app/portfolio/kitchen-n3-3.jpg', region: '인천 송도' },
          { image_url: 'app/portfolio/kitchen-n4-1.jpg', region: '성남 판교' },
          { image_url: 'app/portfolio/kitchen-n6-1.jpg', region: '고양 일산' },
          { image_url: 'app/portfolio/kitchen-n6-2.jpg', region: '용인 수지' },
          { image_url: 'app/portfolio/kitchen-n6-3.jpg', region: '고양 일산' },
          { image_url: 'app/portfolio/kitchen-n7-1.jpg', region: '하남 위례' },
          { image_url: 'app/portfolio/kitchen-n7-2.jpg', region: '수원 광교' },
          { image_url: 'app/portfolio/kitchen-n7-3.jpg', region: '서울 마포' },
          { image_url: 'app/portfolio/kitchen-n7-4.jpg', region: '수원 광교' },
          { image_url: 'app/portfolio/funiture-n4-1.jpg', region: '서울 논현' },
        ];

        // ── 상태 ────────────────────────────────────────
        var posts = []; // 지금까지 확보한 레코드
        var shown = 0; // 화면에 그린 수
        var loading = false;
        var exhausted = false; // 서버에 더 없음
        var cursor = null; // created_at 키셋
        var sb = null;

        var elTiles = document.getElementById('tiles');
        var elState = document.getElementById('tileState');
        var elSentinel = document.getElementById('sentinel');
        var io = null;

        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        // ── 서버에서 한 페이지 ────────────────────────────
        // 키셋 페이지네이션. idx_collection_posts_created (created_at DESC) 를 그대로 탄다.
        // 예전 구현은 매번 전 행을 가져왔다.
        async function fetchPage() {
          if (!sb || exhausted) return [];
          var q = sb
            .from('collection_posts')
            .select('id, image_url, region, created_at')
            .order('created_at', { ascending: false })
            .limit(PAGE);
          if (cursor) q = q.lt('created_at', cursor);
          var res = await q;
          if (res.error) {
            console.warn('[collection] fetch:', res.error.message);
            exhausted = true;
            return [];
          }
          var rows = res.data || [];
          if (rows.length < PAGE) exhausted = true;
          if (rows.length) cursor = rows[rows.length - 1].created_at;
          return rows;
        }

        // ── 그리기 ──────────────────────────────────────
        function tileHTML(p) {
          var region = (p.region || '').trim();
          return (
            '<figure class="v5-tile">' +
            '<div class="v5-tile-img" role="img" aria-label="' +
            esc(region ? '다담가구 시공 사례 · ' + region : '다담가구 시공 사례') +
            '" style="background-image:url(' + esc(p.image_url) + ')"></div>' +
            '<figcaption class="v5-tile-cap">' +
            '<span class="v5-tile-brand">다담가구</span>' +
            // 지역이 비면 구분선까지 같이 감춘다 — 점만 떠 있으면 고장처럼 보인다
            (region
              ? '<span class="v5-tile-dot" aria-hidden="true"></span>' +
                '<span class="v5-tile-region">' + esc(region) + '</span>'
              : '') +
            '</figcaption>' +
            '</figure>'
          );
        }

        function render(from) {
          var html = '';
          for (var i = from; i < shown; i++) html += tileHTML(posts[i]);
          elTiles.insertAdjacentHTML('beforeend', html);
        }

        function atEnd() {
          return exhausted && shown >= posts.length;
        }

        function updateState() {
          if (loading) elState.textContent = '불러오는 중';
          else if (atEnd()) elState.textContent = '마지막 사례입니다';
          else elState.textContent = shown + ' / ' + posts.length + (exhausted ? '' : '+');
        }

        // ── 다음 배치 ────────────────────────────────────
        // 순환 반복 금지 — 실제 레코드 수에서 멈춘다 (README §B).
        async function loadMore(n) {
          if (loading || atEnd()) return;
          loading = true;
          updateState();

          // 보유분이 모자라면 서버에서 먼저 채운다
          while (posts.length - shown < n && !exhausted) {
            var rows = await fetchPage();
            if (!rows.length) break;
            posts = posts.concat(rows);
          }

          var from = shown;
          shown = Math.min(shown + n, posts.length);
          render(from);
          loading = false;
          updateState();

          // 하단에 머물러 있어도 계속 불러오려면 재등록해야 한다.
          if (io && !atEnd()) {
            io.unobserve(elSentinel);
            io.observe(elSentinel);
          }
        }

        function watch() {
          io = new IntersectionObserver(
            function (entries) {
              if (!entries[0].isIntersecting) return;
              if (loading || atEnd()) return;
              setTimeout(function () {
                loadMore(STEP);
              }, 450);
            },
            { rootMargin: '300px' }
          );
          io.observe(elSentinel);
        }

        // ── 시작 ────────────────────────────────────────
        async function init() {
          try {
            if (window.DADAM_CONFIG && window.supabase) {
              sb = window.supabase.createClient(
                window.DADAM_CONFIG.supabase.url,
                window.DADAM_CONFIG.supabase.anonKey
              );
            }
          } catch (e) {
            console.warn('[collection] supabase init:', e);
          }

          var rows = await fetchPage();
          // DB 사례를 앞에, 자체 시공 사진을 뒤에. 예전처럼 정적분을 항상 덧붙이되
          // 순서를 고정해 스크롤 중 순서가 흔들리지 않게 한다.
          posts = rows.concat(STATIC);
          if (!sb) exhausted = true;

          shown = Math.min(FIRST, posts.length);
          render(0);
          updateState();
          watch();
        }

        init();
      })();
    </script>
  </body>
</html>
