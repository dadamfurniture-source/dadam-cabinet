<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A26" />
    <title>협력업체 연결 - 다담가구</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&family=Noto+Sans+KR:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/dadam-system.css">
    <script defer src="js/nav-transitions.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --cream: #f8f7f4;
        --warm: #ebe8e2;
        --gray: #8b8680;
        --charcoal: #2d2a26;
        --gold: #b8956c;
      }
      body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: var(--cream);
        color: var(--charcoal);
        line-height: 1.7;
        min-height: 100vh;
      }
      h1 { font-family: 'Playfair Display', 'Noto Serif KR', serif; font-weight: 500; }
      a { text-decoration: none; color: inherit; }

      .main {
        max-width: 960px;
        margin: 0 auto;
        padding: 112px 24px 60px;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--gray);
        margin-bottom: 24px;
        transition: color 0.3s;
      }
      .back-link:hover { color: var(--charcoal); }

      .notice {
        text-align: center;
        background: #fff;
        border: 1px solid var(--warm);
        border-radius: 12px;
        padding: 56px 24px;
      }
      .notice .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gold);
        margin-bottom: 8px;
      }
      .notice h1 {
        font-size: 1.8rem;
        margin-bottom: 12px;
      }
      .notice p {
        color: var(--gray);
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        background: var(--charcoal);
        color: #fff;
        transition: background 0.3s;
      }
      .btn:hover { background: var(--gold); }

      @media (max-width: 768px) {
        .main { padding: 100px 16px 40px; }
        .notice h1 { font-size: 1.4rem; }
      }
    </style>
  </head>
  <body>
    <!-- Navigation (from nav.css) -->
    <nav class="nav" id="mainNav">
      <a href="index.html" class="nav-logo">DADAM</a>
      <div class="nav-links" id="navLinks">
        <a href="ai-design.html" class="internal-link" data-i18n="nav.ai_design">AI Design</a>
        <a href="consultation.html" class="internal-link" data-i18n="nav.consultation">상담 신청</a>
      </div>
    </nav>

    <div class="main">
      <a href="ai-design.html" class="back-link internal-link">← AI Design으로 돌아가기</a>

      <!-- 협력업체 목록 · 추천은 아직 없다 — 안내와 상담 신청만 보인다 (DB partners 를 읽지 않는다) -->
      <div class="notice" id="partnerNotice">
        <p class="label">Partner</p>
        <h1>협력업체 연결은 준비 중입니다</h1>
        <p>다담에 상담을 신청해 주세요.</p>
        <a href="consultation.html" class="btn internal-link" id="consultLink">상담 신청</a>
      </div>
    </div>

    <script type="module" src="js/i18n.js"></script>
  </body>
</html>
