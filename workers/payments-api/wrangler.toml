name = "dadam-payments-api"
main = "src/worker.js"
compatibility_date = "2024-09-23"
account_id = "8bd8e054dfc7bcdc577f9bb79edd3284"

# 구독 수명주기(src/lifecycle.js) — 하루 한 번 KST 04:00 (UTC 19:00).
# 정기 결제(30일) · 실패 재시도(첫 실패 1일 뒤 · 3일 뒤) · 해지 만료 강등.
# 재시도 시각은 이 cron 이 잡힌 시각에서 잰다 — 시각을 바꾸면 다음 재시도도 같이 옮겨진다.
[triggers]
crons = ["0 19 * * *"]

[vars]
# 등급별 월 가격 (원, VAT 포함). 플랜 id = profiles.tier 값과 같다.
TOSS_PRICE_EXPERT_KRW = "99000"
TOSS_PRICE_AGENT_KRW = "199000"
# CORS 허용 오리진 (콤마 구분)
# 프로덕션은 dadamfurniture.com 이다. 전에는 dadam.kr 만 있어서
# 브라우저가 전부 차단당했다 — 결제가 한 번도 안 쓰인 이유 중 하나.
CORS_ORIGINS = "https://dadamfurniture.com,https://www.dadamfurniture.com,http://127.0.0.1:8899,http://localhost:8899"

# 아래 값들은 Cloudflare 대시보드 또는 wrangler secret put 으로 등록:
#   wrangler secret put TOSS_CLIENT_KEY
#   wrangler secret put TOSS_SECRET_KEY
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_ANON_KEY  (선택, JWT 검증용 — Edge SDK 사용 시 불필요)
