name = "dadam-generate-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
account_id = "8bd8e054dfc7bcdc577f9bb79edd3284"

# Smart Placement 을 끈다 — 켜 두면 워커가 HKG 콜로에 놓였고, 홍콩 발신은
# Google AI Studio 가 게이트웨이·직접 호출 모두 400 "User location is not supported" 로 막는다
# (2026-09-09 /health colo=HKG 로 실측). 생성 자체는 미국 콜로 Durable Object(job.js) 가 한다.

[vars]
# 사용자 인증용. 둘 다 공개값이라 secret 이 아니라 vars 로 둔다
# (js/config.js 에 이미 그대로 들어 있다). service_role 키는 secret 이다.
SUPABASE_URL = "https://vvqrvgcgnlfpiqqndsve.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2cXJ2Z2NnbmxmcGlxcW5kc3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NTYyMjYsImV4cCI6MjA4MzQzMjIyNn0.WvMdB2bojqRUjYWdljAcxP1yHqQZJwuyv2equltyWWQ"

# Gemini 모델 — 이미지와 텍스트 둘. 바꾸려면 이 값만 고친다.
# 2026-09-09 API 목록 기준: gemini-3-pro-image (Nano Banana Pro, 2K/4K, 디테일 프롬프트·다중 참고 이미지),
# gemini-3.1-flash-image (Nano Banana 2, 빠름). 텍스트/QC 는 gemini-3.8-flash.
GEMINI_IMAGE_MODEL = "gemini-3-pro-image"
GEMINI_TEXT_MODEL = "gemini-3.8-flash"
GEMINI_IMAGE_SIZE = "2K"

# 연출컷 기본안·추천안 이미지 공급자 (2026-10-18, src/images.js). 'openai' | 'gemini'.
# 'openai' 라도 시크릿 OPENAI_API_KEY 가 없으면 Gemini 로 그린다. GPT 가 실패하면 그 칸만 Gemini 가 대신 그린다.
# 분석·검사·채팅(텍스트)과 플래너 모드 기본안은 Gemini 그대로. 되돌리려면 'gemini'.
# 2026-10-18: 플래너 모드는 이 값과 상관없이 요청의 image_provider 로 고른다.
IMAGE_PROVIDER = "openai"
# 플래너 모드(사진으로 만들기) 기본 이미지 공급자 (2026-10-19, src/images.js plannerDefaultProvider).
# 요청에 image_provider('gemini'|'openai')가 없을 때 쓰고, 결정된 값은 options.image_provider 에 늘 기록된다.
# 'openai' = GPT (실측 4장: 도면을 더 잘 따르고 1장 약 144원). 키가 없거나 GPT 가 실패하면 Gemini 가 번호 없는 입면으로 대신.
# 없거나 'openai' 밖의 값이면 Gemini. 되돌리려면 'gemini'.
PLANNER_IMAGE_PROVIDER = "openai"
# 플래너 모드 도면 덩어리 (2026-10-20, src/planner-place.js). 'on' 이면 빈 벽 사진·일자 도면에서 카메라를 풀어
# 도면 줄(폭·높이·깊이)을 방 사진에 칠한 그림을 IMAGE A 로 준다 — 줄을 늘리는 실패를 자리로 막는다. 시크릿 ANTHROPIC_API_KEY 필요.
# 2026-10-20 사장님 카드 "켜는 PR" 로 켰다. 되돌리려면 "off".
PLANNER_PLACE_GUIDE = "on"
OPENAI_IMAGE_MODEL = "gpt-image-2.5-sunburst"
OPENAI_IMAGE_QUALITY = "high"

# Claude — 연출컷 구성 분석 (POST /api/generate/:id/layout, src/claude.js). 키는 시크릿 ANTHROPIC_API_KEY.
ANTHROPIC_MODEL = "claude-opus-5"

# 생성 결과 저장·공유
GENERATIONS_BUCKET = "generations"
PUBLIC_BASE_URL = "https://dadamfurniture.com"
SHARE_LINK_TTL_DAYS = "30"

# Gemini 호출 경로(GEMINI_VIA)는 비워 둔다 — 잡 DO(job.js) 가 미국 콜로에서 뜨므로 직접 호출이
# 통하고, 막히면 gemini.js 가 gateway → direct → proxy 순으로 넘어간다. 진단은 /diag.

# Cloudflare AI Gateway base URL — Google Generative Language API 를 한국 발신에서 차단
# (400 "User location is not supported") 하는 문제 우회용 경로 중 하나.
AI_GATEWAY_BASE = "https://gateway.ai.cloudflare.com/v1/8bd8e054dfc7bcdc577f9bb79edd3284/dadam-ai"

# Secret (wrangler secret put):
#   GEMINI_API_KEY               필수
#   OPENAI_API_KEY               연출컷 이미지(IMAGE_PROVIDER=openai) — 없으면 Gemini 로 그린다
#   ANTHROPIC_API_KEY            구성 분석 (플래너 가져오기) — 없으면 그 라우트만 500
#   SUPABASE_SERVICE_ROLE_KEY    generations 행·버킷 쓰기, 잡 안 환불
#   SHARE_TOKEN_PEPPER           공유 토큰 해시

# Gemini 호출을 미국 콜로에서 내보내는 Durable Object (src/proxy.js).
# 워커 콜로(HKG·KIX)에서는 Google 이 지역 차단을 걸어 이 경로가 필요하다.
[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiProxy"

# 잡 실행기 — 잡당 하나, alarm 구동 (src/job.js). locationHint 'enam'.
[[durable_objects.bindings]]
name = "GENERATE_JOB"
class_name = "GenerateJob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxy"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GenerateJob"]
